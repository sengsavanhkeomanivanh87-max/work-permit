/* ---- 3. เรียกคืนเอกสารยกเลิก (Obsolete Recall) ---- */
function renderDocRecall(){
  const wrap = el(`<div><div class="pagehead"><div><h1>เรียกคืนเอกสารยกเลิก (Obsolete Recall)</h1><p>ติดตามการเรียกคืนเอกสารที่ยกเลิกแล้วออกจากทุกจุดใช้งาน เพื่อป้องกันการหยิบไปใช้งานผิดพลาด แล้วยืนยันการทำลาย</p></div></div></div>`);
  const obsoleteDocs = state.safetyDocs.filter(d=>d.status==='obsolete');
  if(obsoleteDocs.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีเอกสารที่ถูกยกเลิก</h3><p>เมื่อมีการยกเลิกเอกสารจากเมนู "ทะเบียนเอกสาร" รายการจะมาแสดงที่นี่เพื่อติดตามการเรียกคืน</p></div>`));
    return wrap;
  }
  obsoleteDocs.forEach(doc=>{
    const info = doc.obsoleteInfo || {};
    const expectedLocations = (doc.controlledCopies||[]).length;
    const recalledCount = (info.recalledFrom||[]).length;
    const complete = expectedLocations>0 && recalledCount>=expectedLocations;
    const card = el(`<div class="card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;">
        <div><strong>${doc.docNo}</strong> — ${doc.title}</div>
        ${info.disposalDate ? '<span class="badge badge-success">ทำลายแล้ว</span>' : complete ? '<span class="badge badge-accent">เรียกคืนครบแล้ว</span>' : '<span class="badge badge-danger">กำลังเรียกคืน</span>'}
      </div>
      <p style="font-size:12.5px;color:var(--ink-muted);margin:4px 0 10px;">ยกเลิกเมื่อ ${info.obsoleteDate||'-'}${info.reason?` — ${info.reason}`:''}${expectedLocations?` · คาดว่ามีสำเนาควบคุม ${expectedLocations} จุด`:''}</p>
      <div style="font-size:13px;">${(info.recalledFrom&&info.recalledFrom.length) ? info.recalledFrom.map(r=>`<div>✓ เรียกคืนจาก "${r.location}" โดย ${r.recalledBy} เมื่อ ${r.date}</div>`).join('') : '<p class="hint" style="margin:0;">ยังไม่มีการบันทึกการเรียกคืน</p>'}</div>
      ${!info.disposalDate ? `
      <div class="no-print" style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        <input type="text" placeholder="จุดที่เรียกคืน" data-recall-loc style="flex:1;min-width:140px;">
        <input type="text" placeholder="ผู้เรียกคืน" data-recall-by style="flex:1;min-width:140px;">
        <button type="button" class="btn btn-outline btn-sm" data-add-recall>+ บันทึกการเรียกคืน</button>
      </div>
      <div class="card no-print" style="background:#FAFAF8;margin-top:10px;">
        <h3 style="margin-top:0;font-size:13.5px;">ยืนยันการทำลาย</h3>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <input type="text" placeholder="วิธีทำลาย เช่น ย่อยกระดาษ" data-dispose-method style="flex:1;min-width:140px;">
          <input type="text" placeholder="ผู้ยืนยัน" data-dispose-by style="flex:1;min-width:140px;">
          <button type="button" class="btn btn-danger btn-sm" data-confirm-dispose>ยืนยันทำลาย</button>
        </div>
      </div>` : `<p style="font-size:12.5px;color:var(--ink-muted);margin-top:8px;">ทำลายโดย ${info.confirmedBy} เมื่อ ${info.disposalDate} (วิธี: ${info.disposalMethod})</p>`}
    </div>`);
    const addBtn = card.querySelector('[data-add-recall]');
    if(addBtn) addBtn.onclick = async ()=>{
      const loc = card.querySelector('[data-recall-loc]').value.trim();
      const by = card.querySelector('[data-recall-by]').value.trim();
      if(!loc || !by){ showToast("กรุณากรอกจุดที่เรียกคืนและผู้เรียกคืน"); return; }
      await addRecallLocation(doc, loc, by);
    };
    const disposeBtn = card.querySelector('[data-confirm-dispose]');
    if(disposeBtn) disposeBtn.onclick = async ()=>{
      const method = card.querySelector('[data-dispose-method]').value.trim();
      const by = card.querySelector('[data-dispose-by]').value.trim();
      if(!method || !by){ showToast("กรุณากรอกวิธีทำลายและผู้ยืนยัน"); return; }
      if(!confirm(`ยืนยันว่าทำลายเอกสาร ${doc.docNo} แล้ว?`)) return;
      await confirmDisposal(doc, method, by);
    };
    wrap.appendChild(card);
  });
  return wrap;
}

/* ---- 4. ตารางอายุการจัดเก็บ & แผนสำรองข้อมูล ---- */
function renderDocRetention(){
  const ds = state.docSettings || defaultDocSettings();
  const wrap = el(`<div><div class="pagehead"><div><h1>ตารางอายุการจัดเก็บ & แผนสำรองข้อมูล</h1><p>กำหนดระยะเวลาจัดเก็บบันทึกแต่ละประเภท และแผนรองรับเมื่อระบบไอทีขัดข้อง (IT Outage)</p></div></div></div>`);
  wrap.appendChild(el(`<div class="card" style="background:var(--accent-bg);margin-bottom:14px;">
    <strong style="font-size:13px;">⚠ หมายเหตุสำคัญ:</strong>
    <p style="margin:4px 0 0;font-size:12.5px;">ตัวเลขอายุการจัดเก็บเริ่มต้นเป็นตัวอย่างทั่วไปเท่านั้น ไม่ใช่คำแนะนำทางกฎหมาย โปรดตรวจสอบกับฝ่ายกฎหมาย/ที่ปรึกษาด้านแรงงานของบริษัทเพื่อความถูกต้องตามกฎหมายที่บังคับใช้จริงก่อนนำไปใช้งาน</p>
  </div>`));

  const form = el(`<form class="card" id="retentionForm" style="margin-bottom:14px;">
    <h3 style="margin-top:0;font-size:15px;">ตารางอายุการจัดเก็บบันทึก (Retention Schedule)</h3>
    <div id="retRows"></div>
    <button type="button" class="btn btn-outline btn-sm no-print" id="addRetRowBtn" style="margin:8px 0;">+ เพิ่มแถว</button>
    <button class="btn btn-primary btn-sm" type="submit">บันทึกตาราง</button>
  </form>`);
  const rowsEl = form.querySelector('#retRows');
  function paintRows(){
    rowsEl.innerHTML = ds.retentionRows.map((r,i)=>`
      <div class="grid3" data-ret-row="${i}" style="align-items:flex-end;">
        <div class="field"><label>ประเภทบันทึก</label><input type="text" data-ret-type value="${(r.recordType||'').replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>อายุจัดเก็บ (ปี)</label><input type="number" min="0" data-ret-years value="${r.years}"></div>
        <div class="field" style="display:flex;gap:6px;">
          <input type="text" data-ret-basis value="${(r.legalBasis||'').replace(/"/g,'&quot;')}" placeholder="อ้างอิง/หมายเหตุ" style="flex:1;">
          <button type="button" class="jsaRemove no-print" data-remove-row style="margin-top:8px;">×</button>
        </div>
      </div>`).join('');
    rowsEl.querySelectorAll('[data-remove-row]').forEach((btn,i)=>{
      btn.onclick = ()=>{ ds.retentionRows.splice(i,1); paintRows(); };
    });
  }
  paintRows();
  form.querySelector('#addRetRowBtn').onclick = ()=>{ ds.retentionRows.push({recordType:"",years:0,legalBasis:""}); paintRows(); };
  form.onsubmit = async (e)=>{
    e.preventDefault();
    const rows = Array.from(rowsEl.querySelectorAll('[data-ret-row]')).map(r=>({
      recordType: r.querySelector('[data-ret-type]').value.trim(),
      years: Number(r.querySelector('[data-ret-years]').value)||0,

/* ==================== นำเข้าข้อมูลย้อนหลังจาก Excel (อุบัติเหตุ / คำร้องขอเข้าพื้นที่) ==================== */
function xlNormKey(k){ return String(k==null?'':k).replace(/[\*\s\r\n]+/g,'').toLowerCase(); }
function xlGet(row, label){
  const want = xlNormKey(label);
  for(const k of Object.keys(row)){ if(xlNormKey(k)===want){ const v=row[k]; return (typeof v==='string') ? v.trim() : v; } }
  return "";
}
function xlIsEmptyRow(row){ return Object.values(row).every(v=>v===""||v==null); }
function xlStr(v){ return v==null ? "" : String(v).trim(); }
function xlYearFix(y){ y = parseInt(y,10); return y>2400 ? y-543 : y; }
function xlPad(n){ return String(n).padStart(2,'0'); }
function xlValidYMD(y,m,d){ return y>=1990 && y<=2100 && m>=1 && m<=12 && d>=1 && d<=31; }
function xlParseDate(v){
  if(v===""||v==null) return "";
  if(typeof v==='number'){
    const o = (typeof XLSX!=='undefined' && XLSX.SSF) ? XLSX.SSF.parse_date_code(v) : null;
    return (o && xlValidYMD(o.y,o.m,o.d)) ? `${o.y}-${xlPad(o.m)}-${xlPad(o.d)}` : "";
  }
  const t = String(v).trim();
  let m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m){ const y=xlYearFix(m[1]), mo=+m[2], d=+m[3]; return xlValidYMD(y,mo,d) ? `${y}-${xlPad(mo)}-${xlPad(d)}` : ""; }
  m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if(m){ const d=+m[1], mo=+m[2], y=xlYearFix(m[3]); return xlValidYMD(y,mo,d) ? `${y}-${xlPad(mo)}-${xlPad(d)}` : ""; }
  return "";
}
function xlParseTime(v, fallbackFromDateCell){
  if(typeof v==='number' && v>=0){
    const frac = v - Math.floor(v); const mins = Math.round(frac*1440);
    return `${xlPad(Math.floor(mins/60)%24)}:${xlPad(mins%60)}`;
  }
  if(v!=="" && v!=null){ const m = String(v).match(/(\d{1,2})[:.](\d{2})/); if(m) return `${xlPad(+m[1])}:${m[2]}`; }
  if(typeof fallbackFromDateCell==='number' && fallbackFromDateCell%1>0){ return xlParseTime(fallbackFromDateCell); }
  return "";
}
// จับคู่ค่าในเซลล์กับรายการมาตรฐาน: ตรงทุกตัว → ตรงบางส่วน (ไม่สนช่องว่าง)
function xlMatch(v, list){
  const t = xlStr(v).replace(/\s+/g,''); if(!t) return null;
  const n = s=>String(s).replace(/\s+/g,'');
  return list.find(x=>n(x)===t) || list.find(x=>n(x).includes(t) || t.includes(n(x))) || null;
}
async function xlReadRows(file){
  if(typeof XLSX==="undefined") throw new Error("โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้าแล้วลองใหม่");
  const wb = XLSX.read(await file.arrayBuffer(), { type:"array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { defval:"" });
}
function xlDownloadTemplate(filename, headers, examples, helpCols){
  if(typeof XLSX==="undefined"){ showToast("โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้าแล้วลองใหม่"); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, ...examples]);
  ws['!cols'] = headers.map(h=>({wch: Math.max(14, String(h).length+4)}));
  const names = Object.keys(helpCols);
  const maxLen = Math.max(...names.map(n=>helpCols[n].length));
  const help = [names]; for(let i=0;i<maxLen;i++) help.push(names.map(n=>helpCols[n][i]||""));
  const ws2 = XLSX.utils.aoa_to_sheet(help); ws2['!cols'] = names.map(()=>({wch:34}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "ข้อมูล");
  XLSX.utils.book_append_sheet(wb, ws2, "ค่าที่ใช้ได้");
  XLSX.writeFile(wb, filename);
}
// การ์ดนำเข้า: ดาวน์โหลดแม่แบบ → เลือกไฟล์ → ดูตัวอย่างผล/ข้อผิดพลาด → กดยืนยัน
function buildExcelImportCard(opt){
  const card = el(`<div class="card" style="margin-bottom:16px;border-style:dashed;">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;">
      <div><h3 style="margin:0 0 2px;font-size:15px;">📥 ${opt.title}</h3><p class="hint" style="margin:0;">${opt.hint}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn btn-outline btn-sm" data-tpl>⬇ ดาวน์โหลดแม่แบบ Excel</button>
        <label class="btn btn-primary btn-sm" style="margin:0;cursor:pointer;">⬆ เลือกไฟล์ Excel<input type="file" data-file accept=".xlsx,.xls,.csv" style="display:none;"></label>
      </div>
    </div>
    <div data-preview style="margin-top:12px;"></div>
  </div>`);
  const prev = card.querySelector('[data-preview]');
  card.querySelector('[data-tpl]').onclick = opt.template;
  const input = card.querySelector('[data-file]');
  input.onchange = async ()=>{
    const file = input.files[0]; if(!file) return;
    prev.innerHTML = `<p class="hint">กำลังอ่านไฟล์...</p>`;
    try{
      const rows = (await xlReadRows(file)).filter(r=>!xlIsEmptyRow(r));
      if(!rows.length){ prev.innerHTML = `<p class="hint" style="color:var(--danger);">ไม่พบข้อมูลในแผ่นงานแรกของไฟล์ (ต้องมีหัวตารางแถวแรก)</p>`; input.value=""; return; }
      const res = opt.parse(rows);   // {items, errors:[{row,msg}], dups:number, summary:string}
      const errHtml = res.errors.length ? `<div style="max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;margin-top:8px;font-size:12.5px;background:var(--danger-bg);color:var(--danger);">${res.errors.slice(0,40).map(e=>`แถว ${e.row}: ${e.msg}`).join('<br>')}${res.errors.length>40?`<br>…และอีก ${res.errors.length-40} แถว`:''}</div>` : '';
      prev.innerHTML = `<div style="font-size:13.5px;"><b>ผลตรวจไฟล์ "${file.name.replace(/[<>&"]/g,'')}"</b>: พร้อมนำเข้า <b style="color:var(--success);">${res.items.length}</b> ${opt.unit}${res.dups?` · ข้ามรายการซ้ำ ${res.dups}`:''}${res.errors.length?` · มีปัญหา <b style="color:var(--danger);">${res.errors.length}</b> แถว (จะไม่ถูกนำเข้า)`:''}${res.summary?`<br><span class="hint">${res.summary}</span>`:''}</div>${errHtml}
        <div style="margin-top:10px;display:flex;gap:8px;"><button type="button" class="btn btn-success btn-sm" data-go ${res.items.length?'':'disabled'}>✓ ยืนยันนำเข้า ${res.items.length} ${opt.unit}</button><button type="button" class="btn btn-outline btn-sm" data-cancel>ยกเลิก</button></div>`;
      prev.querySelector('[data-cancel]').onclick = ()=>{ prev.innerHTML=""; input.value=""; };
      prev.querySelector('[data-go]').onclick = async (ev)=>{
        ev.target.disabled = true; ev.target.textContent = "กำลังนำเข้า...";
        try{ await opt.commit(res.items); }catch(e){ showToast("นำเข้าไม่สำเร็จ: "+(e.message||e)); }
        input.value = "";
      };
    }catch(e){ prev.innerHTML = `<p class="hint" style="color:var(--danger);">อ่านไฟล์ไม่สำเร็จ: ${(e.message||e)}</p>`; input.value=""; }
  };
  return card;
}

function accImportParse(rows){
  const items = [], errors = [], seen = new Set(); let dups = 0;
  const existing = new Set(state.accidents.map(a=>`${a.date}|${a.time||''}|${a.department}|${(a.location||'').trim()}|${(a.description||'').slice(0,40)}`));
  rows.forEach((r,i)=>{
    const rowNo = i+2, errs = [];
    const dateRaw = xlGet(r,"วันที่เกิดเหตุ");
    const date = xlParseDate(dateRaw); if(!date) errs.push("วันที่เกิดเหตุไม่ถูกต้อง/ว่าง");
    const time = xlParseTime(xlGet(r,"เวลา"), dateRaw);
    const department = xlMatch(xlGet(r,"แผนก"), DEPARTMENTS); if(!department) errs.push(`แผนก "${xlStr(xlGet(r,"แผนก"))}" ไม่ตรงกับรายการ`);
    const location = xlStr(xlGet(r,"จุดเกิดเหตุ")); if(!location) errs.push("จุดเกิดเหตุว่าง");
    const accidentType = xlMatch(xlGet(r,"ประเภทอุบัติเหตุ"), ACCIDENT_TYPES); if(!accidentType) errs.push(`ประเภทอุบัติเหตุ "${xlStr(xlGet(r,"ประเภทอุบัติเหตุ"))}" ไม่ตรงกับรายการ`);
    const description = xlStr(xlGet(r,"รายละเอียดเหตุการณ์")); if(!description) errs.push("รายละเอียดเหตุการณ์ว่าง");
    const severity = accSeverityFromText(xlGet(r,"ความรุนแรง")); if(!severity) errs.push(`ความรุนแรง "${xlStr(xlGet(r,"ความรุนแรง"))}" ไม่ถูกต้อง`);
    const sv = ACCIDENT_SEVERITIES[severity]||{};
    const injured = severity && severity!=="none";
    const injuredName = xlStr(xlGet(r,"ชื่อผู้บาดเจ็บ"));
    if(injured && !injuredName) errs.push("มีผู้บาดเจ็บแต่ไม่ระบุชื่อ");
    const personType = injured ? (xlMatch(xlGet(r,"สถานะผู้บาดเจ็บ"), ACC_PERSON_TYPES) || "") : "";
    const bodyParts = injured ? xlStr(xlGet(r,"ส่วนของร่างกายที่บาดเจ็บ")).split(/[,;\n，]+/).map(x=>xlMatch(x,ACC_BODY_PARTS)).filter(Boolean) : [];
    const injuryType = injured ? (xlMatch(xlGet(r,"ลักษณะการบาดเจ็บ"), ACC_INJURY_TYPES) || "") : "";
    const stTxt = xlStr(xlGet(r,"สถานะเคส"));
    const status = /กำลัง/.test(stTxt) ? "investigating" : /รอ/.test(stTxt) ? "reported" : "closed";
    if(errs.length){ errors.push({row:rowNo, msg:errs.join(" · ")}); return; }
    const key = `${date}|${time}|${department}|${location}|${description.slice(0,40)}`;
    if(existing.has(key) || seen.has(key)){ dups++; return; }
    seen.add(key);
    const inv = xlStr(xlGet(r,"ผู้สอบสวน")), rc = xlStr(xlGet(r,"สาเหตุที่แท้จริง"));
    items.push({
      date, time, department, location, accidentType, description,
      immediateAction: xlStr(xlGet(r,"การช่วยเหลือเบื้องต้น")), witnesses: xlStr(xlGet(r,"พยาน")),
      severity, lostDays: sv.lostTime ? (Number(xlGet(r,"จำนวนวันหยุดงาน"))||0) : 0,
      injuredName: injured ? injuredName : "", personType, injuredCompany: personType==="ผู้รับเหมา" ? xlStr(xlGet(r,"บริษัทผู้รับเหมา")) : "",
      bodyParts, injuryType, propertyDamage: xlStr(xlGet(r,"ความเสียหายทรัพย์สิน")), status,
      invest: (inv||rc) ? {investigator:inv, rootCause:rc} : null
    });
  });
  const closed = items.filter(x=>x.status==="closed").length;
  return { items, errors, dups, summary: items.length ? `สถานะเคสที่ไม่ระบุจะถือเป็น "ปิดเคสแล้ว" (ปิดแล้ว ${closed} / ยังไม่ปิด ${items.length-closed}) · เลขที่เอกสารจะอิงวันที่เกิดเหตุ` : "" };
}
async function accImportCommit(items){
  let latest = state.accidents;
  try{ const fresh = await storageAdapter.get("wp:accidents", true); if(fresh) latest = JSON.parse(fresh.value); }catch(e){}
  state.accidents = latest;
  const nowIso = new Date().toISOString();
  items.forEach(it=>{
    const ymd = it.date.replace(/-/g,'');
    const n = state.accidents.filter(a=>(a.code||'').includes(ymd)).length + 1;
    const { invest, ...rest } = it;
    state.accidents.push(Object.assign({
      id:'ac'+Date.now()+Math.random().toString(36).slice(2,8),
      code:`ACC-${ymd}-${String(n).padStart(3,'0')}`, createdAt:nowIso,
      reporterEmail: state.myEmail||"", actions:[], photos:[], imported:true,
      investigation: invest ? { investigator:invest.investigator, rootCause:invest.rootCause, investigatedAt:nowIso } : null
    }, rest));
  });
  state.accidents.sort((a,b)=>`${b.date||''} ${b.time||''}`.localeCompare(`${a.date||''} ${a.time||''}`));
  await saveAccidents();
  showToast(`นำเข้าอุบัติเหตุย้อนหลัง ${items.length} รายการแล้ว`);
  setState({ route:"acc_list" });
}

function arImportParse(rows){
  const errors = [], groups = new Map(); let dups = 0;
  const existingKeys = new Set(state.accessRequests.map(r=>`${r.company}|${r.startDate}|${r.endDate}|${r.purpose}`));
  rows.forEach((r,i)=>{
    const rowNo = i+2, errs = [];
    const company = xlStr(xlGet(r,"บริษัทผู้รับเหมา")); if(!company) errs.push("ชื่อบริษัทว่าง");
    const coordName = xlStr(xlGet(r,"ผู้ควบคุมงาน")); if(!coordName) errs.push("ผู้ควบคุมงานว่าง");
    const pTxt = xlStr(xlGet(r,"วัตถุประสงค์"));
    const pHit = AR_PURPOSES.find(p=>pTxt && (p.label.replace(/\s+/g,'')===pTxt.replace(/\s+/g,'') || p.id===pTxt.toLowerCase())) || AR_PURPOSES.find(p=>pTxt && p.id!=="other" && (p.label.includes(pTxt)||pTxt.includes(p.label)));
    const purpose = pHit ? pHit.id : (pTxt ? "other" : ""); if(!purpose) errs.push("วัตถุประสงค์ว่าง");
    const startRaw = xlGet(r,"วันที่เริ่ม"), endRaw = xlGet(r,"วันที่สิ้นสุด");
    const startDate = xlParseDate(startRaw); if(!startDate) errs.push("วันที่เริ่มไม่ถูกต้อง/ว่าง");
    const endDate = xlParseDate(endRaw) || startDate; if(endDate && startDate && endDate<startDate) errs.push("วันที่สิ้นสุดก่อนวันที่เริ่ม");
    const person = xlStr(xlGet(r,"ชื่อ-นามสกุลพนักงาน")); if(!person) errs.push("ชื่อพนักงานว่าง");
    if(errs.length){ errors.push({row:rowNo, msg:errs.join(" · ")}); return; }
    const gid = xlStr(xlGet(r,"รหัสกลุ่ม")) || `${company}|${startDate}|${endDate}|${purpose}`;
    let g = groups.get(gid);
    if(!g){
      const stTxt = xlStr(xlGet(r,"สถานะคำร้อง"));
      g = { company, coordinator:{ name:coordName, phone:xlStr(xlGet(r,"เบอร์โทรผู้ควบคุมงาน")) },
        ownerDept: xlStr(xlGet(r,"หน่วยงานเจ้าของงาน")), purpose, purposeNote: purpose==="other" ? (xlStr(xlGet(r,"ระบุวัตถุประสงค์ (ถ้าเลือกอื่นๆ)"))||pTxt) : "",
        startDate, endDate, startTime: xlParseTime(xlGet(r,"เวลาเริ่ม"))||"08:00", endTime: xlParseTime(xlGet(r,"เวลาสิ้นสุด"))||"17:00",
        trainingDate: xlParseDate(xlGet(r,"วันที่อบรม")), requesterName: xlStr(xlGet(r,"ผู้ยื่นคำร้อง")) || coordName,
        status: /ไม่อนุมัติ|ปฏิเสธ/.test(stTxt) ? "rejected" : /รอ/.test(stTxt) ? "pending" : "approved", team:[] };
      groups.set(gid, g);
    }
    if(!g.team.some(t=>t.name===person)) g.team.push({ name:person, position: xlStr(xlGet(r,"ตำแหน่ง")), insurer: xlStr(xlGet(r,"บริษัทประกัน")), policyNo: xlStr(xlGet(r,"เลขที่กรมธรรม์")), insuranceStart: xlParseDate(xlGet(r,"ประกันอุบัติเหตุเริ่ม")), insuranceEnd: xlParseDate(xlGet(r,"ประกันอุบัติเหตุสิ้นสุด")) });
  });
  const items = [];
  groups.forEach(g=>{
    if(existingKeys.has(`${g.company}|${g.startDate}|${g.endDate}|${g.purpose}`)){ dups++; return; }
    items.push(g);
  });
  const people = items.reduce((n,g)=>n+g.team.length,0);
  const approved = items.filter(g=>g.status==="approved").length;
  return { items, errors, dups, summary: items.length ? `รวมเป็นคำร้อง ${items.length} ใบ · พนักงาน ${people} คน · อนุมัติแล้ว ${approved} ใบ (จะเพิ่มเข้าทะเบียนผู้รับเหมา/ผู้ผ่านการอบรมอัตโนมัติ)` : "" };
}
async function arImportCommit(items){
  const nowIso = new Date().toISOString();
  const made = [];
  items.forEach(g=>{
    const ymd = g.startDate.replace(/-/g,'');
    const n = state.accessRequests.filter(r=>(r.code||'').includes(ymd)).length + 1;
    const req = {
      id:"ar_"+Date.now()+Math.random().toString(36).slice(2,8), code:`AR-${ymd}-${String(n).padStart(3,'0')}`,
      company:g.company, coordinator:g.coordinator, entryDate:g.startDate, ownerDept:g.ownerDept,
      trainingDateNeeded:g.trainingDate||g.startDate, traineeCount:String(g.team.length),
      workTypes:[], compliance:{}, purpose:g.purpose, purposeNote:g.purposeNote,
      startDate:g.startDate, startTime:g.startTime, endDate:g.endDate, endTime:g.endTime,
      team:g.team, workerCount:g.team.length, documents:[], requesterName:g.requesterName,
      createdAt:nowIso, status:g.status, approval:null, imported:true
    };
    if(g.status!=="pending") req.approval = { decision:g.status, comment:"นำเข้าข้อมูลย้อนหลังจาก Excel", approverEmail:state.myEmail||"(ไม่ระบุ)", at:nowIso };
    state.accessRequests.push(req); made.push(req);

  await saveAccessRequests();
  showToast(`นำเข้าคำร้องขอเข้าพื้นที่ ${made.length} ใบแล้ว`);
  setState({ route:"ar_list" });
}

// เผื่อคำร้องเก่าก่อนมีฟีเจอร์อนุมัติ ยังไม่มีฟิลด์ status — ถือว่า "รออนุมัติ" ไปก่อน
function arStatusOf(request){ return request.status || "pending"; }
function arStatusBadge(status){
  if(status==="approved") return `<span class="badge badge-success">อนุมัติแล้ว</span>`;
  if(status==="rejected") return `<span class="badge badge-danger">ไม่อนุมัติ</span>`;
  return `<span class="badge badge-accent">รอ จป. อนุมัติ</span>`;
}
// ปีที่อบรมจากวันที่ (รองรับ 2026-10-06, 06/10/2026, ปี พ.ศ.) — ใบรับรองหมดอายุสิ้นปีที่อบรม (31 ธ.ค.)
function trainYearOf(d){
  if(!d) return "";
  const m = String(d).match(/(\d{4})/);
  if(!m) return "";
  let y = parseInt(m[1],10);
  if(y>2400) y -= 543;
  return String(y);
}
function trainExpiryOf(d){ const y = trainYearOf(d); return y ? `${y}-12-31` : ""; }
// ดึงข้อมูลคำร้องที่ จป. อนุมัติไปแล้วแต่ยังไม่เคยซิงก์ (เช่นอนุมัติก่อนมีฟีเจอร์นี้) เข้ารายละเอียดรับเหมา — ทำครั้งเดียวต่อคำร้อง
async function backfillApprovedAccessRequests(){
  if(state._arBackfillRunning) return;
  const pending = (state.accessRequests||[]).filter(r=>r.status==="approved" && !r.contractorSynced);
  if(!pending.length) return;
  state._arBackfillRunning = true;
  try{
    for(const r of pending){ await syncContractorFromAccessRequest(r, { noRender:true, skipHidden:true }); r.contractorSynced = true; }
    await saveAccessRequests();
  } finally { state._arBackfillRunning = false; }
  render();
}
// เมื่อ จป. อนุมัติคำร้องขอเข้าพื้นที่ ให้ดึงข้อมูลบริษัท/ทีมงาน/เอกสารจากคำร้องนั้น
// ไปอัปเดต "รายละเอียดรับเหมา" (ทะเบียนผู้รับเหมา) ให้อัตโนมัติ — ไม่ต้องคีย์ซ้ำ และสถิติบนแดชบอร์ดจะอัปเดตตาม
async function syncContractorFromAccessRequest(request, opts){
  opts = opts || {};
  // บริษัทที่ไม่อยู่ในรายชื่อมาตรฐาน (พิมพ์เองตอนขอเข้าพื้นที่) ต้องเพิ่มเข้ารายการ ไม่งั้นข้อมูลถูกบันทึกแต่ไม่แสดงในหน้ารายละเอียดรับเหมา
  if(request.company && !allContractorCompanies().includes(request.company)){
    const hidden = state.settings.hiddenContractorCompanies||[];
    if(opts.skipHidden && hidden.includes(request.company)) return false;
    state.settings.hiddenContractorCompanies = hidden.filter(c=>c!==request.company);
    if(!CONTRACTOR_COMPANIES.includes(request.company)) state.settings.customContractorCompanies = (state.settings.customContractorCompanies||[]).concat([request.company]);
    await saveSettings();
  }
  const profile = getContractorProfile(request.company);
  profile.general = Object.assign(defaultContractorGeneral(), profile.general||{});
  profile.workers = profile.workers || [];
  profile.documents = profile.documents || [];

  profile.general.entryDate = request.entryDate || profile.general.entryDate;
  profile.general.ownerDept = request.ownerDept || profile.general.ownerDept;
  profile.general.coordinatorName = (request.coordinator&&request.coordinator.name) || profile.general.coordinatorName;
  profile.general.phone = (request.coordinator&&request.coordinator.phone) || profile.general.phone;
  profile.general.startDate = request.startDate || profile.general.startDate;
  profile.general.endDate = request.endDate || profile.general.endDate;
  profile.general.trainingDateNeeded = request.trainingDateNeeded || profile.general.trainingDateNeeded;
  profile.general.traineeCount = request.traineeCount || profile.general.traineeCount;
  profile.general.workTypes = Array.from(new Set([...(profile.general.workTypes||[]), ...(request.workTypes||[])]));
  profile.general.compliance = Object.assign({}, profile.general.compliance, request.compliance);

  // วันที่อบรม: ใช้วันที่อบรมที่ระบุในคำร้อง ถ้าไม่มีใช้วันที่เข้าทำงาน/วันเริ่มงาน/วันที่ จป. อนุมัติ
  const trainedDate = request.trainingDateNeeded || request.entryDate || request.startDate || ((request.approval&&request.approval.at)||"").slice(0,10) || "";
  (request.team||[]).forEach(t=>{
    const name = (t.name||"").trim();
    if(!name) return;
    const tDate = t.trainedDate || trainedDate;   // คนที่เพิ่มทีหลังมีวันที่เข้าทำงาน/อบรมของตัวเอง
    const tYear = trainYearOf(tDate);
    // คนเดิมปีเดียวกัน = ไม่เพิ่มซ้ำ / คนเดิมที่ยังไม่มีวันที่อบรม = เติมวันที่ให้ / คนเดิมคนละปี = เพิ่มแถวใหม่ (ต่ออายุรายปี)
    const same = profile.workers.find(w=>w.name===name && (trainYearOf(w.trainedDate)===tYear || !trainYearOf(w.trainedDate)));
    if(same){
      if(!same.trainedDate) same.trainedDate = tDate;
      if(!same.position && t.position) same.position = t.position;
      if(t.insuranceStart && !same.insuranceStart) same.insuranceStart = t.insuranceStart;
      if(t.insuranceEnd && !same.insuranceEnd) same.insuranceEnd = t.insuranceEnd;
      if(t.insurer && !same.insurer) same.insurer = t.insurer;
      if(t.policyNo && !same.policyNo) same.policyNo = t.policyNo;
    } else {
      profile.workers.push({ name, position: t.position||"", trainedDate: tDate, requestCode: request.code, insuranceStart: t.insuranceStart||"", insuranceEnd: t.insuranceEnd||"", insurer: t.insurer||"", policyNo: t.policyNo||"" });
    }
  });
  profile.general.workerCount = String(profile.workers.length);

  const existingDocNames = new Set(profile.documents.map(d=>d.name));
  (request.documents||[]).forEach(d=>{
    if(d.name && !existingDocNames.has(d.name)){
      profile.documents.push(d);
      existingDocNames.add(d.name);
    }
  });

  request.contractorSynced = true;
  await persistContractorProfile(profile, opts);
  return true;
}
// บันทึกผลการอนุมัติ/ไม่อนุมัติคำร้องขอเข้าพื้นที่ (อนุมัติขั้นตอนเดียวโดย จป.)
async function decideAccessRequest(request, decision, comment){
  request.status = decision;
  request.approval = {
    decision, comment: comment||"",
    approverEmail: state.myEmail || "(ไม่ระบุ)",
    at: new Date().toISOString()
  };
  await saveAccessRequests();
  if(decision==="approved"){
    await syncContractorFromAccessRequest(request, { noRender:true });
    await saveAccessRequests();
    showToast(`อนุมัติคำร้อง ${request.code} แล้ว — อัปเดตข้อมูล "${request.company}" ในทะเบียนผู้รับเหมาแล้ว`);
  } else {
    showToast(`ไม่อนุมัติคำร้อง ${request.code}`);
  }
  render();
}

  inner.innerHTML = inner_html;
  document.getElementById('arCloseBtn').onclick = ()=>setState({arDetailId:null});
  async function persistTeamChange(removedNames){
    request.workerCount = request.team.length;
    await saveAccessRequests();
    if(arStatus==='approved'){
      if(removedNames && removedNames.length){
        const prof = state.contractors.find(c=>c.company===request.company);
        if(prof){ prof.workers = (prof.workers||[]).filter(w=>!(removedNames.includes(w.name) && w.requestCode===request.code)); await persistContractorProfile(prof, { noRender:true }); }
      }
      await syncContractorFromAccessRequest(request, { noRender:true });
      await saveAccessRequests();
    }
    render();
  }
  const addBtn = inner.querySelector('#arAddBtn');
  if(addBtn) addBtn.onclick = async ()=>{
    const lines = inner.querySelector('#arAddNames').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);

    let added = 0, skipped = 0;
    lines.forEach(line=>{
      const [name, ...rest] = line.split(/[,，\t]/);
      const nm = (name||'').trim(); if(!nm) return;
      if(request.team.some(t=>(t.name||'').trim()===nm)){ skipped++; return; }
      request.team.push({ name:nm, position:rest.join(',').trim(), joinDate:date, trainedDate:date, addedAt:new Date().toISOString() });
      added++;
    });
    if(!added){ showToast("ชื่อที่พิมพ์มีอยู่ในคำร้องนี้แล้วทั้งหมด"); return; }
    addBtn.disabled = true;
    await persistTeamChange();
    showToast(`เพิ่มรายชื่อ ${added} คนแล้ว${skipped?` (ข้ามชื่อซ้ำ ${skipped})`:''}`);
  };

    request.team.splice(idx,1);
    await persistTeamChange([m.name]);
    showToast("ลบรายชื่อแล้ว");
  });
  const goContractorBtn = inner.querySelector('#goContractorBtn');
  if(goContractorBtn) goContractorBtn.onclick = ()=>setState({ appModule:"contractor", route:"contractors", contractorDetailCompany: request.company, arDetailId:null });

  if(canActAr){
    let arBusy = false;
    const approveBtn = inner.querySelector('#arApproveBtn');
    const rejectBtn = inner.querySelector('#arRejectBtn');
    approveBtn.onclick = async ()=>{
      if(arBusy) return; arBusy = true; approveBtn.disabled = true; rejectBtn.disabled = true;
      try{ await decideAccessRequest(request, "approved", inner.querySelector('#arComment').value.trim()); }
      finally{ arBusy = false; }
    };
    rejectBtn.onclick = async ()=>{
      if(arBusy) return;
      const comment = inner.querySelector('#arComment').value.trim();
      if(!comment){ showToast("กรุณาระบุเหตุผลที่ไม่อนุมัติ"); return; }
      arBusy = true; approveBtn.disabled = true; rejectBtn.disabled = true;
      try{ await decideAccessRequest(request, "rejected", comment); }
      finally{ arBusy = false; }
    };
  }
}

/* ---- Contractor Details ---- */
function getContractorProfile(company){
  return state.contractors.find(c=>c.company===company) || { company, workers: [], documents: [], general: defaultContractorGeneral() };
}

async function persistContractorProfile(profile, opts){
  const idx = state.contractors.findIndex(c=>c.company===profile.company);
  if(idx>=0) state.contractors[idx] = profile; else state.contractors.push(profile);
  await saveContractors(profile);
  if(!(opts && opts.noRender)) render();
}

// ลบข้อมูลรายละเอียดผู้รับเหมาทั้งหมด (พนักงาน/เอกสาร/ข้อมูลทั่วไป) ออกจากระบบ และซ่อนชื่อบริษัทออกจากรายการ/ตัวเลือกถาวร
// (ใช้ "รายการที่ซ่อนไว้" แยกต่างหาก เพราะบริษัทมาตรฐานของระบบเป็นชื่อที่ล็อกไว้ในโค้ด ลบออกจากลิสต์เดิมไม่ได้ตรงๆ)
async function deleteContractorProfile(company){
  if(!(await adminGuard("ลบข้อมูลผู้รับเหมา — ต้องใช้รหัสผ่านผู้ดูแลระบบ"))) return;
  state.contractors = state.contractors.filter(c=>c.company!==company);
  await saveContractors(null, company);
  state.settings.customContractorCompanies = (state.settings.customContractorCompanies||[]).filter(c=>c!==company);
  const hidden = new Set(state.settings.hiddenContractorCompanies||[]);
  hidden.add(company);
  state.settings.hiddenContractorCompanies = Array.from(hidden);
  await saveSettings();
  if(state.contractorDetailCompany===company) state.contractorDetailCompany = null;
  showToast(`ลบ "${company}" ออกจากรายการผู้รับเหมาแล้ว`);
  render();
}

/* ---- สรุปผลการประเมินรับเหมารายวัน (ทุกใบ) ---- */
function allEvaluations(){
  const rows = [];
  state.permits.forEach(p=>{
    evaluationsOf(p).forEach(ev=>{
      rows.push({...ev, permitId:p.id, permitCode:p.code, company:(p.contractor&&p.contractor.company)||"(ไม่ระบุ)", department:p.department});
    });
  });
  rows.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  return rows;
}

function renderEvaluations(){
  const wrap = el(`<div><div class="pagehead"><div><h1>การประเมินรับเหมารายวัน</h1><p>สรุปผลการประเมินรับเหมาทั้งหมดจากทุกใบขออนุญาต เรียงจากล่าสุด</p></div></div></div>`);
  const rows = allEvaluations();
  if(rows.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีการประเมิน</h3><p>เข้าไปที่ใบขออนุญาตแต่ละใบ แล้วกด "+ เพิ่มการประเมินวันนี้" เพื่อเริ่มบันทึกผลการประเมิน</p></div>`));
    return wrap;
  }
  wrap.appendChild(el(`<p class="hint" style="margin:-4px 0 14px;">${EVAL_GRADE_STANDARD_TEXT}</p>`));

  // สรุปคะแนนเฉลี่ยแยกตามบริษัทผู้รับเหมา (เฉลี่ยจากคะแนนรวมเต็ม 100 ของทุกครั้งที่เคยประเมิน)
  const byCompany = {};
  rows.forEach(r=>{ (byCompany[r.company] = byCompany[r.company]||[]).push(r.totalScore); });
  const companySummary = Object.keys(byCompany).sort().map(company=>{
    const scores = byCompany[company];
    const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
    return {company, count:scores.length, avg, grade:evalGradeFromTotal(avg)};
  });

  wrap.appendChild(el(`<div class="card" style="padding:0;overflow:hidden;margin-bottom:16px;"><table class="permit-table">
    <thead><tr><th>บริษัทผู้รับเหมา</th><th>จำนวนครั้งที่ประเมิน</th><th>คะแนนเฉลี่ย (เต็ม 100)</th><th>เกรดรวม</th></tr></thead>
    <tbody>${companySummary.map(c=>`<tr>
      <td data-label="บริษัทผู้รับเหมา">${c.company}</td>
      <td data-label="จำนวนครั้งที่ประเมิน">${c.count}</td>
      <td data-label="คะแนนเฉลี่ย">${c.avg.toFixed(1)}</td>
      <td class="status-cell" data-label="เกรดรวม"><span style="padding:3px 12px;border-radius:20px;font-weight:700;font-size:13px;background:${c.grade.bg};color:${c.grade.color};">${c.grade.grade} — ${c.grade.label}</span></td>
    </tr>`).join('')}</tbody>
  </table></div>`));

  wrap.appendChild(el(`<div class="card" style="padding:0;overflow:hidden;"><table class="permit-table">
    <thead><tr><th>วันที่</th><th>เลขที่ใบ</th><th>ผู้รับเหมา</th><th>แผนก</th><th>ผู้ประเมิน</th><th>คะแนน</th><th>เกรด</th></tr></thead>
    <tbody>${rows.map(r=>{ const g = evalGradeFromTotal(r.totalScore); return `<tr class="clickable" data-id="${r.permitId}">
      <td data-label="วันที่">${r.date}</td>
      <td class="code-tag" data-label="เลขที่ใบ">${r.permitCode}</td>
      <td data-label="ผู้รับเหมา">${r.company}</td>
      <td data-label="แผนก">${r.department}</td>
      <td data-label="ผู้ประเมิน">${r.evaluatedBy}</td>
      <td data-label="คะแนน">${r.totalScore}/100${r.hasCritical?' 🔴':''}</td>
      <td class="status-cell" data-label="เกรด"><span style="padding:3px 12px;border-radius:20px;font-weight:700;font-size:12.5px;background:${g.bg};color:${g.color};">${r.grade}</span></td>
    </tr>`;}).join('')}</tbody>
  </table></div>`));
  wrap.querySelectorAll('tr.clickable').forEach(tr=>tr.onclick=()=>setState({detailId:tr.dataset.id}));
  return wrap;
}

// สถานะประกันอุบัติเหตุจากวันสิ้นสุดความคุ้มครอง: active / soon (เหลือ ≤30 วัน) / expired / notstarted / none
function insuranceStatusOf(start, end){
  const d = new Date(); const today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if(!end) return { key:'none', label:'ยังไม่ระบุ', days:null };
  const days = Math.round((new Date(end+'T00:00:00') - new Date(today+'T00:00:00'))/86400000);
  if(end < today) return { key:'expired', label:'หมดแล้ว', days };
  if(start && start > today) return { key:'notstarted', label:'ยังไม่เริ่มคุ้มครอง', days };
  if(days <= 30) return { key:'soon', label:`ใกล้หมด (เหลือ ${days} วัน)`, days };
  return { key:'active', label:`ยังคุ้มครองอยู่ (เหลือ ${days} วัน)`, days };
}
function insuranceBadge(st){
  const map = { active:'badge-success', soon:'badge-accent', expired:'badge-danger', notstarted:'badge-accent' };
  return map[st.key] ? `<span class="badge ${map[st.key]}">${st.label}</span>` : `<span class="badge" style="background:var(--wait-bg);color:var(--wait);">${st.label}</span>`;
}

/* ---- ทะเบียนผู้ผ่านการอบรม + ประกันอุบัติเหตุ (ค้นหาตามชื่อ/บริษัท/ปี) ---- */
function buildTrainedRegistryCard(){
  const esc = v => String(v==null?'':v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const d = new Date();
  const todayStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const rows = [];
  state.contractors.forEach(c=>(c.workers||[]).forEach((w,wi)=>{
    const year = trainYearOf(w.trainedDate);
    rows.push({ company:c.company, wi, name:w.name||'', position:w.position||'', date:w.trainedDate||'', year, expiry: trainExpiryOf(w.trainedDate), insStart:w.insuranceStart||'', insEnd:w.insuranceEnd||'', insurer:w.insurer||'', policyNo:w.policyNo||'' });
  }));
  const years = Array.from(new Set(rows.map(r=>r.year).filter(Boolean))).sort().reverse();
  const card = el(`<div class="card" style="margin-bottom:18px;">
    <h3 style="margin-top:0;font-size:15px;">ทะเบียนผู้ผ่านการอบรม และประกันอุบัติเหตุ</h3>
    <p class="hint" style="margin:0 0 10px;">ค้นหาว่าใครเคยอบรมแล้วในปีไหน — ผลการอบรมหมดอายุสิ้นปี (31 ธ.ค.) ของปีที่อบรม · ระบุระยะเวลาประกันอุบัติเหตุของแต่ละคนในตารางได้เลย (กรอกวันเริ่ม/วันสิ้นสุด ระบบบันทึกอัตโนมัติ และแจ้งสถานะ ยังคุ้มครองอยู่/หมดแล้ว)</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;">
      <div class="field" style="margin:0;"><label>ค้นหาชื่อ / บริษัท / บริษัทประกัน / เลขกรมธรรม์</label><input type="text" id="trSearch" placeholder="พิมพ์เพื่อค้นหา"></div>
      <div class="field" style="margin:0;"><label>ปีที่อบรม</label><select id="trYear"><option value="">ทุกปี</option>${years.map(y=>`<option value="${y}">${y}</option>`).join('')}</select></div>
      <div class="field" style="margin:0;"><label>สถานะการอบรม</label><select id="trStatus"><option value="">ทั้งหมด</option><option value="valid">ยังไม่หมดอายุ</option><option value="expired">หมดอายุแล้ว</option></select></div>
      <div class="field" style="margin:0;"><label>ประกันอุบัติเหตุ</label><select id="trIns"><option value="">ทั้งหมด</option><option value="active">ยังคุ้มครองอยู่</option><option value="soon">ใกล้หมด (≤30 วัน)</option><option value="expired">หมดแล้ว</option><option value="none">ยังไม่ระบุ</option></select></div>
    </div>
    <div class="hint" id="trCount" style="margin:10px 0 6px;"></div>
    <div style="overflow:auto;max-height:480px;"><table class="permit-table">
      <thead><tr><th>#</th><th>ชื่อ-นามสกุล</th><th>บริษัท</th><th>ตำแหน่ง</th><th>วันที่อบรม</th><th>หมดอายุอบรม</th><th>สถานะอบรม</th><th>บริษัทประกัน</th><th>เลขที่กรมธรรม์</th><th>ประกันเริ่ม</th><th>ประกันสิ้นสุด</th><th>สถานะประกัน</th></tr></thead>
      <tbody id="trBody"></tbody>
    </table></div>
  </div>`);
  function apply(){
    const q = card.querySelector('#trSearch').value.trim().toLowerCase();
    const yr = card.querySelector('#trYear').value;
    const st = card.querySelector('#trStatus').value;
    const insF = card.querySelector('#trIns').value;
    const list = rows.filter(r=>{
      if(q && !(r.name.toLowerCase().includes(q) || r.company.toLowerCase().includes(q) || r.insurer.toLowerCase().includes(q) || r.policyNo.toLowerCase().includes(q))) return false;
      if(yr && r.year!==yr) return false;
      const expired = r.expiry && r.expiry < todayStr;
      if(st==='valid' && (!r.expiry || expired)) return false;
      if(st==='expired' && !expired) return false;
      if(insF){ const k = insuranceStatusOf(r.insStart, r.insEnd).key; if(insF==='active' ? !(k==='active'||k==='notstarted') : k!==insF) return false; }
      return true;
    }).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || a.name.localeCompare(b.name,'th'));
    card.querySelector('#trCount').textContent = `พบ ${list.length} คน จากทั้งหมด ${rows.length} รายการ`;
    card.querySelector('#trBody').innerHTML = list.length ? list.map((r,i)=>{
      const expired = r.expiry && r.expiry < todayStr;
      const badge = !r.expiry ? `<span class="badge" style="background:var(--wait-bg);color:var(--wait);">ไม่ระบุวันที่</span>`
        : expired ? `<span class="badge badge-danger">หมดอายุ</span>` : `<span class="badge badge-success">ยังไม่หมดอายุ</span>`;
      const key = `${esc(r.company)}|${r.wi}`;
      return `<tr data-key="${key}"><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.company)}</td><td>${esc(r.position)||'-'}</td><td>${esc(r.date)||'-'}</td><td>${r.expiry||'-'}</td><td>${badge}</td>
        <td><input type="text" data-ins="insurer" value="${esc(r.insurer)}" placeholder="เช่น ทิพยประกันภัย" style="width:150px;"></td>
        <td><input type="text" data-ins="policyNo" value="${esc(r.policyNo)}" placeholder="เลขที่กรมธรรม์" style="width:140px;"></td>
        <td><input type="date" data-ins="insuranceStart" value="${esc(r.insStart)}" style="width:140px;"></td>
        <td><input type="date" data-ins="insuranceEnd" value="${esc(r.insEnd)}" style="width:140px;"></td>
        <td data-insbadge>${insuranceBadge(insuranceStatusOf(r.insStart, r.insEnd))}</td></tr>`;
    }).join('') : `<tr><td colspan="12" class="hint">ไม่พบรายชื่อที่ตรงกับเงื่อนไข</td></tr>`;
    card.querySelectorAll('#trBody input[data-ins]').forEach(inp=>{
      inp.onchange = async ()=>{
        const tr = inp.closest('tr'); const [company, wi] = tr.getAttribute('data-key').split('|');
        const profile = state.contractors.find(c=>c.company===company); if(!profile || !profile.workers[+wi]) return;
        profile.workers[+wi][inp.getAttribute('data-ins')] = inp.value;
        const row = rows.find(r=>r.company===company && r.wi===+wi);
        if(row){ const wk = profile.workers[+wi]; row.insStart = wk.insuranceStart||''; row.insEnd = wk.insuranceEnd||''; row.insurer = wk.insurer||''; row.policyNo = wk.policyNo||''; tr.querySelector('[data-insbadge]').innerHTML = insuranceBadge(insuranceStatusOf(row.insStart,row.insEnd)); }
        const s = tr.querySelector('[data-ins="insuranceStart"]').value, e = tr.querySelector('[data-ins="insuranceEnd"]').value;
        if(s && e && e < s){ showToast("วันสิ้นสุดประกันต้องไม่ก่อนวันเริ่ม"); }
        await persistContractorProfile(profile, { noRender:true });
      };
    });
  }
  card.querySelector('#trSearch').oninput = apply;
  card.querySelector('#trYear').onchange = apply;
  card.querySelector('#trStatus').onchange = apply;
  card.querySelector('#trIns').onchange = apply;
  apply();
  return card;
}

function renderContractors(){
  const wrap = el(`<div><div class="pagehead"><div><h1>รายละเอียดรับเหมา</h1><p>ผู้รับเหมาที่ผ่านการอบรม เอกสารประกอบ และประวัติการขอเข้าพื้นที่</p></div></div></div>`);

  const companies = allContractorCompanies().filter(c=>c!=="มิตรลาว");
  const totalCompaniesWithData = state.contractors.filter(c=>c.workers && c.workers.length).length;
  const totalTrainedWorkers = state.contractors.reduce((sum,c)=>sum+((c.workers&&c.workers.length)||0),0);
  const totalDocuments = state.contractors.reduce((sum,c)=>sum+((c.documents&&c.documents.length)||0),0);
  const totalCompleteDocs = companies.filter(c=>docCompleteness(getContractorProfile(c)).complete).length;

  wrap.appendChild(el(`
    <div class="grid4" style="margin-bottom:18px;">
      <div class="card" style="text-align:center;">
        <div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">บริษัทที่มีข้อมูลพนักงานแล้ว</div>
        <div style="font-family:'Oswald',sans-serif;font-size:32px;">${totalCompaniesWithData} <span style="font-size:16px;color:var(--ink-muted);">/ ${companies.length}</span></div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">พนักงานที่ผ่านการอบรมทั้งหมด</div>
        <div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--success);">${totalTrainedWorkers}</div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">เอกสารประกอบทั้งหมด</div>
        <div style="font-family:'Oswald',sans-serif;font-size:32px;">${totalDocuments}</div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">บริษัทที่เอกสารครบ</div>
        <div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--success);">${totalCompleteDocs} <span style="font-size:16px;color:var(--ink-muted);">/ ${companies.length}</span></div>
      </div>
    </div>
  `));

  backfillApprovedAccessRequests();
  wrap.appendChild(buildTrainedRegistryCard());

  wrap.appendChild(el(`<div class="card" style="margin-bottom:18px;">
    <h3 style="margin-top:0;font-size:15px;">เพิ่มบริษัทผู้รับเหมาใหม่</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <input type="text" id="newCompanyName" placeholder="ชื่อบริษัทผู้รับเหมา" style="flex:1;min-width:220px;">
      <button type="button" class="btn btn-primary btn-sm" id="addCompanyBtn">+ เพิ่มบริษัท</button>
    </div>
    <p class="hint" style="margin:8px 0 0;">บริษัทที่เพิ่มจะโผล่ในรายการด้านล่างและในตัวเลือก "บริษัท" ตอนสร้างใบขออนุญาตทันที</p>
  </div>`));
  wrap.querySelector('#addCompanyBtn').onclick = async ()=>{
    const input = wrap.querySelector('#newCompanyName');
    const name = input.value.trim();
    if(!name){ showToast("กรุณากรอกชื่อบริษัท"); return; }
    if(allContractorCompanies().includes(name)){ showToast("มีบริษัทนี้อยู่แล้ว"); return; }
    state.settings.customContractorCompanies = (state.settings.customContractorCompanies||[]).concat([name]);
    await saveSettings();
    render();
  };

  const listCard = el(`<div class="card"><h3 style="margin-top:0;font-size:15px;">รายชื่อบริษัทผู้รับเหมา</h3><div id="contractorRows"></div></div>`);
  wrap.appendChild(listCard);
  const rowsWrap = listCard.querySelector('#contractorRows');

  if(!companies.length){
    rowsWrap.innerHTML = `<p class="hint" style="margin:0;">ยังไม่มีรายชื่อบริษัทผู้รับเหมาในระบบ</p>`;
  }

  companies.forEach(company=>{
    const profile = getContractorProfile(company);
    const permitCount = state.permits.filter(p=>((p.contractor&&p.contractor.company)||"")===company).length;
    const isOpen = state.contractorDetailCompany === company;
    const dc = docCompleteness(profile);
    const isBlacklisted = !!(profile.general && profile.general.blacklisted);
    rowsWrap.appendChild(el(`<div style="border-top:1px solid var(--line);padding:12px 0;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div>
          <strong>${company}</strong>
          <span style="margin-left:8px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:${dc.complete?'var(--success-bg)':'var(--danger-bg)'};color:${dc.complete?'var(--success)':'var(--danger)'};">${dc.complete?'เอกสารครบ':'เอกสารไม่ครบ'}</span>
          ${isBlacklisted?`<span style="margin-left:6px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--danger-bg);color:var(--danger);">🚫 Blacklist</span>`:''}
          <div style="font-size:12.5px;color:var(--ink-muted);margin-top:2px;">พนักงานผ่านอบรม ${profile.workers.length} คน · เอกสาร ${profile.documents.length} ไฟล์ · ขอเข้าพื้นที่ ${permitCount} ครั้ง</div>
        </div>
        <button type="button" class="btn btn-outline btn-sm" data-toggle-company="${company.replace(/"/g,'&quot;')}">${isOpen?'ซ่อนรายละเอียด':'ดูรายละเอียด'}</button>
        ${(state.role==="jp"||state.role==="admin") ? `<button type="button" class="btn btn-danger btn-sm" data-delete-company="${company.replace(/"/g,'&quot;')}">🗑 ลบ</button>` : ''}
      </div>
    </div>`));
    if(isOpen) rowsWrap.appendChild(buildContractorDetailPanel(profile, company));
  });

  rowsWrap.querySelectorAll('[data-toggle-company]').forEach(btn=>{
    btn.onclick = ()=>{
      const c = btn.getAttribute('data-toggle-company');
      state.contractorDetailCompany = (state.contractorDetailCompany===c) ? null : c;
      render();
    };
  });
  rowsWrap.querySelectorAll('[data-delete-company]').forEach(btn=>{
    btn.onclick = async ()=>{
      const c = btn.getAttribute('data-delete-company');
      if(!(await requireAdmin(`ยืนยันลบ "${c}" ออกจากรายการผู้รับเหมาทั้งหมด (พนักงาน/เอกสาร/ข้อมูลทั่วไป)?\nการลบนี้กู้คืนไม่ได้`))) return;
      await deleteContractorProfile(c);
    };
  });

  return wrap;
}

function buildContractorDetailPanel(profile, company){
  const dc = docCompleteness(profile);
  const g = profile.general || defaultContractorGeneral();
  const panel = el(`<div style="background:var(--bg);border-radius:var(--radius);padding:14px;margin:0 0 4px;">
    <h4 style="margin:0 0 8px;font-size:13.5px;">ข้อมูลทั่วไปของผู้รับเหมา</h4>

      <div class="field"><label>วันที่เข้าทำงาน</label><input type="date" id="genEntryDate" value="${g.entryDate||''}"></div>

      <div class="field"><label>วันที่ต้องการอบรม</label><input type="date" id="genTrainingDate" value="${g.trainingDateNeeded||''}"></div>
      <div class="field"><label>จำนวนผู้เข้าอบรม</label><input type="number" min="0" id="genTraineeCount" value="${g.traineeCount||''}"></div>
    </div>
    <button type="button" class="btn btn-primary btn-sm" id="saveGenInfoBtn">บันทึกข้อมูลทั่วไป</button>

    <h4 style="margin:22px 0 8px;font-size:13.5px;">พนักงานที่ผ่านการอบรม</h4>
    <div id="workerRows"></div>
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
      <input type="text" id="newWorkerName" placeholder="ชื่อพนักงาน" style="flex:1;min-width:140px;">
      <input type="date" id="newWorkerDate">
      <button type="button" class="btn btn-outline btn-sm" id="addWorkerBtn">+ เพิ่ม</button>
      <label class="btn btn-outline btn-sm" style="margin:0;">⬆ นำเข้าจาก Excel<input type="file" id="importWorkerExcel" accept=".xlsx,.xls,.csv" style="display:none;"></label>
    </div>
    <p class="hint" style="margin:6px 0 0;">ไฟล์ Excel: คอลัมน์แรก = ชื่อพนักงาน, คอลัมน์ที่สอง = วันที่อบรม (ไม่บังคับ) แถวแรกเป็นหัวตารางก็ได้ ระบบจะข้ามให้เอง</p>

    <h4 style="margin:18px 0 4px;font-size:13.5px;">เอกสารประกอบ</h4>
    <div style="padding:10px 12px;border-radius:var(--radius);background:${dc.complete?'var(--success-bg)':'var(--accent-bg)'};margin-bottom:10px;">
      <strong style="font-size:13px;color:${dc.complete?'var(--success)':'var(--accent-ink)'};">${dc.complete?'เอกสารครบถ้วนแล้ว':`ยังขาดเอกสาร ${dc.missing.length} รายการ:`}</strong>
      ${dc.missing.length?`<ul style="margin:6px 0 0;padding-left:20px;font-size:13px;">${dc.missing.map(m=>`<li>${m.label}</li>`).join('')}</ul>`:''}
    </div>
    <div id="docRows"></div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">
      <select id="newDocCategory" style="flex:1;min-width:200px;">
        ${REQUIRED_DOC_CATEGORIES.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}
        <option value="other">อื่นๆ</option>
      </select>
      <label class="btn btn-outline btn-sm" style="margin:0;">⬆ อัปโหลดเอกสาร<input type="file" id="newDocInput" style="display:none;"></label>
    </div>

    <h4 style="margin:18px 0 8px;font-size:13.5px;">ประวัติการขอเข้าพื้นที่</h4>
    <div id="accessRows"></div>

    <h4 style="margin:18px 0 8px;font-size:13.5px;">ประวัติงาน / บัญชีดำ (Blacklist)</h4>
    <div class="card" style="background:${g.blacklisted?'var(--danger-bg)':'var(--bg)'};margin:0;">
      <label class="checkrow" style="margin-bottom:8px;"><input type="checkbox" id="genBlacklisted" ${g.blacklisted?'checked':''}> ขึ้นบัญชีดำ (Blacklist) — ห้ามเข้าปฏิบัติงานจนกว่าจะได้รับการทบทวน</label>
      <div class="field" style="margin-bottom:8px;"><label>เหตุผล / ประวัติที่เกี่ยวข้อง</label><input type="text" id="genBlacklistReason" value="${(g.blacklistReason||'').replace(/"/g,'&quot;')}" placeholder="เช่น ฝ่าฝืนกฎความปลอดภัยซ้ำ, ทำงานไม่ได้มาตรฐาน"></div>
      <button type="button" class="btn btn-danger btn-sm" id="saveBlacklistBtn">บันทึกสถานะ Blacklist</button>
    </div>
  </div>`);

  const workerRows = panel.querySelector('#workerRows');
  if(!profile.workers.length) workerRows.innerHTML = `<p class="hint" style="margin:0;">ยังไม่มีข้อมูลพนักงาน</p>`;
  profile.workers.forEach((w,i)=>{
    workerRows.appendChild(el(`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;">
      <span>${w.name}${w.trainedDate?` <span style="color:var(--ink-muted);">— อบรมเมื่อ ${w.trainedDate}</span>`:''}</span>
      <button type="button" class="jsaRemove" data-remove-worker="${i}" title="ลบ">×</button>
    </div>`));
  });

  const docRows = panel.querySelector('#docRows');
  if(!profile.documents.length) docRows.innerHTML = `<p class="hint" style="margin:0;">ยังไม่มีเอกสาร</p>`;
  const catLabel = id => (REQUIRED_DOC_CATEGORIES.find(c=>c.id===id)||{}).label || "อื่นๆ";
  profile.documents.forEach((d,i)=>{
    docRows.appendChild(el(`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;gap:8px;">
      <span><a href="${d.url}" target="_blank" rel="noopener">${d.name}</a><br><span style="font-size:11.5px;color:var(--ink-muted);">${catLabel(d.category)}</span></span>
      <button type="button" class="jsaRemove" data-remove-doc="${i}" title="ลบ">×</button>
    </div>`));
  });

  const accessRows = panel.querySelector('#accessRows');
  const relatedPermits = state.permits.filter(p=>((p.contractor&&p.contractor.company)||"")===company).slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!relatedPermits.length) accessRows.innerHTML = `<p class="hint" style="margin:0;">ยังไม่เคยขอเข้าพื้นที่</p>`;
  relatedPermits.forEach(p=>{
    accessRows.appendChild(el(`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;">
      <a href="#" data-open-permit="${p.id}">${p.code}</a>
      <span style="color:var(--ink-muted);">${p.department} · ${p.startDate} · ${STAGE_LABEL[p.status]||p.status}</span>
    </div>`));
  });

  panel.querySelectorAll('[data-remove-worker]').forEach(btn=>{
    btn.onclick = async ()=>{ if(!(await requireAdmin('ลบรายชื่อพนักงานออกจากทะเบียนผู้รับเหมา — ต้องใช้รหัสผ่านผู้ดูแลระบบ'))) return; profile.workers.splice(Number(btn.getAttribute('data-remove-worker')),1); persistContractorProfile(profile); };
  });
  panel.querySelectorAll('[data-remove-doc]').forEach(btn=>{
    btn.onclick = async ()=>{ if(!(await requireAdmin('ลบเอกสารผู้รับเหมา — ต้องใช้รหัสผ่านผู้ดูแลระบบ'))) return; profile.documents.splice(Number(btn.getAttribute('data-remove-doc')),1); persistContractorProfile(profile); };
  });
  panel.querySelectorAll('[data-open-permit]').forEach(a=>{
    a.onclick = (e)=>{ e.preventDefault(); state.detailId = a.getAttribute('data-open-permit'); render(); };
  });
  panel.querySelector('#addWorkerBtn').onclick = ()=>{
    const nameInput = panel.querySelector('#newWorkerName');
    const dateInput = panel.querySelector('#newWorkerDate');
    const name = nameInput.value.trim();
    if(!name){ showToast("กรุณากรอกชื่อพนักงาน"); return; }
    profile.workers.push({ name, trainedDate: dateInput.value||"" });
    persistContractorProfile(profile);
  };
  const importInput = panel.querySelector('#importWorkerExcel');
  importInput.onchange = async ()=>{
    const file = importInput.files[0];
    if(!file) return;
    if(typeof XLSX === "undefined"){ showToast("โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้าแล้วลองใหม่"); return; }
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      let added = 0;
      rows.forEach(row=>{
        const name = (row[0]!=null ? String(row[0]).trim() : "");
        if(!name || /^(ชื่อ|name)/i.test(name)) return; // ข้ามแถวหัวตาราง
        let trainedDate = "";
        const rawDate = row[1];
        if(rawDate instanceof Date) trainedDate = rawDate.toISOString().slice(0,10);
        else if(typeof rawDate === "number") trainedDate = XLSX.SSF ? XLSX.SSF.format("yyyy-mm-dd", rawDate) : "";
        else if(rawDate) trainedDate = String(rawDate).trim();
        profile.workers.push({ name, trainedDate });
        added++;
      });
      if(!added){ showToast("ไม่พบรายชื่อในไฟล์ที่นำเข้า"); return; }
      showToast(`นำเข้าพนักงาน ${added} คนสำเร็จ`);
      await persistContractorProfile(profile);
    }catch(e){ showToast("อ่านไฟล์ Excel ไม่สำเร็จ ตรวจสอบรูปแบบไฟล์อีกครั้ง"); }
  };
  const docInput = panel.querySelector('#newDocInput');
  docInput.onchange = async ()=>{
    const file = docInput.files[0];
    if(!file) return;
    const category = panel.querySelector('#newDocCategory').value;
    try{
      showToast("กำลังอัปโหลดเอกสาร...");
      const url = await uploadFileToSupabase(file, `documents/${company}`);
      profile.documents.push({ name: file.name, url, category, uploadedAt: new Date().toISOString() });
      await persistContractorProfile(profile);
    }catch(e){ showToast("อัปโหลดเอกสารไม่สำเร็จ ลองอีกครั้ง"); }
  };

  panel.querySelector('#saveGenInfoBtn').onclick = ()=>{
    // ประเภทงาน/รายชื่อผู้ปฏิบัติงาน/เอกสารคุณสมบัติ ย้ายไปกรอกตอนสร้าง "คำร้องขอเข้าพื้นที่ทำงาน" แทนแล้ว
    // ไม่มีช่องกรอกในหน้านี้แล้ว จึงคงค่าที่เคยมีอยู่เดิมไว้ (ถ้ามี) ไม่ล้างทิ้งตอนกดบันทึก
    profile.general = {
      entryDate: panel.querySelector('#genEntryDate').value,
      coordinatorName: panel.querySelector('#genCoordinator').value.trim(),
      phone: panel.querySelector('#genPhone').value.trim(),
      ownerDept: panel.querySelector('#genOwnerDept').value.trim(),
      workTypes: g.workTypes||[],
      compliance: g.compliance||{},
      workerCount: panel.querySelector('#genWorkerCount').value,
      workerNames: g.workerNames||'',
      trainingDateNeeded: panel.querySelector('#genTrainingDate').value,
      traineeCount: panel.querySelector('#genTraineeCount').value,
      startDate: panel.querySelector('#genStartDate').value,
      endDate: panel.querySelector('#genEndDate').value
    };
    persistContractorProfile(profile);
    showToast("บันทึกข้อมูลทั่วไปของผู้รับเหมาแล้ว");
  };

  panel.querySelector('#saveBlacklistBtn').onclick = ()=>{
    const blacklisted = panel.querySelector('#genBlacklisted').checked;
    const blacklistReason = panel.querySelector('#genBlacklistReason').value.trim();
    profile.general = { ...(profile.general||defaultContractorGeneral()), blacklisted, blacklistReason };
    persistContractorProfile(profile);
    showToast(blacklisted ? `ขึ้นบัญชีดำ "${company}" แล้ว` : `นำ "${company}" ออกจากบัญชีดำแล้ว`);
  };

  return panel;
}

/* ---- Dashboard ---- */
function permitDurationHours(p){
  try{
    const start = new Date(`${p.startDate}T${p.startTime}`);
    const end = new Date(`${p.endDate}T${p.endTime}`);
    const diffMs = end - start;
    if(isNaN(diffMs) || diffMs<=0) return 0;
    return diffMs / 3600000;
  }catch(e){ return 0; }
}
function permitLaborHours(p){
  const workers = Number(p.workerCount) || 0;
  return workers * permitDurationHours(p);
}
function formatHours(h){
  return h.toLocaleString('th-TH', {maximumFractionDigits:1});
}

function buildBreakdownCard(title, permits, keyFn){
  if(!permits.length){
    return el(`<div class="card"><h3 style="margin-top:0;font-size:15px;">${title}</h3><p class="hint" style="margin:0;">ยังไม่มีข้อมูลในกลุ่มนี้</p></div>`);
  }
  const groups = {};
  permits.forEach(p=>{
    const key = keyFn(p) || "(ไม่ระบุ)";
    if(!groups[key]) groups[key] = {total:0, approved:0, rejected:0, pending:0, hours:0};
    groups[key].total++;
    groups[key].hours += permitLaborHours(p);
    if(p.status==="approved") groups[key].approved++;
    else if(p.status==="rejected") groups[key].rejected++;
    else groups[key].pending++;
  });
  const rows = Object.entries(groups).sort((a,b)=>b[1].total-a[1].total);
  const maxTotal = Math.max(...rows.map(r=>r[1].total));
  const CHART_H = 180; // ความสูงพื้นที่กราฟ (ไม่รวมตัวเลขด้านบน/ป้ายชื่อด้านล่าง)

  const wrap = el(`<div class="card">
    <h3 style="margin-top:0;font-size:15px;">${title}</h3>
    <div style="display:flex;align-items:flex-end;gap:20px;height:${CHART_H}px;padding:24px 4px 0;overflow-x:auto;" id="barChart"></div>
    <div style="display:flex;gap:14px;font-size:12px;color:var(--ink-muted);margin-top:10px;">
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--success);border-radius:2px;margin-right:4px;"></span>อนุมัติแล้ว</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:2px;margin-right:4px;"></span>รออนุมัติ</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--danger);border-radius:2px;margin-right:4px;"></span>ไม่อนุมัติ</span>
    </div>
  </div>`);
  const chartWrap = wrap.querySelector('#barChart');
  rows.forEach(([key, g])=>{
    const barH = Math.max((g.total/maxTotal)*CHART_H, 6);
    const hApproved = g.total ? (g.approved/g.total)*barH : 0;
    const hPending  = g.total ? (g.pending/g.total)*barH  : 0;
    const hRejected = g.total ? (g.rejected/g.total)*barH : 0;
    chartWrap.appendChild(el(`
      <div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;align-self:flex-end;">
        <div style="font-size:12px;font-weight:600;margin-bottom:4px;">${g.total}</div>
        <div style="width:40px;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;">
          <div style="height:${hApproved}px;background:var(--success);" title="อนุมัติแล้ว ${g.approved}"></div>
          <div style="height:${hPending}px;background:var(--accent);" title="รออนุมัติ ${g.pending}"></div>
          <div style="height:${hRejected}px;background:var(--danger);" title="ไม่อนุมัติ ${g.rejected}"></div>
        </div>
        <div style="font-size:11px;color:var(--ink-muted);margin-top:8px;text-align:center;max-width:74px;line-height:1.3;">${key}</div>
        <div style="font-size:10px;color:var(--ink-muted);margin-top:2px;text-align:center;">${formatHours(g.hours)} คน-ชม.</div>
      </div>
    `));
  });
  return wrap;
}

    const payload = JSON.stringify({exportedAt:new Date().toISOString(), settings: state.settings, permits: state.permits}, null, 2);
    const blob = new Blob([payload], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `work-permit-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("ดาวน์โหลดไฟล์สำรองข้อมูลแล้ว");
  };
  wrap.querySelector('#importInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data.settings || !data.permits) throw new Error("invalid file");
      if(!(await requireAdmin(`นำเข้าข้อมูลจากไฟล์สำรอง (ใบอนุญาต ${data.permits.length} ใบ) จะเขียนทับข้อมูลปัจจุบันทั้งหมด ยืนยันหรือไม่?`))) return;
      state.settings = migrateSettings(data.settings);
      state.permits = data.permits;
      await saveSettings();
      await savePermits();
      showToast("นำเข้าข้อมูลสำรองเรียบร้อย");
      render();
    }catch(err){
      showToast("ไฟล์ไม่ถูกต้อง ไม่สามารถนำเข้าข้อมูลได้");
    }
  };
  wrap.querySelector('#saveSettingsBtn').onclick = async ()=>{
    document.querySelectorAll('[data-dept]').forEach(inp=>{ state.settings.deptOwnerEmails[inp.dataset.dept] = toEmailArray(inp.value); });
    state.settings.jpEmails = toEmailArray(document.getElementById('jpEmailInput').value);
    state.settings.managerEmails = toEmailArray(document.getElementById('managerEmailInput').value);
    const companyDeptMap = {};
    document.querySelectorAll('[data-company]').forEach(sel=>{ companyDeptMap[sel.dataset.company] = sel.value; });
    state.settings.companyDeptMap = companyDeptMap;
    await saveSettings();
    showToast(state.storageAvailable ? "บันทึกการตั้งค่าเรียบร้อย" : "บันทึกไว้ในหน้าจอนี้แล้ว แต่จะหายเมื่อปิด — ดูวิธีแก้ด้านบน หรือดาวน์โหลดสำรองไว้ก่อน");
    render();
  };
  return wrap;
}

/* ---- Detail modal ---- */
function downloadPermitAsExcel(permit){
  if(typeof XLSX === "undefined"){ showToast("โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้าแล้วลองใหม่"); return; }
  const typesLabel = permit.permitTypes.map(t=>PERMIT_TYPES.find(p=>p.id===t)?.label||t).join(', ');

  const summaryRows = [
    ["เลขที่ใบขออนุญาต", permit.code],
    ["สถานะ", STAGE_LABEL[permit.status]||permit.status],
    ["สร้างเมื่อ", new Date(permit.createdAt).toLocaleString('th-TH')],
    ["ผู้รับเหมา", permit.contractor.company],
    ["ผู้ติดต่อ", permit.contractor.contactName],
    ["โทร", permit.contractor.phone],
    ["แผนก", permit.department],
    ["สถานที่", permit.location],
    ["ลักษณะงาน", permit.workDescription],
    ["ประเภทงาน", typesLabel + (permit.otherTypeNote?` — ${permit.otherTypeNote}`:'')],
    ["วันเวลาปฏิบัติงาน", `${permit.startDate} ${permit.startTime} — ${permit.endDate} ${permit.endTime}`],
    ["จำนวนผู้ปฏิบัติงาน", permit.workerCount||''],
    ["PPE", (permit.ppe||[]).join(', ')],
    ["ความเสี่ยง/อันตรายที่ต้องระวัง", permit.hazards||'']
  ];
  if(permit.riskAssessment){
    const rl = RISK_LEVELS[permit.riskAssessment.level] || {};
    summaryRows.push(["ระดับความเสี่ยง (ภาพรวม)", rl.label||permit.riskAssessment.level]);
    summaryRows.push(["ติ๊กครบมาตรการควบคุม", `${permit.riskAssessment.checkedCount}/${permit.riskAssessment.total}`]);
  }
  const wsSummary = XLSX.utils.aoa_to_sheet([["หัวข้อ","รายละเอียด"], ...summaryRows]);
  wsSummary['!cols'] = [{wch:26},{wch:60}];

  const jsaRows = [["#","ขั้นตอนการทำงาน","อันตราย","มาตรการควบคุม","ความรุนแรง","โอกาสเกิด","ระดับความเสี่ยง"]];
  (permit.jsa||[]).forEach((r,i)=>{
    const hasScore = r.severity!=null && r.likelihood!=null;
    jsaRows.push([i+1, r.step||'', r.hazard||'', r.control||'', r.severity||'', r.likelihood||'', hasScore?`${r.severity*r.likelihood} · ${jsaRiskScoreLevel(r.severity*r.likelihood).label}`:'']);
  });
  const wsJsa = XLSX.utils.aoa_to_sheet(jsaRows);
  wsJsa['!cols'] = [{wch:4},{wch:28},{wch:32},{wch:32},{wch:10},{wch:10},{wch:14}];

  const approvalRows = [["ขั้นตอน","ผู้อนุมัติ","การตัดสินใจ","ความเห็น","เวลา"]];
  (permit.approvals||[]).forEach(a=>{
    approvalRows.push([STAGE_LABEL[a.stage]||a.stage, a.approverEmail||'', a.decision==='approved'?'อนุมัติ':'ไม่อนุมัติ', a.comment||'', new Date(a.at).toLocaleString('th-TH')]);
  });
  const wsApprovals = XLSX.utils.aoa_to_sheet(approvalRows);
  wsApprovals['!cols'] = [{wch:24},{wch:26},{wch:12},{wch:32},{wch:20}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSummary, "สรุปใบขออนุญาต");
  XLSX.utils.book_append_sheet(wb, wsJsa, "JSA");
  XLSX.utils.book_append_sheet(wb, wsApprovals, "ประวัติการอนุมัติ");
  XLSX.writeFile(wb, `${permit.code}.xlsx`);
}

    <div class="card" style="margin-top:10px;background:#FAFAF8;">
      <h3 style="margin-top:0;font-size:14px;">การพิจารณาของท่าน (${STAGE_LABEL[permit.status]})</h3>
      <div class="field"><label>ความคิดเห็น</label><textarea id="decisionComment" placeholder="หมายเหตุ (ถ้ามี)"></textarea></div>
      ${permit.status==='area_owner' ? `<div class="field"><label>รูปหน้างานเพื่อยืนยันการตรวจสอบ <span class="req">*</span> (จำเป็นสำหรับการอนุมัติของเจ้าของพื้นที่ แนบได้สูงสุด ${MAX_PHOTOS} รูป — ถ่ายใหม่หรือเลือกจากคลังรูปในเครื่องก็ได้)</label><input type="file" id="decisionPhoto" accept="image/*" multiple></div>` : ''}
      <div style="display:flex;gap:10px;margin-top:6px;">
        <button class="btn btn-success" id="approveBtn">อนุมัติ</button>
        <button class="btn btn-danger" id="rejectBtn">ไม่อนุมัติ</button>
      </div>
    </div>` : (isPendingStage ? `
    <div class="notice no-print" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;">
      <span>ใบนี้รอการพิจารณาขั้นตอน "${STAGE_LABEL[permit.status]}" — เจ้าของพื้นที่ / จป. / ผู้จัดการ เข้าสู่ระบบเพื่อกดอนุมัติได้ทันที ไม่ต้องผ่านอีเมล</span>
      <button type="button" class="btn btn-primary btn-sm" id="loginToApproveBtn">🔒 เข้าสู่ระบบเพื่ออนุมัติ</button>
    </div>` : '')}
    ${state.role==='admin' ? `
    <div class="card" style="margin-top:10px;border-color:#E3C1B3;">
      <h3 style="margin-top:0;font-size:14px;color:var(--danger);">โซนอันตราย (สำหรับผู้ดูแลระบบ)</h3>
      <p class="hint" style="margin-top:0;">ใช้สำหรับลบข้อมูลทดสอบที่ค้างอยู่ การลบไม่สามารถกู้คืนได้</p>
      <button type="button" class="btn btn-danger" id="deletePermitBtn">🗑 ลบใบขออนุญาตนี้ทิ้ง</button>
    </div>` : ''}
  `;

  inner.querySelector('#closeModal').onclick = ()=>setState({detailId:null});
  const loginToApproveBtn = inner.querySelector('#loginToApproveBtn');
  if(loginToApproveBtn) loginToApproveBtn.onclick = ()=>setState({ loginReturnPermit: permit.id, detailId:null, showLoginModal:true });

  inner.querySelector('#downloadPdfBtn').onclick = ()=>{ window.print(); };
  inner.querySelector('#downloadExcelBtn').onclick = ()=>{ downloadPermitAsExcel(permit); };

  inner.querySelectorAll('[data-resend-idx]').forEach(btn=>{
    btn.onclick = ()=> resendNotification(permit, Number(btn.dataset.resendIdx));
  });

  const deleteBtn = inner.querySelector('#deletePermitBtn');
  if(deleteBtn){
    deleteBtn.onclick = async ()=>{
      if(!(await requireAdmin(`ยืนยันลบใบขออนุญาต ${permit.code} ทิ้งอย่างถาวร?\n(การลบนี้กู้คืนไม่ได้)`))) return;
      await deletePermit(permit.id);
    };
  }

  const toggleEvalBtn = inner.querySelector('#toggleEvalFormBtn');
  const evalFormCard = inner.querySelector('#evalFormCard');
  if(toggleEvalBtn && evalFormCard){
    toggleEvalBtn.onclick = ()=>{ evalFormCard.style.display = evalFormCard.style.display==='none' ? '' : 'none'; };
    inner.querySelector('#cancelEvalBtn').onclick = ()=>{ evalFormCard.style.display = 'none'; };
    let evalBusy = false;
    inner.querySelector('#submitEvalBtn').onclick = async ()=>{
      if(evalBusy) return;
      const photoInput = inner.querySelector('#evalPhotoInput');
      if(photoInput.files.length>MAX_PHOTOS){ showToast(`แนบรูปได้ไม่เกิน ${MAX_PHOTOS} รูป`); return; }
      evalBusy = true;
      const submitBtn = inner.querySelector('#submitEvalBtn');
      submitBtn.disabled = true;
      try{
        const scores = {};
        EVAL_CRITERIA.forEach(c=>{
          const sel = inner.querySelector(`[data-eval-crit="${c.id}"]`);
          scores[c.id] = Number(sel.value);
        });
        const note = inner.querySelector('#evalNote').value.trim();
        let photos = [];
        if(photoInput.files.length){
          try{
            const rawPhotos = await filesToDataUrls(photoInput.files);
            photos = await uploadPhotosAndGetUrls(rawPhotos, "eval_" + Date.now());
          }catch(e){
            showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองบันทึกใหม่โดยไม่แนบรูป หรือลองอีกครั้ง");
            return;
          }
        }
        await addEvaluation(permit, scores, note, photos, state.myEmail);
      } finally {
        evalBusy = false;
      }
    };
  }

  if(canAct){
    let decisionBusy = false;
    const approveBtn = inner.querySelector('#approveBtn');
    const rejectBtn = inner.querySelector('#rejectBtn');
    approveBtn.onclick = async ()=>{
      if(decisionBusy) return; // กันกดซ้ำเร็วเกินไปจนยิง request ซ้อนกัน ทำให้สถานะเพี้ยน
      decisionBusy = true;
      approveBtn.disabled = true; rejectBtn.disabled = true;
      try{
        const comment = inner.querySelector('#decisionComment').value.trim();
        const photoInput = inner.querySelector('#decisionPhoto');
        let photos = [];
        if(permit.status==='area_owner'){
          if(!photoInput.files.length){ showToast("กรุณาแนบรูปภาพอย่างน้อย 1 รูปก่อนอนุมัติ (ขั้นตอนเจ้าของพื้นที่)"); return; }
          if(photoInput.files.length>MAX_PHOTOS){ showToast(`แนบรูปได้ไม่เกิน ${MAX_PHOTOS} รูป`); return; }
          try{
            const rawPhotos = await filesToDataUrls(photoInput.files);
            photos = await uploadPhotosAndGetUrls(rawPhotos, "approval_" + Date.now());
          }catch(e){
            showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองอีกครั้ง");
            return;
          }
        }
        await decide(permit, "approved", comment, photos);
      } finally {
        decisionBusy = false;
        approveBtn.disabled = false; rejectBtn.disabled = false;
      }
    };
    rejectBtn.onclick = async ()=>{
      if(decisionBusy) return;
      decisionBusy = true;
      approveBtn.disabled = true; rejectBtn.disabled = true;
      try{
        const comment = inner.querySelector('#decisionComment').value.trim();
        if(!comment){ showToast("กรุณาระบุเหตุผลที่ไม่อนุมัติ"); return; }
        await decide(permit, "rejected", comment, null);
      } finally {
        decisionBusy = false;
        approveBtn.disabled = false; rejectBtn.disabled = false;
      }
    };
  }
}

let roleSetFromUrl = false;
function applyDeepLinkFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const permitId = params.get("permit");
  const roleParam = params.get("role");
  const arId = params.get("ar");
  const emailParam = (params.get("email")||"").trim();
  if(roleParam && ROLES.some(r=>r.id===roleParam)){
    state.role = roleParam;
    roleSetFromUrl = true;
  }
  // เติม "อีเมลของฉัน" อัตโนมัติจากลิงก์ในอีเมลแจ้งเตือน กันกรณีลืมพิมพ์/พิมพ์อีเมลตัวเองผิด
  // แล้วเจอ "ไม่มีสิทธิ์อนุมัติขั้นตอนนี้" ทั้งที่จริงๆ เป็นผู้มีสิทธิ์
  if(emailParam){
    state.myEmail = emailParam;
    saveMyEmail(emailParam);
  }
  if(permitId){
    state.route = "all";
    state.detailId = permitId;
  }
  if(arId){
    state.route = "ar_list";
    state.arDetailId = arId;
  }
}

applyDeepLinkFromUrl();
loadAll();
</script>
