    <p class="hint" style="margin:10px 0 0;">🔒 รูปและเอกสารที่เลือกจะถูกส่งไปยังผู้ให้บริการ AI ที่ตั้งค่าไว้เพื่อวิเคราะห์ — ไม่ควรถ่ายติดข้อมูลส่วนบุคคลที่ไม่จำเป็น · AI อาจผิดพลาด ผู้ประเมินต้องตรวจสอบทุกครั้ง</p>
  </div>`);
  wrap.appendChild(form);
  const result = el(`<div id="scResult"></div>`); wrap.appendChild(result);
  if(_scanDraft){ renderScanReview(result); }

  const msg = form.querySelector('#scMsg'), runBtn = form.querySelector('#scRun'), manualBtn = form.querySelector('#scManual');
  const setMsg = (t, bad)=>{ msg.textContent = t; msg.style.color = bad ? 'var(--danger)' : ''; };
  manualBtn.onclick = async ()=>{
    const dept = form.querySelector('#scDept').value, loc = form.querySelector('#scLoc').value.trim(), by = form.querySelector('#scBy').value.trim();
    if(!dept || !loc || !by){ setMsg("กรุณากรอก แผนก จุดที่ตรวจ และผู้ประเมิน", true); return; }
    manualBtn.disabled = true; setMsg("กำลังเตรียมไฟล์...");
    try{
      const photos = form.querySelector('#scPhotos').files.length ? await filesToDataUrls(form.querySelector('#scPhotos').files, 6, 1280) : [];
      const docImgs = [];
      for(const f of Array.from(form.querySelector('#scDocs').files||[])){ if(!(f.type==="application/pdf" || /\.pdf$/i.test(f.name))) docImgs.push(...await filesToDataUrls([f], 1, 1800)); }
      const desc = form.querySelector('#scDesc').value.trim();
      _scanDraft = scanBuildDraft({ scene_summary:desc }, { department:dept, location:loc, workDescription:desc, assessor:by, permitId:form.querySelector('#scPermit').value });
      _scanDraft.provider = "manual"; _scanDraft.model = ""; _scanDraft.confidence = "manual"; _scanDraft.photoDataUrls = photos; _scanDraft.docDataUrls = docImgs;
      setMsg("เริ่มประเมินเอง — เพิ่มอันตรายที่พบและให้คะแนนด้านล่าง");
      renderScanReview(result); result.scrollIntoView({behavior:'smooth', block:'start'});
    }catch(e){ setMsg("เตรียมไฟล์ไม่สำเร็จ: "+(e.message||e), true); }
    manualBtn.disabled = false;
  };
  runBtn.onclick = async ()=>{
    const dept = form.querySelector('#scDept').value, loc = form.querySelector('#scLoc').value.trim(), by = form.querySelector('#scBy').value.trim();
    const photoFiles = form.querySelector('#scPhotos').files, docFiles = Array.from(form.querySelector('#scDocs').files||[]);
    if(!dept || !loc || !by){ setMsg("กรุณากรอก แผนก จุดที่ตรวจ และผู้ประเมิน", true); return; }
    if(!photoFiles.length && !docFiles.length){ setMsg("กรุณาแนบรูปหน้างานหรือเอกสารอย่างน้อย 1 ไฟล์", true); return; }
    runBtn.disabled = true; setMsg("กำลังเตรียมไฟล์...");
    try{
      const photos = photoFiles.length ? await filesToDataUrls(photoFiles, 6, 1280) : [];
      const docImgs = [], docPdfs = [];
      for(const f of docFiles){
        if(f.type==="application/pdf" || /\.pdf$/i.test(f.name)){
          if(f.size>12*1024*1024) throw new Error(`ไฟล์ ${f.name} ใหญ่เกิน 12 MB`);
          docPdfs.push(await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('อ่าน PDF ไม่ได้')); r.readAsDataURL(f); }));
        } else { docImgs.push(...await filesToDataUrls([f], 1, 1800)); }
      }
      setMsg("AI กำลังวิเคราะห์ภาพและเอกสาร (ประมาณ 10–40 วินาที)...");
      const ctx = `แผนก: ${dept}\nจุดที่ตรวจ: ${loc}\nลักษณะงาน: ${form.querySelector('#scDesc').value.trim()||'(ไม่ระบุ)'}\nจำนวนรูปหน้างาน: ${photos.length} · เอกสาร: ${docImgs.length+docPdfs.length} ไฟล์ (รูปเอกสารอยู่ท้ายรูปหน้างาน)\nวิเคราะห์ตามรูปแบบ JSON ที่กำหนด`;
      let ai, edgeResp = null;
      if(scanMode()==='edge'){
        if(!scanAppKey()) throw new Error("โหมดเซิร์ฟเวอร์ต้องใส่รหัสแอปในกล่อง ⚙ การเชื่อมต่อเซิร์ฟเวอร์ก่อน");
        edgeResp = await callEdge('analyze-safety', { images:[...photos, ...docImgs], pdfs:docPdfs, context:{ department:dept, location:loc, description:form.querySelector('#scDesc').value.trim() } });
        ai = edgeResp.result;
      } else {
        const text = await callAiVision(scanSystemPrompt(), ctx, [...photos, ...docImgs], docPdfs);
        ai = scanParseJson(text);
      }
      const permitId = form.querySelector('#scPermit').value;
      _scanDraft = scanBuildDraft(ai, { department:dept, location:loc, workDescription:form.querySelector('#scDesc').value.trim(), assessor:by, permitId });
      _scanDraft.photoDataUrls = photos; _scanDraft.docDataUrls = docImgs; _scanDraft.pdfCount = docPdfs.length;
      if(edgeResp){ _scanDraft.provider = edgeResp.provider; _scanDraft.model = edgeResp.model; _scanDraft.engine = edgeResp.engine; }
      setMsg("วิเคราะห์เสร็จแล้ว — ตรวจสอบผลด้านล่าง");
      renderScanReview(result);
      result.scrollIntoView({behavior:'smooth', block:'start'});
    }catch(e){ setMsg("วิเคราะห์ไม่สำเร็จ: "+(e.message||e), true); }
    runBtn.disabled = false;
  };
  return wrap;
}

function renderScanReview(box){
  const d = _scanDraft; if(!d){ box.innerHTML = ""; return; }
  const ov = scanOverall(d.findings);
  const lvl = scanRiskLevel(ov.maxScore);
  const planOf = fid => d.plan.filter(p=>p.fid===fid);
  const catOpts = id => SCAN_CATEGORIES.map(c=>`<option value="${c.id}" ${c.id===id?'selected':''}>${c.label}</option>`).join('');
  const sel = (cls, i, v)=>`<select data-${cls}="${i}" style="width:62px;">${[1,2,3,4,5].map(n=>`<option ${n===v?'selected':''}>${n}</option>`).join('')}</select>`;
  const html = `
  ${scanPipelineHeader([3,4])}
  <div class="card" style="margin-bottom:12px;border-left:6px solid ${ov.level==='low'?'var(--success)':ov.level==='medium'?'var(--accent)':'var(--danger)'};">
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
      <div style="flex:1;min-width:260px;"><div style="font-size:12.5px;color:var(--ink-muted);">ระดับความเสี่ยงโดยรวม (คะแนนสูงสุด × ความรุนแรง×โอกาส)</div>
        <div style="font-size:26px;font-weight:700;">${scanBadge(ov.maxScore)}</div>
        <div style="font-size:13.5px;margin-top:4px;"><b>แนวทางตัดสินใจ:</b> ${lvl.decision}</div>
        <div style="font-size:13px;color:var(--ink-muted);">ผู้อนุมัติที่แนะนำ: ${lvl.approver}</div></div>
      <div style="font-size:13px;min-width:200px;">${d.provider==='manual'?'บันทึกอันตราย':'พบอันตราย'} <b>${d.findings.length}</b> รายการ<br>สูงมาก ${ov.counts.very_high} · สูง ${ov.counts.high} · ปานกลาง ${ov.counts.medium} · ต่ำ ${ov.counts.low}<br><span style="color:var(--ink-muted);">${d.provider==='manual'?'ประเมินโดยผู้ประเมิน (ไม่ใช้ AI)':'ความมั่นใจของ AI: '+execEsc(d.confidence)}</span></div>
    </div>
    ${d.summary?`<p style="margin:10px 0 0;font-size:13.5px;"><b>สรุปหน้างาน:</b> ${execEsc(d.summary)}${d.workType?` (งาน: ${execEsc(d.workType)})`:''}</p>`:''}
    ${d.limitations?`<p class="hint" style="margin:6px 0 0;">ข้อจำกัดของภาพ: ${execEsc(d.limitations)}</p>`:''}
  </div>

  <div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 4px;font-size:15px;">ขั้นตอน 3 — อันตรายที่พบและคะแนนความเสี่ยง (ผู้ประเมินปรับคะแนนได้)</h3>
    <p class="hint" style="margin:0 0 8px;">คะแนน = ความรุนแรง (S) × โอกาสเกิด (L) · ผู้ประเมินปรับ S/L ได้หากเห็นต่างจาก AI · ความเสี่ยงคงเหลือเป็นค่าประมาณจากมาตรการที่เลือกในแผนด้านล่าง</p>
    <div style="overflow:auto;"><table class="permit-table"><thead><tr><th>#</th><th>อันตราย / หลักฐานในภาพ</th><th>หมวด</th><th>S</th><th>L</th><th>คะแนน</th><th>คงเหลือ (ประมาณ)</th><th></th></tr></thead><tbody>
    ${d.findings.length ? d.findings.map((f,i)=>{ const res = scanResidual(f, planOf(f.id)); return `<tr>
      <td>${i+1}</td>
      <td style="min-width:240px;"><b>${execEsc(f.hazard)}</b>${f.source==='rule'?' <span class="badge badge-accent">จากกฎ PPE</span>':f.source==='manual'?' <span class="badge badge-wait">เพิ่มเอง</span>':''}
        ${f.evidence?`<div style="font-size:12px;color:var(--ink-muted);">หลักฐาน: ${execEsc(f.evidence)}</div>`:''}${(f.existing||[]).length?`<div style="font-size:12px;color:var(--success);">มีอยู่แล้ว: ${f.existing.map(execEsc).join(', ')}</div>`:''}</td>
      <td><select data-cat="${i}" style="max-width:170px;">${catOpts(f.category)}</select></td>
      <td>${sel('sev',i,f.severity)}</td><td>${sel('lik',i,f.likelihood)}</td>
      <td>${scanBadge(f.severity*f.likelihood)}</td><td>${scanBadge(res.score)}</td>
      <td><button type="button" class="btn btn-outline btn-sm" data-delf="${i}" title="ลบรายการนี้">✕</button></td></tr>`; }).join('') : `<tr><td colspan="8" class="hint">${d.provider==='manual'?'ยังไม่มีรายการ — เลือกหมวดอันตรายด้านล่างแล้วกด “เพิ่ม” ระบบจะใส่มาตรการมาตรฐานของหมวดนั้นให้':'AI ไม่พบอันตรายที่ชัดเจนในภาพ — เพิ่มรายการเองได้ หรือถ่ายภาพเพิ่มแล้ววิเคราะห์ใหม่'}</td></tr>`}
    </tbody></table></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="margin:0;"><label>หมวดอันตราย</label><select id="scAddCat">${SCAN_CATEGORIES.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}</select></div>
      <div class="field" style="margin:0;flex:1;min-width:220px;"><label>รายละเอียดอันตรายที่พบ</label><input type="text" id="scAddTxt" placeholder="เช่น ทำงานบนหลังคาโดยไม่มีราวกันตก"></div>
      <button type="button" class="btn btn-primary btn-sm" id="scAddF">➕ เพิ่มอันตราย</button></div>
  </div>

  <div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 4px;font-size:15px;">ขั้นตอน 4 — มาตรการควบคุมตามลำดับ Hierarchy of Controls (เทียบกับ Control Library และให้ผู้ประเมินตรวจสอบ)</h3>
    <p class="hint" style="margin:0 0 8px;">ติ๊กมาตรการที่จะนำไปติดตาม · กำหนดผู้รับผิดชอบและวันครบกำหนด · "AI" = AI แนะนำ, "มาตรฐาน" = จากคลังมาตรการมาตรฐานตามหมวดอันตราย (เลือกให้อัตโนมัติเมื่อเสี่ยงสูงขึ้นไป)</p>
    <div style="overflow:auto;"><table class="permit-table"><thead><tr><th>ใช้</th><th>อันตราย</th><th>มาตรการ</th><th>ระดับการควบคุม</th><th>ที่มา</th><th>ความเร่งด่วน</th><th>ผู้รับผิดชอบ</th><th>ครบกำหนด</th></tr></thead><tbody>
    ${d.plan.length ? d.plan.map((p,i)=>{ const fi = d.findings.findIndex(f=>f.id===p.fid); if(fi<0) return ''; const cl = controlLevelOf(p.level);
      return `<tr><td><input type="checkbox" data-pinc="${i}" ${p.include?'checked':''}></td><td style="min-width:140px;">#${fi+1} ${execEsc(d.findings[fi].hazard.slice(0,40))}</td><td style="min-width:240px;">${execEsc(p.measure)}</td>
        <td>${cl?`<span class="badge" style="background:${cl.color};color:${cl.ink};">${cl.short}</span>`:''}</td>
        <td>${p.source==='library'?'<span class="badge badge-wait">มาตรฐาน</span>':p.source==='rule'?'<span class="badge badge-accent">กฎ PPE</span>':'<span class="badge badge-success">AI</span>'}</td>
        <td><select data-ppri="${i}">${Object.keys(SCAN_PRIORITY).map(k=>`<option value="${k}" ${k===p.priority?'selected':''}>${SCAN_PRIORITY[k].label}</option>`).join('')}</select></td>
        <td><input type="text" data-pown="${i}" value="${execEsc(p.owner)}" placeholder="ชื่อผู้รับผิดชอบ" style="width:140px;"></td>
        <td><input type="date" data-pdue="${i}" value="${p.due}" style="width:140px;"></td></tr>`; }).join('') : `<tr><td colspan="8" class="hint">ยังไม่มีมาตรการ</td></tr>`}
    </tbody></table></div>
  </div>

  ${(d.ppe.required.length||d.ppe.observed.length||d.ppe.missing.length)?`<div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 6px;font-size:15px;">ตรวจ PPE</h3>
    <div style="font-size:13px;line-height:1.7;"><b>ที่ต้องใช้:</b> ${d.ppe.required.map(execEsc).join(', ')||'-'}<br><b>ที่เห็นว่าสวมอยู่:</b> ${d.ppe.observed.map(execEsc).join(', ')||'-'}<br><b style="color:var(--danger);">ขาด/ไม่เหมาะสม:</b> ${d.ppe.missing.map(execEsc).join(', ')||'ไม่พบ'}</div></div>`:''}

  ${d.objects&&d.objects.length?`<div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 6px;font-size:15px;">วัตถุที่ตรวจจับได้ (Object Detection)</h3><div style="overflow:auto;"><table class="permit-table"><thead><tr><th>วัตถุ</th><th>จำนวน</th><th>ตำแหน่งในภาพ</th><th>สภาพ / ข้อสังเกต</th></tr></thead><tbody>${d.objects.map(o=>`<tr><td><b>${execEsc(o.object)}</b></td><td>${o.count}</td><td>${execEsc(o.location)||'-'}</td><td>${execEsc(o.condition)||'-'}</td></tr>`).join('')}</tbody></table></div><p class="hint" style="margin:6px 0 0;">ตรวจจับโดย AI จากภาพ (ระบุตำแหน่งเป็นข้อความ ไม่ใช่กรอบพิกัด) — ผู้ประเมินควรตรวจสอบกับภาพจริง</p></div>`:''}

  ${d.signs.length?`<div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 6px;font-size:15px;">ป้าย/สัญลักษณ์ที่อ่านได้ (OCR)</h3><div style="overflow:auto;"><table class="permit-table"><thead><tr><th>ข้อความบนป้าย</th><th>ความหมาย</th><th>ตำแหน่ง</th><th>ข้อสังเกต</th></tr></thead><tbody>${d.signs.map(s=>`<tr><td><b>${execEsc(s.text)}</b></td><td>${execEsc(s.meaning)}</td><td>${execEsc(s.location)}</td><td>${execEsc(s.issue)||'-'}</td></tr>`).join('')}</tbody></table></div></div>`:''}

  ${d.documents.length?`<div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 6px;font-size:15px;">ข้อมูลที่ดึงจากเอกสาร (OCR)</h3>${d.documents.map(doc=>`<div style="margin-bottom:10px;"><b>${execEsc(doc.docType)||'เอกสาร'}</b>
    <table class="permit-table" style="margin-top:4px;"><tbody>${doc.fields.map(f=>`<tr><td style="width:36%;color:var(--ink-muted);">${execEsc(f[0])}</td><td>${execEsc(f[1])}</td></tr>`).join('')||'<tr><td class="hint">ไม่พบฟิลด์</td></tr>'}</tbody></table>
    ${doc.issues.length?`<div style="color:var(--danger);font-size:12.5px;margin-top:4px;">⚠ ${doc.issues.map(execEsc).join(' · ')}</div>`:''}</div>`).join('')}</div>`:''}

  <div class="card" style="margin-bottom:20px;"><h3 style="margin:0 0 6px;font-size:15px;">ขั้นตอน 5 — บันทึกลง Supabase และส่งขออนุมัติ</h3>
    <p class="hint" style="margin:0 0 8px;">รูป/เอกสารถูกเก็บใน Supabase Storage · ผลประเมิน ประวัติ และผู้อนุมัติเก็บในฐานข้อมูล · ผู้อนุมัติที่แนะนำสำหรับผลนี้: <b>${lvl.approver}</b></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;"><button type="button" class="btn btn-primary" id="scSave">💾 บันทึกและส่งขออนุมัติ</button><button type="button" class="btn btn-outline" id="scDiscard">ล้างผลวิเคราะห์</button><span id="scSaveMsg" class="hint" style="margin:0;"></span></div></div>`;
  box.innerHTML = html;

  const rerender = ()=>renderScanReview(box);
  box.querySelectorAll('[data-sev]').forEach(s=>s.onchange=()=>{ d.findings[+s.getAttribute('data-sev')].severity = +s.value; rerender(); });
  box.querySelectorAll('[data-lik]').forEach(s=>s.onchange=()=>{ d.findings[+s.getAttribute('data-lik')].likelihood = +s.value; rerender(); });
  box.querySelectorAll('[data-cat]').forEach(s=>s.onchange=()=>{ d.findings[+s.getAttribute('data-cat')].category = s.value; });
  box.querySelectorAll('[data-delf]').forEach(b=>b.onclick=()=>{ const f = d.findings.splice(+b.getAttribute('data-delf'),1)[0]; d.plan = d.plan.filter(p=>p.fid!==f.id); rerender(); });
  box.querySelectorAll('[data-pinc]').forEach(c=>c.onchange=()=>{ d.plan[+c.getAttribute('data-pinc')].include = c.checked; rerender(); });
  box.querySelectorAll('[data-ppri]').forEach(s=>s.onchange=()=>{ const p = d.plan[+s.getAttribute('data-ppri')]; p.priority = s.value; p.due = scanDueFromPriority(s.value); rerender(); });
  box.querySelectorAll('[data-pown]').forEach(i=>i.oninput=()=>{ d.plan[+i.getAttribute('data-pown')].owner = i.value; });
  box.querySelectorAll('[data-pdue]').forEach(i=>i.onchange=()=>{ d.plan[+i.getAttribute('data-pdue')].due = i.value; });
  box.querySelector('#scAddF').onclick = ()=>{
    const cat = box.querySelector('#scAddCat').value, txt = box.querySelector('#scAddTxt').value.trim() || scanCatLabel(cat);
    const f = { id:scanId('f'), source:"manual", hazard:txt, category:cat, evidence:"ผู้ประเมินเพิ่มเอง", severity:3, likelihood:3, existing:[] };
    d.findings.push(f);
    (SCAN_CONTROL_LIBRARY[cat]||[]).forEach(lc=>d.plan.push({ fid:f.id, measure:lc.measure, level:lc.level, priority:"7d", source:"library", include:true, owner:"", due:scanDueFromPriority("7d") }));
    rerender();
  };
  box.querySelector('#scDiscard').onclick = ()=>{ if(confirm("ล้างผลวิเคราะห์นี้และเริ่มใหม่?")){ _scanDraft = null; render(); } };
  box.querySelector('#scSave').onclick = ()=>scanSaveDraft(box.querySelector('#scSave'), box.querySelector('#scSaveMsg'));
}

async function scanSaveDraft(btn, msg){
  const d = _scanDraft; if(!d) return;
  const say = (t,bad)=>{ msg.textContent = t; msg.style.color = bad?'var(--danger)':''; };
  if(!d.findings.length && !confirm("ยังไม่มีรายการอันตรายในผลประเมิน — บันทึกต่อหรือไม่?")) return;
  btn.disabled = true;
  try{
    const code = genScanCode();
    let photos = [], docs = [], uploadFailed = false;
    say("กำลังอัปโหลดรูปไปยัง Supabase Storage...");
    try{
      photos = d.photoDataUrls.length ? await uploadPhotosAndGetUrls(d.photoDataUrls, `scan_${code}`) : [];
      docs = d.docDataUrls.length ? await uploadPhotosAndGetUrls(d.docDataUrls, `scandoc_${code}`) : [];
    }catch(e){ uploadFailed = true; }
    const now = new Date().toISOString();
    const findings = d.findings.map(f=>({ id:f.id, source:f.source, hazard:f.hazard, category:f.category, evidence:f.evidence, severity:f.severity, likelihood:f.likelihood, existing:f.existing||[] }));
    const actions = d.plan.filter(p=>p.include && d.findings.some(f=>f.id===p.fid)).map(p=>({
      id:scanId('sa'), findingId:p.fid, description:p.measure, controlLevel:p.level, priority:p.priority, source:p.source,
      assignedTo:p.owner||"", dueDate:p.due||"", status:"open", createdAt:now, completedAt:null, evidenceAfter:[], rechecks:[]
    }));
    const ov = scanOverall(d.findings);
    const scan = { id:scanId('rs'), code, createdAt:now, createdBy:d.meta.assessor, department:d.meta.department, location:d.meta.location, workDescription:d.meta.workDescription, permitId:d.meta.permitId||"",
      photos, docs, uploadFailed, summary:d.summary, workType:d.workType, confidence:d.confidence, limitations:d.limitations,
      findings, ppe:d.ppe, objects:d.objects||[], signs:d.signs, documents:d.documents, overall:{ maxScore:ov.maxScore, level:ov.level, counts:ov.counts }, actions,
      ai:{ provider:d.provider, model:d.model }, status:"pending", approvals:[] };
    state.scans.unshift(scan);
    say("กำลังบันทึกผลประเมินลงฐานข้อมูล...");
    const ok = await saveScans(scan);
    if(!ok){ say("บันทึกลงฐานข้อมูลไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วกดบันทึกอีกครั้ง (ข้อมูลยังอยู่ในหน้านี้)", true); state.scans = state.scans.filter(s=>s.id!==scan.id); btn.disabled = false; return; }
    _scanDraft = null;
    scanNotify('scan_created', scan.id);
    let nmMsg = "";
    try{
      say("กำลังส่งรายการเข้าโมดูล Near Miss...");
      const nm = await scanSyncToNearMiss(scan);
      if(nm && nm.error) nmMsg = " (ส่งเข้า Near Miss ไม่สำเร็จ)";
      else if(nm) nmMsg = ` · ส่งเข้า Near Miss ${nm.total} รายการ (Near Miss ${nm.counts.near_miss} / Unsafe Act ${nm.counts.unsafe_act} / Unsafe Condition ${nm.counts.unsafe_condition})`;
    }catch(e){ nmMsg = " (ส่งเข้า Near Miss ไม่สำเร็จ)"; }
    showToast(`บันทึก ${scan.code} แล้ว — รอผู้อนุมัติ${uploadFailed?' (อัปโหลดรูปไม่สำเร็จ บันทึกเฉพาะข้อมูล)':''}${nmMsg}`);
    setState({ route:"scan_history", scanDetailId:scan.id });
  }catch(e){ say("บันทึกไม่สำเร็จ: "+(e.message||e), true); btn.disabled = false; }
}

/* ---- หน้า: ประวัติการประเมิน + รายละเอียด/อนุมัติ/ติดตามแก้ไข ---- */
const _scanFilter = { q:"", status:"", level:"" };
function scanOpenActions(scan){ return (scan.actions||[]).filter(a=>a.status!=="verified"); }
function renderScanHistory(){

  const wrap = el(`<div><div class="pagehead"><div><h1>📚 ประวัติการประเมินความเสี่ยง</h1><p>ผลประเมินทั้งหมดที่บันทึกใน Supabase พร้อมสถานะอนุมัติและความคืบหน้าการแก้ไข</p></div></div></div>`);
  wrap.appendChild(el(scanPipelineHeader(5)));
  const bar = el(`<div class="card" style="margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
    <div class="field" style="margin:0;"><label>ค้นหา (เลขที่/แผนก/จุด)</label><input type="text" id="shQ" value="${execEsc(_scanFilter.q)}"></div>
    <div class="field" style="margin:0;"><label>สถานะ</label><select id="shS"><option value="">ทั้งหมด</option>${Object.keys(SCAN_STATUS).map(k=>`<option value="${k}" ${_scanFilter.status===k?'selected':''}>${SCAN_STATUS[k].label}</option>`).join('')}</select></div>
    <div class="field" style="margin:0;"><label>ระดับความเสี่ยง</label><select id="shL"><option value="">ทั้งหมด</option>${["very_high","high","medium","low"].map(k=>`<option value="${k}" ${_scanFilter.level===k?'selected':''}>${scanRiskLevel(k==='very_high'?16:k==='high'?10:k==='medium'?5:1).label}</option>`).join('')}</select></div>
    <button type="button" class="btn btn-primary btn-sm" id="shNew">🔍 สแกนใหม่</button></div>`);
  wrap.appendChild(bar);
  bar.querySelector('#shQ').oninput = e=>{ _scanFilter.q = e.target.value; fill(); };
  bar.querySelector('#shS').onchange = e=>{ _scanFilter.status = e.target.value; fill(); };
  bar.querySelector('#shL').onchange = e=>{ _scanFilter.level = e.target.value; fill(); };
  bar.querySelector('#shNew').onclick = ()=>setState({route:"scan_new"});
  const card = el(`<div class="card" style="padding:0;overflow:auto;"></div>`); wrap.appendChild(card);
  function fill(){
    const q = _scanFilter.q.trim().toLowerCase();
    const list = state.scans.filter(s=>(!q || `${s.code} ${s.department} ${s.location}`.toLowerCase().includes(q)) && (!_scanFilter.status || s.status===_scanFilter.status) && (!_scanFilter.level || (s.overall||{}).level===_scanFilter.level));
    if(!list.length){ card.innerHTML = `<div class="empty"><h3>ยังไม่มีผลประเมิน</h3><p>กด "สแกนใหม่" เพื่อเริ่มวิเคราะห์ภาพหน้างาน</p></div>`; return; }
    const today = execToday();
    card.innerHTML = `<table class="permit-table"><thead><tr><th>เลขที่</th><th>วันที่</th><th>แผนก / จุด</th><th>ระดับโดยรวม</th><th>อันตราย</th><th>มาตรการ (ค้าง/ทั้งหมด)</th><th>ผู้ประเมิน</th><th>ผู้อนุมัติ</th><th>สถานะ</th></tr></thead><tbody>
      ${list.map(s=>{ const ap = (s.approvals||[]).slice(-1)[0], acts = s.actions||[], open = scanOpenActions(s).length, over = scanOpenActions(s).filter(a=>a.dueDate && a.dueDate<today).length;
        return `<tr class="clickable" data-id="${s.id}"><td class="code-tag">${s.code}</td><td>${(s.createdAt||'').slice(0,10)}</td><td>${execEsc(s.department)}<div style="font-size:12px;color:var(--ink-muted);">${execEsc(s.location)}</div></td>
        <td>${scanBadge((s.overall||{}).maxScore||0)}</td><td>${(s.findings||[]).length}</td><td>${open}/${acts.length}${over?` <span class="badge badge-danger">เกินกำหนด ${over}</span>`:''}</td>
        <td>${execEsc(s.createdBy||'-')}</td><td>${ap?execEsc(ap.by)+` <span style="font-size:11.5px;color:var(--ink-muted);">(${ap.decision==='approved'?'อนุมัติ':'ส่งกลับ'})</span>`:'-'}</td>
        <td><span class="badge ${SCAN_STATUS[s.status].cls}">${SCAN_STATUS[s.status].label}</span></td></tr>`; }).join('')}</tbody></table>`;
    card.querySelectorAll('tr.clickable').forEach(tr=>tr.onclick=()=>setState({scanDetailId:tr.dataset.id}));
  }
  fill();
  return wrap;
}

function scanThumbs(urls){ return (urls||[]).length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;">${urls.map(u=>`<a href="${execEsc(u)}" target="_blank" rel="noopener"><img src="${execEsc(u)}" alt="" style="width:110px;height:110px;object-fit:cover;border:1px solid var(--line);border-radius:4px;"></a>`).join('')}</div>` : `<span class="hint">ไม่มีรูป</span>`; }
function renderScanDetail(scan){
  const wrap = el(`<div></div>`);
  const back = el(`<div style="margin-bottom:10px;"><button type="button" class="btn btn-outline btn-sm">← กลับไปประวัติการประเมิน</button></div>`);
  back.querySelector('button').onclick = ()=>setState({scanDetailId:null}); wrap.appendChild(back);
  const ov = scan.overall||{}, lvl = scanRiskLevel(ov.maxScore||0), st = SCAN_STATUS[scan.status];
  const permit = scan.permitId ? state.permits.find(p=>p.id===scan.permitId) : null;
  wrap.appendChild(el(`<div class="pagehead"><div><h1>${scan.code} <span class="badge ${st.cls}" style="font-size:13px;vertical-align:middle;">${st.label}</span></h1>
    <p>${execEsc(scan.department)} · ${execEsc(scan.location)} · ประเมินโดย ${execEsc(scan.createdBy||'-')} · ${(scan.createdAt||'').slice(0,16).replace('T',' ')}${permit?` · ใบอนุญาต ${execEsc(permit.code)}`:''}</p></div></div>`));
  wrap.appendChild(el(`<div class="card" style="margin-bottom:12px;border-left:6px solid ${ov.level==='low'?'var(--success)':ov.level==='medium'?'var(--accent)':'var(--danger)'};">
    <div style="font-size:22px;font-weight:700;">ระดับโดยรวม ${scanBadge(ov.maxScore||0)}</div>
    <div style="font-size:13.5px;margin-top:4px;"><b>แนวทางตัดสินใจ:</b> ${lvl.decision}</div>
    ${scan.workDescription?`<div style="font-size:13px;margin-top:6px;"><b>ลักษณะงาน:</b> ${execEsc(scan.workDescription)}</div>`:''}
    ${scan.summary?`<div style="font-size:13px;margin-top:4px;"><b>สรุปจาก AI:</b> ${execEsc(scan.summary)}</div>`:''}
    <div class="hint" style="margin-top:6px;">${(scan.ai||{}).provider==='manual'?'ประเมินโดยผู้ประเมิน (ไม่ใช้ AI)':`วิเคราะห์โดย ${execEsc((scan.ai||{}).provider||'-')} / ${execEsc((scan.ai||{}).model||'-')} · ความมั่นใจ ${execEsc(scan.confidence||'-')}`}${scan.limitations?` · ข้อจำกัด: ${execEsc(scan.limitations)}`:''}${scan.uploadFailed?' · ⚠ อัปโหลดรูปไม่สำเร็จ':''}</div></div>`));
  const shareText = scanShareText(scan, 'scan_created', null), shareTo = scanRecipients(scan, null);
  const shareBar = el(`<div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
    <button type="button" class="btn btn-outline btn-sm" id="shLine">📨 ส่งต่อทาง LINE</button>
    <button type="button" class="btn btn-outline btn-sm" id="shMail">✉ ส่งอีเมล${shareTo.length?'':' (ยังไม่ได้ตั้งอีเมลผู้รับ)'}</button>
    <button type="button" class="btn btn-outline btn-sm" id="shCopy">🔗 คัดลอกข้อความ+ลิงก์</button></div>`);
  shareBar.querySelector('#shLine').onclick = ()=>window.open('https://line.me/R/msg/text/?'+encodeURIComponent(shareText), '_blank');
  shareBar.querySelector('#shMail').onclick = ()=>{ location.href = `mailto:${shareTo.join(',')}?subject=${encodeURIComponent('[Safety Center] ผลประเมินความเสี่ยง '+scan.code)}&body=${encodeURIComponent(shareText)}`; };
  shareBar.querySelector('#shCopy').onclick = async ()=>{ try{ await navigator.clipboard.writeText(shareText); shareBar.querySelector('#shCopy').textContent = '✓ คัดลอกแล้ว'; }catch(e){ prompt('คัดลอกข้อความนี้:', shareText); } };
  wrap.appendChild(shareBar);
  wrap.appendChild(el(`<div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 6px;font-size:15px;">รูปหน้างาน</h3>${scanThumbs(scan.photos)}${(scan.docs||[]).length?`<h3 style="margin:12px 0 6px;font-size:15px;">เอกสาร</h3>${scanThumbs(scan.docs)}`:''}</div>`));

  const plan = scan.actions||[];
  if((scan.objects||[]).length) wrap.appendChild(el(`<div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 6px;font-size:15px;">วัตถุที่ตรวจจับได้ (Object Detection)</h3><div style="overflow:auto;"><table class="permit-table"><thead><tr><th>วัตถุ</th><th>จำนวน</th><th>ตำแหน่ง</th><th>สภาพ / ข้อสังเกต</th></tr></thead><tbody>${scan.objects.map(o=>`<tr><td><b>${execEsc(o.object)}</b></td><td>${o.count}</td><td>${execEsc(o.location)||'-'}</td><td>${execEsc(o.condition)||'-'}</td></tr>`).join('')}</tbody></table></div></div>`));
  wrap.appendChild(el(`<div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 6px;font-size:15px;">อันตรายที่พบ</h3><div style="overflow:auto;"><table class="permit-table"><thead><tr><th>#</th><th>อันตราย</th><th>หมวด</th><th>S</th><th>L</th><th>คะแนน</th><th>มาตรการ (เสร็จ/ทั้งหมด)</th></tr></thead><tbody>
    ${(scan.findings||[]).map((f,i)=>{ const fa = plan.filter(a=>a.findingId===f.id), done = fa.filter(a=>a.status==='verified').length;
      return `<tr><td>${i+1}</td><td><b>${execEsc(f.hazard)}</b>${f.evidence?`<div style="font-size:12px;color:var(--ink-muted);">${execEsc(f.evidence)}</div>`:''}</td><td>${scanCatLabel(f.category)}</td><td>${f.severity}</td><td>${f.likelihood}</td><td>${scanBadge(f.severity*f.likelihood)}</td><td>${done}/${fa.length}</td></tr>`; }).join('')||'<tr><td colspan="7" class="hint">ไม่มีรายการ</td></tr>'}
    </tbody></table></div></div>`));

  // ---- อนุมัติ ----
  const apCard = el(`<div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 6px;font-size:15px;">ขั้นตอน 4 — Human Review: ผู้อนุมัติและประวัติการพิจารณา</h3>
    ${(scan.approvals||[]).length?`<table class="permit-table"><thead><tr><th>วันที่</th><th>ผู้พิจารณา</th><th>ผล</th><th>ความเห็น</th></tr></thead><tbody>${scan.approvals.map(a=>`<tr><td>${(a.at||'').slice(0,16).replace('T',' ')}</td><td>${execEsc(a.by)}</td><td>${a.decision==='approved'?'<span class="badge badge-success">อนุมัติ</span>':'<span class="badge badge-danger">ส่งกลับ</span>'}</td><td>${execEsc(a.comment)||'-'}</td></tr>`).join('')}</tbody></table>`:'<p class="hint" style="margin:0 0 8px;">ยังไม่มีการพิจารณา</p>'}
    ${scan.status==='pending'?`<div style="margin-top:10px;"><p class="hint" style="margin:0 0 6px;">ผู้อนุมัติที่แนะนำ: <b>${lvl.approver}</b></p>
      <div class="grid2"><div class="field"><label>ผู้อนุมัติ (อีเมล/ชื่อ) <span class="req">*</span></label><input type="text" id="apBy" value="${execEsc(state.myEmail||'')}"></div>
      <div class="field"><label>ความเห็น</label><input type="text" id="apCm" placeholder="หมายเหตุ/เงื่อนไข (ถ้ามี)"></div></div>
      <div style="display:flex;gap:8px;"><button type="button" class="btn btn-success" id="apOk">อนุมัติ</button><button type="button" class="btn btn-danger" id="apNo">ส่งกลับให้แก้ไข</button></div></div>`
      : scan.status==='rejected' ? `<div style="margin-top:10px;"><button type="button" class="btn btn-outline btn-sm" id="apRe">↻ ส่งขออนุมัติใหม่</button></div>` : ''}</div>`);
  wrap.appendChild(apCard);
  async function decide(dec){

    if(dec==='rejected' && !cm){ alert("กรุณาระบุเหตุผลที่ส่งกลับ"); return; }
    scan.approvals = (scan.approvals||[]).concat([{ by, at:new Date().toISOString(), decision:dec, comment:cm }]);
    scan.status = dec==='approved' ? 'approved' : 'rejected';
    await saveScans(scan); scanNotify('scan_decided', scan.id); render();
  }
  const apOk = apCard.querySelector('#apOk'); if(apOk){ apOk.onclick = ()=>decide('approved'); apCard.querySelector('#apNo').onclick = ()=>decide('rejected'); }
  const apRe = apCard.querySelector('#apRe'); if(apRe) apRe.onclick = async ()=>{ scan.status = 'pending'; await saveScans(scan); render(); };

  // ---- Corrective Action tracker ----
  const today = execToday();
  const acCard = el(`<div class="card" style="margin-bottom:12px;"><h3 style="margin:0 0 4px;font-size:15px;">ขั้นตอน 6 — ติดตามการแก้ไข (Corrective Action) และตรวจซ้ำ</h3>
    <p class="hint" style="margin:0 0 8px;">เปลี่ยนผู้รับผิดชอบ/วันครบกำหนดได้ทันที · เมื่อแก้ไขเสร็จให้แนบรูปหลังแก้ไข แล้วให้ผู้ตรวจซ้ำยืนยัน — ตรวจซ้ำไม่ผ่านจะเปิดงานกลับมาใหม่</p>
    <div style="overflow:auto;"><table class="permit-table"><thead><tr><th>มาตรการ</th><th>ระดับ</th><th>ผู้รับผิดชอบ</th><th>ครบกำหนด</th><th>สถานะ</th><th>หลักฐาน / ตรวจซ้ำ</th><th>ดำเนินการ</th></tr></thead><tbody>
    ${plan.length?plan.map((a,i)=>{ const cl = controlLevelOf(a.controlLevel), over = a.status!=='verified' && a.dueDate && a.dueDate<today, lr = (a.rechecks||[]).slice(-1)[0];
      return `<tr><td style="min-width:220px;">${execEsc(a.description)}<div style="font-size:11.5px;color:var(--ink-muted);">${a.source==='library'?'มาตรฐาน':a.source==='rule'?'กฎ PPE':'AI'} · ${SCAN_PRIORITY[a.priority]?SCAN_PRIORITY[a.priority].label:''}</div></td>
      <td>${cl?`<span class="badge" style="background:${cl.color};color:${cl.ink};">${cl.short}</span>`:''}</td>
      <td><input type="text" data-aown="${i}" value="${execEsc(a.assignedTo)}" placeholder="ผู้รับผิดชอบ" style="width:130px;"></td>
      <td><input type="date" data-adue="${i}" value="${a.dueDate||''}" style="width:138px;${over?'border-color:var(--danger);':''}">${over?'<div style="color:var(--danger);font-size:11.5px;">เกินกำหนด</div>':''}</td>
      <td><span class="badge ${a.status==='verified'?'badge-success':over?'badge-danger':a.status==='done'?'badge-accent':'badge-wait'}">${SCAN_ACTION_STATUS[a.status]}</span></td>
      <td style="min-width:150px;">${(a.evidenceAfter||[]).length?scanThumbs(a.evidenceAfter).replace(/110px/g,'56px'):'<span class="hint">-</span>'}${lr?`<div style="font-size:11.5px;margin-top:3px;color:${lr.result==='pass'?'var(--success)':'var(--danger)'};">ตรวจซ้ำ ${lr.date}: ${lr.result==='pass'?'ผ่าน':'ไม่ผ่าน'} โดย ${execEsc(lr.by)}${lr.note?` — ${execEsc(lr.note)}`:''}</div>`:''}</td>
      <td style="min-width:150px;">${a.status==='open'?`<button type="button" class="btn btn-outline btn-sm" data-astart="${i}">▶ เริ่มแก้ไข</button> `:''}${(a.status==='open'||a.status==='in_progress')?`<button type="button" class="btn btn-primary btn-sm" data-adone="${i}">✔ แก้ไขเสร็จ</button>`:''}${a.status==='done'?`<button type="button" class="btn btn-success btn-sm" data-apass="${i}">✅ ตรวจซ้ำ ผ่าน</button> <button type="button" class="btn btn-danger btn-sm" data-afail="${i}">↩ ไม่ผ่าน</button>`:''}${a.status==='verified'?`<button type="button" class="btn btn-outline btn-sm" data-areopen="${i}">เปิดใหม่</button>`:''}</td></tr>`; }).join(''):'<tr><td colspan="7" class="hint">ไม่ได้เลือกมาตรการติดตามไว้ตอนบันทึก</td></tr>'}
    </tbody></table></div></div>`);
  wrap.appendChild(acCard);
  const persist = async ()=>{ await saveScans(scan); render(); };
  acCard.querySelectorAll('[data-aown]').forEach(i=>i.onchange=async ()=>{ plan[+i.getAttribute('data-aown')].assignedTo = i.value.trim(); await saveScans(scan); });
  acCard.querySelectorAll('[data-adue]').forEach(i=>i.onchange=async ()=>{ plan[+i.getAttribute('data-adue')].dueDate = i.value; await persist(); });
  acCard.querySelectorAll('[data-astart]').forEach(b=>b.onclick=()=>{ plan[+b.getAttribute('data-astart')].status = 'in_progress'; persist(); });
  acCard.querySelectorAll('[data-adone]').forEach(b=>b.onclick=()=>{
    const a = plan[+b.getAttribute('data-adone')];
    const finish = async urls=>{ a.status = 'done'; a.completedAt = new Date().toISOString(); a.evidenceAfter = (a.evidenceAfter||[]).concat(urls||[]); await persist(); scanNotify('action_done', scan.id, a.id); };
    if(confirm("แนบรูปหลังแก้ไขเป็นหลักฐานหรือไม่?\nกด OK เพื่อเลือกรูป / กด ยกเลิก เพื่อบันทึกโดยไม่มีรูป")){
      scanPickPhotos(async du=>{ let urls = []; try{ urls = du.length ? await uploadPhotosAndGetUrls(du, `scanfix_${scan.code}`) : []; }catch(e){ alert("อัปโหลดรูปไม่สำเร็จ บันทึกสถานะโดยไม่มีรูป"); } await finish(urls); });
    } else finish([]);
  });
  const recheck = async (i, result)=>{
    const a = plan[i]; const by = prompt("ชื่อ/อีเมลผู้ตรวจซ้ำ:", state.myEmail||""); if(!by) return;
    const note = prompt(result==='pass' ? "หมายเหตุการตรวจซ้ำ (ถ้ามี):" : "เหตุผลที่ไม่ผ่าน (จะเปิดงานกลับมาแก้ไขใหม่):", "") || "";
    if(result==='fail' && !note.trim()){ alert("กรุณาระบุเหตุผลที่ไม่ผ่าน"); return; }
    a.rechecks = (a.rechecks||[]).concat([{ date:execToday(), by:by.trim(), result, note:note.trim() }]);
    a.status = result==='pass' ? 'verified' : 'open'; if(result==='pass') a.verifiedAt = new Date().toISOString();
    await persist(); scanNotify(result==='pass' ? 'action_verified' : 'action_failed', scan.id, a.id);
  };
  acCard.querySelectorAll('[data-apass]').forEach(b=>b.onclick=()=>recheck(+b.getAttribute('data-apass'),'pass'));
  acCard.querySelectorAll('[data-afail]').forEach(b=>b.onclick=()=>recheck(+b.getAttribute('data-afail'),'fail'));
  acCard.querySelectorAll('[data-areopen]').forEach(b=>b.onclick=()=>{ plan[+b.getAttribute('data-areopen')].status = 'open'; persist(); });

  {
    const del = el(`<div class="card no-print" style="border-color:#E3C1B3;"><button type="button" class="btn btn-danger btn-sm">🗑 ลบผลประเมินนี้ (ต้องใช้รหัสผ่านแอดมิน)</button></div>`);
    del.querySelector('button').onclick = ()=>deleteScan(scan.id); wrap.appendChild(del);
  }
  return wrap;
}

/* ---- หน้า: แดชบอร์ด + ติดตามแก้ไข ---- */
function renderScanDashboard(){
  const wrap = el(`<div><div class="pagehead"><div><h1>📊 แดชบอร์ด AI Risk Scanner</h1><p>ภาพรวมผลประเมิน ความเสี่ยงที่พบบ่อย และงานแก้ไขที่ต้องติดตาม</p></div></div></div>`);
  wrap.appendChild(el(scanPipelineHeader(6)));
  const scans = state.scans, today = execToday(), thisMonth = today.slice(0,7);
  const acts = []; scans.forEach(s=>(s.actions||[]).forEach(a=>acts.push({s, a})));
  const openA = acts.filter(x=>x.a.status!=="verified"), overA = openA.filter(x=>x.a.dueDate && x.a.dueDate<today), recheckA = acts.filter(x=>x.a.status==="done");
  const verified = acts.filter(x=>x.a.status==="verified").length, rate = acts.length ? Math.round(verified/acts.length*100) : 0;
  const pending = scans.filter(s=>s.status==="pending").length;
  const hiScans = scans.filter(s=>["high","very_high"].includes((s.overall||{}).level)).length;
  const monthCount = scans.filter(s=>(s.createdAt||'').slice(0,7)===thisMonth).length;
  const stat = (l,v,c,sub)=>`<div class="card" style="text-align:center;margin:0;"><div style="font-size:12.5px;color:var(--ink-muted);">${l}</div><div style="font-size:32px;font-weight:600;line-height:1.2;color:${c||'var(--ink)'};">${v}</div>${sub?`<div style="font-size:11.5px;color:var(--ink-muted);">${sub}</div>`:''}</div>`;
  wrap.appendChild(el(`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px;">
    ${stat('การประเมินทั้งหมด', scans.length, null, `เดือนนี้ ${monthCount}`)}${stat('รออนุมัติ', pending, pending?'var(--accent-ink)':'var(--success)')}
    ${stat('ผลประเมินเสี่ยงสูง/สูงมาก', hiScans, hiScans?'var(--danger)':'var(--success)')}${stat('มาตรการที่ยังค้าง', openA.length, null, `เกินกำหนด ${overA.length}`)}
    ${stat('เกินกำหนดแก้ไข', overA.length, overA.length?'var(--danger)':'var(--success)')}${stat('รอตรวจซ้ำ', recheckA.length, recheckA.length?'var(--accent-ink)':'var(--success)')}
    ${stat('ปิดงานแล้ว (ตรวจซ้ำผ่าน)', rate+'%', rate>=80?'var(--success)':'var(--accent-ink)', `${verified}/${acts.length} มาตรการ`)}</div>`));

  // การกระจายระดับ + หมวดอันตราย
  const lv = {very_high:0,high:0,medium:0,low:0}; scans.forEach(s=>{ const k = (s.overall||{}).level; if(lv[k]!==undefined) lv[k]++; });
  const tot = Math.max(1, scans.length), colors = {very_high:'var(--danger)',high:'#D6786A',medium:'var(--accent)',low:'var(--success)'}, names = {very_high:'สูงมาก',high:'สูง',medium:'ปานกลาง',low:'ต่ำ'};
  const catCount = {}; scans.forEach(s=>(s.findings||[]).forEach(f=>{ catCount[f.category] = (catCount[f.category]||0)+1; }));
  const cats = Object.keys(catCount).sort((a,b)=>catCount[b]-catCount[a]).slice(0,8), maxC = Math.max(1, ...cats.map(c=>catCount[c]));
  wrap.appendChild(el(`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:14px;">
    <div class="card" style="margin:0;"><h3 style="margin:0 0 8px;font-size:15px;">ระดับความเสี่ยงของผลประเมิน</h3>
      <div style="display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--wait-bg);">${Object.keys(lv).map(k=>lv[k]?`<div title="${names[k]} ${lv[k]}" style="width:${lv[k]/tot*100}%;background:${colors[k]};"></div>`:'').join('')}</div>
      <div style="margin-top:8px;font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap;">${Object.keys(lv).map(k=>`<span><span style="color:${colors[k]};">■</span> ${names[k]} ${lv[k]}</span>`).join('')}</div></div>
    <div class="card" style="margin:0;"><h3 style="margin:0 0 8px;font-size:15px;">อันตรายที่พบบ่อย (ตามหมวด)</h3>
      ${cats.length?cats.map(c=>`<div style="margin-bottom:6px;font-size:12.5px;"><div style="display:flex;justify-content:space-between;"><span>${scanCatLabel(c)}</span><b>${catCount[c]}</b></div><div style="height:8px;background:var(--wait-bg);border-radius:4px;overflow:hidden;"><div style="height:100%;width:${catCount[c]/maxC*100}%;background:var(--accent);"></div></div></div>`).join(''):'<p class="hint" style="margin:0;">ยังไม่มีข้อมูล</p>'}</div></div>`));

  // ---- วิเคราะห์แนวโน้มความเสี่ยง (12 เดือนล่าสุด) ----
  {
    const now = new Date(), keys = [];
    for(let i=11;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
    const mn = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    const nScan = keys.map(k=>scans.filter(s=>(s.createdAt||'').slice(0,7)===k).length);
    const nHigh = keys.map(k=>scans.filter(s=>(s.createdAt||'').slice(0,7)===k).reduce((n,s)=>n+(s.findings||[]).filter(f=>f.severity*f.likelihood>=10).length,0));
    const avgS = keys.map((k,i)=>{ const m = scans.filter(s=>(s.createdAt||'').slice(0,7)===k); return m.length ? Math.round(m.reduce((a,s)=>a+((s.overall||{}).maxScore||0),0)/m.length*10)/10 : null; });
    const mx = Math.max(4, ...nScan, ...nHigh), W=760, H=220, L=32, B=26, T=12, pw=(W-L-8)/12, ph=H-B-T;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:860px;display:block;font-family:inherit;" role="img" aria-label="แนวโน้มความเสี่ยงรายเดือน">`;
    for(let g=0; g<=4; g++){ const y=T+ph-(ph*g/4); svg += `<line x1="${L}" y1="${y}" x2="${W-6}" y2="${y}" stroke="#E3E8E6"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#5B6B70">${Math.round(mx*g/4)}</text>`; }
    keys.forEach((k,i)=>{ const x=L+i*pw+pw*0.12, bw=pw*0.34, h1=ph*nScan[i]/mx, h2=ph*nHigh[i]/mx;
      svg += `<rect x="${x}" y="${T+ph-h1}" width="${bw}" height="${h1}" fill="#C98A1F"/><rect x="${x+bw+2}" y="${T+ph-h2}" width="${bw}" height="${h2}" fill="#A73B22"/>`;
      if(nScan[i]) svg += `<text x="${x+bw/2}" y="${T+ph-h1-3}" text-anchor="middle" font-size="10" fill="#8a5f10">${nScan[i]}</text>`;
      if(nHigh[i]) svg += `<text x="${x+bw+2+bw/2}" y="${T+ph-h2-3}" text-anchor="middle" font-size="10" fill="#A73B22">${nHigh[i]}</text>`;
      svg += `<text x="${L+i*pw+pw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#5B6B70">${mn[+k.slice(5)-1]}</text>`; });
    svg += `</svg>`;
    // เปรียบเทียบหมวดอันตราย 3 เดือนล่าสุด กับ 3 เดือนก่อนหน้า
    const recent = new Set(keys.slice(9)), prev = new Set(keys.slice(6,9)), cr = {}, cp = {};
    scans.forEach(s=>{ const k=(s.createdAt||'').slice(0,7); (s.findings||[]).forEach(f=>{ if(recent.has(k)) cr[f.category]=(cr[f.category]||0)+1; else if(prev.has(k)) cp[f.category]=(cp[f.category]||0)+1; }); });
    const cats2 = Array.from(new Set([...Object.keys(cr), ...Object.keys(cp)])).sort((a,b)=>(cr[b]||0)-(cr[a]||0));
    const lastAvg = avgS.filter(v=>v!=null).slice(-2);
    const trendTxt = lastAvg.length===2 ? (lastAvg[1]>lastAvg[0] ? `⚠ คะแนนเสี่ยงสูงสุดเฉลี่ยต่อใบประเมินเพิ่มขึ้น (${lastAvg[0]} → ${lastAvg[1]})` : lastAvg[1]<lastAvg[0] ? `✅ คะแนนเสี่ยงสูงสุดเฉลี่ยต่อใบประเมินลดลง (${lastAvg[0]} → ${lastAvg[1]})` : `คะแนนเสี่ยงเฉลี่ยคงที่ (${lastAvg[1]})`) : 'ข้อมูลยังไม่พอเปรียบเทียบรายเดือน (ต้องมีผลประเมินอย่างน้อย 2 เดือน)';
    wrap.appendChild(el(`<div class="card" style="margin-bottom:14px;"><h3 style="margin:0 0 4px;font-size:15px;">วิเคราะห์แนวโน้มความเสี่ยง (12 เดือนล่าสุด)</h3>
      <p style="margin:0 0 6px;font-size:13px;">${trendTxt}</p>${svg}
      <div style="font-size:12px;color:var(--ink-muted);"><span style="color:#C98A1F;">■</span> จำนวนการประเมิน &nbsp; <span style="color:#A73B22;">■</span> อันตรายระดับสูงขึ้นไป (คะแนน ≥ 10)</div>
      <h4 style="margin:12px 0 6px;font-size:13.5px;">หมวดอันตราย: 3 เดือนล่าสุดเทียบ 3 เดือนก่อนหน้า</h4>
      <div style="overflow:auto;"><table class="permit-table"><thead><tr><th>หมวด</th><th>3 เดือนก่อนหน้า</th><th>3 เดือนล่าสุด</th><th>แนวโน้ม</th></tr></thead><tbody>
      ${cats2.length?cats2.slice(0,10).map(c=>{ const a=cp[c]||0, b=cr[c]||0; return `<tr><td>${scanCatLabel(c)}</td><td>${a}</td><td>${b}</td><td style="font-weight:700;color:${b>a?'var(--danger)':b<a?'var(--success)':'var(--ink-muted)'};">${b>a?'▲ เพิ่มขึ้น':b<a?'▼ ลดลง':'– คงที่'}</td></tr>`; }).join(''):'<tr><td colspan="4" class="hint">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div></div>`));
  }
  // ---- แจ้งเตือนที่เกี่ยวกับ Scanner ----
  {
    const al = computeAlerts().filter(a=>a.cat==="AI Risk Scanner" || (a.cat==="CAPA / งานแก้ไข" && /AI Risk Scanner/.test(a.detail||'')));
    const box = el(`<div class="card no-print" style="margin-bottom:14px;"><h3 style="margin:0 0 6px;font-size:15px;">🔔 แจ้งเตือนจาก Scanner (${al.length})</h3>${al.length?al.slice(0,6).map(a=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);">${ALERT_SEV[a.sev].icon} ${execEsc(a.title)}</div>`).join(''):'<p class="hint" style="margin:0;">✅ ไม่มีเรื่องที่ต้องตาม</p>'}<div style="margin-top:8px;"><button type="button" class="btn btn-outline btn-sm">เปิดศูนย์แจ้งเตือนรวม →</button></div></div>`);
    box.querySelector('button').onclick = ()=>setState({appModule:"overview", route:"alert_center"});
    wrap.appendChild(box);
  }

  // ตารางรายแผนก
  const byDept = {}; scans.forEach(s=>{ const d = byDept[s.department] = byDept[s.department] || {n:0,hi:0,open:0,over:0}; d.n++; if(["high","very_high"].includes((s.overall||{}).level)) d.hi++; (s.actions||[]).forEach(a=>{ if(a.status!=="verified"){ d.open++; if(a.dueDate && a.dueDate<today) d.over++; } }); });
  const deptRows = Object.keys(byDept).sort((a,b)=>byDept[b].over-byDept[a].over || byDept[b].hi-byDept[a].hi);
  wrap.appendChild(el(`<div class="card" style="margin-bottom:14px;"><h3 style="margin:0 0 8px;font-size:15px;">สรุปรายแผนก</h3><div style="overflow:auto;"><table class="permit-table"><thead><tr><th>แผนก</th><th>จำนวนการประเมิน</th><th>เสี่ยงสูง/สูงมาก</th><th>มาตรการค้าง</th><th>เกินกำหนด</th></tr></thead><tbody>
    ${deptRows.length?deptRows.map(d=>`<tr><td><b>${execEsc(d)}</b></td><td>${byDept[d].n}</td><td>${byDept[d].hi||'-'}</td><td>${byDept[d].open||'-'}</td><td style="${byDept[d].over?'color:var(--danger);font-weight:700;':''}">${byDept[d].over||'-'}</td></tr>`).join(''):'<tr><td colspan="5" class="hint">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div></div>`));

  // ตารางติดตามงาน
  const trk = openA.sort((x,y)=>(x.a.dueDate||'9999').localeCompare(y.a.dueDate||'9999'));
  const trkCard = el(`<div class="card" style="margin-bottom:20px;"><h3 style="margin:0 0 4px;font-size:15px;">งานแก้ไขที่ต้องติดตาม (เรียงตามกำหนด)</h3><p class="hint" style="margin:0 0 8px;">กดแถวเพื่อเปิดใบประเมินและอัปเดตสถานะ/ตรวจซ้ำ</p><div style="overflow:auto;"><table class="permit-table"><thead><tr><th>เลขที่</th><th>แผนก</th><th>มาตรการ</th><th>ผู้รับผิดชอบ</th><th>ครบกำหนด</th><th>สถานะ</th></tr></thead><tbody>
    ${trk.length?trk.slice(0,50).map(x=>{ const over = x.a.dueDate && x.a.dueDate<today; return `<tr class="clickable" data-id="${x.s.id}"><td class="code-tag">${x.s.code}</td><td>${execEsc(x.s.department)}</td><td>${execEsc(x.a.description)}</td><td>${execEsc(x.a.assignedTo)||'<span style="color:var(--danger);">ยังไม่มอบหมาย</span>'}</td><td style="${over?'color:var(--danger);font-weight:700;':''}">${x.a.dueDate||'-'}${over?' (เกินกำหนด)':''}</td><td>${SCAN_ACTION_STATUS[x.a.status]}</td></tr>`; }).join(''):'<tr><td colspan="6" class="hint">✅ ไม่มีงานค้าง</td></tr>'}</tbody></table></div></div>`);
  trkCard.querySelectorAll('tr.clickable').forEach(tr=>tr.onclick=()=>setState({route:"scan_history", scanDetailId:tr.dataset.id}));
  wrap.appendChild(trkCard);
  return wrap;
}

/* ---- หน้า: เกณฑ์ Risk Matrix + Control Library ---- */
function renderScanMatrix(){
  const wrap = el(`<div><div class="pagehead"><div><h1>📐 เกณฑ์ Risk Matrix และมาตรการมาตรฐาน</h1><p>เกณฑ์ที่ Risk Assessment Engine ใช้เทียบกับผลวิเคราะห์ของ AI</p></div></div></div>`);
  wrap.appendChild(el(scanPipelineHeader(3)));
  const sevT = ["เล็กน้อย / ไม่บาดเจ็บ","ปฐมพยาบาล","รักษาพยาบาล / หยุดงาน","บาดเจ็บรุนแรง / ทุพพลภาพ","เสียชีวิต / หลายราย"], likT = ["แทบไม่เกิด","เกิดได้ยาก","อาจเกิดได้","มักเกิดขึ้น","เกิดบ่อย / กำลังเกิด"];

  wrap.appendChild(el(`<div class="card" style="margin-bottom:14px;"><h3 style="margin:0 0 8px;font-size:15px;">Risk Matrix 5×5 (คะแนน = ความรุนแรง S × โอกาสเกิด L)</h3><div style="overflow:auto;"><table class="permit-table" style="max-width:760px;"><thead><tr><th>โอกาสเกิด \\ ความรุนแรง</th>${sevT.map((t,i)=>`<th style="text-align:center;font-size:12px;">S=${i+1}<br>${t}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`));
  wrap.appendChild(el(`<div class="card" style="margin-bottom:14px;"><h3 style="margin:0 0 8px;font-size:15px;">ระดับความเสี่ยงและแนวทางตัดสินใจ</h3><table class="permit-table"><thead><tr><th>ช่วงคะแนน</th><th>ระดับ</th><th>แนวทางตัดสินใจ</th><th>ผู้อนุมัติ</th></tr></thead><tbody>
    ${[[ '16 – 25',16],['10 – 15',10],['5 – 9',5],['1 – 4',1]].map(r=>{ const l = scanRiskLevel(r[1]); return `<tr><td>${r[0]}</td><td><span class="badge" style="background:${l.bg};color:${l.color};">${l.label}</span></td><td>${l.decision}</td><td>${l.approver}</td></tr>`; }).join('')}</tbody></table></div>`));
  wrap.appendChild(el(`<div class="card" style="margin-bottom:14px;"><h3 style="margin:0 0 8px;font-size:15px;">ผลของมาตรการต่อความเสี่ยงคงเหลือ (ใช้ประมาณการ)</h3><table class="permit-table"><thead><tr><th>ระดับการควบคุม</th><th>ลดโอกาสเกิด (L)</th><th>ลดความรุนแรง (S)</th></tr></thead><tbody>
    ${CONTROL_LEVELS.map((c,i)=>`<tr><td><span class="badge" style="background:${c.color};color:${c.ink};">${i+1}. ${c.short}</span> ${c.desc}</td><td>-${SCAN_CONTROL_EFFECT[c.id].L}</td><td>-${SCAN_CONTROL_EFFECT[c.id].S}</td></tr>`).join('')}</tbody></table>

function planNow(){ const d = new Date(); return { y:d.getFullYear(), m:d.getMonth() }; }
function planItems(){ return (state.plan && state.plan.items) || []; }
function planSorted(){ return planItems().slice().sort((a,b)=>(a.groupNo||0)-(b.groupNo||0)); }
// เดือนที่มีแผน (ค่า 1) แต่ผ่านมาแล้วและยังไม่ทำเสร็จ — ไม่นับถ้ารายการนี้สถานะ "เรียบร้อย"
function planLimit(){ const n = planNow(), y = state.plan.year; return y < n.y ? 12 : (y === n.y ? n.m : 0); }
function planLateMonths(it){
  if(it.status === "เรียบร้อย") return [];
  const lim = planLimit(), out = [];
  for(let i=0;i<lim;i++) if((it.months||[])[i] === 1) out.push(i);
  return out;
}
function planStatusBadge(st){ const s = PLAN_STATUS_STYLE[st] || PLAN_STATUS_STYLE[""]; return `<span class="badge" style="background:${s.bg};color:${s.c};">${execEsc(st||'ไม่ระบุ')}</span>`; }
function planCell(v, late){
  if(v===2) return { html:"✓", style:"background:#B7E1C1;color:#1d5a30;font-weight:700;" };
  if(v===1) return { html: late ? "!" : "●", style: late ? "background:#F6C9BD;color:#A73B22;font-weight:700;" : "background:#FFE27A;color:#7a5a00;" };
  return { html:"", style:"" };
}
function planNextGroupNo(){ return planItems().reduce((m,i)=>Math.max(m, i.groupNo||0), 0) + 1; }
function planGroups(){ const g = {}; planItems().forEach(i=>{ if(!g[i.groupNo]) g[i.groupNo] = i.group; }); return g; }

async function savePlan(changed, deletedId, opts){
  opts = opts || {};
  try{
    let latest = state.plan;
    try{ const fresh = await storageAdapter.get("wp:plan", true); if(fresh) latest = JSON.parse(fresh.value); }catch(e){}
    latest = Object.assign({ year:2026, items:[] }, latest);
    let items = (latest.items||[]).slice();
    if(deletedId) items = items.filter(x=>x.id!==deletedId);
    if(changed){
      const idx = items.findIndex(x=>x.id===changed.id);
      if(idx>=0) items[idx] = changed;
      else { let at = -1; items.forEach((x,i)=>{ if(x.groupNo===changed.groupNo) at = i; }); if(at>=0) items.splice(at+1,0,changed); else items.push(changed); }
    }
    (opts.addItems||[]).forEach(n=>{ if(!items.some(x=>x.id===n.id)) items.push(n); });
    if(opts.year) latest.year = opts.year;
    latest.items = items;
    state.plan = latest;
    await storageAdapter.set("wp:plan", JSON.stringify(latest), true);
    return true;
  }catch(e){ return false; }
}
async function planDelete(id){
  if(!(await adminGuard("ลบรายการแผนงานประจำปี — ต้องใช้รหัสผ่านผู้ดูแลระบบ"))) return false;
  state.plan.items = planItems().filter(x=>x.id!==id);
  await savePlan(null, id);
  return true;
}

  const wrap = el(`<div><div class="pagehead"><div><h1>📅 Annual Safety Action Plan</h1><p>แผนการดำเนินงานด้านความปลอดภัย อาชีวอนามัย ประจำปี <b>${P.year}</b> — กดช่องเดือนเพื่อสลับสถานะ: ว่าง → ● แผน → ✓ เสร็จ → ว่าง</p></div></div></div>`);
  if(!planItems().length){

      <p style="margin:0 0 10px;font-size:13px;">โหลดตารางแผนงานประจำปี 2026 จากไฟล์ Excel ที่ส่งมา (${PLAN_SEED.length} รายการ รวมสถานะ หมายเหตุ ผู้รับผิดชอบ และเดือนที่มีแผน) แล้วแก้ไข/ลบ/เพิ่มได้ทุกรายการ</p>
      <button type="button" class="btn btn-primary" id="plSeed">⬇ โหลดแผนงานประจำปี 2026</button> <span class="hint" id="plSeedMsg"></span></div>`);
    seed.querySelector('#plSeed').onclick = async (e)=>{
      e.target.disabled = true; seed.querySelector('#plSeedMsg').textContent = 'กำลังบันทึก...';
      const ok = await savePlan(null, null, { addItems: PLAN_SEED.map(x=>JSON.parse(JSON.stringify(x))), year:2026 });
      if(ok) setState({}); else { seed.querySelector('#plSeedMsg').textContent = 'บันทึกไม่สำเร็จ ลองใหม่'; e.target.disabled = false; }
    };
    wrap.appendChild(seed);
  }
  const owners = Array.from(new Set(planItems().map(i=>i.owner).filter(Boolean))).sort();
  const bar = el(`<div class="card" style="margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
    <div class="field" style="margin:0;"><label>ค้นหา</label><input type="text" id="plQ" value="${execEsc(_planF.q)}" placeholder="กิจกรรม / ผู้รับผิดชอบ / ดัชนี" style="min-width:200px;"></div>
    <div class="field" style="margin:0;"><label>สถานะ</label><select id="plS"><option value="">ทั้งหมด</option>${PLAN_STATUSES.map(s=>`<option ${_planF.status===s?'selected':''}>${s}</option>`).join('')}<option value="__none" ${_planF.status==='__none'?'selected':''}>ไม่ระบุ</option></select></div>
    <div class="field" style="margin:0;"><label>ประเภท</label><select id="plT"><option value="">ทั้งหมด</option>${PLAN_TYPES.map(s=>`<option ${_planF.type===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field" style="margin:0;"><label>เดือนที่มีแผน</label><select id="plM"><option value="">ทุกเดือน</option>${PLAN_MONTHS.map((m,i)=>`<option value="${i}" ${_planF.month===String(i)?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="field" style="margin:0;"><label>ปีของแผน</label><input type="number" id="plY" value="${P.year}" min="2000" max="2100" style="width:90px;"></div>
    <div style="flex:1;"></div>
    <button type="button" class="btn btn-primary" id="plAdd">➕ เพิ่มรายการ</button></div>`);
  wrap.appendChild(bar);
  const formBox = el(`<div id="plFormBox"></div>`); wrap.appendChild(formBox);

  bar.querySelector('#plS').onchange = e=>{ _planF.status = e.target.value; fill(); };
  bar.querySelector('#plT').onchange = e=>{ _planF.type = e.target.value; fill(); };
  bar.querySelector('#plM').onchange = e=>{ _planF.month = e.target.value; fill(); };
  bar.querySelector('#plY').onchange = async e=>{ const y = parseInt(e.target.value,10); if(y>=2000 && y<=2100){ await savePlan(null,null,{year:y}); setState({}); } };
  bar.querySelector('#plAdd').onclick = ()=>{ _planForm = { id:null }; renderPlanForm(formBox); formBox.scrollIntoView({behavior:'smooth',block:'start'}); };
  if(_planForm) renderPlanForm(formBox);

  function visible(it){
    const q = _planF.q.trim().toLowerCase();
    if(q && !`${it.group} ${it.content} ${it.owner} ${it.kpi} ${it.remark}`.toLowerCase().includes(q)) return false;
    if(_planF.status==='__none' ? it.status : (_planF.status && it.status!==_planF.status)) return false;
    if(_planF.type && it.type!==_planF.type) return false;
    if(_planF.month!=='' && !((it.months||[])[+_planF.month])) return false;
    return true;
  }
  function fill(){
    const all = planSorted(), list = all.filter(visible);
    if(!list.length){ scroll.innerHTML = `<div class="empty"><h3>ไม่พบรายการ</h3><p>${planItems().length?'ลองเปลี่ยนตัวกรอง':'กด "โหลดแผนงาน" หรือ "เพิ่มรายการ"'}</p></div>`; return; }
    const cur = planNow(), isCurYear = P.year===cur.y, lim = planLimit();
    let html = `<table class="permit-table" style="min-width:1250px;"><thead><tr><th>ลำดับ</th><th style="min-width:260px;">กิจกรรม / เนื้อหา</th><th>ประเภท</th><th style="min-width:160px;">ดัชนีชี้วัด</th><th>ผู้รับผิดชอบ</th><th>สถานะ</th><th style="min-width:130px;">หมายเหตุ</th>${PLAN_MONTHS.map((m,i)=>`<th style="text-align:center;width:38px;${isCurYear&&i===cur.m?'background:var(--accent-bg);':''}">${m}</th>`).join('')}<th class="no-print"></th></tr></thead><tbody>`;
    let lastG = null, n = 0;
    list.forEach(it=>{
      if(it.groupNo!==lastG){
        lastG = it.groupNo; const g = all.filter(x=>x.groupNo===it.groupNo), done = g.filter(x=>x.status==='เรียบร้อย').length;
        html += `<tr style="background:#F3F5F4;"><td colspan="20"><b>${it.groupNo}. ${execEsc(it.group)}</b> <span class="hint" style="margin-left:6px;">เรียบร้อย ${done}/${g.length}</span></td></tr>`;
      }
      n++;
      html += `<tr data-id="${it.id}"><td style="color:var(--ink-muted);">${it.groupNo}.${all.filter(x=>x.groupNo===it.groupNo).indexOf(it)+1}</td>
        <td>${execEsc(it.content)}${it.scheduleNote?`<div style="font-size:12px;color:var(--ink-muted);margin-top:2px;">🗓 ${execEsc(it.scheduleNote)}</div>`:''}</td>
        <td>${execEsc(it.type)||'-'}</td><td style="font-size:12.5px;">${execEsc(it.kpi)||'-'}</td><td style="font-size:12.5px;">${execEsc(it.owner)||'-'}</td>
        <td><select data-pst style="border:0;border-radius:20px;padding:3px 6px;font-size:12px;background:${(PLAN_STATUS_STYLE[it.status]||PLAN_STATUS_STYLE['']).bg};color:${(PLAN_STATUS_STYLE[it.status]||PLAN_STATUS_STYLE['']).c};font-weight:600;"><option value="">ไม่ระบุ</option>${PLAN_STATUSES.map(s=>`<option ${it.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
        <td style="font-size:12.5px;">${execEsc(it.remark)||''}</td>
        ${PLAN_MONTHS.map((m,i)=>{ const v=(it.months||[])[i]||0, late = v===1 && i<lim && it.status!=='เรียบร้อย', c = planCell(v,late); return `<td class="plm" data-m="${i}" title="${m}: ${v===2?'เสร็จแล้ว':v===1?(late?'เลยกำหนด ยังไม่เสร็จ':'มีแผน'):'ไม่มีแผน'}" style="text-align:center;cursor:pointer;border-left:1px solid var(--line);${isCurYear&&i===cur.m&&!v?'background:#FFF8E1;':''}${c.style}">${c.html}</td>`; }).join('')}

    });
    html += `</tbody></table>`;
    scroll.innerHTML = html + `<div class="hint" style="padding:8px 12px;">แสดง ${n} จาก ${all.length} รายการ · สัญลักษณ์: ● มีแผน · ! เลยกำหนดแต่ยังไม่เสร็จ · ✓ เสร็จแล้ว</div>`;
  }
  scroll.onclick = async (ev)=>{
    const tr = ev.target.closest('tr[data-id]'); if(!tr) return;
    const it = planItems().find(x=>x.id===tr.dataset.id); if(!it) return;
    const mc = ev.target.closest('.plm');
    if(mc){
      const i = +mc.dataset.m; it.months = (it.months||Array(12).fill(0)).slice(); it.months[i] = ((it.months[i]||0)+1)%3;
      const lim = planLimit(), late = it.months[i]===1 && i<lim && it.status!=='เรียบร้อย', c = planCell(it.months[i], late);
      mc.style.cssText = `text-align:center;cursor:pointer;border-left:1px solid var(--line);${c.style}`; mc.innerHTML = c.html;
      await savePlan(it); return;
    }

    if(ev.target.closest('[data-pdel]')){ if(await planDelete(it.id)) setState({}); return; }
  };
  scroll.onchange = async (ev)=>{
    const sel = ev.target.closest('select[data-pst]'); if(!sel) return;
    const it = planItems().find(x=>x.id===sel.closest('tr').dataset.id); if(!it) return;
    it.status = sel.value; const s = PLAN_STATUS_STYLE[it.status]||PLAN_STATUS_STYLE[''];
    sel.style.background = s.bg; sel.style.color = s.c; await savePlan(it);
  };
  fill();

  // นำเข้าจาก Excel (แม่แบบของระบบ) — ใช้เริ่มแผนปีถัดไปหรือเพิ่มหลายรายการพร้อมกัน
  const imp = el(`<details class="card no-print" style="margin-top:14px;"><summary style="cursor:pointer;font-weight:700;">📥 นำเข้าแผนงานจาก Excel (เพิ่มรายการหลายรายการ / เริ่มแผนปีใหม่)</summary><div id="plImpBox" style="margin-top:10px;"></div></details>`);
  imp.querySelector('#plImpBox').appendChild(buildExcelImportCard({ title:"นำเข้าแผนงานจาก Excel", unit:"รายการ",
    hint:"โหลดแม่แบบ กรอกตามหัวตาราง (ช่องเดือน: พิมพ์ \"แผน\" หรือ \"เสร็จ\") แล้วอัปโหลด — รายการที่ซ้ำกับที่มีอยู่จะถูกข้าม และเพิ่มต่อท้ายแผนเดิม",
    template: planImportTemplate, parse: planImportParse, commit: planImportCommit }));
  wrap.appendChild(imp);
  return wrap;
}

function renderPlanForm(box){
  const editing = _planForm && _planForm.id ? planItems().find(x=>x.id===_planForm.id) : null;
  if(_planForm && _planForm.id && !editing){ _planForm = null; box.innerHTML = ""; return; }
  const it = editing || { groupNo:null, group:"", content:"", type:"กฎหมาย", kpi:"", owner:"", status:"", remark:"", months:Array(12).fill(0), scheduleNote:"" };
  const months = (it.months||Array(12).fill(0)).slice();
  const groups = planGroups(), gnos = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  box.innerHTML = `<div class="card" style="margin-bottom:14px;border-left:5px solid var(--accent);">
    <h3 style="margin:0 0 10px;font-size:15px;">${editing?'✏ แก้ไขรายการ':'➕ เพิ่มรายการแผนงาน'}</h3>
    <div class="grid2">
      <div class="field"><label>กลุ่มกิจกรรม</label><select id="pfG">${gnos.map(g=>`<option value="${g}" ${it.groupNo===g?'selected':''}>${g}. ${execEsc(groups[g])}</option>`).join('')}<option value="__new" ${!gnos.length||it.groupNo==null&&!gnos.length?'selected':''}>➕ สร้างกลุ่มใหม่</option></select></div>
      <div class="field" id="pfNewG" style="display:none;"><label>ชื่อกลุ่มกิจกรรมใหม่ <span class="req">*</span></label><input type="text" id="pfGT" placeholder="เช่น การตรวจสอบเครื่องจักร"></div>
    </div>
    <div class="field"><label>เนื้อหากิจกรรม <span class="req">*</span></label><textarea id="pfC" rows="2">${execEsc(it.content)}</textarea></div>
    <div class="grid3">
      <div class="field"><label>ประเภท</label><input type="text" id="pfT" list="pfTypes" value="${execEsc(it.type)}"><datalist id="pfTypes">${PLAN_TYPES.map(t=>`<option value="${t}">`).join('')}</datalist></div>
      <div class="field"><label>ดัชนีชี้วัด</label><input type="text" id="pfK" value="${execEsc(it.kpi)}"></div>
      <div class="field"><label>ผู้รับผิดชอบ</label><input type="text" id="pfO" value="${execEsc(it.owner)}" placeholder="เช่น จป.,HR"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>สถานะ</label><select id="pfS"><option value="">ไม่ระบุ</option>${PLAN_STATUSES.map(s=>`<option ${it.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>หมายเหตุ</label><input type="text" id="pfR" value="${execEsc(it.remark)}"></div>
      <div class="field"><label>กำหนดการ (ข้อความ เช่น "ทุกครั้งที่มีผู้รับเหมาใหม่")</label><input type="text" id="pfN" value="${execEsc(it.scheduleNote)}"></div>
    </div>
    <div class="field"><label>เดือนที่มีแผน (กดสลับ: ว่าง → ● แผน → ✓ เสร็จ)</label><div id="pfMonths" style="display:flex;gap:6px;flex-wrap:wrap;"></div></div>
    ${editing&&it.groupNo!=null?`<label style="font-weight:400;font-size:13px;"><input type="checkbox" id="pfAllG"> ใช้ชื่อกลุ่มที่เลือกกับทุกรายการในกลุ่มเดียวกัน (เมื่อเปลี่ยนชื่อกลุ่ม)</label>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"><button type="button" class="btn btn-primary" id="pfSave">💾 บันทึก</button><button type="button" class="btn btn-outline" id="pfCancel">ยกเลิก</button>${editing?'<button type="button" class="btn btn-danger" id="pfDel" style="margin-left:auto;">🗑 ลบรายการนี้ (ต้องใช้รหัสแอดมิน)</button>':''}<span class="hint" id="pfMsg" style="margin:0;align-self:center;"></span></div></div>`;
  const q = s=>box.querySelector(s);
  const gSel = q('#pfG'), newWrap = q('#pfNewG');
  const syncG = ()=>{ newWrap.style.display = gSel.value==='__new' ? '' : 'none'; };
  gSel.onchange = syncG; syncG();
  const mBox = q('#pfMonths');
  const drawMonths = ()=>{ mBox.innerHTML = PLAN_MONTHS.map((m,i)=>{ const c = planCell(months[i], false); return `<button type="button" data-mi="${i}" style="min-width:52px;padding:6px 4px;border:1px solid var(--line);border-radius:4px;cursor:pointer;${c.style||'background:#fff;'}">${m}<br><span style="font-size:13px;">${c.html||'·'}</span></button>`; }).join(''); mBox.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const i=+b.dataset.mi; months[i]=(months[i]+1)%3; drawMonths(); }); };
  drawMonths();
  q('#pfCancel').onclick = ()=>{ _planForm = null; box.innerHTML = ""; };
  const del = q('#pfDel'); if(del) del.onclick = async ()=>{ if(await planDelete(editing.id)){ _planForm = null; setState({}); } };
  q('#pfSave').onclick = async ()=>{
    const content = q('#pfC').value.trim(), msg = q('#pfMsg');
    if(!content){ msg.style.color='var(--danger)'; msg.textContent = 'กรุณากรอกเนื้อหากิจกรรม'; return; }
    let groupNo, group;
    if(gSel.value==='__new'){
      group = q('#pfGT').value.trim(); if(!group){ msg.style.color='var(--danger)'; msg.textContent = 'กรุณากรอกชื่อกลุ่มกิจกรรมใหม่'; return; }
      groupNo = planNextGroupNo();
    } else { groupNo = +gSel.value; group = groups[groupNo]; }
    const rec = Object.assign(editing || { id:'pl_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5) }, { groupNo, group, content, type:q('#pfT').value.trim(), kpi:q('#pfK').value.trim(), owner:q('#pfO').value.trim(), status:q('#pfS').value, remark:q('#pfR').value.trim(), scheduleNote:q('#pfN').value.trim(), months: months.slice(), updatedAt:new Date().toISOString() });
    if(!editing) state.plan.items = planItems().concat([rec]);
    const all = q('#pfAllG');
    if(all && all.checked) planItems().forEach(x=>{ if(x.groupNo===groupNo) x.group = group; });
    q('#pfSave').disabled = true; msg.style.color = ''; msg.textContent = 'กำลังบันทึก...';
    const ok = await savePlan(rec);
    if(!ok){ msg.style.color='var(--danger)'; msg.textContent = 'บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'; q('#pfSave').disabled = false; return; }
    if(all && all.checked){ for(const x of planItems()){ if(x.groupNo===groupNo && x.id!==rec.id) await savePlan(x); } }
    _planForm = null; setState({});
  };
}

function planImportParse(rows){
  const items = [], errors = []; let dups = 0, gno = null, gtitle = "";
  const exist = new Set(planItems().map(i=>`${i.group}|${i.content}`)), seen = new Set(), groups = planGroups();
  const mv = v=>{ const s = xlStr(v).toLowerCase(); if(!s || /^(-|ไม่|no|0)$/.test(s)) return 0; return /เสร็จ|done|✓|✔|^2$/.test(s) ? 2 : 1; };
  rows.forEach((r,i)=>{
    const rowNo = i+2, g = xlStr(xlGet(r,"ลำดับกลุ่ม")), gt = xlStr(xlGet(r,"กิจกรรม (ชื่อกลุ่ม)")) || xlStr(xlGet(r,"กิจกรรม"));
    if(g || gt){ if(g && !isNaN(Number(g))) gno = Number(g); if(gt) gtitle = gt; if(gt && !g){ const found = Object.keys(groups).find(k=>groups[k]===gt); gno = found ? Number(found) : planNextGroupNo()+items.filter(x=>x._new).length; } }
    const content = xlStr(xlGet(r,"เนื้อหากิจกรรม"));
    if(!content){ if(!(g||gt)) errors.push({row:rowNo, msg:"ไม่มีเนื้อหากิจกรรม"}); return; }
    if(gno==null || !gtitle){ errors.push({row:rowNo, msg:"ไม่มีกลุ่มกิจกรรม (กรอกลำดับกลุ่มและชื่อกิจกรรมในแถวแรกของกลุ่ม)"}); return; }
    const key = `${gtitle}|${content}`;
    if(exist.has(key) || seen.has(key)){ dups++; return; } seen.add(key);
    const stTxt = xlStr(xlGet(r,"สถานะ")); const status = /เรียบร้อย|เสร็จ/.test(stTxt) ? "เรียบร้อย" : /กำลัง/.test(stTxt) ? "กำลังดำเนินการ" : /รอ/.test(stTxt) ? "รอดำเนินการ" : "";
    items.push({ groupNo:gno, group:gtitle, content, type:xlStr(xlGet(r,"ประเภท")), kpi:xlStr(xlGet(r,"ดัชนีชี้วัด")), owner:xlStr(xlGet(r,"ผู้รับผิดชอบ")), status, remark:xlStr(xlGet(r,"หมายเหตุ")), months:PLAN_MONTHS.map(m=>mv(xlGet(r,m))), scheduleNote:xlStr(xlGet(r,"กำหนดการ (ข้อความ)")) || xlStr(xlGet(r,"กำหนดการ")), _new:true });
  });
  return { items, errors, dups, summary: items.length ? `จะเพิ่มต่อท้ายแผนเดิม ${items.length} รายการ (กลุ่มที่ชื่อตรงกับของเดิมจะรวมเข้ากลุ่มเดิม)` : "" };
}
async function planImportCommit(items){
  const add = items.map((x,i)=>{ const { _new, ...rest } = x; return Object.assign({ id:'pl_'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,4) }, rest); });
  const ok = await savePlan(null, null, { addItems:add });
  if(!ok) throw new Error("บันทึกไม่สำเร็จ");
  showToast(`นำเข้าแผนงาน ${add.length} รายการแล้ว`);
}

  const capaItems = allCorrectiveItems();

  const totalHours = computeTotalLaborHoursAllPermits();
  const recordableCount = allIncidentRecords().filter(r=>r.recordable).length;
  const ltiCount = allIncidentRecords().filter(r=>r.lostTime).length;

  </div>`));

  // สรุปข้ามโมดูล
  const blacklistedCount = state.contractors.filter(c=>c.general&&c.general.blacklisted).length;
  const fireAttention = state.fireEquipment.filter(eq=>equipmentStatus(eq).cls==="badge-danger").length;
  const inspOpenFindings = state.inspections.reduce((s,i)=>s+(i.findings||[]).filter(f=>f.status!=="closed").length, 0);

    {icon:"👷", name:"Contractor", stat1:`${state.contractors.length} บริษัทในระบบ`, stat2:`${blacklistedCount} บริษัทติด Blacklist`, module:"contractor", route:"contractors"},

    incByMonth.push(allIncidentRecords().filter(x=>{ const xd=new Date(x.date); return xd.getFullYear()===y && xd.getMonth()===m; }).length);
    nmByMonth.push(state.nearMisses.filter(x=>{ const xd=new Date(x.date); return xd.getFullYear()===y && xd.getMonth()===m; }).length);
  }
  const maxTrend = Math.max(...incByMonth, ...nmByMonth, 1);
  const TR_H = 140;
  const trendCard = el(`<div class="card" style="margin-bottom:16px;">
    <h3 style="margin-top:0;font-size:15px;">แนวโน้มอุบัติเหตุ vs Near Miss (6 เดือนล่าสุด)</h3>
    <div style="display:flex;gap:6px;margin-bottom:8px;font-size:11.5px;">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--danger);border-radius:2px;margin-right:4px;"></span>อุบัติเหตุ</span>
      <span style="margin-left:12px;"><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:4px;"></span>Near Miss</span>
    </div>
    <div style="display:flex;align-items:flex-end;gap:16px;height:${TR_H}px;padding:6px 4px 0;overflow-x:auto;" id="trendChart"></div>
  </div>`);
  const trendWrap = trendCard.querySelector('#trendChart');
  monthLabels.forEach((label,idx)=>{
    const incH = Math.max((incByMonth[idx]/maxTrend)*TR_H, incByMonth[idx]>0?6:0);
    const nmH = Math.max((nmByMonth[idx]/maxTrend)*TR_H, nmByMonth[idx]>0?6:0);
    trendWrap.appendChild(el(`<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;">
      <div style="display:flex;align-items:flex-end;gap:4px;height:${TR_H}px;">
        <div style="width:16px;background:var(--danger);border-radius:3px 3px 0 0;height:${incH}px;" title="อุบัติเหตุ ${incByMonth[idx]}"></div>
        <div style="width:16px;background:var(--accent);border-radius:3px 3px 0 0;height:${nmH}px;" title="Near Miss ${nmByMonth[idx]}"></div>
      </div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:6px;">${label}</div>
    </div>`));
  });
  wrap.appendChild(trendCard);

  // ตารางความเสี่ยงตามแผนก — รวมข้อบกพร่อง/มาตรการค้างจากทุกโมดูลตามแผนก
  const deptRisk = {};
  DEPARTMENTS.forEach(d=>{ deptRisk[d] = 0; });
  state.inspections.forEach(insp=>{
    (insp.findings||[]).filter(f=>f.status!=="closed").forEach(()=>{ if(deptRisk[insp.department]!=null) deptRisk[insp.department]++; });
  });
  state.nearMisses.forEach(nm=>{
    (nm.actions||[]).filter(a=>a.status!=="closed").forEach(()=>{ if(deptRisk[nm.department]!=null) deptRisk[nm.department]++; });
  });
  state.capas.filter(c=>c.status!=="closed").forEach(c=>{ if(deptRisk[c.department]!=null) deptRisk[c.department]++; });
  state.accidents.forEach(acc=>{
    (acc.actions||[]).filter(a=>a.status!=="closed").forEach(()=>{ if(deptRisk[acc.department]!=null) deptRisk[acc.department]++; });
  });
  const riskRows = Object.entries(deptRisk).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(riskRows.length){
    const maxRisk = Math.max(...riskRows.map(r=>r[1]));
    wrap.appendChild(el(`<div class="card">
      <h3 style="margin-top:0;font-size:15px;">พื้นที่/แผนกที่มีข้อบกพร่อง-มาตรการค้างมากที่สุด</h3>
      ${riskRows.map(([dept,count])=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <div style="width:140px;font-size:12.5px;flex-shrink:0;">${dept}</div>
          <div style="flex:1;background:var(--bg);border-radius:6px;overflow:hidden;height:18px;">
            <div style="width:${Math.max((count/maxRisk)*100,6)}%;background:${count>=maxRisk*0.7?'var(--danger)':'var(--accent)'};height:100%;"></div>
          </div>
          <div style="width:24px;text-align:right;font-size:12.5px;font-weight:700;">${count}</div>
        </div>`).join('')}
    </div>`));
  }

  return wrap;
}

/* ==================== Fire & Emergency: ตรวจอุปกรณ์ดับเพลิงประจำเดือน ==================== */
function monthlyTypeDone(typeId, monthKey){
  // รอบตรวจเก่าที่ไม่ได้ระบุประเภท (r.type ว่าง) ถือว่าครอบคลุมทุกประเภท
  return state.fireMonthlyChecks.some(r=>r.month===monthKey && (!r.type || r.type===typeId));
}
function monthlyRoundsThisMonth(typeId, monthKey){
  return state.fireMonthlyChecks.filter(r=>r.month===monthKey && (!r.type || r.type===typeId));
}
// บันทึกผลตรวจ 1 ครั้ง (1 ฟอร์ม = อุปกรณ์ 1 ชิ้น) โดยไม่ต้องมีในทะเบียนก่อน
async function submitFireInspection(typeId, header, data){
  const round = {
    id:'fm'+Date.now()+Math.random().toString(36).slice(2,7),
    month: header.date.slice(0,7), type: typeId, date: header.date, time: header.time,
    department: header.department, createdAt: new Date().toISOString(),
    checkedBy: header.checkedBy,
    totalChecked: 1, failCount: data.result==="fail" ? 1 : 0,
    results: [{ equipmentId:null, code:"", type:typeId, location:data.location,
      extType:data.extType||"", extSize:data.extSize||"", extras:data.extras||{}, result:data.result,
      note:data.note||"", items:data.items, photos:data.photos||[] }]
  };
