}

/* ---- Contractors working on a given day (grouped by company) ---- */
function buildContractorDaySummary(){
  const todayStr = (()=>{ const d=new Date(); const m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${d.getFullYear()}-${m}-${dd}`; })();
  const esc = v => String(v==null?'':v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const card = el(`<div class="card" style="margin-bottom:14px;">
    <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between;">
      <div>
        <h3 style="margin:0 0 4px;font-size:16px;">ผู้รับเหมาที่ทำงานในวันนี้</h3>
        <div class="hint" style="margin:0;" id="cdsSub"></div>
      </div>
      <div class="field" style="margin:0;"><label>เลือกวันที่</label><input type="date" id="cdsDate" value="${todayStr}"></div>
    </div>
    <div id="cdsBody" style="margin-top:12px;"></div>
  </div>`);

  function render(){
    const day = card.querySelector('#cdsDate').value || todayStr;
    // ใบที่วันนั้นอยู่ในช่วง startDate..endDate และไม่ถูกปฏิเสธ
    const active = state.permits.filter(p=>p.status!=="rejected" && p.startDate<=day && (p.endDate||p.startDate)>=day);
    const groups = {};
    active.forEach(p=>{
      const name = (p.contractor&&p.contractor.company)||'(ไม่ระบุ)';
      (groups[name] = groups[name] || []).push(p);
    });
    const names = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length || a.localeCompare(b,'th'));
    const totalWorkers = active.reduce((n,p)=>n+(parseInt(p.workerCount,10)||0),0);
    card.querySelector('#cdsSub').textContent = names.length
      ? `${day} · ${names.length} ผู้รับเหมา · ${active.length} ใบอนุญาต · คนงานรวม ${totalWorkers} คน`
      : `${day}`;
    const body = card.querySelector('#cdsBody');
    if(!names.length){ body.innerHTML = `<p class="hint" style="margin:0;">ไม่มีผู้รับเหมาที่มีใบอนุญาตทำงานในวันนี้</p>`; return; }
    body.innerHTML = `<div style="overflow-x:auto;"><table class="permit-table">
      <thead><tr><th>ผู้รับเหมา</th><th>จำนวนใบ</th><th>คนงาน</th><th>พื้นที่ / ลักษณะงาน</th><th>สถานะ</th></tr></thead>
      <tbody>${names.map(n=>{
        const ps = groups[n];
        const workers = ps.reduce((a,p)=>a+(parseInt(p.workerCount,10)||0),0);
        const works = ps.map(p=>`<div style="margin-bottom:3px;"><b>${esc(p.department)}</b>${p.location?` · ${esc(p.location)}`:''} — ${esc((p.workDescription||'').slice(0,50))}</div>`).join('');
        const badges = ps.map(p=>`<div style="margin-bottom:3px;">${badgeForStatus(p.status)}</div>`).join('');
        return `<tr data-company="${esc(n)}"><td><b>${esc(n)}</b></td><td>${ps.length}</td><td>${workers||'-'}</td><td>${works}</td><td>${badges}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }
  card.querySelector('#cdsDate').onchange = render;
  render();
  return card;
}

/* ---- All permits ---- */
function renderAll(){
  const wrap = el(`<div><div class="pagehead"><div><h1>ใบอนุญาตทำงานทั้งหมด</h1><p>ประวัติและสถานะใบขออนุญาตทำงานทั้งหมดในระบบ</p></div></div></div>`);
  if(state.permits.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีใบขออนุญาต</h3><p>เริ่มต้นด้วยการสร้างใบขออนุญาตทำงานใหม่จากเมนูด้านซ้าย</p></div>`));

    <div class="grid3">
      <div class="field" style="margin-bottom:0;"><label>แผนก</label>
        <select id="filterDept"><option value="">ทุกแผนก</option>${DEPARTMENTS.map(d=>`<option value="${d}">${d}</option>`).join('')}</select>
      </div>
      <div class="field" style="margin-bottom:0;"><label>วันที่ปฏิบัติงาน ตั้งแต่</label><input type="date" id="filterDateFrom"></div>

    </div>
    <div style="display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap;">
      <button type="button" class="btn btn-outline btn-sm" id="filterClearBtn">ล้างตัวกรอง</button>
      <span id="filterResultCount" class="hint" style="margin:0;"></span>
    </div>
  </div>`);
  wrap.appendChild(filterCard);

  const tableContainer = el(`<div></div>`);
  wrap.appendChild(tableContainer);

  function applyFilters(){
    const dept = filterCard.querySelector('#filterDept').value;
    const from = filterCard.querySelector('#filterDateFrom').value;
    const to = filterCard.querySelector('#filterDateTo').value;
    let list = state.permits;
    if(dept) list = list.filter(p=>p.department===dept);
    if(from) list = list.filter(p=>p.startDate>=from);
    if(to) list = list.filter(p=>p.startDate<=to);
    tableContainer.innerHTML = '';
    if(list.length===0){
      tableContainer.appendChild(el(`<div class="empty"><h3>ไม่พบรายการที่ตรงกับตัวกรอง</h3><p>ลองปรับแผนกหรือช่วงวันที่ใหม่</p></div>`));
    } else {
      tableContainer.appendChild(buildTable(list));
    }
    filterCard.querySelector('#filterResultCount').textContent = `พบ ${list.length} รายการ จากทั้งหมด ${state.permits.length} รายการ`;
  }

  filterCard.querySelector('#filterDept').onchange = applyFilters;
  filterCard.querySelector('#filterDateFrom').onchange = applyFilters;
  filterCard.querySelector('#filterDateTo').onchange = applyFilters;
  filterCard.querySelector('#filterClearBtn').onclick = ()=>{
    filterCard.querySelector('#filterDept').value = '';
    filterCard.querySelector('#filterDateFrom').value = '';
    filterCard.querySelector('#filterDateTo').value = '';
    applyFilters();
  };

  applyFilters();
  return wrap;
}

      <div id="inspChecklistArea"></div>

      </div>
      <button class="btn btn-primary" type="submit">บันทึกผลตรวจ</button>
    </form>
  </div>`);

  const checklistArea = wrap.querySelector('#inspChecklistArea');
  function currentCatIds(){ return Array.from(wrap.querySelectorAll('input[name="categories"]:checked')).map(c=>c.value); }
  function refreshChecklist(){
    const catIds = currentCatIds();
    if(!catIds.length){ checklistArea.innerHTML=''; return; }
    const items = inspectionItemsForCategories(catIds);
    checklistArea.innerHTML = `<div class="card"><h3 style="margin-top:0;font-size:15px;">รายการตรวจ</h3>${items.map(inspectionItemRowHtml).join('')}</div>`;
  }
  wrap.querySelectorAll('input[name="categories"]').forEach(cb=>cb.onchange=refreshChecklist);
  checklistArea.addEventListener('change', (e)=>{
    if(e.target.name && e.target.name.startsWith('status_')){
      const card = e.target.closest('[data-insp-item]');
      const extra = card.querySelector('[data-insp-fail-extra]');
      extra.style.display = e.target.value==='fail' ? 'block' : 'none';
    }
  });

  wrap.querySelector('#inspForm').onsubmit = async (e)=>{
    e.preventDefault();
    const catIds = currentCatIds();
    if(!catIds.length){ showToast("กรุณาเลือกหมวดตรวจอย่างน้อย 1 หมวด"); return; }
    const f = new FormData(e.target);
    const items = inspectionItemsForCategories(catIds);
    const results = items.map(item=>({
      key:item.key, categoryId:item.categoryId, categoryLabel:item.categoryLabel, text:item.text,
      status: f.get(`status_${item.key}`) || "pass",
      severity: f.get(`severity_${item.key}`) || "medium",
      note: (f.get(`note_${item.key}`)||"").trim()
    }));
    const photoInput = wrap.querySelector('#inspPhotoInput');
    if(photoInput.files.length>MAX_PHOTOS){ showToast(`แนบรูปได้ไม่เกิน ${MAX_PHOTOS} รูป`); return; }
    const submitBtn = wrap.querySelector('#inspForm button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = "กำลังบันทึก...";
    let photos = [];
    if(photoInput.files.length){
      try{
        const rawPhotos = await filesToDataUrls(photoInput.files);
        photos = await uploadPhotosAndGetUrls(rawPhotos, "inspection_"+Date.now());
      }catch(err){
        showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองอีกครั้ง");
        submitBtn.disabled = false; submitBtn.textContent = "บันทึกผลตรวจ";
        return;
      }
    }
    await createInspection({
      date: f.get('date'), department: f.get('department'), area: f.get('area'),
      inspectorName: f.get('inspectorName'), inspectorEmail: state.myEmail,
      categories: catIds, results, photos
    });
  };
  return wrap;
}

function renderInspectionDashboard(){
  const wrap = el(`<div><div class="pagehead"><div><h1>แดชบอร์ดตรวจความปลอดภัย</h1><p>สรุปภาพรวมผลการตรวจความปลอดภัยทั้งหมด</p></div></div></div>`);
  const list = state.inspections;
  if(list.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีข้อมูล</h3><p>แดชบอร์ดจะแสดงผลเมื่อมีการตรวจอย่างน้อย 1 ครั้ง</p></div>`));
    return wrap;
  }
  const totalInsp = list.length;
  const allFindings = list.flatMap(i=>i.findings||[]);
  const openFindings = allFindings.filter(f=>f.status!=="closed").length;
  const closedFindings = allFindings.filter(f=>f.status==="closed").length;
  const totalItems = list.reduce((s,i)=>s+(i.results||[]).length,0);
  const passItems = list.reduce((s,i)=>s+(i.results||[]).filter(r=>r.status==="pass").length,0);
  const passRate = totalItems ? Math.round((passItems/totalItems)*100) : 0;

  wrap.appendChild(el(`<div class="grid4" style="margin-bottom:16px;">
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">จำนวนครั้งที่ตรวจ</div><div style="font-family:'Oswald',sans-serif;font-size:32px;">${totalInsp}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">อัตราผ่านการตรวจ</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--success);">${passRate}%</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ข้อบกพร่องค้างแก้ไข</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--danger);">${openFindings}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ข้อบกพร่องแก้ไขแล้ว</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--success);">${closedFindings}</div></div>
  </div>`));

  const groups = {};
  list.forEach(i=>{
    const key = i.department || "(ไม่ระบุ)";
    if(!groups[key]) groups[key] = {total:0, open:0, closed:0};
    groups[key].total++;
    (i.findings||[]).forEach(f=> f.status==="closed" ? groups[key].closed++ : groups[key].open++);
  });
  const rows = Object.entries(groups).sort((a,b)=>b[1].total-a[1].total);
  const maxTotal = Math.max(...rows.map(r=>r[1].total), 1);
  const CHART_H = 160;
  const chart = el(`<div class="card">
    <h3 style="margin-top:0;font-size:15px;">จำนวนครั้งที่ตรวจ แยกตามแผนก</h3>
    <div style="display:flex;align-items:flex-end;gap:20px;height:${CHART_H}px;padding:24px 4px 0;overflow-x:auto;" id="inspBarChart"></div>
  </div>`);
  const chartWrap = chart.querySelector('#inspBarChart');
  rows.forEach(([key,g])=>{
    const barH = Math.max((g.total/maxTotal)*CHART_H, 6);
    chartWrap.appendChild(el(`<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;align-self:flex-end;">
      <div style="font-size:12px;font-weight:600;margin-bottom:4px;">${g.total}</div>
      <div style="width:40px;background:var(--accent);border-radius:3px 3px 0 0;height:${barH}px;"></div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:8px;text-align:center;max-width:74px;line-height:1.3;">${key}</div>
    </div>`));
  });
  wrap.appendChild(chart);
  return wrap;
}

      ${(f.photos&&f.photos.length)?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">${f.photos.map(p=>`<img src="${p}" style="max-width:160px;border-radius:var(--radius);border:1px solid var(--line);">`).join('')}</div>`:''}
      ${f.status!=='closed' ? `
        <div class="grid2 no-print" style="margin-top:10px;">
          <div class="field" style="margin-bottom:6px;"><label>มอบหมายให้</label><input type="text" data-f-assign value="${(f.assignedTo||'').replace(/"/g,'&quot;')}" placeholder="ชื่อผู้รับผิดชอบ"></div>
          <div class="field" style="margin-bottom:6px;"><label>กำหนดเสร็จ</label><input type="date" data-f-due value="${f.dueDate||''}"></div>
        </div>
        ${(f.assignedTo||f.dueDate)?`<div style="font-size:12px;color:var(--ink-muted);margin:-4px 0 8px;">${f.assignedTo?`มอบหมาย: ${f.assignedTo}`:''}${f.dueDate?` · กำหนดเสร็จ: ${f.dueDate}`:''}</div>`:''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;" class="no-print">
          <button type="button" class="btn btn-outline btn-sm" data-f-save>บันทึกผู้รับผิดชอบ/กำหนดเสร็จ</button>
          <button type="button" class="btn btn-success btn-sm" data-f-close>✓ ปิดรายการ (แก้ไขแล้ว)</button>
        </div>` : `
        <div class="no-print" style="margin-top:8px;font-size:12px;color:var(--ink-muted);">
          ปิดโดย ${f.closedBy||'(ไม่ระบุ)'} เมื่อ ${f.closedAt?new Date(f.closedAt).toLocaleString('th-TH'):''}${f.closeNote?` — ${f.closeNote}`:''}
          <button type="button" class="btn btn-outline btn-sm" data-f-reopen style="margin-left:8px;">เปิดใหม่</button>
        </div>`}
    </div>`;
  }).join('');

  container.querySelectorAll('[data-finding-id]').forEach(card=>{
    const fid = card.dataset.findingId;
    const saveBtn = card.querySelector('[data-f-save]');
    if(saveBtn){
      saveBtn.onclick = async ()=>{
        const assignedTo = card.querySelector('[data-f-assign]').value.trim();
        const dueDate = card.querySelector('[data-f-due]').value;
        await updateFinding(insp, fid, {assignedTo, dueDate});
        showToast("บันทึกแล้ว");
      };
    }
    const closeBtn = card.querySelector('[data-f-close]');
    if(closeBtn){
      closeBtn.onclick = async ()=>{
        const note = prompt("หมายเหตุการปิดรายการ (ถ้ามี) — อธิบายวิธีแก้ไข", "");
        if(note===null) return;
        await closeFinding(insp, fid, note);
      };
    }
    const reopenBtn = card.querySelector('[data-f-reopen]');
    if(reopenBtn){
      reopenBtn.onclick = async ()=>{ await reopenFinding(insp, fid); };
    }
  });
}

function wscItemsForCategories(catIds){
  const items = [];
  WSC_CATEGORIES.filter(c=>catIds.includes(c.id)).forEach(c=>{
    c.items.forEach((text,i)=>items.push({key:`${c.id}::${i}`, categoryId:c.id, categoryLabel:c.label, text}));
  });
  return items;
}
const WSC_SEVERITIES = {
  low:      {label:"ต่ำ",                  bg:"var(--success-bg)", color:"var(--success)"},
  medium:   {label:"ปานกลาง",              bg:"var(--accent-bg)",  color:"var(--accent-ink)"},
  high:     {label:"สูง",                  bg:"var(--danger-bg)",  color:"var(--danger)"},
  critical: {label:"วิกฤต — สั่งหยุดงาน",  bg:"var(--danger)",     color:"#fff"}
};
function wscScore(chk){
  const r = (chk.results||[]).filter(x=>x.status!=="na");
  if(!r.length) return null;
  return Math.round(r.filter(x=>x.status==="pass").length / r.length * 100);
}
function wscOverallStatus(chk){
  const findings = chk.findings||[];
  const stopped = findings.some(f=>f.severity==="critical");
  if(stopped){
    const openStop = findings.some(f=>f.severity==="critical" && f.status!=="closed");
    return openStop ? {label:"สั่งหยุดงาน (วิกฤต)", cls:"badge-danger", code:"stop"}
                    : {label:"สั่งหยุดงาน — แก้ไขแล้ว", cls:"badge-accent", code:"stop_closed"};
  }
  if(findings.length===0) return {label:"ผ่านทุกข้อ", cls:"badge-success", code:"pass"};
  const open = findings.filter(f=>f.status!=="closed").length;
  return open>0 ? {label:`พบข้อบกพร่อง ${open} รายการ (ค้างแก้ไข)`, cls:"badge-danger", code:"open"}
                : {label:"พบข้อบกพร่อง — แก้ไขครบแล้ว", cls:"badge-accent", code:"closed"};
}

/* ================= Work Site Control: actions ================= */
function genWscCode(){
  const d = new Date();
  const ymd = d.getFullYear().toString()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const n = state.wscChecks.filter(i=>i.code.includes(ymd)).length + 1;
  return `WSC-${ymd}-${String(n).padStart(3,'0')}`;
}
async function createWscCheck(form){
  const findings = form.results.filter(r=>r.status==="fail").map(r=>({
    id: 'wf'+Date.now()+Math.random().toString(36).slice(2,6),
    itemKey: r.key, itemText: r.text, categoryLabel: r.categoryLabel,
    severity: r.severity || "medium", note: r.note || "",
    photos: form.photos || [],
    assignedTo: "", dueDate: "",
    status: "open", createdAt: new Date().toISOString(),
    closeNote: "", closedBy: "", closedAt: null
  }));
  const chk = {
    id: 'w'+Date.now()+Math.random().toString(36).slice(2,7),
    code: genWscCode(),
    createdAt: new Date().toISOString(),
    date: form.date, time: form.time, department: form.department, location: form.location,
    permitId: form.permitId || "", permitCode: form.permitCode || "",
    company: form.company || "", workerCount: form.workerCount || "",
    inspectorName: form.inspectorName, inspectorEmail: form.inspectorEmail || "",
    categories: form.categories, results: form.results, findings, generalNote: form.generalNote || ""
  };
  state.wscChecks.unshift(chk);
  await saveWscChecks(chk);
  const stop = findings.some(f=>f.severity==="critical");
  showToast(stop ? `⛔ บันทึก ${chk.code} — พบข้อบกพร่องวิกฤต ต้องหยุดงานทันที` : `บันทึกผลตรวจ ${chk.code} แล้ว${findings.length?` — พบข้อบกพร่อง ${findings.length} รายการ`:' — ผ่านทุกข้อ'}`);
  setState({route:"wsc_list", wscDetailId:chk.id});
}
async function updateWscFinding(chk, findingId, patch){
  const f = (chk.findings||[]).find(x=>x.id===findingId);
  if(!f) return;
  Object.assign(f, patch);
  await saveWscChecks(chk);
  render();
}
async function closeWscFinding(chk, findingId, closeNote){
  const f = (chk.findings||[]).find(x=>x.id===findingId);
  if(!f) return;
  f.status = "closed"; f.closeNote = closeNote || "";
  f.closedBy = state.myEmail || "(ไม่ระบุ)"; f.closedAt = new Date().toISOString();
  await saveWscChecks(chk);
  showToast("ปิดรายการข้อบกพร่องแล้ว");
  render();
}
async function reopenWscFinding(chk, findingId){
  const f = (chk.findings||[]).find(x=>x.id===findingId);
  if(!f) return;
  f.status = "open"; f.closedAt = null;
  await saveWscChecks(chk);
  render();
}
async function deleteWscCheck(id){
  if(!(await adminGuard("ลบผลตรวจ Work Site Control — ต้องใช้รหัสผ่านผู้ดูแลระบบ"))) return;
  state.wscChecks = state.wscChecks.filter(i=>i.id!==id);
  await saveWscChecks(null, id);
  showToast("ลบผลตรวจนี้แล้ว");
  setState({wscDetailId:null});
}

            ${otherPermits.length?`<optgroup label="ใบอนุญาตอื่นที่อนุมัติแล้ว">${otherPermits.map(permitOpt).join('')}</optgroup>`:''}

          <div class="field"><label>แผนก/พื้นที่ <span class="req">*</span></label>
            <select required name="department" id="wscDept"><option value="" disabled selected>เลือกแผนก</option>${DEPARTMENTS.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>
        </div>
        <div class="grid3">
          <div class="field"><label>จุด/บริเวณที่ตรวจ <span class="req">*</span></label><input required type="text" name="location" id="wscLoc" placeholder="เช่น หม้อไอน้ำ #2 ชั้น 3"></div>
          <div class="field"><label>บริษัทผู้รับเหมา/ผู้ปฏิบัติงาน</label><input type="text" name="company" id="wscCompany" placeholder="ชื่อบริษัท"></div>

  const area = wrap.querySelector('#wscChecklistArea');
  const keepStatus = {};
  function currentCatIds(){ return Array.from(wrap.querySelectorAll('input[name="categories"]:checked')).map(c=>c.value); }
  function refreshChecklist(){
    // เก็บค่าที่กรอกไว้แล้ว กันหายตอนติ๊กหมวดเพิ่ม/ลด
    area.querySelectorAll('[data-insp-item]').forEach(card=>{
      const k = card.dataset.inspItem;
      const st = card.querySelector('input[type=radio]:checked');
      keepStatus[k] = { status: st?st.value:'pass', severity: card.querySelector('select').value, note: card.querySelector('input[type=text]').value };
    });
    const catIds = currentCatIds();
    if(!catIds.length){ area.innerHTML=''; return; }
    const items = wscItemsForCategories(catIds);
    area.innerHTML = `<div class="card"><h3 style="margin-top:0;font-size:15px;">รายการตรวจ (${items.length} ข้อ)</h3>
      <div style="margin-bottom:10px;"><button type="button" class="btn btn-outline btn-sm" id="wscAllPass">ตั้งทุกข้อเป็น "ผ่าน"</button></div>
      ${items.map(wscItemRowHtml).join('')}</div>`;
    area.querySelectorAll('[data-insp-item]').forEach(card=>{
      const k = card.dataset.inspItem, kept = keepStatus[k];
      if(!kept) return;
      const r = card.querySelector(`input[type=radio][value="${kept.status}"]`); if(r) r.checked = true;
      card.querySelector('select').value = kept.severity;
      card.querySelector('input[type=text]').value = kept.note;
      card.querySelector('[data-insp-fail-extra]').style.display = kept.status==='fail' ? 'block' : 'none';
    });
    const allPass = area.querySelector('#wscAllPass');
    if(allPass) allPass.onclick = ()=>{ area.querySelectorAll('input[type=radio][value="pass"]').forEach(r=>{ r.checked=true; r.dispatchEvent(new Event('change',{bubbles:true})); }); };
  }
  wrap.querySelectorAll('input[name="categories"]').forEach(cb=>cb.onchange=refreshChecklist);
  area.addEventListener('change', (e)=>{
    if(e.target.name && e.target.name.startsWith('status_')){
      const card = e.target.closest('[data-insp-item]');
      card.querySelector('[data-insp-fail-extra]').style.display = e.target.value==='fail' ? 'block' : 'none';
    }
  });

  // เลือกใบอนุญาต → เติมข้อมูล + ติ๊กหมวดตามประเภทงาน
  wrap.querySelector('#wscPermit').onchange = (e)=>{
    const p = state.permits.find(x=>x.id===e.target.value);
    if(!p) return;
    if(p.department && DEPARTMENTS.includes(p.department)) wrap.querySelector('#wscDept').value = p.department;
    wrap.querySelector('#wscLoc').value = p.location || '';
    wrap.querySelector('#wscCompany').value = (p.contractor&&p.contractor.company) || '';
    wrap.querySelector('#wscWorkers').value = p.workerCount || '';
    const types = p.permitTypes || [];
    wrap.querySelectorAll('input[name="categories"]').forEach(cb=>{
      const cat = WSC_CATEGORIES.find(c=>c.id===cb.value);
      if(cat && cat.permitType) cb.checked = types.includes(cat.permitType);
    });
    refreshChecklist();
  };
  refreshChecklist();

  wrap.querySelector('#wscForm').onsubmit = async (e)=>{
    e.preventDefault();
    const catIds = currentCatIds();
    if(!catIds.length){ showToast("กรุณาเลือกหมวดตรวจอย่างน้อย 1 หมวด"); return; }
    const f = new FormData(e.target);
    const items = wscItemsForCategories(catIds);
    const results = items.map(item=>({
      key:item.key, categoryId:item.categoryId, categoryLabel:item.categoryLabel, text:item.text,
      status: f.get(`status_${item.key}`) || "pass",
      severity: f.get(`severity_${item.key}`) || "medium",
      note: (f.get(`note_${item.key}`)||"").trim()
    }));
    const photoInput = wrap.querySelector('#wscPhotoInput');
    if(photoInput.files.length>MAX_PHOTOS){ showToast(`แนบรูปได้ไม่เกิน ${MAX_PHOTOS} รูป`); return; }
    const btn = wrap.querySelector('#wscForm button[type=submit]');
    btn.disabled = true; btn.textContent = "กำลังบันทึก...";
    let photos = [];
    if(photoInput.files.length){
      try{
        const raw = await filesToDataUrls(photoInput.files);
        photos = await uploadPhotosAndGetUrls(raw, "wsc_"+Date.now());
      }catch(err){
        showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองอีกครั้ง");
        btn.disabled = false; btn.textContent = "บันทึกผลตรวจ";
        return;
      }
    }
    const pid = f.get('permitId') || "";
    const pm = state.permits.find(x=>x.id===pid);
    await createWscCheck({
      date:f.get('date'), time:f.get('time'), department:f.get('department'), location:f.get('location'),
      permitId:pid, permitCode: pm?pm.code:"", company:(f.get('company')||"").trim(), workerCount:f.get('workerCount'),
      inspectorName:f.get('inspectorName'), inspectorEmail: state.myEmail,
      categories:catIds, results, photos, generalNote:(f.get('generalNote')||"").trim()
    });
  };
  return wrap;
}

function renderWscDashboard(){
  const wrap = el(`<div><div class="pagehead"><div><h1>แดชบอร์ด Work Site Control</h1><p>สรุปภาพรวมการควบคุมหน้างานจากการตรวจทั้งหมด</p></div></div></div>`);
  const list = state.wscChecks;
  if(list.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีข้อมูล</h3><p>แดชบอร์ดจะแสดงผลเมื่อมีการตรวจอย่างน้อย 1 ครั้ง</p></div>`));
    return wrap;
  }
  const allF = list.flatMap(c=>(c.findings||[]).map(f=>({...f, _c:c})));
  const openF = allF.filter(f=>f.status!=="closed").length;
  const stopCount = list.filter(c=>(c.findings||[]).some(f=>f.severity==="critical")).length;
  const totalItems = list.reduce((s,c)=>s+(c.results||[]).filter(r=>r.status!=="na").length,0);
  const passItems = list.reduce((s,c)=>s+(c.results||[]).filter(r=>r.status==="pass").length,0);
  const passRate = totalItems ? Math.round(passItems/totalItems*100) : 0;
  const kpi = (t,v,c)=>`<div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">${t}</div><div style="font-family:'Oswald',sans-serif;font-size:32px;${c?`color:${c};`:''}">${v}</div></div>`;
  wrap.appendChild(el(`<div class="grid4" style="margin-bottom:16px;">
    ${kpi("จำนวนครั้งที่ตรวจ", list.length)}
    ${kpi("อัตราผ่านการควบคุม", passRate+"%", "var(--success)")}
    ${kpi("ข้อบกพร่องค้างแก้ไข", openF, "var(--danger)")}
    ${kpi("ครั้งที่สั่งหยุดงาน", stopCount, "var(--danger)")}
  </div>`));

  const barCard = (title, rows, unit)=>{
    const max = Math.max(...rows.map(r=>r[1]),1);
    return `<div class="card" style="margin-bottom:16px;"><h3 style="margin-top:0;font-size:15px;">${title}</h3>
      ${rows.length?rows.map(([k,v])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12.5px;">
        <div style="flex:0 0 38%;max-width:260px;line-height:1.3;">${k}</div>
        <div style="flex:1;background:var(--line);border-radius:3px;height:14px;"><div style="width:${Math.max(v/max*100,3)}%;height:100%;background:var(--accent);border-radius:3px;"></div></div>
        <div style="width:54px;text-align:right;font-weight:600;">${v}${unit||''}</div></div>`).join(''):'<p class="hint">ไม่มีข้อมูล</p>'}</div>`;
  };
  const byDept = {}; list.forEach(c=>{ byDept[c.department||"(ไม่ระบุ)"] = (byDept[c.department||"(ไม่ระบุ)"]||0)+1; });
  wrap.appendChild(el(barCard("จำนวนครั้งที่ตรวจ แยกตามแผนก", Object.entries(byDept).sort((a,b)=>b[1]-a[1]))));
  const byComp = {}; allF.forEach(f=>{ const k=f._c.company||"(ไม่ระบุผู้รับเหมา)"; byComp[k]=(byComp[k]||0)+1; });
  wrap.appendChild(el(barCard("ข้อบกพร่องที่พบ แยกตามผู้รับเหมา", Object.entries(byComp).sort((a,b)=>b[1]-a[1]).slice(0,8))));
  const byItem = {}; allF.forEach(f=>{ byItem[f.itemText]=(byItem[f.itemText]||0)+1; });
  wrap.appendChild(el(barCard("ข้อที่ไม่ผ่านบ่อยที่สุด (Top 8)", Object.entries(byItem).sort((a,b)=>b[1]-a[1]).slice(0,8), " ครั้ง")));
  const byCat = {}; allF.forEach(f=>{ byCat[f.categoryLabel]=(byCat[f.categoryLabel]||0)+1; });
  wrap.appendChild(el(barCard("ข้อบกพร่อง แยกตามหมวดควบคุม", Object.entries(byCat).sort((a,b)=>b[1]-a[1]))));
  return wrap;
}

}

function renderNmDashboard(){
  const wrap = el(`<div><div class="pagehead"><div><h1>แดชบอร์ด Near Miss / Unsafe</h1><p>สรุปภาพรวมการแจ้งเหตุ Near Miss / Unsafe Act / Unsafe Condition</p></div></div></div>`);

    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ความรุนแรงสูงที่อาจเกิด</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--danger);">${highSeverity}</div></div>
  </div>`));

  const typeGroups = {};

  list.forEach(r=>{ if(typeGroups[r.type]) typeGroups[r.type].total++; });

  const chart = el(`<div class="card">
    <h3 style="margin-top:0;font-size:15px;">จำนวนที่แจ้ง แยกตามประเภทเหตุการณ์</h3>

  rows.forEach(g=>{

    chartWrap.appendChild(el(`<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;align-self:flex-end;">

    </div>`));
  });
  wrap.appendChild(chart);
  return wrap;
}

      <div class="grid2">

      </div>
      <button type="button" class="btn btn-outline btn-sm" id="addNmActionBtn">+ เพิ่มมาตรการ</button>
    </div>

    <div class="no-print" style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
      ${report.status!=='closed'
        ? `<button type="button" class="btn btn-success" id="closeNmCaseBtn">✓ ปิดเคสนี้</button>`
        : `<button type="button" class="btn btn-outline" id="reopenNmCaseBtn">เปิดเคสใหม่</button>`}
    </div>

    ${state.role==='admin' ? `<div class="card" style="margin-top:16px;border-color:#E3C1B3;">
      <h3 style="margin-top:0;font-size:14px;color:var(--danger);">โซนอันตราย (สำหรับผู้ดูแลระบบ)</h3>
      <p class="hint" style="margin-top:0;">ใช้สำหรับลบข้อมูลทดสอบที่ค้างอยู่ การลบไม่สามารถกู้คืนได้</p>
      <button type="button" class="btn btn-danger" id="deleteNmBtn">🗑 ลบรายการนี้ทิ้ง</button>
    </div>` : ''}
  `;

  inner.querySelector('#closeNmModal').onclick = ()=>setState({nmDetailId:null});
  inner.querySelector('#nmPrintBtn').onclick = ()=>{ window.print(); };
  inner.querySelector('#saveInvestigationBtn').onclick = async ()=>{
    const investigator = inner.querySelector('#nmInvestigator').value.trim();
    const rootCause = inner.querySelector('#nmRootCause').value.trim();
    if(!investigator || !rootCause){ showToast("กรุณากรอกผู้สอบสวนและสาเหตุที่แท้จริง"); return; }
    await saveNmInvestigation(report, investigator, rootCause);
  };
  inner.querySelector('#addNmActionBtn').onclick = async ()=>{
    const desc = inner.querySelector('#nmActionDesc').value.trim();
    if(!desc){ showToast("กรุณากรอกรายละเอียดมาตรการ"); return; }
    const assignedTo = inner.querySelector('#nmActionAssignee').value.trim();
    const dueDate = inner.querySelector('#nmActionDue').value;
    await addNmAction(report, desc, assignedTo, dueDate);
  };
  const closeCaseBtn = inner.querySelector('#closeNmCaseBtn');
  if(closeCaseBtn) closeCaseBtn.onclick = async ()=>{
    if(!confirm(`ยืนยันปิดเคส ${report.code}?`)) return;
    await closeNmCase(report);
  };
  const reopenCaseBtn = inner.querySelector('#reopenNmCaseBtn');
  if(reopenCaseBtn) reopenCaseBtn.onclick = async ()=>{ await reopenNmCase(report); };
  const deleteBtn = inner.querySelector('#deleteNmBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    if(!(await requireAdmin(`ยืนยันลบรายการ ${report.code} ทิ้งอย่างถาวร?\n(การลบนี้กู้คืนไม่ได้)`))) return;
    await deleteNearMiss(report.id);
  };

  renderNmActionsList(inner.querySelector('#nmActionsList'), report);
}

    <div class="no-print" style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">

    ${inc.damageDescription?`<p><strong>ความเสียหาย:</strong> ${inc.damageDescription}</p>`:''}
    ${inc.responseTimeline?`<p><strong>Timeline การตอบสนอง:</strong><br>${inc.responseTimeline.replace(/\n/g,'<br>')}</p>`:''}

    <div class="no-print" style="margin-top:14px;">
      ${inc.status!=='closed' ? `
        <div class="field"><label>สรุปการติดตามผล / มาตรการป้องกันซ้ำ</label><input type="text" id="incFollowUp" placeholder="สรุปสิ่งที่ดำเนินการแก้ไข"></div>
        <button type="button" class="btn btn-success" id="closeIncBtn">✓ ปิดเคสนี้</button>`
        : `<button type="button" class="btn btn-outline" id="reopenIncBtn">เปิดเคสใหม่</button>`}
    </div>

    ${state.role==='admin' ? `<div class="card" style="margin-top:16px;border-color:#E3C1B3;">
      <h3 style="margin-top:0;font-size:14px;color:var(--danger);">โซนอันตราย (สำหรับผู้ดูแลระบบ)</h3>
      <button type="button" class="btn btn-danger" id="deleteIncBtn">🗑 ลบบันทึกเหตุการณ์นี้ทิ้ง</button>
    </div>` : ''}
  `;
  inner.querySelector('#closeIncModal').onclick = ()=>setState({fireIncDetailId:null});
  inner.querySelector('#incPrintBtn').onclick = ()=>{ window.print(); };
  const closeBtn = inner.querySelector('#closeIncBtn');
  if(closeBtn) closeBtn.onclick = async ()=>{
    const note = inner.querySelector('#incFollowUp').value.trim();
    if(!confirm(`ยืนยันปิดเคส ${inc.code}?`)) return;
    await closeIncident(inc, note);
  };
  const reopenBtn = inner.querySelector('#reopenIncBtn');
  if(reopenBtn) reopenBtn.onclick = async ()=>{ await reopenIncident(inc); };
  const deleteBtn = inner.querySelector('#deleteIncBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    if(!(await requireAdmin(`ยืนยันลบบันทึก ${inc.code} ทิ้งอย่างถาวร?`))) return;
    await deleteIncident(inc.id);
  };
}

function renderFireDashboard(){
  const wrap = el(`<div><div class="pagehead"><div><h1>แดชบอร์ด Fire & Emergency</h1><p>ภาพรวมอุปกรณ์ดับเพลิง การซ้อมอพยพ และเหตุฉุกเฉินที่เกิดขึ้น</p></div></div></div>`);

  const openIncidents = state.fireIncidents.filter(i=>i.status!=="closed").length;
  const lastDrill = state.fireDrills.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];

  wrap.appendChild(el(`<div class="grid4" style="margin-bottom:16px;">
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">อุปกรณ์ทั้งหมด</div><div style="font-family:'Oswald',sans-serif;font-size:32px;">${state.fireEquipment.length}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">อุปกรณ์ต้องแก้ไข/หมดอายุ</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--danger);">${eqNeedsAttention}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">เหตุฉุกเฉินที่ยังเปิดอยู่</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--danger);">${openIncidents}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ซ้อมอพยพล่าสุด</div><div style="font-family:'Oswald',sans-serif;font-size:22px;">${lastDrill?lastDrill.date:'ยังไม่เคยซ้อม'}</div></div>
  </div>`));

  if(state.fireEquipment.length){
    const typeGroups = {};
    FIRE_EQUIPMENT_TYPES.forEach(t=>{ typeGroups[t.id] = {label:t.label, total:0}; });
    state.fireEquipment.forEach(eq=>{ if(typeGroups[eq.type]) typeGroups[eq.type].total++; });
    const rows = Object.values(typeGroups).filter(g=>g.total>0);
    const maxTotal = Math.max(...rows.map(r=>r.total), 1);
    const CHART_H = 150;
    const chart = el(`<div class="card"><h3 style="margin-top:0;font-size:15px;">จำนวนอุปกรณ์ แยกตามประเภท</h3>
      <div style="display:flex;align-items:flex-end;gap:20px;height:${CHART_H}px;padding:24px 4px 0;overflow-x:auto;" id="fireBarChart"></div>
    </div>`);
    const chartWrap = chart.querySelector('#fireBarChart');
    rows.forEach(g=>{
      const barH = Math.max((g.total/maxTotal)*CHART_H, 6);
      chartWrap.appendChild(el(`<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;align-self:flex-end;">
        <div style="font-size:12px;font-weight:600;margin-bottom:4px;">${g.total}</div>
        <div style="width:44px;background:var(--accent);border-radius:3px 3px 0 0;height:${barH}px;"></div>
        <div style="font-size:11px;color:var(--ink-muted);margin-top:8px;text-align:center;max-width:80px;line-height:1.3;">${g.label}</div>
      </div>`));
    });
    wrap.appendChild(chart);
  } else {
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีข้อมูล</h3><p>เพิ่มอุปกรณ์ดับเพลิงเพื่อดูกราฟสรุปที่นี่</p></div>`));
  }
  return wrap;
}

  const items = allCorrectiveItems();
  if(items.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีรายการงานแก้ไข</h3><p>รายการจะปรากฏที่นี่เมื่อมีข้อบกพร่องจากการตรวจ, Near Miss หรือสร้างงานแก้ไขใหม่จากเมนูด้านซ้าย</p></div>`));
    return wrap;
  }
  const today = new Date().toISOString().slice(0,10);
  const table = el(`<div class="card" style="padding:0;overflow:hidden;"><table class="permit-table">
    <thead><tr><th>ที่มา</th><th>เลขที่อ้างอิง</th><th>รายละเอียด</th><th>แผนก/พื้นที่</th><th>ผู้รับผิดชอบ</th><th>กำหนดเสร็จ</th><th>สถานะ</th></tr></thead>
    <tbody>${items.map(it=>{
      const overdue = it.status!=="closed" && it.dueDate && it.dueDate<today;
      const statusBadge = it.status==="closed" ? '<span class="badge badge-success">ปิดแล้ว</span>' : overdue ? '<span class="badge badge-danger">เกินกำหนด</span>' : '<span class="badge badge-wait">ดำเนินการ</span>';
      return `<tr class="clickable" data-source="${it.source}" data-source-id="${it.sourceId}">
        <td data-label="ที่มา">${it.sourceLabel}</td>
        <td class="code-tag" data-label="เลขที่อ้างอิง">${it.sourceCode}</td>
        <td data-label="รายละเอียด" style="max-width:260px;">${it.description}</td>
        <td data-label="แผนก/พื้นที่">${it.department||'-'}</td>
        <td data-label="ผู้รับผิดชอบ">${it.assignedTo||'-'}</td>
        <td data-label="กำหนดเสร็จ">${it.dueDate||'-'}</td>
        <td class="status-cell" data-label="สถานะ">${statusBadge}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`);
  table.querySelectorAll('tr.clickable').forEach(tr=>{
    tr.onclick = ()=>{
      const source = tr.dataset.source, id = tr.dataset.sourceId;
      if(source==="inspection") setState({appModule:"inspection", route:"insp_list", inspDetailId:id});
      else if(source==="nearmiss") setState({appModule:"nearmiss", route:"nm_list", nmDetailId:id});
      else if(source==="fire") setState({appModule:"fire", route:"fire_incident", fireIncDetailId:id});
      else if(source==="accident") setState({appModule:"nearmiss", route:"acc_list", accDetailId:id});
      else if(source==="capa") setState({capaDetailId:id});
      else if(source==="scanner") setState({appModule:"scanner", route:"scan_history", scanDetailId:id});
    };
  });
  wrap.appendChild(table);
  return wrap;
}

        ${capa.verificationNote?`<p><strong>หมายเหตุ:</strong> ${capa.verificationNote}</p>`:''}
        <button type="button" class="btn btn-outline btn-sm no-print" id="capaReopenBtn">เปิดงานใหม่</button>
      </div>`}

    ${state.role==='admin' ? `<div class="card" style="margin-top:16px;border-color:#E3C1B3;">
      <h3 style="margin-top:0;font-size:14px;color:var(--danger);">โซนอันตราย (สำหรับผู้ดูแลระบบ)</h3>
      <button type="button" class="btn btn-danger" id="deleteCapaBtn">🗑 ลบงานแก้ไขนี้ทิ้ง</button>
    </div>` : ''}
  `;
  inner.querySelector('#closeCapaModal').onclick = ()=>setState({capaDetailId:null});
  inner.querySelector('#capaPrintBtn').onclick = ()=>{ window.print(); };
  inner.querySelector('#capaUpdateBtn').onclick = async ()=>{
    const assignedTo = inner.querySelector('#capaAssignee').value.trim();
    const dueDate = inner.querySelector('#capaDue').value;
    await updateCapa(capa, {assignedTo, dueDate});
    showToast("บันทึกแล้ว");
  };
  const closeBtn = inner.querySelector('#capaCloseBtn');
  if(closeBtn){
    closeBtn.onclick = async ()=>{
      const verifiedBy = inner.querySelector('#capaVerifiedBy').value.trim();
      if(!verifiedBy){ showToast("กรุณาระบุผู้ยืนยันผล"); return; }
      const verificationNote = inner.querySelector('#capaVerificationNote').value.trim();
      const photoInput = inner.querySelector('#capaAfterPhotoInput');
      let photos = [];
      if(photoInput.files.length){
        try{
          const rawPhotos = await filesToDataUrls(photoInput.files);
          photos = await uploadPhotosAndGetUrls(rawPhotos, "capa_after_"+Date.now());
        }catch(err){ showToast("อัปโหลดรูปไม่สำเร็จ ลองอีกครั้ง"); return; }
      }
      await closeCapa(capa, verifiedBy, verificationNote, photos);
    };
  }
  const reopenBtn = inner.querySelector('#capaReopenBtn');
  if(reopenBtn) reopenBtn.onclick = async ()=>{ await reopenCapa(capa); };
  const deleteBtn = inner.querySelector('#deleteCapaBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    if(!(await requireAdmin(`ยืนยันลบงานแก้ไข ${capa.code} ทิ้งอย่างถาวร?`))) return;
    await deleteCapa(capa.id);
  };
}

function renderCapaDashboard(){
  const wrap = el(`<div><div class="pagehead"><div><h1>แดชบอร์ด Corrective Action</h1><p>ภาพรวมงานแก้ไข/ป้องกันจากทุกโมดูลทั่วทั้งระบบ</p></div></div></div>`);
  const items = allCorrectiveItems();
  if(items.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีข้อมูล</h3><p>แดชบอร์ดจะแสดงผลเมื่อมีรายการงานแก้ไขอย่างน้อย 1 รายการ</p></div>`));
    return wrap;
  }
  const today = new Date().toISOString().slice(0,10);
  const total = items.length;
  const closed = items.filter(i=>i.status==="closed").length;
  const overdue = items.filter(i=>i.status!=="closed" && i.dueDate && i.dueDate<today).length;
  const openCount = total - closed;

  wrap.appendChild(el(`<div class="grid4" style="margin-bottom:16px;">
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">งานแก้ไขทั้งหมด</div><div style="font-family:'Oswald',sans-serif;font-size:32px;">${total}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ค้างดำเนินการ</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--accent-ink);">${openCount}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">เกินกำหนด</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--danger);">${overdue}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ปิดงานแล้ว</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--success);">${closed}</div></div>
  </div>`));

  const bySource = {};
  items.forEach(it=>{
    if(!bySource[it.sourceLabel]) bySource[it.sourceLabel] = {total:0, open:0};
    bySource[it.sourceLabel].total++;
    if(it.status!=="closed") bySource[it.sourceLabel].open++;
  });
  const rows = Object.entries(bySource);
  const maxTotal = Math.max(...rows.map(r=>r[1].total), 1);
  const CHART_H = 150;
  const chart = el(`<div class="card"><h3 style="margin-top:0;font-size:15px;">จำนวนงานแก้ไข แยกตามที่มา</h3>
    <div style="display:flex;align-items:flex-end;gap:24px;height:${CHART_H}px;padding:24px 4px 0;overflow-x:auto;" id="capaBarChart"></div>
  </div>`);
  const chartWrap = chart.querySelector('#capaBarChart');
  rows.forEach(([label,g])=>{
    const barH = Math.max((g.total/maxTotal)*CHART_H, 6);
    chartWrap.appendChild(el(`<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;align-self:flex-end;">
      <div style="font-size:12px;font-weight:600;margin-bottom:4px;">${g.total}</div>
      <div style="width:50px;background:var(--accent);border-radius:3px 3px 0 0;height:${barH}px;"></div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:8px;text-align:center;max-width:90px;line-height:1.3;">${label}</div>
    </div>`));
  });
  wrap.appendChild(chart);
  return wrap;
}

function computeTotalLaborHoursAllPermits(){
  const permits = state.permits;
  const mitrLaoPermits = permits.filter(p=>((p.contractor && p.contractor.company)||"").trim()==="มิตรลาว");
  const contractorPermits = permits.filter(p=>((p.contractor && p.contractor.company)||"").trim()!=="มิตรลาว");
  const autoMitrLaoHours = mitrLaoPermits.reduce((sum,p)=>sum+permitLaborHours(p), 0);
  const autoContractorHours = contractorPermits.reduce((sum,p)=>sum+permitLaborHours(p), 0);
  const hoursOverride = state.settings.hoursOverride || { mitrLao:null, contractor:null };
  const mitrLaoHours = (typeof hoursOverride.mitrLao === "number") ? hoursOverride.mitrLao : autoMitrLaoHours;
  const contractorHours = (typeof hoursOverride.contractor === "number") ? hoursOverride.contractor : autoContractorHours;
  return mitrLaoHours + contractorHours;
}

/* ==================== Executive Dashboard + ศูนย์แจ้งเตือนรวม ==================== */
const _exec = { y:null, m:null };            // m: 0 = ทั้งปี, 1-12 = รายเดือน
const _alertFilter = { sev:"all", cat:"all" };
function execToday(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function execP(){ if(_exec.y==null){ const d=new Date(); _exec.y=d.getFullYear(); _exec.m=d.getMonth()+1; } return _exec; }
function execInPeriod(dateStr){ if(!dateStr) return false; const P=execP(); const y=+String(dateStr).slice(0,4), m=+String(dateStr).slice(5,7); return y===P.y && (P.m===0 || m===P.m); }
function execDayDiff(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function execEsc(v){ return String(v==null?'':v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function execFireShort(typeId){ const t = FIRE_EQUIPMENT_TYPES.find(x=>x.id===typeId); return t ? t.label.replace(/\s*\(.*\)/,'').replace('ตู้สายฉีดน้ำดับเพลิง','ตู้สายฉีดน้ำ') : typeId; }
const ALERT_CATS = ["แผนงานประจำปี","AI Risk Scanner","ใบอนุญาต","ผู้รับเหมา","CAPA / งานแก้ไข","อุปกรณ์ดับเพลิง","อุบัติเหตุ / Near Miss","เอกสาร"];
const ALERT_SEV = {
  critical:{ label:"วิกฤต", icon:"🔴", color:"var(--danger)", bg:"var(--danger-bg)", rank:0 },
  warning: { label:"เตือน",  icon:"🟠", color:"var(--accent-ink)", bg:"var(--accent-bg)", rank:1 },
  info:    { label:"ติดตาม", icon:"🔵", color:"var(--ink-muted)", bg:"var(--wait-bg)", rank:2 }
};

/* รวมเรื่องที่ จป. ต้องตามจากทุกโมดูล — คำนวณสดทุกครั้งจากข้อมูลในระบบ */
function computeAlerts(){
  const out = [];
  const today = execToday(), now = Date.now();
  const add = (sev, cat, title, detail, days, go)=>out.push({ sev, cat, title, detail, days:days||0, go });
  const hoursFmt = h => h>=48 ? `${Math.floor(h/24)} วัน` : `${Math.floor(h)} ชม.`;

  // 1) ใบอนุญาตทำงานที่ค้างพิจารณา
  state.permits.filter(p=>p.status!=="approved" && p.status!=="rejected").forEach(p=>{
    const last = (p.approvals&&p.approvals.length&&p.approvals[p.approvals.length-1].at) || p.createdAt;
    const h = (now - new Date(last).getTime())/3600000;
    const due = p.startDate && p.startDate<=today;
    if(h<8 && !due) return;
    const sev = (h>=24 || due) ? "critical" : "warning";
    add(sev, "ใบอนุญาต", `${p.code} รอ "${STAGE_LABEL[p.status]||p.status}" นาน ${hoursFmt(h)}${due?' — ถึงวันทำงานแล้วแต่ยังไม่อนุมัติ':''}`,
      `${(p.contractor&&p.contractor.company)||'-'} · ${p.department||'-'} · ${(p.workDescription||'').slice(0,50)}`, h, ()=>setState({appModule:"permit", route:"all", detailId:p.id}));
  });
  // 2) คำร้องขอเข้าพื้นที่ที่ค้าง
  state.accessRequests.filter(r=>r.status==="pending").forEach(r=>{
    const h = (now - new Date(r.createdAt).getTime())/3600000; if(h<24) return;
    add(h>=72?"critical":"warning", "ผู้รับเหมา", `คำร้องขอเข้าพื้นที่ ${r.code} รอ จป. พิจารณา ${hoursFmt(h)}`, `${r.company} · ${(r.team||[]).length} คน`, h, ()=>setState({appModule:"contractor", route:"ar_list", arDetailId:r.id}));
  });
  // 3) ผู้รับเหมาที่อยู่ในพื้นที่วันนี้: อบรม/ประกันหมดอายุ, Blacklist
  const activeAr = state.accessRequests.filter(r=>r.status==="approved" && r.startDate<=today && (r.endDate||r.startDate)>=today);
  const byCompany = {};
  activeAr.forEach(r=>{
    const prof = state.contractors.find(c=>c.company===r.company);
    const g = byCompany[r.company] = byCompany[r.company] || { noTrain:[], insExp:[] };
    (r.team||[]).forEach(t=>{
      const cands = prof ? (prof.workers||[]).filter(w=>w.name===t.name) : [];
      const w = cands.sort((a,b)=>(b.trainedDate||'').localeCompare(a.trainedDate||''))[0];
      const exp = w ? trainExpiryOf(w.trainedDate) : "";
      if(!w || !exp || exp<today) g.noTrain.push(t.name);
      if(w && insuranceStatusOf(w.insuranceStart,w.insuranceEnd).key==="expired") g.insExp.push(t.name);
    });
  });
  Object.keys(byCompany).forEach(co=>{
    const g = byCompany[co], goC = ()=>setState({appModule:"contractor", route:"contractors"});
    const nm = a=>a.slice(0,4).join(', ')+(a.length>4?` และอีก ${a.length-4} คน`:'');
    if(g.noTrain.length) add("critical","ผู้รับเหมา",`${co} — ${g.noTrain.length} คนอยู่ในพื้นที่ แต่อบรมหมดอายุ/ไม่มีบันทึกอบรม`, nm(g.noTrain), 100, goC);
    if(g.insExp.length) add("critical","ผู้รับเหมา",`${co} — ${g.insExp.length} คนอยู่ในพื้นที่ แต่ประกันอุบัติเหตุหมดอายุ`, nm(g.insExp), 100, goC);
  });
  state.permits.filter(p=>p.status==="approved" && p.startDate<=today && (p.endDate||p.startDate)>=today).forEach(p=>{
    const prof = state.contractors.find(c=>c.company===(p.contractor&&p.contractor.company));
    if(prof && prof.general && prof.general.blacklisted) add("critical","ผู้รับเหมา",`${prof.company} อยู่ใน Blacklist แต่มีใบอนุญาต ${p.code} ทำงานวันนี้`, p.department||'', 200, ()=>setState({appModule:"permit", route:"all", detailId:p.id}));
  });
  // 4) ประกันใกล้หมด (≤30 วัน) รายบริษัท
  state.contractors.forEach(c=>{
    const soon = (c.workers||[]).filter(w=>insuranceStatusOf(w.insuranceStart,w.insuranceEnd).key==="soon").map(w=>w.name);
    if(soon.length) add("warning","ผู้รับเหมา",`${c.company} — ประกันอุบัติเหตุใกล้หมด ${soon.length} คน (≤30 วัน)`, soon.slice(0,4).join(', ')+(soon.length>4?` และอีก ${soon.length-4} คน`:''), 30, ()=>setState({appModule:"contractor", route:"contractors"}));
  });
  // 6) ตรวจอุปกรณ์ดับเพลิงประจำเดือน (แยกแผนก)
  const missing = fireMonthlyMissing(fireLocalMonthKey()), st = fireDeadlineStatus(), byDept = {};
  missing.forEach(m=>{ (byDept[m.dept] = byDept[m.dept]||[]).push(execFireShort(m.typeId)); });
  Object.keys(byDept).forEach(d=>{
    const sev = st.overdue ? "critical" : (st.left<=3 ? "warning" : "info");
    add(sev,"อุปกรณ์ดับเพลิง",`${d} ยังไม่ตรวจอุปกรณ์ประจำเดือน ${byDept[d].length} รายการ${st.overdue?` (เลยกำหนดวันที่ ${FIRE_MONTHLY_DEADLINE_DAY} มา ${-st.left} วัน)`:` (เหลือ ${st.left} วัน)`}`, byDept[d].join(', '), st.overdue?-st.left:0, ()=>setState({appModule:"fire", route:"fire_monthly", fireMonthlyType:null}));
  });
  // 7) อุปกรณ์ดับเพลิงหมดอายุ / ตรวจไม่ผ่าน
  state.fireEquipment.forEach(eq=>{
    const label = `${execFireShort(eq.type)} ${eq.code||''} (${eq.location||'-'})`, goF = ()=>setState({appModule:"fire", route:"fire_equipment"});
    const checks = eq.checks||[], last = checks[checks.length-1];
    if(eq.expiryDate && eq.expiryDate<today) add("critical","อุปกรณ์ดับเพลิง",`${label} หมดอายุแล้ว`, `หมดอายุ ${eq.expiryDate}`, execDayDiff(eq.expiryDate,today), goF);
    else if(eq.expiryDate && execDayDiff(today,eq.expiryDate)<=30) add("warning","อุปกรณ์ดับเพลิง",`${label} ใกล้หมดอายุ`, `หมดอายุ ${eq.expiryDate} (อีก ${execDayDiff(today,eq.expiryDate)} วัน)`, 0, goF);
    if(last && last.result==="fail") add("critical","อุปกรณ์ดับเพลิง",`${label} ตรวจไม่ผ่าน ยังไม่ได้แก้ไข`, (last.note||'').slice(0,80), 0, goF);
  });
  // 8) อุบัติเหตุที่ยังไม่ปิดเคส / Near Miss ค้าง
  state.accidents.filter(a=>a.status!=="closed").forEach(a=>{
    const age = execDayDiff(a.date||today, today), sv = ACCIDENT_SEVERITIES[a.severity]||{};
    if(age<=7 && !sv.lostTime) return;
    add(age>14||sv.lostTime&&age>7?"critical":"warning","อุบัติเหตุ / Near Miss",`${a.code} ยังไม่ปิดเคส ${age} วัน`, `${a.department||'-'} · ${(a.description||'').slice(0,60)}`, age, ()=>setState({appModule:"nearmiss", route:"acc_list"}));
  });
  state.nearMisses.filter(r=>r.status!=="closed").forEach(r=>{
    const age = execDayDiff(r.date||today, today); if(age<=14) return;
    add(age>30?"critical":"warning","อุบัติเหตุ / Near Miss",`Near Miss ${r.code} ค้าง ${age} วัน`, `${r.department||'-'} · ${(r.description||'').slice(0,60)}`, age, ()=>setState({appModule:"nearmiss", route:"nm_list"}));
  });
  // 8.5) AI Risk Scanner: ผลประเมินรออนุมัติ / รอตรวจซ้ำ
  (state.scans||[]).forEach(sc=>{
    const age = execDayDiff((sc.createdAt||'').slice(0,10)||today, today), hi = ["high","very_high"].includes((sc.overall||{}).level);
    if(sc.status==="pending" && (hi || age>=2)) add(hi && (age>=1 || (sc.overall||{}).level==="very_high") ? "critical":"warning","AI Risk Scanner",`ผลประเมิน ${sc.code} (${scanRiskLevel((sc.overall||{}).maxScore||0).label}) รออนุมัติ ${age} วัน`,`${sc.department||'-'} · ${sc.location||''}`, age, ()=>setState({appModule:"scanner", route:"scan_history", scanDetailId:sc.id}));
    const wait = (sc.actions||[]).filter(a=>a.status==="done");
    if(wait.length) add("info","AI Risk Scanner",`${sc.code} มี ${wait.length} มาตรการแก้ไขแล้ว รอตรวจซ้ำ`,`${sc.department||'-'} · ${sc.location||''}`, 0, ()=>setState({appModule:"scanner", route:"scan_history", scanDetailId:sc.id}));
  });
  // 8.7) แผนงานประจำปี: แผนเดือนที่ผ่านมาแต่ยังไม่เรียบร้อย / ถึงกำหนดเดือนนี้
  planItems().forEach(it=>{
    const late = planLateMonths(it), goP = ()=>setState({appModule:"plan", route:"plan_table"});
    if(late.length) add(late.length>=2?"critical":"warning","แผนงานประจำปี",`แผนงานค้าง ${late.length} เดือน (${late.map(i=>PLAN_MONTHS[i]).join(', ')}): ${String(it.content).slice(0,70)}`,`${it.group} · ${it.owner||'ไม่ระบุผู้รับผิดชอบ'} · สถานะ ${it.status||'ไม่ระบุ'}`, late.length, goP);
    else if(it.status!=="เรียบร้อย" && state.plan.year===planNow().y && (it.months||[])[planNow().m]===1) add("info","แผนงานประจำปี",`ถึงกำหนดเดือนนี้: ${String(it.content).slice(0,70)}`,`${it.group} · ${it.owner||'ไม่ระบุผู้รับผิดชอบ'}`, 0, goP);
  });
  // 9) คำขอแก้ไขเอกสาร (DAR) ค้าง
  state.dars.filter(d=>d.status==="pending" && (d.createdAt||d.requestedAt)).forEach(d=>{
    const age = execDayDiff((d.createdAt||d.requestedAt).slice(0,10), today); if(age<=7) return;
    add(age>14?"critical":"warning","เอกสาร",`DAR ${d.code||''} รอพิจารณา ${age} วัน`, (d.title||d.docTitle||d.reason||'').toString().slice(0,70), age, ()=>setState({appModule:"docs", route:"doc_dar"}));
  });
  out.sort((a,b)=> ALERT_SEV[a.sev].rank-ALERT_SEV[b.sev].rank || b.days-a.days);
  return out;
}
function alertBadgeCount(){ try{ return computeAlerts().filter(a=>a.sev!=="info").length; }catch(e){ return 0; } }

function alertSummaryText(list){
  const d = new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
  const lines = [`🔔 สรุปเรื่องที่ต้องตาม — Safety Center (${d})`];
  ["critical","warning"].forEach(sev=>{
    const items = list.filter(a=>a.sev===sev);
    if(!items.length) return;
    lines.push(`\n${ALERT_SEV[sev].icon} ${ALERT_SEV[sev].label} (${items.length})`);
    items.slice(0,25).forEach(a=>lines.push(`• [${a.cat}] ${a.title}${a.detail?' — '+a.detail:''}`));
    if(items.length>25) lines.push(`…และอีก ${items.length-25} เรื่อง`);
  });
  if(lines.length===1) lines.push("ไม่มีเรื่องวิกฤตหรือเตือนในขณะนี้ ✅");
  return lines.join('\n');
}

function renderAlertCenter(){
  const all = computeAlerts();

/* ---- Executive Dashboard ---- */
function execRag(actual, target, lowerIsBetter){
  if(actual==null || target==null) return "gray";
  if(lowerIsBetter){ return actual<=target ? "green" : (actual<=target*1.5 ? "amber" : "red"); }
  return actual>=target ? "green" : (actual>=target*0.7 ? "amber" : "red");
}
const EXEC_RAG = { green:{c:"var(--success)",t:"ตามเป้า"}, amber:{c:"#C98A1F",t:"เฝ้าระวัง"}, red:{c:"var(--danger)",t:"ต่ำกว่าเป้า / เกินเป้า"}, gray:{c:"var(--ink-muted)",t:"ไม่มีข้อมูล"} };
function execCard(label, value, rag, sub, go){
  const r = EXEC_RAG[rag||"gray"];
  return `<div class="card" style="margin:0;border-left:5px solid ${r.c};${go?'cursor:pointer;':''}" ${go?`data-go="${go}"`:''}>
    <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:4px;">${label}</div>
    <div style="font-size:30px;font-weight:600;line-height:1.15;color:${rag?r.c:'var(--ink)'};">${value}</div>
    <div style="font-size:12px;color:var(--ink-muted);margin-top:4px;">${rag?`<b style="color:${r.c};">● ${r.t}</b> · `:''}${sub||''}</div></div>`;
}
function execTrendSvg(year){
  const months = Array.from({length:12},(_,i)=>i+1), key = m=>`${year}-${String(m).padStart(2,'0')}`;
  const acc = months.map(m=>allIncidentRecords().filter(r=>(r.date||'').slice(0,7)===key(m)).length);
  const nm = months.map(m=>state.nearMisses.filter(r=>(r.date||'').slice(0,7)===key(m)).length);
  const max = Math.max(4, ...acc, ...nm), W=760, H=230, L=34, B=28, T=14, pw=(W-L-10)/12, ph=H-B-T;
  const names = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:860px;display:block;font-family:inherit;" role="img" aria-label="แนวโน้มรายเดือน">`;
  for(let g=0; g<=4; g++){ const v=Math.round(max*g/4), y=T+ph-(ph*g/4); s += `<line x1="${L}" y1="${y}" x2="${W-6}" y2="${y}" stroke="#E3E8E6"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#5B6B70">${v}</text>`; }
  months.forEach((m,i)=>{
    const x = L + i*pw + pw*0.12, bw = pw*0.34;
    const h1 = ph*acc[i]/max, h2 = ph*nm[i]/max;
    s += `<rect x="${x}" y="${T+ph-h1}" width="${bw}" height="${h1}" fill="#A73B22"/><rect x="${x+bw+2}" y="${T+ph-h2}" width="${bw}" height="${h2}" fill="#C98A1F"/>`;
    if(acc[i]) s += `<text x="${x+bw/2}" y="${T+ph-h1-3}" text-anchor="middle" font-size="10.5" fill="#A73B22">${acc[i]}</text>`;
    if(nm[i]) s += `<text x="${x+bw+2+bw/2}" y="${T+ph-h2-3}" text-anchor="middle" font-size="10.5" fill="#8a5f10">${nm[i]}</text>`;
    s += `<text x="${L+i*pw+pw/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="#5B6B70">${names[i]}</text>`;
  });
  s += `</svg><div style="font-size:12px;color:var(--ink-muted);"><span style="color:#A73B22;">■</span> อุบัติเหตุ/เหตุการณ์ &nbsp; <span style="color:#C98A1F;">■</span> Near Miss / Unsafe</div>`;
  return s;
}

/* ---- Risk Assessment Engine ---- */
function scanRiskLevel(score){
  if(score>=16) return {key:"very_high", label:"สูงมาก", color:"#fff", bg:"var(--danger)", decision:"หยุดงานทันทีจนกว่าจะมีมาตรการควบคุม — ต้องให้ผู้จัดการและ จป. อนุมัติก่อนทำต่อ", approver:"ผู้จัดการ + จป."};
  if(score>=10) return {key:"high", label:"สูง", color:"var(--danger)", bg:"var(--danger-bg)", decision:"ต้องมีมาตรการควบคุมก่อนเริ่มงาน และ จป. อนุมัติ", approver:"จป."};
  if(score>=5)  return {key:"medium", label:"ปานกลาง", color:"var(--accent-ink)", bg:"var(--accent-bg)", decision:"แก้ไขภายในกำหนด และติดตามผลโดยเจ้าของพื้นที่", approver:"เจ้าของพื้นที่"};
  return {key:"low", label:"ต่ำ", color:"var(--success)", bg:"var(--success-bg)", decision:"เฝ้าระวังตามปกติ", approver:"ผู้ประเมิน"};
}
function scanBadge(score){ const l = scanRiskLevel(score); return `<span class="badge" style="background:${l.bg};color:${l.color};">${score} · ${l.label}</span>`; }
function scanClamp(v, d){ const n = Math.round(Number(v)); return (n>=1 && n<=5) ? n : (d||3); }
// ความเสี่ยงคงเหลือ (ประมาณการ) จากมาตรการที่เลือก: ใช้ผลของมาตรการระดับสูงสุด + เพิ่มอีก 1 ขั้นถ้ามีหลายระดับ
function scanResidual(f, controls){
  const inc = controls.filter(c=>c.include);
  if(!inc.length) return { S:f.severity, L:f.likelihood, score:f.severity*f.likelihood };
  const order = ["elimination","substitution","engineering","administrative","ppe"];
  const best = inc.map(c=>c.level).sort((a,b)=>order.indexOf(a)-order.indexOf(b))[0];
  const eff = SCAN_CONTROL_EFFECT[best] || {L:1,S:0};
  const extra = new Set(inc.map(c=>c.level)).size>1 ? 1 : 0;
  const L = Math.max(1, f.likelihood - eff.L - extra), S = Math.max(1, f.severity - eff.S);
  return { S, L, score:S*L };
}
function scanOverall(findings){
  const max = findings.reduce((m,f)=>Math.max(m, f.severity*f.likelihood), 0);
  const lvl = scanRiskLevel(max);
  const counts = { very_high:0, high:0, medium:0, low:0 };
  findings.forEach(f=>{ counts[scanRiskLevel(f.severity*f.likelihood).key]++; });
  return { maxScore:max, level:lvl.key, label:lvl.label, decision:lvl.decision, approver:lvl.approver, counts };
}
function scanDueFromPriority(p){ const d = new Date(Date.now() + (SCAN_PRIORITY[p]||SCAN_PRIORITY["30d"]).days*86400000); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function scanPriorityFor(score){ return score>=16 ? "immediate" : score>=10 ? "7d" : "30d"; }
function scanId(p){ return p + Date.now() + Math.random().toString(36).slice(2,7); }
function genScanCode(){
  const d = new Date(), ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const n = state.scans.filter(s=>(s.code||'').includes(ymd)).length + 1;
  return `RS-${ymd}-${String(n).padStart(3,'0')}`;
}

/* ---- ตรวจผู้ให้บริการจากหน้าตาของ Key + แก้อัตโนมัติถ้าตั้งผู้ให้บริการไม่ตรงกับ Key ---- */
function aiGuessProvider(key){
  const k = String(key||'').trim();
  if(/^sk-ant-/i.test(k)) return 'anthropic';
  if(/^(AIza|AQ\.)/.test(k)) return 'gemini';
  if(/^sk-/i.test(k)) return 'openai';
  return null;
}
function aiFixProvider(){
  const g = aiGuessProvider(state.aiApiKey);
  if(g && g !== (state.aiProvider||'anthropic')){ state.aiProvider = g; state.aiModel = ''; persistAiSettings(); }
}

/* ---- Gemini: ค้นหารุ่นที่ใช้ได้อัตโนมัติ (ชื่อรุ่นของ Google เปลี่ยนบ่อย) + รองรับรูปแบบ Key หลายแบบ ---- */
let _geminiAuthStyle = 0;   // 0 = header x-goog-api-key, 1 = ?key= , 2 = Authorization: Bearer (จำแบบที่ใช้ได้)
async function geminiFetch(url, apiKey, init){
  const styles = [0,1,2].sort((x,y)=>(x===_geminiAuthStyle?-1:0)-(y===_geminiAuthStyle?-1:0));
  let last = null;
  for(const st of styles){
    const u = st===1 ? url + (url.includes('?')?'&':'?') + 'key=' + encodeURIComponent(apiKey) : url;
    const headers = Object.assign({}, (init&&init.headers)||{});
    if(st===0) headers['x-goog-api-key'] = apiKey; else if(st===2) headers['Authorization'] = 'Bearer ' + apiKey;
    const resp = await fetch(u, Object.assign({}, init, { headers }));
    const data = await resp.json().catch(()=>({}));
    last = { resp, data };
    const msg = String((data.error && data.error.message) || '');
    if(resp.ok){ _geminiAuthStyle = st; return last; }
    if(!([400,401,403].includes(resp.status) && /api key|credential|authenticat|unauthor|permission|invalid|expired/i.test(msg))) return last;
  }
  return last;
}
async function geminiListModels(apiKey){
  const { resp, data } = await geminiFetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', apiKey, {});
  if(!resp.ok) throw new Error((data.error && data.error.message) || `HTTP ${resp.status}`);
  return (data.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>String(m.name).replace(/^models\//,''));
}
function geminiPickFlash(ids){
  let cand = ids.filter(id=>/^gemini-[\d.]+-flash(-\d+)?$/.test(id) || /^gemini-[\d.]+-flash-latest$/.test(id));
  if(!cand.length) cand = ids.filter(id=>/flash/.test(id) && !/(lite|image|tts|live|embedding|thinking|exp|audio)/.test(id));
  const ver = id=>parseFloat((id.match(/gemini-([\d.]+)/)||[])[1]||0);
  cand.sort((a,b)=>(ver(b)-ver(a)) || (a.length-b.length));
  return cand[0] || null;
}
async function geminiGenerate(apiKey, model, body){
  const call = m=>geminiFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, apiKey, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  let { resp, data } = await call(model);
  const msgOf = d=>String((d.error && d.error.message) || '');
  if(!resp.ok && (resp.status===404 || /not found|not supported|deprecated|no longer available/i.test(msgOf(data)))){
    const picked = geminiPickFlash(await geminiListModels(apiKey));
    if(picked && picked!==model){ ({ resp, data } = await call(picked)); if(resp.ok){ state.aiModel = picked; persistAiSettings(); } }
  }
  if(!resp.ok){
    const m = msgOf(data) || `HTTP ${resp.status}`;
    if(resp.status===429) throw new Error('โควตาฟรีของ Gemini เต็มชั่วคราว (ใช้เกินต่อนาทีหรือต่อวัน) — รอสักครู่แล้วลองใหม่');
    if((resp.status===400 || resp.status===401) && /api key|credential|authenticat/i.test(m)) throw new Error('Gemini ไม่ยอมรับ Key นี้ — ตรวจสอบว่าคัดลอกครบ หรือสร้าง Key ใหม่ที่ aistudio.google.com ('+m.slice(0,100)+')');
    if(resp.status===403) throw new Error('Gemini ปฏิเสธคำขอ (403) — Key อาจถูกจำกัดสิทธิ์หรือยังไม่เปิดใช้งาน: '+m.slice(0,160));
    throw new Error(m.slice(0,240));
  }
  return data;
}

async function callAiVision(system, userText, images, pdfs){
  aiFixProvider();
  const provider = state.aiProvider || "anthropic", apiKey = (state.aiApiKey||"").trim();
  const model = (state.aiModel||"").trim() || AI_PROVIDERS[provider].defaultModel;
  if(!apiKey) throw new Error("ยังไม่ได้ตั้งค่า API Key — ไปที่เมนู Safety AI > แชท AI เพื่อใส่ Key ก่อน");
  const b64 = d=>d.split(',')[1], mt = d=>((d.match(/^data:([^;]+);/)||[])[1]||"image/jpeg");
  if(provider==="anthropic"){
    const content = [];
    images.forEach(d=>content.push({type:"image", source:{type:"base64", media_type:mt(d), data:b64(d)}}));
    pdfs.forEach(d=>content.push({type:"document", source:{type:"base64", media_type:"application/pdf", data:b64(d)}}));
    content.push({type:"text", text:userText});
    const resp = await fetch("https://api.anthropic.com/v1/messages", { method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model, max_tokens:4096, system, messages:[{role:"user", content}] }) });
    const data = await resp.json();
    if(!resp.ok) throw new Error((data.error&&data.error.message) || `HTTP ${resp.status}`);
    return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  }
  if(provider==="gemini"){
    const parts = [];
    images.forEach(d=>parts.push({ inline_data:{ mime_type:mt(d), data:b64(d) } }));
    pdfs.forEach(d=>parts.push({ inline_data:{ mime_type:"application/pdf", data:b64(d) } }));
    parts.push({ text:userText });
    const data = await geminiGenerate(apiKey, model, { systemInstruction:{ parts:[{text:system}] }, contents:[{ role:"user", parts }], generationConfig:{ responseMimeType:"application/json", maxOutputTokens:4096 } });
    const txt = ((data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[]).map(x=>x.text||"").join("\n");
    if(!txt.trim()) throw new Error("AI ไม่ส่งผลลัพธ์กลับมา (อาจถูกบล็อกโดยตัวกรองเนื้อหา) ลองเปลี่ยนรูปแล้ววิเคราะห์ใหม่");
    return txt;
  }
  if(pdfs.length) throw new Error("ผู้ให้บริการ OpenAI ยังไม่รองรับไฟล์ PDF ในหน้านี้ — แปลงเป็นรูปภาพก่อน หรือเปลี่ยนไปใช้ Claude");
  const content = [{type:"text", text:userText}, ...images.map(d=>({type:"image_url", image_url:{url:d}}))];
  const resp = await fetch("https://api.openai.com/v1/chat/completions", { method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+apiKey },
    body: JSON.stringify({ model, max_tokens:4096, response_format:{type:"json_object"}, messages:[{role:"system",content:system},{role:"user",content}] }) });
  const data = await resp.json();
  if(!resp.ok) throw new Error((data.error&&data.error.message) || `HTTP ${resp.status}`);
  return (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content) || "";
}
/* ---- เชื่อม Supabase Edge Functions (analyze-safety / notify-safety) ---- */
function scanMode(){ try{ return localStorage.getItem('wp_scan_mode')==='edge' ? 'edge' : 'direct'; }catch(e){ return 'direct'; } }
function scanAppKey(){ try{ return localStorage.getItem('wp_app_key')||''; }catch(e){ return ''; } }
function scanNotifyOn(){ try{ return localStorage.getItem('wp_scan_notify')!=='off'; }catch(e){ return true; } }
function scanLsSet(k, v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
function scanFnHeaders(){ return Object.assign({}, sbHeaders(), {'x-app-key': scanAppKey()}); }
async function callEdge(fn, payload, timeoutMs){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), timeoutMs||120000);
  try{
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, { method:'POST', headers:scanFnHeaders(), body:JSON.stringify(payload), signal:ctl.signal });
    let data = {}; try{ data = await resp.json(); }catch(e){}
    if(!resp.ok){
      let msg = data.message || data.error || `HTTP ${resp.status}`;
      if(resp.status===404) msg = `ไม่พบฟังก์ชัน ${fn} บนเซิร์ฟเวอร์ — ยังไม่ได้ deploy หรือชื่อไม่ตรง`;
      else if(resp.status===401 && /invalid jwt/i.test(String(data.message||''))) msg = `เซิร์ฟเวอร์ปฏิเสธคีย์ของแอป — ต้อง deploy ฟังก์ชันด้วยตัวเลือก --no-verify-jwt (ดู README)`;
      else if(resp.status===401) msg = `รหัสแอป (x-app-key) ไม่ถูกต้อง หรือยังไม่ได้ตั้งค่าที่เซิร์ฟเวอร์`;
      const err = new Error(msg); err.status = resp.status; throw err;
    }
    return data;
  }catch(e){ if(e.name==='AbortError') throw new Error('เซิร์ฟเวอร์ตอบช้าเกินไป ลองใหม่อีกครั้ง'); throw e; }
  finally{ clearTimeout(t); }
}

const SCAN_EVENT_TH = { scan_created:"มีผลประเมินความเสี่ยงใหม่ รอ จป. ตรวจสอบ", scan_decided:"ผลการพิจารณาผลประเมินความเสี่ยง", action_done:"แก้ไขเสร็จ รอตรวจซ้ำ", action_verified:"ตรวจซ้ำผ่าน — ปิดงานแก้ไข", action_failed:"ตรวจซ้ำไม่ผ่าน — เปิดงานกลับมาแก้ไขใหม่" };
const SCAN_EMAIL_RE = /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/;
function scanLink(id){ return location.origin + location.pathname + '?scan=' + encodeURIComponent(id); }
function scanRecipients(scan, action){
  const st = state.settings || {};
  const set = new Set([...(st.jpEmails||[]), ...(st.managerEmails||[]), ...(((st.deptOwnerEmails||{})[scan.department])||[])]);
  if(action && SCAN_EMAIL_RE.test(String(action.assignedTo||'').trim())) set.add(String(action.assignedTo).trim());
  return [...set].filter(e=>SCAN_EMAIL_RE.test(e)).slice(0,20);
}
function scanShareText(scan, type, action){
  const lv = scanRiskLevel((scan.overall||{}).maxScore||0);
  const lines = [`🔔 ${SCAN_EVENT_TH[type] || 'ผลประเมินความเสี่ยง'}`, `เลขที่: ${scan.code}`, `พื้นที่: ${scan.department||'-'} · ${scan.location||''}`, `ระดับความเสี่ยงโดยรวม: ${lv.label} (คะแนน ${(scan.overall||{}).maxScore||0})`];

  lines.push(`เปิดดู: ${scanLink(scan.id)}`);

}
// ส่งอีเมลผ่านระบบอีเมลเดิมของแอป (Google Apps Script) — ไม่ต้องติดตั้งอะไรเพิ่ม
async function scanNotifyViaAppsScript(type, scanId, actionId){
  const scan = state.scans.find(x=>x.id===scanId); if(!scan) return;
  const action = actionId ? (scan.actions||[]).find(a=>a.id===actionId) : null;
  const to = scanRecipients(scan, action); if(!to.length) return;
  const text = scanShareText(scan, type, action), subject = `[Safety Center] ${SCAN_EVENT_TH[type]||'ผลประเมินความเสี่ยง'} — ${scan.code}`;
  for(const addr of to){ await sendEmailNotify(addr, subject, text, scanLink(scan.id)); }
}
// แจ้งเตือนหลังเหตุการณ์ (ไม่รอผล ไม่ทำให้การบันทึกล้มเหลว): มีรหัสแอป = ผ่านเซิร์ฟเวอร์ (อีเมล+LINE), ไม่มี = ใช้ระบบอีเมลเดิม
async function scanNotify(type, scanId, actionId){
  if(!scanNotifyOn()) return;
  try{
    if(scanAppKey()){ await fetch(`${SUPABASE_URL}/functions/v1/notify-safety`, { method:'POST', headers:scanFnHeaders(), body:JSON.stringify({action:'event', type, scanId, actionId}), keepalive:true }); }
    else { await scanNotifyViaAppsScript(type, scanId, actionId); }
  }catch(e){}
}

function scanParseJson(text){

  let t = String(text||"").trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a<0 || b<=a) throw new Error("AI ตอบกลับในรูปแบบที่อ่านไม่ได้ ลองวิเคราะห์ใหม่อีกครั้ง");
  return JSON.parse(t.slice(a, b+1));
}

/* ---- Step 2: Engine — แปลงผล AI เป็นรายการประเมิน + เทียบมาตรการมาตรฐาน ---- */
function scanBuildDraft(ai, meta){
  const arr = v=>Array.isArray(v) ? v : [];
  const str = v=>String(v==null?"":v).trim();
  const levels = CONTROL_LEVELS.map(c=>c.id);
  const findings = [], plan = [];
  arr(ai.hazards).forEach(h=>{
    if(!str(h.hazard)) return;
    const f = { id:scanId('f'), source:"ai", hazard:str(h.hazard), category:SCAN_CATEGORIES.some(c=>c.id===h.category)?h.category:"other",
      evidence:str(h.evidence) + ((Array.isArray(h.rule_notes) && h.rule_notes.length) ? ` [ปรับตามกฎ: ${h.rule_notes.map(str).join('; ')} — AI ให้ ${h.ai_severity}×${h.ai_likelihood}]` : ''), severity:scanClamp(h.severity), likelihood:scanClamp(h.likelihood), existing:arr(h.existing_controls).map(str).filter(Boolean) };
    findings.push(f);
    arr(h.recommended_controls).forEach(c=>{ if(!str(c.measure)) return;
      plan.push({ fid:f.id, measure:str(c.measure), level:levels.includes(c.level)?c.level:"administrative", priority:SCAN_PRIORITY[c.priority]?c.priority:scanPriorityFor(f.severity*f.likelihood), source:"ai", include:true, owner:"", due:"" }); });
  });
  const ppe = ai.ppe || {}, missing = arr(ppe.missing).map(str).filter(Boolean);
  if(missing.length){
    const f = { id:scanId('f'), source:"rule", hazard:`PPE ไม่ครบ/ไม่เหมาะสม: ${missing.join(", ")}`, category:"ppe", evidence:"ตรวจจากการเทียบ PPE ที่จำเป็นกับที่เห็นในภาพ", severity:3, likelihood:4, existing:[] };
    findings.push(f);
    plan.push({ fid:f.id, measure:`จัดหา/สวมใส่ ${missing.join(", ")} ก่อนเริ่มงาน`, level:"ppe", priority:"immediate", source:"rule", include:true, owner:"", due:"" });
  }
  // เติมมาตรการมาตรฐานจาก Control Library ที่ AI ยังไม่ได้แนะนำ (เลือกอัตโนมัติเฉพาะอันตรายระดับสูงขึ้นไป)
  findings.forEach(f=>{
    const score = f.severity*f.likelihood, have = plan.filter(p=>p.fid===f.id).map(p=>p.measure);
    (SCAN_CONTROL_LIBRARY[f.category]||[]).forEach(lc=>{
      if(have.some(m=>m===lc.measure)) return;
      plan.push({ fid:f.id, measure:lc.measure, level:lc.level, priority:scanPriorityFor(score), source:"library", include:score>=10, owner:"", due:"" });
    });
  });
  plan.forEach(p=>{ p.due = scanDueFromPriority(p.priority); });
  const objects = arr(ai.objects).map(o=>({ object:str(o.object), count:Math.max(1, Math.round(Number(o.count))||1), location:str(o.location), condition:str(o.condition) })).filter(o=>o.object);
  const signs = arr(ai.signs).map(s=>({ text:str(s.text), meaning:str(s.meaning), location:str(s.location), issue:str(s.issue) })).filter(s=>s.text||s.meaning);
  const documents = arr(ai.documents).map(d=>({ docType:str(d.doc_type), fields:(d.fields&&typeof d.fields==="object")?Object.keys(d.fields).map(k=>[k,str(d.fields[k])]):[], issues:arr(d.issues).map(str).filter(Boolean) }));
  return { meta, summary:str(ai.scene_summary), workType:str(ai.work_type), confidence:str(ai.confidence)||"medium", limitations:str(ai.limitations),
    findings, plan, ppe:{ required:arr(ppe.required).map(str), observed:arr(ppe.observed).map(str), missing }, objects, signs, documents,
    provider:state.aiProvider||"anthropic", model:(state.aiModel||"").trim()||AI_PROVIDERS[state.aiProvider||"anthropic"].defaultModel, photoDataUrls:[], docDataUrls:[] };
}


/* ---- ซิงค์ผลประเมิน AI Risk Scanner → โมดูล Near Miss / Unsafe (แยกประเภทอัตโนมัติ) ---- */
const SCAN_NM_KW_NEAR = /เกือบ|เฉียด|หวุดหวิด|near[\s-]?miss/i;
const SCAN_NM_KW_ACT  = /ไม่สวม|ไม่ใส่|ไม่ได้สวม|ไม่ได้ใส่|สวมไม่|ไม่คล้อง|ไม่ได้คล้อง|ไม่ใช้|ไม่ได้ใช้|ปีน|ยืนใต้|เดินใต้|อยู่ใต้|ใช้ผิด|ฝ่าฝืน|ละเลย|สูบบุหรี่|โทรศัพท์|วิ่ง|ทำงานโดยไม่|ไม่ปฏิบัติตาม|ยกผิด|ท่าทาง|ไม่ล็อก|ไม่ได้ล็อก|ไม่กั้น|ไม่ตรวจ|ลัดขั้นตอน|ขับรถเร็ว/;
// Near Miss = ข้อความระบุว่าเกือบเกิดเหตุ · Unsafe Act = พฤติกรรม/การกระทำของคน (PPE, ท่าทาง, ฝ่าฝืนขั้นตอน) · Unsafe Condition = สภาพพื้นที่/อุปกรณ์/สิ่งแวดล้อม (ค่าเริ่มต้น)
function scanClassifyNm(f){
  const text = `${f.hazard||''} ${f.evidence||''}`;
  if(SCAN_NM_KW_NEAR.test(text)) return "near_miss";
  if(f.category==="ppe" || f.category==="ergonomics" || SCAN_NM_KW_ACT.test(text)) return "unsafe_act";
  return "unsafe_condition";
}
function scanNmSeverity(f){
  const sc = (f.severity||0)*(f.likelihood||0);
  return sc>=15 ? "high" : sc>=8 ? "medium" : "low";
}
async function scanSyncToNearMiss(scan){
  if(!scan || (scan.nearMissIds && scan.nearMissIds.length)) return null;
  const todayD = new Date(scan.createdAt||Date.now());
  const date = todayD.toISOString().slice(0,10), time = todayD.toTimeString().slice(0,5);
  const counts = { near_miss:0, unsafe_act:0, unsafe_condition:0 };
  const reports = (scan.findings||[]).map(f=>{
    const type = scanClassifyNm(f);
    counts[type]++;
    const lines = [f.hazard];
    if(f.evidence) lines.push(`หลักฐานที่พบ: ${f.evidence}`);
    if(scan.workDescription) lines.push(`งาน/กิจกรรม: ${scan.workDescription}`);
    lines.push(`(สร้างอัตโนมัติจาก AI Risk Scanner ${scan.code} · หมวด ${scanCatLabel(f.category)} · คะแนนความเสี่ยง ${f.severity}×${f.likelihood}=${f.severity*f.likelihood})`);
    const rep_ = {
      id: 'nm'+Date.now()+Math.random().toString(36).slice(2,7),
      code: genNmCode(),
      createdAt: new Date().toISOString(),
      type, department: scan.department||"", area: scan.location||"",
      date, time, description: lines.join("\n"),
      anonymous:false, reporterName: scan.createdBy||"", reporterEmail:"",
      photos: scan.photos||[],
      potentialSeverity: scanNmSeverity(f),
      investigation:null, actions:[], status:"reported",
      source:"scanner", scanId:scan.id, scanCode:scan.code, scanFindingId:f.id
    };
    state.nearMisses.unshift(rep_);   // ใส่ทันที เพื่อให้เลขที่ถัดไปรันต่อเนื่อง ไม่ซ้ำ
    return rep_;
  });
  if(!reports.length) return null;
  // บันทึกครั้งเดียว (ดึงข้อมูลล่าสุดมารวมก่อน กันชนกัน)
  try{
    let latest = state.nearMisses;
    try{ const fresh = await storageAdapter.get("wp:nearmiss", true); if(fresh){ const f = JSON.parse(fresh.value); const ids = new Set(reports.map(r=>r.id)); latest = reports.concat(f.filter(x=>!ids.has(x.id))); } }catch(e){}
    state.nearMisses = latest;
    await storageAdapter.set("wp:nearmiss", JSON.stringify(state.nearMisses), true);
  }catch(e){
    const ids = new Set(reports.map(r=>r.id));
    state.nearMisses = state.nearMisses.filter(x=>!ids.has(x.id));
    return { error:true };
  }
  scan.nearMissIds = reports.map(r=>r.id);
  await saveScans(scan);
  return { counts, total:reports.length };
}

/* ---- Step 3: Supabase (Storage = รูป, Database = kv_store wp:scans) ---- */
async function saveScans(changed, deletedId){
  try{
    if(changed || deletedId){
      let latest = state.scans;
      try{ const fresh = await storageAdapter.get("wp:scans", true); if(fresh) latest = JSON.parse(fresh.value); }catch(e){}
      if(deletedId){ latest = latest.filter(x=>x.id!==deletedId); }
      if(changed){ const idx = latest.findIndex(x=>x.id===changed.id); if(idx>=0) latest[idx]=changed; else latest.unshift(changed); }
      state.scans = latest;
    }
    await storageAdapter.set("wp:scans", JSON.stringify(state.scans), true);
    state.lastSavedAt = new Date().toISOString();
    return true;
  }catch(e){ return false; }
}
async function deleteScan(id){
  if(!(await adminGuard("ลบผลประเมิน AI Risk Scanner — ต้องใช้รหัสผ่านผู้ดูแลระบบ"))) return;
  state.scans = state.scans.filter(s=>s.id!==id);
  await saveScans(null, id);
  setState({ scanDetailId:null });
}
