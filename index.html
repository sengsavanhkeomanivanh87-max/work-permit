<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFETY CENTER — บริษัท น้ำตาลมิตรลาว จำกัด</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C98A1F">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Work Permit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Inter:ital@1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF1EF;
  --surface:#FFFFFF;
  --ink:#16232B;
  --ink-muted:#5B6B70;
  --line:#D6DDDA;
  --accent:#C98A1F;
  --accent-ink:#4A3510;
  --accent-bg:#FBEED4;
  --success:#2E6E49;
  --success-bg:#E1F0E6;
  --danger:#A73B22;
  --danger-bg:#F7E5DE;
  --wait:#5B6B70;
  --wait-bg:#E7EAE9;
  --radius:3px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;line-height:1.55;}
h1,h2,h3,.label-font{font-family:'Oswald',sans-serif;letter-spacing:.01em;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;}

.app{display:flex;min-height:100vh;}
.sidebar{width:230px;flex:0 0 230px;background:var(--ink);color:#EAEDEC;padding:22px 16px;display:flex;flex-direction:column;gap:22px;}
.sidebar .brand{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;line-height:1.25;border-bottom:2px solid var(--accent);padding-bottom:14px;}
.sidebar .brand-row{display:flex;align-items:center;gap:10px;}
.sidebar .brand-logo{width:36px;height:36px;border-radius:8px;background:#fff;padding:3px;object-fit:contain;box-shadow:0 1px 3px rgba(0,0,0,.35);flex:0 0 auto;}
.sidebar .brand small{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:11px;color:#9FAEB2;margin-top:8px;letter-spacing:.02em;line-height:1.4;}
.refresh-btn{width:100%;background:transparent;border:1px solid #3A4B54;color:#C7D0CE;padding:8px 10px;border-radius:var(--radius);font-size:12.5px;font-weight:600;cursor:pointer;margin-bottom:6px;}
.refresh-btn:hover{background:#1E2E37;color:#fff;}
.refresh-btn:disabled{opacity:.6;cursor:wait;}
.refresh-time{font-size:10.5px;color:#7F8F94;text-align:center;margin-bottom:10px;}
.module-switch{display:flex;flex-wrap:wrap;gap:4px;background:#1E2E37;padding:3px;border-radius:var(--radius);}
.module-switch-btn{flex:1 1 46%;background:transparent;border:none;color:#9FAEB2;padding:8px 4px;border-radius:calc(var(--radius) - 1px);font-size:11px;font-weight:600;cursor:pointer;text-align:center;line-height:1.3;}
.module-switch-btn:hover{color:#fff;}
.module-switch-btn.active{background:var(--accent);color:var(--accent-ink);}
.nav-item{display:block;width:100%;text-align:left;background:transparent;border:none;color:#C7D0CE;padding:10px 10px;border-radius:var(--radius);font-size:13.5px;font-weight:500;}
.nav-item:hover{background:#22333D;color:#fff;}
.nav-item.active{background:var(--accent);color:var(--accent-ink);font-weight:600;}
.nav-item .count{float:right;background:rgba(255,255,255,.15);padding:1px 7px;border-radius:20px;font-size:11px;}
.nav-item.active .count{background:rgba(0,0,0,.12);}

.identity-box{margin-top:auto;border-top:1px solid #2A3B45;padding-top:14px;font-size:12px;color:#9FAEB2;}
.identity-box select,.identity-box input{width:100%;margin-top:5px;margin-bottom:8px;background:#1E2E37;border:1px solid #2E4048;color:#EAEDEC;padding:7px 8px;border-radius:var(--radius);font-size:12.5px;}
.identity-box label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7C8D91;}

.main{flex:1;padding:28px 34px;max-width:1120px;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:14px;}
.pagehead h1{font-size:24px;margin:0;font-weight:600;}
.pagehead p{margin:4px 0 0;color:var(--ink-muted);font-size:13px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(22,35,43,.04);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
@media(max-width:720px){.grid2,.grid3,.grid4,.grid5{grid-template-columns:1fr;}.main{padding:18px;}.app{flex-direction:column;}.sidebar{width:100%;flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;}.identity-box{margin-top:0;border-top:none;flex-basis:100%;}
  /* ตารางรายการใบขออนุญาต (ทั้งหมด/รอออนุมัติ) บนมือถือ: เปลี่ยนจากตารางแนวนอนที่ต้องเลื่อนดู เป็นการ์ดทีละใบ พร้อมป้ายสถานะเห็นชัดมุมขวาบนทันที ไม่ต้องเลื่อนซ้ายขวา */
  .permit-table thead{display:none;}
  .permit-table, .permit-table tbody, .permit-table tr, .permit-table td{display:block;width:100%;}
  .permit-table{border-collapse:separate;}
  .permit-table tr{border-bottom:1px solid var(--line);padding:12px 14px 12px 12px;position:relative;}
  .permit-table tr:last-child{border-bottom:none;}
  .permit-table td{border:none;padding:2px 0;padding-right:78px;font-size:13px;}
  .permit-table td::before{content:attr(data-label);display:block;font-size:10.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px;}
  .permit-table td.code-tag{font-size:15px;font-weight:700;padding-top:0;}
  .permit-table td.status-cell{position:absolute;top:12px;right:12px;padding:0;width:auto;}
  .permit-table td.status-cell::before{content:none;}
}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-muted);margin-bottom:5px;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13.5px;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:64px;}
.checkrow{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13.5px;}
.checkrow input{margin-top:3px;}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;}
@media(max-width:720px){.checkgrid{grid-template-columns:1fr;}}

.btn{display:inline-block;padding:10px 18px;border-radius:var(--radius);border:1px solid transparent;font-size:13.5px;font-weight:600;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:#B87D18;}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #E3C1B3;}
.btn-danger:hover{background:#F0D3C6;}
.btn-success{background:var(--success-bg);color:var(--success);border:1px solid #BEDCC7;}
.btn-success:hover{background:#D1E9D9;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:5px 11px;font-size:12px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);border-bottom:2px solid var(--line);padding:8px 10px;font-weight:600;}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:#F7F8F6;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge-wait{background:var(--wait-bg);color:var(--wait);}
.badge-accent{background:var(--accent-bg);color:var(--accent-ink);}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}

.stepper{display:flex;margin:6px 0 22px;}
.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--ink-muted);}
.step .dot{width:26px;height:26px;border-radius:50%;background:var(--wait-bg);color:var(--wait);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-weight:700;font-size:12px;border:2px solid var(--line);}
.step.done .dot{background:var(--success);color:#fff;border-color:var(--success);}
.step.current .dot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.step.rejected .dot{background:var(--danger);color:#fff;border-color:var(--danger);}
.step::after{content:'';position:absolute;top:13px;left:calc(50% + 18px);width:calc(100% - 36px);height:2px;background:var(--line);z-index:-1;}
.step:last-child::after{display:none;}
.step.done::after{background:var(--success);}

.empty{text-align:center;padding:50px 20px;color:var(--ink-muted);}
.empty h3{color:var(--ink);margin-bottom:6px;}

.modal-bg{position:fixed;inset:0;background:rgba(15,25,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
.modal{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;padding:26px 28px;margin-bottom:40px;}
@media print{
  body *{visibility:hidden;}
  .modal-bg,.modal-bg *{visibility:visible;}
  .modal-bg{position:absolute;inset:auto;top:0;left:0;background:#fff;padding:0;display:block;overflow:visible;}
  .modal{max-width:100%;box-shadow:none;margin:0;}
  .no-print,.modal-close{display:none !important;}
}
.modal-close{float:right;background:none;border:none;font-size:20px;color:var(--ink-muted);cursor:pointer;line-height:1;}
.print-only{display:none;}
.export-bar{display:flex;justify-content:flex-end;gap:8px;margin:-10px 0 10px;}
/* พิมพ์/บันทึก PDF ทั้งหน้า (เปิดด้วย body.print-page เฉพาะตอนกดปุ่ม PDF — การพิมพ์ใบอนุญาตใน popup ยังทำงานเหมือนเดิม) */
@media print{
  body.print-page *{visibility:visible;}
  body.print-page .sidebar,body.print-page .modal-bg,body.print-page .toast,body.print-page .export-bar,body.print-page .btn,body.print-page .refresh-btn{display:none !important;}
  body.print-page .app{display:block;min-height:0;}
  body.print-page .main{max-width:none;padding:0;}
  body.print-page .print-only{display:block;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #C98A1F;}
  body.print-page div{max-height:none !important;overflow:visible !important;}
  body.print-page .card,body.print-page tr{break-inside:avoid;}
  body.print-page table{width:100%;}
  body.print-page{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

.approval-log{border-left:2px solid var(--line);padding-left:14px;margin-top:6px;}
.approval-entry{margin-bottom:14px;}
.approval-entry .who{font-weight:600;font-size:13px;}
.approval-entry .meta{font-size:11.5px;color:var(--ink-muted);}
.approval-entry img{max-width:220px;border-radius:var(--radius);margin-top:6px;border:1px solid var(--line);display:block;}
.approval-entry p{margin:5px 0 0;font-size:13px;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--radius);font-size:13px;max-width:340px;z-index:100;box-shadow:0 6px 18px rgba(0,0,0,.2);}
.notice{background:var(--accent-bg);border:1px solid #E9C989;color:var(--accent-ink);padding:10px 14px;border-radius:var(--radius);font-size:12.5px;margin-bottom:16px;}
.hint{font-size:11.5px;color:var(--ink-muted);margin-top:3px;}
.req{color:var(--danger);}
.code-tag{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.02em;}
.jsa-input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;background:#fff;color:var(--ink);}
.jsaRemove{background:none;border:none;color:var(--danger);font-size:17px;cursor:pointer;line-height:1;padding:2px 4px;}
.jsaRemove:hover{background:var(--danger-bg);border-radius:var(--radius);}
#jsaTable td, #jsaTable th{padding:6px 6px;}
#jsaTable .jsaNum{text-align:center;color:var(--ink-muted);font-size:12.5px;}
.jsa-view-table td, .jsa-view-table th{padding:7px 9px;font-size:12.5px;}
.storage-warn{background:var(--danger-bg);color:var(--danger);border-bottom:1px solid #E3C1B3;padding:10px 20px;font-size:12.5px;font-weight:600;}
.dev-credit{position:fixed;top:8px;right:14px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-muted);background:var(--surface);padding:3px 12px 3px 3px;border-radius:20px;border:1px solid var(--line);z-index:50;pointer-events:none;}
.dev-credit img{width:22px;height:22px;border-radius:50%;object-fit:cover;display:block;}
.backup-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;}
.datadict{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
.datadict th,.datadict td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
.datadict th{background:#F7F8F6;}
</style>
</head>

(function setFavicon(){
  const link = document.createElement("link");
  link.rel = "icon";
  link.href = LOGO_DATA_URL;
  document.head.appendChild(link);
})();

const PUBLIC_URL = "https://sengsavanhkeomanivanh87-max.github.io/work-permit/";
function getAppBaseUrl(){
  if(PUBLIC_URL) return PUBLIC_URL.replace(/\/$/, '') + '/';
  return window.location.origin + window.location.pathname;
}

function hasBuiltinStorage(){ return typeof window.storage !== "undefined" && window.storage !== null; }

function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

// ตัวช่วย fetch ที่ลองใหม่อัตโนมัติและไม่รอค้างไม่มีที่สิ้นสุด (เผื่อเน็ตสะดุดชั่วคราว)
async function fetchWithRetry(url, options, retries, timeoutMs){
  retries = retries===undefined ? 2 : retries;
  timeoutMs = timeoutMs===undefined ? 8000 : timeoutMs;
  let lastErr;
  for(let attempt=0; attempt<=retries; attempt++){
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), timeoutMs); // ไม่รอเกินเวลาที่กำหนด/รอบ กันค้างไม่มีที่สิ้นสุด
    try{
      const resp = await fetch(url, {...(options||{}), signal: controller.signal});
      clearTimeout(timeoutId);
      if(!resp.ok) throw new Error("http " + resp.status);
      return resp;
    }catch(e){
      clearTimeout(timeoutId);
      // AbortError ดิบๆ อ่านไม่รู้เรื่อง แปลงเป็นข้อความบอกสาเหตุจริงว่าหมดเวลารอ
      lastErr = (e && e.name==="AbortError") ? new Error(`หมดเวลารอการตอบกลับ (เกิน ${Math.round(timeoutMs/1000)} วินาที)`) : e;
      if(attempt<retries) await sleep(600 * (attempt+1)); // หน่วงเพิ่มขึ้นทีละรอบก่อนลองใหม่
    }
  }
  throw lastErr;
}

function sbHeaders(extra){
  return Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  }, extra||{});
}

const storageAdapter = {
  async get(key, shared){
    if(SUPABASE_URL){
      try{
        const resp = await fetchWithRetry(
          `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`,
          { headers: sbHeaders() }
        );
        const rows = await resp.json();
        if(!rows.length || rows[0].value === null || rows[0].value === undefined) throw new Error("not found");
        return { key, value: rows[0].value, shared };
      }catch(e){
        if(hasBuiltinStorage()) return window.storage.get(key, shared);
        throw e;
      }
    }
    return window.storage.get(key, shared);
  },
  async set(key, value, shared){
    if(SUPABASE_URL){
      try{
        await fetchWithRetry(
          `${SUPABASE_URL}/rest/v1/kv_store?on_conflict=key`,
          {
            method: "POST",
            headers: sbHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
            body: JSON.stringify({ key, value, updated_at: new Date().toISOString() })
          }
        );
        return { ok: true };
      }catch(e){
        if(hasBuiltinStorage()) return window.storage.set(key, value, shared);
        throw e;
      }
    }
    return window.storage.set(key, value, shared);
  }
};

/* ---------------- อัปโหลดรูปภาพขึ้น Supabase Storage ---------------- */
function dataUrlToBlobClient(dataUrl){
  const [meta, b64] = dataUrl.split(",");
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function uploadPhotoToSupabase(dataUrl, filename){
  const blob = dataUrlToBlobClient(dataUrl);
  const path = `permits/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${filename}`;
  await fetchWithRetry(`${SUPABASE_URL}/storage/v1/object/photos/${path}`, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": blob.type || "image/jpeg" },
    body: blob
  });
  return `${SUPABASE_URL}/storage/v1/object/public/photos/${path}`;
}

// อัปโหลดรูปหลายรูปพร้อมกัน (ไปที่ Supabase Storage โดยตรง ไม่ผ่าน Apps Script แล้ว) คืนค่าเป็น array ของลิงก์รูป
async function uploadPhotosAndGetUrls(dataUrls, namePrefix){
  return Promise.all(dataUrls.map((d,i)=>uploadPhotoToSupabase(d, `${namePrefix}_${i}.jpg`)));
}

// อัปโหลดไฟล์เอกสารทั่วไป (PDF/รูป/เอกสารอื่นๆ) ขึ้น Supabase Storage — ใช้ bucket "photos" เดิม (ไม่ได้จำกัดเฉพาะรูปภาพ) แยกใส่โฟลเดอร์ย่อยตามที่ระบุ
async function uploadFileToSupabase(file, folder){
  const safeName = file.name.replace(/[^a-zA-Z0-9ก-๙.\-_]/g,'_');
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName}`;
  await fetchWithRetry(`${SUPABASE_URL}/storage/v1/object/photos/${encodeURI(path)}`, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": file.type || "application/octet-stream" },
    body: file
  });
  return `${SUPABASE_URL}/storage/v1/object/public/photos/${encodeURI(path)}`;
}

// รวมรายการอันตรายที่แนะนำจากทุกประเภทงานเสมอ (ไม่กรองตามประเภทงานที่ติ๊กเลือกไว้ เพื่อให้เลือกได้ครบทุกทางเลือกตลอดเวลา)
function jsaHazardOptionsForTypes(typeIds){
  const ids = Object.keys(JSA_ROW_LIBRARY);
  const opts = []; const seen = new Set();
  ids.forEach(id=>{ (JSA_ROW_LIBRARY[id]||[]).forEach(entry=>{
    if(!seen.has(entry.hazard)){ seen.add(entry.hazard); opts.push(entry); }
  }); });
  return opts;
}

function jsaRiskScoreLevel(score){
  if(score>=16) return {label:"สูงมาก", color:"#fff", bg:"var(--danger)"};
  if(score>=10) return {label:"สูง", color:"var(--danger)", bg:"var(--danger-bg)"};
  if(score>=5)  return {label:"ปานกลาง", color:"var(--accent-ink)", bg:"var(--accent-bg)"};
  return {label:"ต่ำ", color:"var(--success)", bg:"var(--success-bg)"};
}

// รวมรายการควบคุมความเสี่ยงจากทุกประเภทงานที่เลือก (ไม่ซ้ำ) แล้วคำนวณระดับความเสี่ยงที่เหลือจากสัดส่วนที่ติ๊กแล้ว
function computeRiskAssessment(typeIds, checkedKeys){
  const relevantTypes = (typeIds && typeIds.length) ? typeIds : ["general"];
  const items = [];
  const seen = new Set();
  let baseRisk = 1;
  relevantTypes.forEach(id=>{
    const def = JSA_CHECKLIST_BY_TYPE[id];
    if(!def) return;
    baseRisk = Math.max(baseRisk, def.risk);
    def.items.forEach(text=>{
      const key = id + "::" + text;
      if(!seen.has(key)){ seen.add(key); items.push({key, text, typeId:id}); }
    });
  });
  const checkedSet = new Set(checkedKeys||[]);
  const total = items.length;
  const checkedCount = items.filter(it=>checkedSet.has(it.key)).length;
  const ratio = total ? checkedCount/total : 0;
  // ติ๊กครบมาตรการควบคุมช่วยลดความเสี่ยงที่เหลือได้มาก แต่ไม่มีทางเป็นศูนย์ (งานยังมีความเสี่ยงโดยธรรมชาติอยู่)
  const residual = baseRisk * (1 - ratio*0.65);
  let level = "low";
  if(residual >= 3.2) level = "high";
  else if(residual >= 1.6) level = "medium";
  const missing = items.filter(it=>!checkedSet.has(it.key));
  return { items, total, checkedCount, ratio, level, missing, baseRisk };
}

function inspectionOverallStatus(insp){
  const findings = insp.findings||[];
  if(findings.length===0) return {label:"ไม่พบข้อบกพร่อง", cls:"badge-success"};
  const openCount = findings.filter(f=>f.status!=="closed").length;
  if(openCount>0) return {label:`พบข้อบกพร่อง ${openCount} รายการ (ค้างแก้ไข)`, cls:"badge-danger"};
  return {label:"พบข้อบกพร่อง — แก้ไขครบแล้ว", cls:"badge-accent"};
}

function equipmentTypeLabel(id){ return (FIRE_EQUIPMENT_TYPES.find(t=>t.id===id)||{}).label || id; }
function equipmentStatus(eq){
  const today = new Date().toISOString().slice(0,10);
  if(eq.expiryDate && eq.expiryDate < today) return {label:"หมดอายุ", cls:"badge-danger"};
  const checks = eq.checks || [];
  if(checks.length===0) return {label:"ยังไม่เคยตรวจ", cls:"badge-wait"};
  const latest = checks[checks.length-1];
  if(latest.result==="fail") return {label:"ต้องแก้ไข", cls:"badge-danger"};
  return {label:"ปกติ", cls:"badge-success"};
}

// รวมรายการงานแก้ไข/ป้องกันจากทุกโมดูล (ตรวจความปลอดภัย, Near Miss, Fire, และ CAPA เดี่ยว) มาไว้ในลิสต์เดียว
function allCorrectiveItems(){
  const items = [];
  state.inspections.forEach(insp=>{
    (insp.findings||[]).forEach(f=>{
      items.push({
        source:"inspection", sourceLabel:"ตรวจความปลอดภัย", sourceCode:insp.code, sourceId:insp.id,
        description:f.itemText, department:insp.department,
        assignedTo:f.assignedTo, dueDate:f.dueDate, status:f.status, createdAt:f.createdAt
      });
    });
  });
  state.nearMisses.forEach(nm=>{
    (nm.actions||[]).forEach(a=>{
      items.push({
        source:"nearmiss", sourceLabel:"Near Miss / Unsafe", sourceCode:nm.code, sourceId:nm.id,
        description:a.description, department:nm.department,
        assignedTo:a.assignedTo, dueDate:a.dueDate, status:a.status, createdAt:a.createdAt
      });
    });
  });
  state.accidents.forEach(acc=>{
    (acc.actions||[]).forEach(a=>{
      items.push({
        source:"accident", sourceLabel:"อุบัติเหตุ", sourceCode:acc.code, sourceId:acc.id,
        description:a.description, department:acc.department,
        assignedTo:a.assignedTo, dueDate:a.dueDate, status:a.status, createdAt:a.createdAt
      });
    });
  });
  state.fireIncidents.forEach(inc=>{
    items.push({
      source:"fire", sourceLabel:"Fire & Emergency", sourceCode:inc.code, sourceId:inc.id,
      description:inc.description.slice(0,80)+(inc.description.length>80?'…':''), department:inc.area,
      assignedTo:"", dueDate:"", status:inc.status==="closed"?"closed":"open", createdAt:inc.createdAt
    });
  });
  (state.scans||[]).forEach(sc=>{
    (sc.actions||[]).forEach(a=>{
      items.push({
        source:"scanner", sourceLabel:"AI Risk Scanner", sourceCode:sc.code, sourceId:sc.id,
        description:a.description, department:sc.department,
        assignedTo:a.assignedTo, dueDate:a.dueDate, status:a.status==="verified"?"closed":"open", createdAt:a.createdAt||sc.createdAt
      });
    });
  });
  state.capas.forEach(c=>{
    items.push({
      source:"capa", sourceLabel:"CAPA อื่นๆ", sourceCode:c.code, sourceId:c.id,
      description:c.description, department:c.department,
      assignedTo:c.assignedTo, dueDate:c.dueDate, status:c.status==="closed"?"closed":"open", createdAt:c.createdAt
    });
  });
  items.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return items;
}

/* ================= ด่านรหัสผ่านผู้ดูแลระบบ: การลบข้อมูลทุกชนิดต้องกรอกรหัสผ่าน admin ทุกครั้ง (ทุกบทบาท รวมถึง จป.) =================
   ข้อจำกัด: ระบบนี้ตรวจรหัสผ่านฝั่งเบราว์เซอร์ จึงกันการกดลบผ่านหน้าเว็บได้ แต่ไม่ใช่ความปลอดภัยระดับเซิร์ฟเวอร์ —
   ถ้าต้องกันการยิง API ฐานข้อมูลตรงๆ ต้องตั้ง Row Level Security / Edge Function ที่ Supabase เพิ่มเติม */
let _adminAuthUntil = 0, _adminFails = 0, _adminLockUntil = 0;
function requireAdmin(message){
  return new Promise(resolve=>{
    if(Date.now()<_adminLockUntil){ showToast(`กรอกรหัสผิดหลายครั้ง กรุณารออีก ${Math.ceil((_adminLockUntil-Date.now())/1000)} วินาที`); resolve(false); return; }
    const esc = v => String(v==null?'':v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const bg = document.createElement('div');
    bg.style.cssText = 'position:fixed;inset:0;background:rgba(15,25,30,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;';
    bg.innerHTML = `<div style="background:#fff;border-radius:var(--radius);max-width:420px;width:100%;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.3);">
      <h3 style="margin:0 0 6px;font-size:16px;">🔒 ต้องใช้รหัสผ่านผู้ดูแลระบบ</h3>
      <p style="margin:0 0 12px;font-size:13px;white-space:pre-line;color:var(--ink);">${esc(message||'การลบข้อมูลต้องได้รับอนุญาตจากผู้ดูแลระบบ')}</p>
      <input type="password" id="adminPwInput" placeholder="รหัสผ่านผู้ดูแลระบบ (admin)" autocomplete="off" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;">
      <div id="adminPwErr" style="color:var(--danger);font-size:12px;min-height:16px;margin-top:6px;"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
        <button type="button" class="btn btn-outline" id="adminPwCancel">ยกเลิก</button>
        <button type="button" class="btn btn-danger" id="adminPwOk">ยืนยัน</button>
      </div></div>`;
    document.body.appendChild(bg);
    const inp = bg.querySelector('#adminPwInput'), err = bg.querySelector('#adminPwErr');
    const done = ok=>{ bg.remove(); resolve(ok); };
    const submit = ()=>{
      const adm = USER_ACCOUNTS.find(a=>a.role==="admin");
      if(adm && inp.value===adm.password){ _adminFails = 0; _adminAuthUntil = Date.now()+15000; done(true); return; }
      _adminFails++;
      if(_adminFails>=5){ _adminLockUntil = Date.now()+60000; _adminFails = 0; showToast("กรอกรหัสผิด 5 ครั้ง ล็อกการลบชั่วคราว 1 นาที"); done(false); return; }
      err.textContent = `รหัสผ่านไม่ถูกต้อง (ผิด ${_adminFails}/5 ครั้ง)`; inp.value = ''; inp.focus();
    };
    bg.querySelector('#adminPwOk').onclick = submit;
    bg.querySelector('#adminPwCancel').onclick = ()=>done(false);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); else if(e.key==='Escape') done(false); });
    setTimeout(()=>inp.focus(), 30);
  });
}

function restoreAuthSession(){
  try{
    const raw = localStorage.getItem("safetyAuthUser") || sessionStorage.getItem("safetyAuthUser");
    if(raw){
      const u = JSON.parse(raw);
      if(USER_ACCOUNTS.some(a=>a.username===u.username)){
        state.isAuthenticated = true;
        state.authUser = u;
        state.role = u.role;
      }
    }
  }catch(e){ /* storage ใช้ไม่ได้ก็ข้ามไป ถือว่ายังไม่ได้ล็อกอิน */ }
}
function persistAuthSession(remember){
  try{
    if(state.authUser){
      const payload = JSON.stringify(state.authUser);
      if(remember){ localStorage.setItem("safetyAuthUser", payload); sessionStorage.removeItem("safetyAuthUser"); }
      else{ sessionStorage.setItem("safetyAuthUser", payload); localStorage.removeItem("safetyAuthUser"); }
    } else {
      localStorage.removeItem("safetyAuthUser");
      sessionStorage.removeItem("safetyAuthUser");
    }
  }catch(e){ /* บันทึกไม่ได้ก็ปล่อยผ่าน — จะต้องล็อกอินใหม่เมื่อรีเฟรชหน้า */ }
}
function attemptLogin(username, password, remember){
  const acc = USER_ACCOUNTS.find(a=>a.username===username && a.password===password);
  if(!acc) return false;
  state.isAuthenticated = true;
  state.authUser = { username:acc.username, name:acc.name, role:acc.role };
  state.role = acc.role;
  persistAuthSession(!!remember);
  return true;
}
function logoutUser(){
  state.isAuthenticated = false;
  state.authUser = null;
  persistAuthSession(false);
  setState({ appModule:"permit", route:"new", showLoginModal:false, pendingModule:null });
}

async function savePermits(changedPermit, deletedId){
  try{
    if(changedPermit || deletedId){
      // ป้องกันข้อมูลชนกัน (race condition): ก่อนบันทึกทุกครั้ง ดึงข้อมูลล่าสุดจากฐานข้อมูลมาก่อนเสมอ
      // แล้ว "แทรก/อัปเดต/ลบเฉพาะใบที่เปลี่ยนแปลงจริงๆ" ลงในชุดข้อมูลล่าสุดนั้น แทนที่จะเขียนทับด้วยสำเนาที่ค้างอยู่ในเครื่องตัวเอง
      // (เดิมเขียนทับทั้งก้อนด้วย state.permits ที่โหลดไว้ตอนเปิดหน้า — ถ้ามีคนอื่นบันทึกข้อมูลแทรกเข้ามาระหว่างนั้น
      //  พอเรากดบันทึกทีหลังก็จะเขียนทับข้อมูลของเขาหายไปเลย นี่คือสาเหตุที่ใบขออนุญาตบางใบ "หาย/ไม่พบ" ทั้งที่ไม่มีใครลบ)
      let latest = state.permits;
      try{
        const fresh = await storageAdapter.get("wp:permits", true);
        if(fresh) latest = JSON.parse(fresh.value);
      }catch(e){ /* ดึงล่าสุดไม่ได้ ใช้ข้อมูลในเครื่องแทนไปก่อน ยังดีกว่าไม่ลองเลย */ }

      if(deletedId){
        latest = latest.filter(p=>p.id!==deletedId);
      }
      if(changedPermit){
        const idx = latest.findIndex(p=>p.id===changedPermit.id);
        if(idx>=0) latest[idx] = changedPermit; else latest.unshift(changedPermit);
      }
      state.permits = latest;
    }
    // ไม่ส่ง changedPermit/deletedId มาเลย (เช่น ตอนนำเข้าไฟล์สำรอง) = ตั้งใจเขียนทับทั้งก้อนจริงๆ ใช้ state.permits ตรงๆ
    await storageAdapter.set("wp:permits", JSON.stringify(state.permits), true);
    state.lastSavedAt = new Date().toISOString();
  }
  catch(e){ showToast("บันทึกข้อมูลไม่สำเร็จ ลองอีกครั้ง"); }
}

async function sendEmailNotify(to, subject, body, link){
  if(!to) return { status:"missing_email" };
  try{
    const resp = await fetchWithRetry(API_BASE, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"notify", to, subject, body, link })
    }, 2, 20000);
    const data = await resp.json();
    return { status: data.ok ? "sent" : "failed", error: data.error || null };
  }catch(e){ return { status:"failed", error:String(e) }; }
}

function showToast(msg){ setState({toast: msg}); setTimeout(()=>{ if(state.toast===msg) setState({toast:null}); }, 4200); }

/* ---------------- settings helpers ---------------- */
function toEmailArray(v){
  if(Array.isArray(v)) return v.map(x=>String(x).trim()).filter(Boolean);
  if(typeof v==="string") return v.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
  return [];
}
function migrateSettings(raw){
  const out = defaultSettings();
  const deptSrc = raw.deptOwnerEmails || raw.deptOwnerEmail || {};
  DEPARTMENTS.forEach(d=>{ out.deptOwnerEmails[d] = toEmailArray(deptSrc[d]); });
  out.jpEmails = toEmailArray(raw.jpEmails || raw.jpEmail);
  out.managerEmails = toEmailArray(raw.managerEmails || raw.managerEmail);
  out.fireMonthlyExempt = (raw.fireMonthlyExempt && typeof raw.fireMonthlyExempt==="object") ? raw.fireMonthlyExempt : {};
  out.customContractorCompanies = Array.isArray(raw.customContractorCompanies) ? raw.customContractorCompanies.filter(c=>typeof c==="string" && c.trim()) : [];
  const companyMapSrc = raw.companyDeptMap || {};
  CONTRACTOR_COMPANIES.concat(out.customContractorCompanies).forEach(c=>{
    const d = companyMapSrc[c];
    out.companyDeptMap[c] = (d && DEPARTMENTS.includes(d)) ? d : "";
  });
  const hoursSrc = raw.hoursOverride || {};
  out.hoursOverride = {
    mitrLao: (typeof hoursSrc.mitrLao === "number") ? hoursSrc.mitrLao : null,
    contractor: (typeof hoursSrc.contractor === "number") ? hoursSrc.contractor : null
  };
  return out;
}
// รวมรายชื่อบริษัทผู้รับเหมาแบบคงที่ (CONTRACTOR_COMPANIES) กับที่เพิ่มเองภายหลัง (เก็บใน settings) ไม่ซ้ำกัน
function allContractorCompanies(){
  const extra = (state.settings.customContractorCompanies||[]).filter(c=>!CONTRACTOR_COMPANIES.includes(c));
  const hidden = new Set(state.settings.hiddenContractorCompanies||[]);
  return CONTRACTOR_COMPANIES.concat(extra).filter(c=>!hidden.has(c));
}

/* ---------------- notifications (real email via Gmail MCP, falls back to logged simulation) ---------------- */
// สร้างหัวข้อ/เนื้อหาอีเมลของขั้นตอนหนึ่งๆ (แยกออกมาเพื่อใช้ซ้ำได้ทั้งตอนส่งครั้งแรกและตอนกด "ส่งอีเมลใหม่")
function buildStageEmail(permit, stageKey){
  const photoLinks = getRelevantPhotosForStage(permit, stageKey);
  const subject = `[Work Permit ${permit.code}] รออนุมัติจากท่าน - แผนก ${permit.department}`;
  const body = `เรียน ผู้อนุมัติ (${STAGE_LABEL[stageKey]})\n\n`+
    `มีใบขออนุญาตทำงานฉบับใหม่รอการอนุมัติจากท่าน\n\n`+
    `เลขที่ใบขออนุญาต: ${permit.code}\n`+
    `ผู้รับเหมา: ${permit.contractor.company} (${permit.contractor.contactName}, โทร ${permit.contractor.phone})\n`+
    `แผนก/พื้นที่: ${permit.department}\n`+
    `สถานที่ปฏิบัติงาน: ${permit.location}\n`+
    `ลักษณะงาน: ${permit.workDescription}\n`+
    `ประเภทงาน: ${permit.permitTypes.map(t=>PERMIT_TYPES.find(p=>p.id===t)?.label||t).join(", ")}\n`+
    `วันที่ปฏิบัติงาน: ${permit.startDate} ${permit.startTime} ถึง ${permit.endDate} ${permit.endTime}\n`+
    `จำนวนขั้นตอนใน JSA: ${(permit.jsa||[]).length} ขั้นตอน\n`+
    (photoLinks.length ? `\nรูปถ่ายหน้างาน:\n${photoLinks.join("\n")}\n` : '') +
    `\nกรุณาเข้าสู่ระบบ Work Permit เพื่อพิจารณาอนุมัติ`;
  return {subject, body};
}

// ส่งอีเมลแจ้งเตือน "1 ฉบับ" ให้ผู้รับ 1 คน คืนค่าเป็น record เดียว (ไม่ push เข้า permit.notifications เอง)
// แยกออกมาจาก notifyStage เพื่อให้ปุ่ม "ส่งอีเมลใหม่" เรียกซ้ำได้โดยไม่ต้องส่งซ้ำให้ทุกคน
async function sendStageNotificationOne(permit, stageKey, recipient){
  const {subject, body} = buildStageEmail(permit, stageKey);
  // ใส่อีเมลผู้รับไว้ในลิงก์ด้วย (&email=) เพื่อให้เปิดลิงก์แล้วระบบกรอก "อีเมลของฉัน" ให้อัตโนมัติ
  // แก้ปัญหาที่ผู้รับกดลิงก์แล้วเจอ "ไม่มีสิทธิ์อนุมัติ" เพราะลืมพิมพ์อีเมลตัวเอง/พิมพ์ผิด
  const link = getAppBaseUrl() + `?permit=${encodeURIComponent(permit.id)}&role=${encodeURIComponent(stageKey)}&email=${encodeURIComponent(recipient)}`;
  if(API_BASE){
    // โฮสต์เอง: ส่งอีเมลจริงผ่าน Google Apps Script (MailApp) โดยตรง ไม่ต้องพึ่ง Claude
    try{
      const resp = await fetchWithRetry(API_BASE, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // หลีกเลี่ยง CORS preflight เช่นเดียวกับ storageAdapter.set
        body: JSON.stringify({ action: "notify", to: recipient, subject, body, link })
      }, 2, 20000);
      const data = await resp.json();
      // Apps Script รุ่นใหม่ตอบกลับทันทีว่า "เข้าคิวแล้ว" (queued:true) แล้วค่อยส่งอีเมลจริงเบื้องหลังภายใน ~1 นาที
      // เพื่อไม่ให้ฝั่งเว็บต้องรอ MailApp.sendEmail() เสร็จจนบางครั้งช้าเกินไปจน timeout เหมือนเดิม
      const status = data.queued ? "queued" : (data.ok ? "sent" : "failed");
      return {stage:stageKey, to:recipient, sentAt:new Date().toISOString(), status, error: data.error || null};
    }catch(e){
      // Apps Script บางครั้งไม่ตอบกลับภายในเวลาที่กำหนด (เครือข่าย/สคริปต์ช้า) — ไม่ใช่ว่าอีเมลผิด
      // ผู้ใช้กดปุ่ม "ส่งอีเมลใหม่" ที่ประวัติการแจ้งเตือนได้โดยไม่ต้องรอระบบ auto-retry
      return {stage:stageKey, to:recipient, sentAt:new Date().toISOString(), status:"failed", error: String(e)};
    }
  }
  // ใช้งานอยู่ในอาร์ติแฟกต์ของ Claude: ลองส่งผ่าน Gmail ที่เชื่อมต่อไว้
  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user", content:`ส่งอีเมลถึง ${recipient} หัวข้อ "${subject}" เนื้อหาดังนี้:\n\n${body}\n\nกรุณาใช้เครื่องมือส่งอีเมลของ Gmail ที่มีอยู่เพื่อส่งอีเมลนี้จริง ๆ ตอบกลับสั้น ๆ ว่าส่งสำเร็จหรือไม่`}],
        mcp_servers:[{type:"url", url:"https://gmailmcp.googleapis.com/mcp/v1", name:"gmail-mcp"}]
      })
    });
    const data = await resp.json();
    const usedTool = (data.content||[]).some(b=>b.type==="mcp_tool_use");
    return {stage:stageKey, to:recipient, sentAt:new Date().toISOString(), status: usedTool ? "sent" : "simulated"};
  }catch(e){
    return {stage:stageKey, to:recipient, sentAt:new Date().toISOString(), status:"simulated"};
  }
}

async function notifyStage(permit, stageKey){
  const recipients = recipientsForStage(permit, stageKey);
  if(recipients.length===0){
    permit.notifications.push({stage:stageKey, to:"(ไม่ได้ตั้งค่าอีเมล)", sentAt:new Date().toISOString(), status:"missing_email"});
    return;
  }
  for(const recipient of recipients){
    const record = await sendStageNotificationOne(permit, stageKey, recipient);
    permit.notifications.push(record);
  }
}

// กดส่งอีเมลใหม่จากประวัติการแจ้งเตือน (ใช้กับรายการที่สถานะ "failed" เท่านั้น) — ไม่ต้องรอ auto-retry หรือแก้ Apps Script ก่อน
let resendBusyIdx = null;
async function resendNotification(permit, notifIndex){
  const n = permit.notifications[notifIndex];
  if(!n || n.status!=="failed" || resendBusyIdx!==null) return;
  resendBusyIdx = notifIndex;
  render();
  showToast(`กำลังส่งอีเมลใหม่ถึง ${n.to} ...`);
  const record = await sendStageNotificationOne(permit, n.stage, n.to);
  permit.notifications.push(record);
  await savePermits(permit);
  resendBusyIdx = null;
  showToast(record.status==="sent" ? `ส่งอีเมลถึง ${n.to} สำเร็จแล้ว ✓` : `ส่งอีเมลถึง ${n.to} ไม่สำเร็จอีกครั้ง — ${record.error||''}`);
  render();
}

function recipientsForStage(permit, stageKey){
  if(stageKey==="area_owner") return state.settings.deptOwnerEmails[permit.department] || [];
  if(stageKey==="jp") return state.settings.jpEmails || [];
  if(stageKey==="manager") return state.settings.managerEmails || [];
  return [];
}

function sitePhotosOf(permit){
  return (permit.sitePhotos && permit.sitePhotos.length) ? permit.sitePhotos : (permit.sitePhoto ? [permit.sitePhoto] : []);
}
function approvalPhotosOf(a){
  return (a.photos && a.photos.length) ? a.photos : (a.photo ? [a.photo] : []);
}
function getRelevantPhotosForStage(permit, stageKey){
  if(stageKey==="area_owner") return sitePhotosOf(permit);
  const withPhoto = [...permit.approvals].reverse().find(a=>approvalPhotosOf(a).length);
  return withPhoto ? approvalPhotosOf(withPhoto) : sitePhotosOf(permit);
}

/* ---------------- helpers ---------------- */
const MAX_PHOTOS = 3;
function genCode(){
  const d = new Date();
  const ymd = d.getFullYear().toString()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const n = state.permits.filter(p=>p.code.includes(ymd)).length + 1;
  return `WP-${ymd}-${String(n).padStart(3,'0')}`;
}
/* ---------------- รูปถ่าย: อ่าน/ย่อรูปให้ทนทานบนมือถือทุกรุ่น ---------------- */
function isHeicFile(f){ return /image\/hei[cf]/i.test(f.type||'') || /\.(heic|heif)$/i.test(f.name||''); }
let _heicLoading = null;
function loadHeicLib(){
  if(window.heic2any) return Promise.resolve();
  if(_heicLoading) return _heicLoading;
  _heicLoading = new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js';
    sc.onload = ()=>res(); sc.onerror = ()=>{ _heicLoading=null; rej(new Error('heic lib')); };
    document.head.appendChild(sc);
  });
  return _heicLoading;
}
async function heicToJpegBlob(file){
  await loadHeicLib();
  const out = await window.heic2any({ blob:file, toType:'image/jpeg', quality:0.85 });
  return Array.isArray(out) ? out[0] : out;
}
// ลองอ่านรูปหลายวิธี: createImageBitmap → <img>+objectURL → FileReader → (HEIC) แปลงเป็น JPEG แล้วอ่านใหม่
async function decodeImageFile(file, triedHeic){
  try{
    if(window.createImageBitmap){
      const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
      return { draw:(ctx,w,h)=>ctx.drawImage(bmp,0,0,w,h), w:bmp.width, h:bmp.height, done:()=>{ try{bmp.close();}catch(e){} } };
    }
  }catch(e){}
  const viaImg = src => new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('decode')); im.src=src; });
  try{
    const url = URL.createObjectURL(file);
    try{ const im = await viaImg(url); return { draw:(ctx,w,h)=>ctx.drawImage(im,0,0,w,h), w:im.naturalWidth||im.width, h:im.naturalHeight||im.height, done:()=>URL.revokeObjectURL(url) }; }
    catch(e){ URL.revokeObjectURL(url); }
  }catch(e){}
  try{
    const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('read')); r.readAsDataURL(file); });
    const im = await viaImg(dataUrl);
    return { draw:(ctx,w,h)=>ctx.drawImage(im,0,0,w,h), w:im.naturalWidth||im.width, h:im.naturalHeight||im.height, done:()=>{} };
  }catch(e){}
  if(!triedHeic && (isHeicFile(file) || !file.type)){
    const jpg = await heicToJpegBlob(file);   // ไม่สำเร็จ → throw ไปให้ผู้เรียกแจ้งผู้ใช้
    return decodeImageFile(jpg, true);
  }
  throw new Error('unsupported image');
}
async function resizeImage(file, maxWidth){
  const src = await decodeImageFile(file);
  try{
    const maxW = maxWidth || 900;
    const scale = Math.min(1, maxW/(src.w||maxW));
    const w = Math.max(1, Math.round(src.w*scale)), h = Math.max(1, Math.round(src.h*scale));
    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
    src.draw(ctx, w, h);
    return canvas.toDataURL('image/jpeg',0.72);
  } finally { src.done(); }
}
async function filesToDataUrls(fileList, max, maxWidth){
  max = max || MAX_PHOTOS;
  const files = Array.from(fileList).slice(0, max);
  const out = [], failed = [];
  for(const f of files){
    try{ out.push(await resizeImage(f, maxWidth)); }catch(e){ failed.push(f.name||'รูป'); }
  }
  if(failed.length){
    const msg = out.length
      ? `อ่านรูปบางไฟล์ไม่ได้ (${failed.join(', ')}) ระบบแนบเฉพาะรูปที่อ่านได้`
      : `อ่านไฟล์รูปไม่ได้ (${failed.join(', ')}) — ลองถ่ายใหม่ด้วยปุ่ม "ถ่ายรูปด้วยกล้อง" หรือตั้งค่ากล้องเป็น "เข้ากันได้สูงสุด (JPEG)"`;
    setTimeout(()=>showToast(msg), 500);
    if(!out.length) throw new Error('no readable photo');
  }
  return out;
}

/* ---- ตัวช่วยแนบรูปบนมือถือ: ปุ่ม "ถ่ายรูป" และ "เลือกจากคลังภาพ" แยกกัน + แสดงรูปตัวอย่าง/ลบทีละรูป ----
   (บางเครื่องช่องเลือกไฟล์ปกติเปิดได้แค่กล้องหรือแค่คลังภาพ จึงทำให้แนบไม่ได้) */
function photoDTSupported(){ try{ const dt = new DataTransfer(); return !!dt.files; }catch(e){ return false; } }
function enhancePhotoInput(inp){
  if(inp.dataset.enh || !photoDTSupported()) return;
  inp.dataset.enh = '1';
  const MAXP = +inp.dataset.max || MAX_PHOTOS;
  const wasRequired = inp.required; inp.required = false;   // การเช็กว่าแนบรูปแล้วทำใน JS ของแต่ละฟอร์มอยู่แล้ว
  inp.style.cssText += ';position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;';
  const tools = document.createElement('div'); tools.className = 'photo-tools';
  tools.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">
      <button type="button" class="btn btn-primary btn-sm" data-cam>📷 ถ่ายรูปด้วยกล้อง</button>
      <button type="button" class="btn btn-outline btn-sm" data-gal>🖼 เลือกจากคลังภาพ</button></div>
    <div class="photo-thumbs" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"></div>
    <div class="hint photo-msg" style="margin:4px 0 0;"></div>`;
  inp.insertAdjacentElement('afterend', tools);
  const mk = (cap)=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*,.heic,.heif'; if(cap){ i.setAttribute('capture','environment'); } else { i.multiple = true; } i.style.display='none'; tools.appendChild(i); return i; };
  const cam = mk(true), gal = mk(false);
  const thumbs = tools.querySelector('.photo-thumbs'), msg = tools.querySelector('.photo-msg');
  const urls = [];
  let current = Array.from(inp.files||[]);
  function sync(){
    const dt = new DataTransfer(); current.slice(0, MAXP).forEach(f=>dt.items.add(f));
    inp.files = dt.files;
    urls.splice(0).forEach(u=>URL.revokeObjectURL(u));
    thumbs.innerHTML = '';
    Array.from(inp.files).forEach((f,i)=>{
      const box = document.createElement('div'); box.style.cssText = 'position:relative;width:76px;height:76px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#EEF1EF;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;color:var(--ink-muted);';
      if(isHeicFile(f)){ box.textContent = 'HEIC'; }
      else { const u = URL.createObjectURL(f); urls.push(u); const im = document.createElement('img'); im.src = u; im.style.cssText='width:100%;height:100%;object-fit:cover;'; im.onerror = ()=>{ im.remove(); box.textContent = 'รูป'; }; box.appendChild(im); }
      const x = document.createElement('button'); x.type='button'; x.textContent='✕'; x.title='เอาออก';
      x.style.cssText = 'position:absolute;top:0;right:0;border:0;background:rgba(0,0,0,.6);color:#fff;width:22px;height:22px;cursor:pointer;';
      x.onclick = ()=>{ current.splice(i,1); sync(); };
      box.appendChild(x); thumbs.appendChild(box);
    });
    const n = inp.files.length;
    msg.textContent = n ? `แนบแล้ว ${n} รูป (สูงสุด ${MAXP} รูป)${current.length>MAXP?' — ใช้ '+MAXP+' รูปแรก':''}` : (wasRequired ? 'ยังไม่ได้แนบรูป (จำเป็นต้องแนบอย่างน้อย 1 รูป)' : '');
    msg.style.color = (!n && wasRequired) ? 'var(--danger)' : '';
  }
  function add(files){ current = current.concat(Array.from(files)); sync(); }
  cam.onchange = ()=>{ add(cam.files); cam.value=''; };
  gal.onchange = ()=>{ add(gal.files); gal.value=''; };
  inp.addEventListener('change', ()=>{ current = Array.from(inp.files||[]); sync(); });
  tools.querySelector('[data-cam]').onclick = ()=>cam.click();
  tools.querySelector('[data-gal]').onclick = ()=>gal.click();
  sync();
}
function enhanceAllPhotoInputs(root){
  (root||document).querySelectorAll('input[type=file][accept="image/*"]:not([data-enh])').forEach(enhancePhotoInput);
}
(function startPhotoEnhancer(){
  let t = null;
  const run = ()=>{ clearTimeout(t); t = setTimeout(()=>enhanceAllPhotoInputs(document), 30); };
  const init = ()=>{ new MutationObserver(run).observe(document.body, { childList:true, subtree:true }); run(); };
  if(document.body) init(); else document.addEventListener('DOMContentLoaded', init);
})();

function badgeForStatus(status){
  if(status==="approved") return `<span class="badge badge-success">อนุมัติแล้ว</span>`;
  if(status==="rejected") return `<span class="badge badge-danger">ไม่อนุมัติ</span>`;
  return `<span class="badge badge-accent">รอ ${STAGE_LABEL[status]}</span>`;
}
// เจ้าของพื้นที่/จป./ผู้จัดการ กดอนุมัติในหน้าใบอนุญาตได้โดยตรง ไม่ต้องเลือกบทบาทจำลอง ไม่ต้องผ่านอีเมล ไม่ต้องล็อกอิน
function isApproverSession(){ return true; }   // ไม่ต้องล็อกอิน: ทุกคนที่เปิดใบเห็นฟอร์มอนุมัติของขั้นตอนปัจจุบัน (ต้องกรอกชื่อผู้อนุมัติเพื่อบันทึกประวัติ)
function pendingCountFor(role, email){
  return state.permits.filter(p=>{
    if(p.status==="approved"||p.status==="rejected") return false;
    if(role==="admin" || isApproverSession()) return true;
    if(p.status!==role) return false;
    if(!email) return true;
    const req = recipientsForStage(p, role).map(e=>e.toLowerCase());
    return req.length===0 || req.includes(email.toLowerCase());
  }).length;
}

/* ---------------- actions ---------------- */
async function createPermit(form){
  const permit = {
    id: 'p'+Date.now()+Math.random().toString(36).slice(2,7),
    code: genCode(),
    createdAt: new Date().toISOString(),
    contractor: {company:form.company, contactName:form.contactName, phone:form.phone},
    department: form.department,
    location: form.location,
    workDescription: form.workDescription,
    startDate: form.startDate, endDate: form.endDate, startTime: form.startTime, endTime: form.endTime,
    permitTypes: form.permitTypes, otherTypeNote: form.otherTypeNote,
    workerCount: form.workerCount, ppe: form.ppe, hazards: form.hazards,
    jsa: form.jsa || [],
    sitePhotos: form.sitePhotos || [],
    riskAssessment: form.riskAssessment || null,
    gasMeasurement: form.gasMeasurement || null,
    status: "area_owner",
    approvals: [],
    notifications: [],
    evaluations: []
  };
  state.permits.unshift(permit);

// บันทึกผลการประเมินรับเหมารายวัน 1 รายการ — scores คือ object {criteriaId: 1|2|3}, photos ไม่บังคับ (จะเป็น array ว่างก็ได้)
async function addEvaluation(permit, scores, note, photos, evaluatorEmail){
  const values = EVAL_CRITERIA.map(c=>scores[c.id]).filter(v=>typeof v==="number");
  const totalScore = values.reduce((a,b)=>a+b,0);
  const hasCritical = values.some(v=>v===0); // มีอย่างน้อย 1 หัวข้อ "พบการกระทำผิด 4 ครั้งขึ้นไป" (คะแนน 0) ถือเป็นข้อบกพร่องร้ายแรง ชี้เตือนแยกจากเกรดรวม
  const gradeInfo = evalGradeFromTotal(totalScore);
  permit.evaluations = permit.evaluations || [];
  permit.evaluations.unshift({
    id: 'ev'+Date.now()+Math.random().toString(36).slice(2,6),
    date: new Date().toISOString().slice(0,10),
    scores, totalScore, hasCritical,
    grade: gradeInfo.grade, gradeLabel: gradeInfo.label,
    note: note||"", photos: photos||[],
    evaluatedBy: evaluatorEmail || state.myEmail || "(ไม่ระบุ)",
    createdAt: new Date().toISOString()
  });
  await savePermits(permit);
  showToast(`บันทึกการประเมินวันนี้แล้ว — ${totalScore}/100 คะแนน เกรด ${gradeInfo.grade} (${gradeInfo.label})`);
  render();
}

async function decide(permit, decision, comment, photos, approverName){
  const stage = permit.status;
  permit.approvals.push({
    stage, approverEmail: approverName || state.myEmail || (recipientsForStage(permit,stage)[0]) || "(ไม่ระบุ)",
    approverName: approverName || "", approvedByAccount: (state.authUser&&state.authUser.username) || "",
    decision, comment: comment||"", photos: photos||[], at: new Date().toISOString()
  });
  if(decision==="rejected"){
    permit.status = "rejected";
  }else{
    const idx = STAGE_ORDER.indexOf(stage);
    const next = STAGE_ORDER[idx+1];
    permit.status = next;
    if(next!=="approved"){
      await notifyStage(permit, next);
    }
  }
  await savePermits(permit);
  showToast(decision==="rejected" ? `ไม่อนุมัติใบ ${permit.code}` : (permit.status==="approved" ? `ใบ ${permit.code} อนุมัติครบทุกขั้นตอนแล้ว` : `อนุมัติขั้นตอนนี้แล้ว — แจ้งเตือน ${STAGE_LABEL[permit.status]} ต่อไป`));
  render();
}

async function recordMonthlyChecks(monthKey, checkedBy, results, typeId, meta){
  meta = meta || {};
  const checkedAtISO = new Date().toISOString();
  const checkDate = meta.date || checkedAtISO.slice(0,10);
  let failCount = 0;
  results.forEach(r=>{
    const eq = state.fireEquipment.find(x=>x.id===r.equipmentId);
    if(!eq) return;
    eq.checks = eq.checks || [];
    if(r.location) eq.location = r.location;
    if(r.extType) eq.extType = r.extType;
    if(r.extSize) eq.extSize = r.extSize;
    eq.checks.push({
      id:'c'+Date.now()+Math.random().toString(36).slice(2,6),
      date: checkDate, time: meta.time||"", department: meta.department||"",
      extType: r.extType||"", extSize: r.extSize||"",
      result: r.result, note: r.note||"", photos: r.photos||[],
      items: r.items||[],
      checkedBy: checkedBy || "(ไม่ระบุ)"
    });
    if(r.result==="fail") failCount++;
  });
  await saveFireEquipmentBulk();
  const round = {
    id:'fm'+Date.now()+Math.random().toString(36).slice(2,7),
    month: monthKey, type: typeId || null, date: checkDate, time: meta.time||"", department: meta.department||"", createdAt: checkedAtISO,
    checkedBy: checkedBy || "(ไม่ระบุ)",
    totalChecked: results.length, failCount,
    results: results.map(r=>({ equipmentId:r.equipmentId, code:r.code, type:r.type, location:r.location, result:r.result, note:r.note||"", items:r.items||[], photos:r.photos||[] }))
  };
  await saveFireMonthlyChecks(round);
  showToast(`บันทึกผลตรวจประจำเดือน ${monthKey} แล้ว — ตรวจ ${results.length} ชิ้น${failCount?`, ไม่ผ่าน ${failCount} ชิ้น`:''}`);
  render();
}

/* ---------------- JSA row helpers ---------------- */
function jsaRowHtml(row, typeIds){
  row = row || {};
  const hazardOptions = jsaHazardOptionsForTypes(typeIds);
  const selectedHazard = row.hazard || "";
  const isCustomHazard = !!selectedHazard && !hazardOptions.some(h=>h.hazard===selectedHazard);
  const severity = Number(row.severity)||1;
  const likelihood = Number(row.likelihood)||1;
  return `<tr>
    <td class="jsaNum">1</td>
    <td><input type="text" class="jsa-input" data-jsa="step" value="${(row.step||'').replace(/"/g,'&quot;')}" placeholder="เช่น ปีนบันไดขึ้นถังผสม"></td>
    <td>
      <select class="jsa-input" data-jsa="hazardSelect">
        <option value="" ${!selectedHazard?'selected':''}>-- เลือกอันตรายที่แนะนำ --</option>
        ${hazardOptions.map(h=>`<option value="${h.hazard.replace(/"/g,'&quot;')}" data-control="${(h.control||'').replace(/"/g,'&quot;')}" data-severity="${h.severity}" data-likelihood="${h.likelihood}" ${selectedHazard===h.hazard?'selected':''}>${h.hazard}</option>`).join('')}
        <option value="__custom__" ${isCustomHazard?'selected':''}>อื่นๆ (ระบุเอง)</option>
      </select>
      <input type="text" class="jsa-input" data-jsa="hazardCustom" placeholder="ระบุอันตรายเอง" value="${isCustomHazard?selectedHazard.replace(/"/g,'&quot;'):''}" style="margin-top:5px;display:${isCustomHazard?'block':'none'};">
    </td>
    <td><input type="text" class="jsa-input" data-jsa="control" value="${(row.control||'').replace(/"/g,'&quot;')}" placeholder="เช่น ใช้สายรัดนิรภัยคล้องจุดยึด"></td>
    <td><select class="jsa-input" data-jsa="severity">${SEVERITY_LABELS.map((l,i)=>`<option value="${i+1}" ${severity===i+1?'selected':''}>${l}</option>`).join('')}</select></td>
    <td><select class="jsa-input" data-jsa="likelihood">${LIKELIHOOD_LABELS.map((l,i)=>`<option value="${i+1}" ${likelihood===i+1?'selected':''}>${l}</option>`).join('')}</select></td>
    <td class="jsaRiskCell" style="text-align:center;font-weight:600;white-space:nowrap;"></td>
    <td><button type="button" class="jsaRemove" title="ลบแถว">×</button></td>
  </tr>`;
}
function renumberJsa(tbody){
  Array.from(tbody.children).forEach((tr,i)=>{ const n=tr.querySelector('.jsaNum'); if(n) n.textContent = i+1; });
}
function updateJsaRiskCell(tr){
  const severity = Number(tr.querySelector('[data-jsa="severity"]').value)||1;
  const likelihood = Number(tr.querySelector('[data-jsa="likelihood"]').value)||1;
  const score = severity*likelihood;
  const lvl = jsaRiskScoreLevel(score);
  const cell = tr.querySelector('.jsaRiskCell');
  cell.textContent = `${score} · ${lvl.label}`;
  cell.style.background = lvl.bg;
  cell.style.color = lvl.color;
  cell.style.borderRadius = 'var(--radius)';
  cell.style.padding = '5px 6px';
}

/* ==================== ดาวน์โหลดทุกหน้าเป็น Excel / PDF (ระบบกลาง ใช้ได้ทุกโมดูล) ==================== */
const EXPORT_EXCLUDED_ROUTES = ["scan_new","new","ar_new","insp_new","nm_new","acc_new","capa_new","settings","kpi_targets","ai_chat"];
function exportPageTitle(main){
  const h = main.querySelector('h1');
  return (h ? h.textContent : (state.route||'page')).replace(/\s+/g,' ').trim() || 'รายงาน';
}
function exportStamp(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function exportSafeName(t){ return String(t).replace(/[\\\/:*?"<>|\[\]]+/g,' ').replace(/\s+/g,' ').trim(); }
function exportUniqueSheet(wb, name){
  let base = exportSafeName(name).slice(0,28) || 'Sheet'; let n = base, i = 2;
  while(wb.SheetNames.includes(n)){ n = `${base.slice(0,26)} ${i++}`; }
  return n;
}
function exportAutoWidth(ws){
  const rng = XLSX.utils.decode_range(ws['!ref']||'A1'); const w = [];
  for(let c=rng.s.c;c<=rng.e.c;c++){ let m=8; for(let r=rng.s.r;r<=rng.e.r;r++){ const cell=ws[XLSX.utils.encode_cell({r,c})]; if(cell&&cell.v!=null){ const len=String(cell.v).split('\n').reduce((a,x)=>Math.max(a,x.length),0); if(len>m) m=len; } } w.push({wch:Math.min(m+2,60)}); }
  ws['!cols'] = w;
}
function exportPageToExcel(){
  if(typeof XLSX==="undefined"){ showToast("โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้าแล้วลองใหม่"); return; }
  const main = document.getElementById('mainArea'); if(!main) return;
  const title = exportPageTitle(main);
  const wb = XLSX.utils.book_new();
  const clean = t => (t||'').replace(/\s+/g,' ').trim();

  // แผ่น "สรุป": การ์ดตัวเลข/ข้อความที่ไม่ใช่ตาราง/ฟอร์ม (เช่น KPI, จำนวนรวม)
  const summary = [["หัวข้อ","ค่า / รายละเอียด"]];
  main.querySelectorAll('.card').forEach(c=>{
    if(c.closest('.export-bar') || c.querySelector('table,form,input,select,textarea')) return;
    const kids = Array.from(c.children).map(k=>clean(k.textContent)).filter(Boolean);
    if(kids.length>=2 && c.textContent.length<500){ summary.push([kids[0], kids.slice(1).join(' · ')]); }
    else if(kids.length===1 && kids[0].length<300){ summary.push([kids[0], '']); }
  });
  if(summary.length>1){ const ws = XLSX.utils.aoa_to_sheet(summary); exportAutoWidth(ws); XLSX.utils.book_append_sheet(wb, ws, exportUniqueSheet(wb,"สรุป")); }

  // ทุกตารางในหน้า → 1 แผ่นต่อ 1 ตาราง (ตั้งชื่อตามหัวข้อที่อยู่ใกล้ที่สุด)
  const tables = Array.from(main.querySelectorAll('table')).filter(t=>t.rows.length>0);
  tables.forEach((t,i)=>{
    let name = '';
    const card = t.closest('.card');
    const h = card ? card.querySelector('h2,h3') : null;
    if(h) name = clean(h.textContent);
    if(!name){ let prev = (card||t).previousElementSibling; while(prev && !name){ const hh = prev.matches('h2,h3')?prev:prev.querySelector('h2,h3'); if(hh) name = clean(hh.textContent); prev = prev.previousElementSibling; } }
    if(!name) name = tables.length>1 ? `${title} ${i+1}` : title;
    const clone = t.cloneNode(true);
    clone.querySelectorAll('.no-print,button[data-delmember],button[data-exempt],button[data-restore]').forEach(x=>x.remove());
    clone.querySelectorAll('input,select,textarea').forEach(x=>{ const v = x.tagName==='SELECT' ? (x.options[x.selectedIndex]||{}).text : x.value; x.replaceWith(document.createTextNode(v||'')); });
    const ws = XLSX.utils.table_to_sheet(clone, { raw:true });
    exportAutoWidth(ws);
    XLSX.utils.book_append_sheet(wb, ws, exportUniqueSheet(wb,name));
  });

  if(!wb.SheetNames.length){
    const lines = (main.innerText||'').split(/\n+/).map(x=>[x.trim()]).filter(r=>r[0]);
    const ws = XLSX.utils.aoa_to_sheet([[title], ...lines]); exportAutoWidth(ws);
    XLSX.utils.book_append_sheet(wb, ws, exportUniqueSheet(wb,title));
  }
  XLSX.writeFile(wb, `${exportSafeName(title)}_${exportStamp()}.xlsx`);
  showToast("ดาวน์โหลดไฟล์ Excel แล้ว");
}
function exportPageToPdf(){
  const main = document.getElementById('mainArea'); if(!main) return;
  const title = exportPageTitle(main);
  const oldTitle = document.title;
  document.title = `${exportSafeName(title)}_${exportStamp()}`;
  const st = document.createElement('style'); st.id = 'printPageStyle'; st.textContent = '@page{size:A4 landscape;margin:10mm;}';
  document.head.appendChild(st);
  const hdr = document.createElement('div'); hdr.className = 'print-only'; hdr.id = 'printHdr';
  hdr.innerHTML = `<div style="font-size:12px;color:#5B6B70;">SAFETY CENTER — บริษัท น้ำตาลมิตรลาว จำกัด</div><div style="font-size:20px;font-weight:700;">${title.replace(/[<>&]/g,'')}</div><div style="font-size:11px;color:#5B6B70;">พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}</div>`;
  main.insertBefore(hdr, main.firstChild);
  document.body.classList.add('print-page');
  const cleanup = ()=>{ document.body.classList.remove('print-page'); document.title = oldTitle; st.remove(); hdr.remove(); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=>{ window.print(); setTimeout(()=>{ if(document.body.classList.contains('print-page')) cleanup(); }, 1500); }, 80);
}
function injectExportBar(main){
  if(!main || EXPORT_EXCLUDED_ROUTES.includes(state.route)) return;
  const bar = el(`<div class="export-bar no-print">
    <button type="button" class="btn btn-outline btn-sm" id="exportXlsxBtn">📊 ดาวน์โหลด Excel</button>
    <button type="button" class="btn btn-outline btn-sm" id="exportPdfBtn">📄 ดาวน์โหลด PDF</button>
  </div>`);
  main.insertBefore(bar, main.firstChild);
  bar.querySelector('#exportXlsxBtn').onclick = exportPageToExcel;
  bar.querySelector('#exportPdfBtn').onclick = exportPageToPdf;
}

          </div>
        </div>
        <div class="field"><label>จำนวนผู้ปฏิบัติงาน</label><input name="workerCount" type="number" min="1" placeholder="จำนวนคน"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;font-size:15px;">ประเภทงาน (เลือกได้มากกว่า 1)</h3>
        <div class="checkgrid">${PERMIT_TYPES.map(t=>`<label class="checkrow"><input type="checkbox" name="permitTypes" value="${t.id}"> ${t.label}</label>`).join('')}</div>
        <div class="field" style="margin-top:8px;"><label>รายละเอียดเพิ่มเติม (กรณีเลือก "อื่นๆ")</label><input name="otherTypeNote" type="text"></div>
      </div>
      <div class="card" id="gasCard" style="display:none;">
        <h3 style="margin-top:0;font-size:15px;">ผลการตรวจวัดบรรยากาศก่อนเข้าที่อับอากาศ (Confined Space Gas Test)</h3>
        <p class="hint" style="margin-top:0;margin-bottom:10px;">บังคับกรอกเมื่อเลือกประเภทงาน "งานในที่อับอากาศ" — ค่าที่ปลอดภัย: O₂ 19.5–23.5% · LEL ต่ำกว่า 10% · CO ต่ำกว่า 25 ppm · H₂S ต่ำกว่า 10 ppm</p>
        <div class="grid4">
          <div class="field"><label>ออกซิเจน O₂ (%) <span class="req">*</span></label><input type="number" step="0.1" name="gasO2" id="gasO2" placeholder="เช่น 20.9"></div>
          <div class="field"><label>LEL (%) <span class="req">*</span></label><input type="number" step="0.1" min="0" name="gasLel" id="gasLel" placeholder="เช่น 0"></div>
          <div class="field"><label>CO (ppm) <span class="req">*</span></label><input type="number" step="1" min="0" name="gasCo" id="gasCo" placeholder="เช่น 0"></div>
          <div class="field"><label>H₂S (ppm) <span class="req">*</span></label><input type="number" step="1" min="0" name="gasH2s" id="gasH2s" placeholder="เช่น 0"></div>
        </div>
        <div id="gasResultBadge"></div>
      </div>
      <div class="card" id="riskCard">
        <h3 style="margin-top:0;font-size:15px;">ประเมินความเสี่ยงและรายการควบคุม (Risk Assessment)</h3>
        <p class="hint" style="margin-top:0;margin-bottom:10px;">ระบบแนะนำรายการควบคุมความเสี่ยงตามประเภทงานที่เลือกไว้ด้านบนโดยอัตโนมัติ ติ๊กรายการที่ทำจริงหน้างาน เพื่อประเมินระดับความเสี่ยงที่เหลืออยู่</p>
        <div id="riskChecklistItems"></div>
        <div id="riskSummary" style="margin-top:12px;"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;font-size:15px;">รูปถ่ายหน้างาน</h3>
        <div class="field"><label>รูปหน้างานก่อนเริ่มงาน <span class="req">*</span></label>
          <input required id="sitePhotoInput" type="file" accept="image/*" multiple>
          <div class="hint">แนบรูปสภาพพื้นที่ ณ ขณะยื่นขออนุญาต ได้สูงสุด 3 รูป ใช้ประกอบการพิจารณาของเจ้าของพื้นที่ — ถ่ายใหม่หรือเลือกจากคลังรูปในเครื่องก็ได้</div>
        </div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;font-size:15px;">อุปกรณ์ป้องกันภัยส่วนบุคคล (PPE)</h3>
        <p class="hint" style="margin-top:0;">เลือก "ประเภทงาน" ด้านล่างก่อน ระบบจะติ๊กและขึ้นป้าย "แนะนำ" กำกับ PPE ที่เกี่ยวข้องให้อัตโนมัติ (ยังปรับเองได้เสมอ)</p>
        <div class="checkgrid" id="ppeGrid">${PPE_LIST.map(p=>`<label class="checkrow"><input type="checkbox" name="ppe" value="${p.replace(/"/g,'&quot;')}"> ${p}</label>`).join('')}</div>
        <div class="field" style="margin-top:8px;"><label>อันตราย/ความเสี่ยงที่ต้องระวังเป็นพิเศษ</label><textarea name="hazards" placeholder="เช่น พื้นที่อับอากาศ, ของร้อน, ไฟฟ้าแรงสูง"></textarea></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;font-size:15px;">JSA — วิเคราะห์งานเพื่อความปลอดภัย (Job Safety Analysis)</h3>
        <p class="hint" style="margin-top:0;margin-bottom:10px;">แตกงานออกเป็นขั้นตอนย่อย ระบุอันตรายและมาตรการควบคุมของแต่ละขั้นตอน อย่างน้อย 1 แถว <span class="req">*</span></p>
        <div style="overflow-x:auto;">
        <table id="jsaTable">
          <thead><tr><th style="width:26px;">#</th><th style="min-width:140px;">ขั้นตอนการทำงาน</th><th style="min-width:200px;">อันตรายที่อาจเกิดขึ้น</th><th style="min-width:200px;">มาตรการป้องกัน/ควบคุม</th><th style="min-width:150px;">ความรุนแรง</th><th style="min-width:150px;">โอกาสเกิด</th><th style="min-width:90px;">ระดับความเสี่ยง</th><th style="width:26px;"></th></tr></thead>
          <tbody id="jsaBody">${jsaRowHtml()}</tbody>
        </table>
        </div>
        <button type="button" class="btn btn-outline btn-sm" id="addJsaRow" style="margin-top:8px;">+ เพิ่มขั้นตอน</button>
      </div>
      <button class="btn btn-primary" type="submit">บันทึกและส่งขออนุมัติ</button>
    </form>
  </div>`);

  const jsaBody = wrap.querySelector('#jsaBody');
  function currentSelectedTypeIds(){
    return Array.from(wrap.querySelectorAll('input[name="permitTypes"]:checked')).map(c=>c.value);
  }
  const ppeGrid = wrap.querySelector('#ppeGrid');
  function refreshPpeSuggestions(){
    const typeIds = currentSelectedTypeIds();
    const recommended = ppeRecommendedForTypes(typeIds);
    const extraItems = ppeExtraForTypes(typeIds);
    const previousChecked = new Set(Array.from(ppeGrid.querySelectorAll('input[type="checkbox"]:checked')).map(cb=>cb.value));
    const allItems = PPE_LIST.concat(extraItems.filter(x=>!PPE_LIST.includes(x)));
    ppeGrid.innerHTML = allItems.map(p=>{
      const isRecommended = recommended.has(p) || extraItems.includes(p);
      const checked = isRecommended || previousChecked.has(p);
      const badge = isRecommended ? ` <span class="ppe-recommend-badge" style="margin-left:4px;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-bg);padding:1px 6px;border-radius:10px;">แนะนำ</span>` : '';
      return `<label class="checkrow"><input type="checkbox" name="ppe" value="${p.replace(/"/g,'&quot;')}" ${checked?'checked':''}> ${p}${badge}</label>`;
    }).join('');
  }
  wrap.querySelector('#addJsaRow').onclick = ()=>{
    jsaBody.insertAdjacentHTML('beforeend', jsaRowHtml({}, currentSelectedTypeIds()));
    renumberJsa(jsaBody);
    updateJsaRiskCell(jsaBody.lastElementChild);
  };
  jsaBody.addEventListener('click', (e)=>{
    if(e.target.classList.contains('jsaRemove')){
      if(jsaBody.children.length>1){ e.target.closest('tr').remove(); renumberJsa(jsaBody); }
      else{ showToast("ต้องมี JSA อย่างน้อย 1 ขั้นตอน"); }
    }
  });
  jsaBody.addEventListener('change', (e)=>{
    const tr = e.target.closest('tr');
    if(!tr) return;
    if(e.target.matches('[data-jsa="hazardSelect"]')){
      const hazardCustom = tr.querySelector('[data-jsa="hazardCustom"]');
      if(e.target.value === '__custom__'){
        hazardCustom.style.display = 'block';
        hazardCustom.focus();
      }else{
        hazardCustom.style.display = 'none';
        const opt = e.target.selectedOptions[0];
        if(opt){
          const control = opt.getAttribute('data-control');
          const severity = opt.getAttribute('data-severity');
          const likelihood = opt.getAttribute('data-likelihood');
          if(control) tr.querySelector('[data-jsa="control"]').value = control;
          if(severity) tr.querySelector('[data-jsa="severity"]').value = severity;
          if(likelihood) tr.querySelector('[data-jsa="likelihood"]').value = likelihood;
          updateJsaRiskCell(tr);
        }
      }
    }
    if(e.target.matches('[data-jsa="severity"]') || e.target.matches('[data-jsa="likelihood"]')){
      updateJsaRiskCell(tr);
    }
  });
  // เปลี่ยนประเภทงาน -> อัปเดตรายการอันตรายที่แนะนำในทุกแถวของ JSA ให้ตรงกับประเภทงานที่เลือกใหม่ (คงค่าที่กรอกไว้เดิม)
  function refreshJsaHazardOptions(){
    const typeIds = currentSelectedTypeIds();
    Array.from(jsaBody.querySelectorAll('tr')).forEach(tr=>{
      const hazardSelect = tr.querySelector('[data-jsa="hazardSelect"]');
      const hazardCustom = tr.querySelector('[data-jsa="hazardCustom"]');
      const currentHazard = hazardSelect.value === '__custom__' ? hazardCustom.value : hazardSelect.value;
      const rowData = {
        step: tr.querySelector('[data-jsa="step"]').value,
        hazard: currentHazard,
        control: tr.querySelector('[data-jsa="control"]').value,
        severity: tr.querySelector('[data-jsa="severity"]').value,
        likelihood: tr.querySelector('[data-jsa="likelihood"]').value
      };
      tr.outerHTML = jsaRowHtml(rowData, typeIds);
    });
    renumberJsa(jsaBody);
    Array.from(jsaBody.querySelectorAll('tr')).forEach(updateJsaRiskCell);
  }
  updateJsaRiskCell(jsaBody.firstElementChild);

  /* ---- Risk assessment checklist: สร้างใหม่ทุกครั้งที่เปลี่ยนประเภทงาน หรือติ๊ก/ยกเลิกติ๊กรายการ ---- */
  const riskCheckedKeys = new Set();
  const riskItemsEl = wrap.querySelector('#riskChecklistItems');
  const riskSummaryEl = wrap.querySelector('#riskSummary');
  function renderRiskChecklist(){
    const typeIds = currentSelectedTypeIds();
    const assessment = computeRiskAssessment(typeIds, riskCheckedKeys);
    if(!typeIds.length){
      riskItemsEl.innerHTML = `<p class="hint" style="margin:0;">เลือก "ประเภทงาน" ด้านบนก่อน ระบบจะแนะนำรายการควบคุมความเสี่ยงที่เกี่ยวข้องให้อัตโนมัติ</p>`;
      riskSummaryEl.innerHTML = '';
      return;
    }
    riskItemsEl.innerHTML = assessment.items.map(it=>`
      <label class="checkrow" style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;">
        <input type="checkbox" data-risk-key="${it.key.replace(/"/g,'&quot;')}" ${riskCheckedKeys.has(it.key)?'checked':''} style="margin-top:3px;">
        <span>${it.text}</span>
      </label>
    `).join('');
    const rl = RISK_LEVELS[assessment.level];
    const pct = Math.round(assessment.ratio*100);
    let suggestionHtml = '';
    if(assessment.missing.length){
      suggestionHtml = `<div style="margin-top:10px;padding:10px 12px;background:var(--accent-bg);border-radius:var(--radius);">
        <strong style="font-size:13px;">ข้อแนะนำเพิ่มเติม — ยังไม่ได้ติ๊ก ${assessment.missing.length} รายการ:</strong>
        <ul style="margin:6px 0 0;padding-left:20px;font-size:13px;">
          ${assessment.missing.map(m=>`<li>${m.text}</li>`).join('')}
        </ul>
      </div>`;
    }else{
      suggestionHtml = `<div style="margin-top:10px;padding:10px 12px;background:var(--success-bg);border-radius:var(--radius);font-size:13px;">
        <strong>ติ๊กครบทุกรายการควบคุมความเสี่ยงที่แนะนำแล้ว</strong>
      </div>`;
    }
    riskSummaryEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:600;background:${rl.bg};color:${rl.color};">ระดับความเสี่ยง: ${rl.label}</span>
        <span style="font-size:12.5px;color:var(--ink-muted);">ติ๊กครบ ${assessment.checkedCount} จาก ${assessment.total} รายการ (${pct}%)</span>
      </div>
      ${suggestionHtml}
    `;
  }
  const gasCard = wrap.querySelector('#gasCard');
  const gasResultBadge = wrap.querySelector('#gasResultBadge');
  const gasFieldIds = ['gasO2','gasLel','gasCo','gasH2s'];
  function isConfinedSelected(){ return currentSelectedTypeIds().includes('confined'); }
  function refreshGasCardVisibility(){
    const show = isConfinedSelected();
    gasCard.style.display = show ? '' : 'none';
    gasFieldIds.forEach(id=>{ wrap.querySelector('#'+id).required = show; });
    if(!show) gasResultBadge.innerHTML = '';
  }
  function gasSafetyCheck(){
    if(!isConfinedSelected()) return;
    const o2 = parseFloat(wrap.querySelector('#gasO2').value);
    const lel = parseFloat(wrap.querySelector('#gasLel').value);
    const co = parseFloat(wrap.querySelector('#gasCo').value);
    const h2s = parseFloat(wrap.querySelector('#gasH2s').value);
    if([o2,lel,co,h2s].some(v=>isNaN(v))){ gasResultBadge.innerHTML = ''; return; }
    const problems = [];
    if(o2<19.5 || o2>23.5) problems.push('O₂ อยู่นอกช่วงปลอดภัย (19.5–23.5%)');
    if(lel>=10) problems.push('LEL สูงเกิน 10%');
    if(co>=25) problems.push('CO สูงเกิน 25 ppm');
    if(h2s>=10) problems.push('H₂S สูงเกิน 10 ppm');
    gasResultBadge.innerHTML = problems.length
      ? `<div style="margin-top:10px;padding:8px 12px;border-radius:var(--radius);background:var(--danger-bg);color:var(--danger);font-size:12.5px;font-weight:600;">⚠ ค่าที่วัดได้ไม่ปลอดภัย — ห้ามเข้าปฏิบัติงานจนกว่าจะระบายอากาศและวัดซ้ำ: ${problems.join(', ')}</div>`
      : `<div style="margin-top:10px;padding:8px 12px;border-radius:var(--radius);background:var(--success-bg);color:var(--success);font-size:12.5px;font-weight:600;">✓ ค่าที่วัดได้อยู่ในเกณฑ์ปลอดภัย</div>`;
  }
  gasFieldIds.forEach(id=>wrap.querySelector('#'+id).addEventListener('input', gasSafetyCheck));
  refreshGasCardVisibility();

  wrap.querySelectorAll('input[name="permitTypes"]').forEach(cb=>{
    cb.addEventListener('change', ()=>{ riskCheckedKeys.clear(); renderRiskChecklist(); refreshJsaHazardOptions(); refreshPpeSuggestions(); refreshGasCardVisibility(); });
  });
  riskItemsEl.addEventListener('change', (e)=>{
    const key = e.target.getAttribute('data-risk-key');
    if(!key) return;
    if(e.target.checked) riskCheckedKeys.add(key); else riskCheckedKeys.delete(key);
    renderRiskChecklist();
  });
  renderRiskChecklist();

  const companySelect = wrap.querySelector('#companySelect');
  const companyOtherField = wrap.querySelector('#companyOtherField');
  const companyOtherInput = wrap.querySelector('#companyOtherInput');
  const departmentSelect = wrap.querySelector('#departmentSelect');
  companySelect.onchange = ()=>{
    const val = companySelect.value;
    if(val===OTHER_COMPANY_VALUE){
      companyOtherField.style.display = '';
      companyOtherInput.required = true;
    }else{
      companyOtherField.style.display = 'none';
      companyOtherInput.required = false;
      companyOtherInput.value = '';
      // เด้งไปเลือกแผนกให้อัตโนมัติตามที่ตั้งค่าไว้ในหน้า "ตั้งค่าอีเมลผู้อนุมัติ" (ถ้ามีการกำหนดไว้สำหรับบริษัทนี้)
      const mappedDept = (state.settings.companyDeptMap||{})[val];
      if(mappedDept) departmentSelect.value = mappedDept;
    }
  };

  wrap.querySelector('#permitForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const permitTypes = f.getAll('permitTypes');
    const ppe = f.getAll('ppe');
    if(permitTypes.length===0){ showToast("กรุณาเลือกประเภทงานอย่างน้อย 1 รายการ"); return; }
    let gasMeasurement = null;
    if(permitTypes.includes('confined')){
      const o2 = f.get('gasO2'), lel = f.get('gasLel'), co = f.get('gasCo'), h2s = f.get('gasH2s');
      if(o2===''||lel===''||co===''||h2s===''){ showToast("กรุณากรอกผลการตรวจวัดบรรยากาศให้ครบทั้ง 4 ค่า (O₂, LEL, CO, H₂S) ก่อนเข้าที่อับอากาศ"); return; }
      gasMeasurement = { o2:Number(o2), lel:Number(lel), co:Number(co), h2s:Number(h2s), measuredAt:new Date().toISOString() };
    }
    const companyVal = f.get('company');
    if(!companyVal){ showToast("กรุณาเลือกบริษัท"); return; }
    const company = companyVal===OTHER_COMPANY_VALUE ? f.get('companyOther').trim() : companyVal;
    if(!company){ showToast("กรุณาระบุชื่อบริษัท"); return; }
    const jsa = Array.from(jsaBody.querySelectorAll('tr')).map(tr=>{
      const hazardSelect = tr.querySelector('[data-jsa="hazardSelect"]');
      const hazardCustom = tr.querySelector('[data-jsa="hazardCustom"]');
      const hazard = (hazardSelect.value === '__custom__' ? hazardCustom.value : hazardSelect.value).trim();
      const severity = Number(tr.querySelector('[data-jsa="severity"]').value)||1;
      const likelihood = Number(tr.querySelector('[data-jsa="likelihood"]').value)||1;
      return {
        step: tr.querySelector('[data-jsa="step"]').value.trim(),
        hazard, control: tr.querySelector('[data-jsa="control"]').value.trim(),
        severity, likelihood, riskScore: severity*likelihood
      };
    }).filter(r=>r.step || r.hazard || r.control);
    if(jsa.length===0){ showToast("กรุณากรอกข้อมูล JSA อย่างน้อย 1 ขั้นตอน"); return; }
    const sitePhotoInput = wrap.querySelector('#sitePhotoInput');
    if(!sitePhotoInput.files.length){ showToast("กรุณาแนบรูปถ่ายหน้างานอย่างน้อย 1 รูปก่อนส่งขออนุมัติ"); return; }
    if(sitePhotoInput.files.length>MAX_PHOTOS){ showToast(`แนบรูปได้ไม่เกิน ${MAX_PHOTOS} รูป`); return; }
    const submitBtn = wrap.querySelector('#permitForm button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = "กำลังอัปโหลดรูปภาพ...";
    let sitePhotos;
    try{
      const rawPhotos = await filesToDataUrls(sitePhotoInput.files);
      sitePhotos = await uploadPhotosAndGetUrls(rawPhotos, "site_" + Date.now());
    }catch(e){
      showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองอีกครั้ง");
      submitBtn.disabled = false; submitBtn.textContent = "บันทึกและส่งขออนุมัติ";
      return;
    }
    submitBtn.textContent = "กำลังบันทึก...";
    const riskAssessment = computeRiskAssessment(permitTypes, riskCheckedKeys);
    createPermit({
      company, contactName:f.get('contactName'), phone:f.get('phone'),
      department:f.get('department'), location:f.get('location'), workDescription:f.get('workDescription'),
      startDate:f.get('startDate'), startTime:f.get('startTime'), endDate:f.get('endDate'), endTime:f.get('endTime'),
      workerCount:f.get('workerCount'), permitTypes, otherTypeNote:f.get('otherTypeNote'), ppe, hazards:f.get('hazards'),
      jsa, sitePhotos, gasMeasurement,
      riskAssessment: { level: riskAssessment.level, checkedCount: riskAssessment.checkedCount, total: riskAssessment.total, ratio: riskAssessment.ratio, items: riskAssessment.items.map(it=>({ text: it.text, checked: riskCheckedKeys.has(it.key) })) }
    });
  };
  return wrap;
}

/* ---- Queue (my pending approvals) ---- */
function renderQueue(){
  const list = state.permits.filter(p=>{
    if(p.status==="approved"||p.status==="rejected") return false;
    if(state.role==="admin" || isApproverSession()) return true;
    if(p.status!==state.role) return false;
    const req = recipientsForStage(p, state.role).map(e=>e.toLowerCase());
    if(!state.myEmail) return true;
    return req.length===0 || req.includes(state.myEmail.toLowerCase());
  });
  const wrap = el(`<div><div class="pagehead"><div><h1>รายการรออนุมัติของฉัน</h1><p>แสดงใบขออนุญาตที่รอการอนุมัติในขั้นตอนของบทบาทที่เลือก</p></div></div></div>`);
  if(state.role==="contractor"){
    wrap.appendChild(el(`<div class="empty"><h3>บทบาทนี้ไม่มีคิวอนุมัติ</h3><p>เปลี่ยนบทบาทเป็นเจ้าของพื้นที่ / จป. / ผู้จัดการ เพื่อดูรายการที่รอท่านอนุมัติ</p></div>`));
    return wrap;
  }
  wrap.appendChild(buildContractorDaySummary());
  if(list.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ไม่มีรายการรออนุมัติ</h3><p>ยังไม่มีใบขออนุญาตที่รอการอนุมัติจากท่านในขณะนี้</p></div>`));
    return wrap;
  }
  wrap.appendChild(buildTable(list));
