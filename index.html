      <button type="button" class="btn btn-danger" id="deleteNmBtn">🗑 ลบรายการนี้ทิ้ง</button>
    </div>` : ''}
  `;

  inner.querySelector('#closeNmModal').onclick = ()=>setState({nmDetailId:null});
  inner.querySelector('#nmPrintBtn').onclick = ()=>{ window.print(); };
  inner.querySelector('#saveInvestigationBtn').onclick = async ()=>{
    const investigator = inner.querySelector('#nmInvestigator').value.trim();
    const rootCause = inner.querySelector('#nmRootCause').value.trim();
    if(!investigator || !rootCause){ showToast("กรุณากรอกผู้สอบสวนและสาเหตุที่แท้จริง"); return; }
    await saveNmInvestigation(report, investigator, rootCause);
  };
  inner.querySelector('#addNmActionBtn').onclick = async ()=>{
    const desc = inner.querySelector('#nmActionDesc').value.trim();
    if(!desc){ showToast("กรุณากรอกรายละเอียดมาตรการ"); return; }
    const assignedTo = inner.querySelector('#nmActionAssignee').value.trim();
    const dueDate = inner.querySelector('#nmActionDue').value;
    await addNmAction(report, desc, assignedTo, dueDate);
  };
  const closeCaseBtn = inner.querySelector('#closeNmCaseBtn');
  if(closeCaseBtn) closeCaseBtn.onclick = async ()=>{
    if(!confirm(`ยืนยันปิดเคส ${report.code}?`)) return;
    await closeNmCase(report);
  };
  const reopenCaseBtn = inner.querySelector('#reopenNmCaseBtn');
  if(reopenCaseBtn) reopenCaseBtn.onclick = async ()=>{ await reopenNmCase(report); };
  const deleteBtn = inner.querySelector('#deleteNmBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    if(!(await requireAdmin(`ยืนยันลบรายการ ${report.code} ทิ้งอย่างถาวร?\n(การลบนี้กู้คืนไม่ได้)`))) return;
    await deleteNearMiss(report.id);
  };

  renderNmActionsList(inner.querySelector('#nmActionsList'), report);
}

        <button type="button" class="btn btn-success" id="closeIncBtn">✓ ปิดเคสนี้</button>`

    </div>` : ''}

    if(!confirm(`ยืนยันปิดเคส ${inc.code}?`)) return;
    await closeIncident(inc, note);
  };
  const reopenBtn = inner.querySelector('#reopenIncBtn');
  if(reopenBtn) reopenBtn.onclick = async ()=>{ await reopenIncident(inc); };
  const deleteBtn = inner.querySelector('#deleteIncBtn');

    if(!(await requireAdmin(`ยืนยันลบบันทึก ${inc.code} ทิ้งอย่างถาวร?`))) return;
    await deleteIncident(inc.id);
  };

function renderFireDashboard(){
  const wrap = el(`<div><div class="pagehead"><div><h1>แดชบอร์ด Fire & Emergency</h1><p>ภาพรวมอุปกรณ์ดับเพลิง การซ้อมอพยพ และเหตุฉุกเฉินที่เกิดขึ้น</p></div></div></div>`);

  wrap.appendChild(el(`<div class="grid4" style="margin-bottom:16px;">

    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">อุปกรณ์ต้องแก้ไข/หมดอายุ</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--danger);">${eqNeedsAttention}</div></div>

    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ซ้อมอพยพล่าสุด</div><div style="font-family:'Oswald',sans-serif;font-size:22px;">${lastDrill?lastDrill.date:'ยังไม่เคยซ้อม'}</div></div>
  </div>`));

  if(state.fireEquipment.length){
    const typeGroups = {};
    FIRE_EQUIPMENT_TYPES.forEach(t=>{ typeGroups[t.id] = {label:t.label, total:0}; });
    state.fireEquipment.forEach(eq=>{ if(typeGroups[eq.type]) typeGroups[eq.type].total++; });
    const rows = Object.values(typeGroups).filter(g=>g.total>0);
    const maxTotal = Math.max(...rows.map(r=>r.total), 1);
    const CHART_H = 150;
    const chart = el(`<div class="card"><h3 style="margin-top:0;font-size:15px;">จำนวนอุปกรณ์ แยกตามประเภท</h3>
      <div style="display:flex;align-items:flex-end;gap:20px;height:${CHART_H}px;padding:24px 4px 0;overflow-x:auto;" id="fireBarChart"></div>
    </div>`);
    const chartWrap = chart.querySelector('#fireBarChart');
    rows.forEach(g=>{
      const barH = Math.max((g.total/maxTotal)*CHART_H, 6);
      chartWrap.appendChild(el(`<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;align-self:flex-end;">
        <div style="font-size:12px;font-weight:600;margin-bottom:4px;">${g.total}</div>
        <div style="width:44px;background:var(--accent);border-radius:3px 3px 0 0;height:${barH}px;"></div>
        <div style="font-size:11px;color:var(--ink-muted);margin-top:8px;text-align:center;max-width:80px;line-height:1.3;">${g.label}</div>
      </div>`));
    });
    wrap.appendChild(chart);
  } else {
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีข้อมูล</h3><p>เพิ่มอุปกรณ์ดับเพลิงเพื่อดูกราฟสรุปที่นี่</p></div>`));
  }
  return wrap;
}

  if(items.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีรายการงานแก้ไข</h3><p>รายการจะปรากฏที่นี่เมื่อมีข้อบกพร่องจากการตรวจ, Near Miss หรือสร้างงานแก้ไขใหม่จากเมนูด้านซ้าย</p></div>`));

      const overdue = it.status!=="closed" && it.dueDate && it.dueDate<today;
      const statusBadge = it.status==="closed" ? '<span class="badge badge-success">ปิดแล้ว</span>' : overdue ? '<span class="badge badge-danger">เกินกำหนด</span>' : '<span class="badge badge-wait">ดำเนินการ</span>';
      return `<tr class="clickable" data-source="${it.source}" data-source-id="${it.sourceId}">

        <td class="code-tag" data-label="เลขที่อ้างอิง">${it.sourceCode}</td>

      </tr>`;
    }).join('')}</tbody>
  </table></div>`);
  table.querySelectorAll('tr.clickable').forEach(tr=>{
    tr.onclick = ()=>{
      const source = tr.dataset.source, id = tr.dataset.sourceId;
      if(source==="inspection") setState({appModule:"inspection", route:"insp_list", inspDetailId:id});
      else if(source==="nearmiss") setState({appModule:"nearmiss", route:"nm_list", nmDetailId:id});

      else if(source==="capa") setState({capaDetailId:id});
    };
  });
  wrap.appendChild(table);
  return wrap;
}

        <div class="field"><label>มอบหมายให้</label><input type="text" name="assignedTo" placeholder="ชื่อผู้รับผิดชอบ"></div>
        <div class="field"><label>รูปหลักฐานก่อนแก้ไข (ถ้ามี — สูงสุด ${MAX_PHOTOS} รูป)</label><input type="file" id="capaPhotoInput" accept="image/*" multiple></div>
      </div>
      <button class="btn btn-primary" type="submit">บันทึกงานแก้ไข</button>
    </form>
  </div>`);
  wrap.querySelector('#capaForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const photoInput = wrap.querySelector('#capaPhotoInput');
    if(photoInput.files.length>MAX_PHOTOS){ showToast(`แนบรูปได้ไม่เกิน ${MAX_PHOTOS} รูป`); return; }
    const submitBtn = wrap.querySelector('#capaForm button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = "กำลังบันทึก...";
    let photos = [];
    if(photoInput.files.length){
      try{
        const rawPhotos = await filesToDataUrls(photoInput.files);
        photos = await uploadPhotosAndGetUrls(rawPhotos, "capa_"+Date.now());
      }catch(err){
        showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองอีกครั้ง");
        submitBtn.disabled = false; submitBtn.textContent = "บันทึกงานแก้ไข";
        return;
      }
    }
    await createCapa({
      source: f.get('source'), sourceDetail: f.get('sourceDetail'), department: f.get('department'),
      dueDate: f.get('dueDate'), description: f.get('description'), rootCause: f.get('rootCause'),
      assignedTo: f.get('assignedTo'), evidenceBeforePhotos: photos
    });
  };
  return wrap;
}

      const verificationNote = inner.querySelector('#capaVerificationNote').value.trim();
      const photoInput = inner.querySelector('#capaAfterPhotoInput');
      let photos = [];
      if(photoInput.files.length){
        try{
          const rawPhotos = await filesToDataUrls(photoInput.files);
          photos = await uploadPhotosAndGetUrls(rawPhotos, "capa_after_"+Date.now());
        }catch(err){ showToast("อัปโหลดรูปไม่สำเร็จ ลองอีกครั้ง"); return; }
      }
      await closeCapa(capa, verifiedBy, verificationNote, photos);
    };
  }
  const reopenBtn = inner.querySelector('#capaReopenBtn');
  if(reopenBtn) reopenBtn.onclick = async ()=>{ await reopenCapa(capa); };

  if(deleteBtn) deleteBtn.onclick = async ()=>{
    if(!(await requireAdmin(`ยืนยันลบงานแก้ไข ${capa.code} ทิ้งอย่างถาวร?`))) return;
    await deleteCapa(capa.id);
  };

function renderCapaDashboard(){
  const wrap = el(`<div><div class="pagehead"><div><h1>แดชบอร์ด Corrective Action</h1><p>ภาพรวมงานแก้ไข/ป้องกันจากทุกโมดูลทั่วทั้งระบบ</p></div></div></div>`);
  const items = allCorrectiveItems();
  if(items.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีข้อมูล</h3><p>แดชบอร์ดจะแสดงผลเมื่อมีรายการงานแก้ไขอย่างน้อย 1 รายการ</p></div>`));
    return wrap;
  }
  const today = new Date().toISOString().slice(0,10);
  const total = items.length;
  const closed = items.filter(i=>i.status==="closed").length;
  const overdue = items.filter(i=>i.status!=="closed" && i.dueDate && i.dueDate<today).length;
  const openCount = total - closed;

  wrap.appendChild(el(`<div class="grid4" style="margin-bottom:16px;">
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">งานแก้ไขทั้งหมด</div><div style="font-family:'Oswald',sans-serif;font-size:32px;">${total}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ค้างดำเนินการ</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--accent-ink);">${openCount}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">เกินกำหนด</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--danger);">${overdue}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ปิดงานแล้ว</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--success);">${closed}</div></div>
  </div>`));

  const bySource = {};
  items.forEach(it=>{
    if(!bySource[it.sourceLabel]) bySource[it.sourceLabel] = {total:0, open:0};
    bySource[it.sourceLabel].total++;
    if(it.status!=="closed") bySource[it.sourceLabel].open++;
  });
  const rows = Object.entries(bySource);
  const maxTotal = Math.max(...rows.map(r=>r[1].total), 1);
  const CHART_H = 150;
  const chart = el(`<div class="card"><h3 style="margin-top:0;font-size:15px;">จำนวนงานแก้ไข แยกตามที่มา</h3>
    <div style="display:flex;align-items:flex-end;gap:24px;height:${CHART_H}px;padding:24px 4px 0;overflow-x:auto;" id="capaBarChart"></div>
  </div>`);
  const chartWrap = chart.querySelector('#capaBarChart');
  rows.forEach(([label,g])=>{
    const barH = Math.max((g.total/maxTotal)*CHART_H, 6);
    chartWrap.appendChild(el(`<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;align-self:flex-end;">
      <div style="font-size:12px;font-weight:600;margin-bottom:4px;">${g.total}</div>
      <div style="width:50px;background:var(--accent);border-radius:3px 3px 0 0;height:${barH}px;"></div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:8px;text-align:center;max-width:90px;line-height:1.3;">${label}</div>
    </div>`));
  });
  wrap.appendChild(chart);
  return wrap;
}

/* ==================== Safety Dashboard (ภาพรวมรวมทุกโมดูล) ==================== */
function computeTotalLaborHoursAllPermits(){
  const permits = state.permits;
  const mitrLaoPermits = permits.filter(p=>((p.contractor && p.contractor.company)||"").trim()==="มิตรลาว");
  const contractorPermits = permits.filter(p=>((p.contractor && p.contractor.company)||"").trim()!=="มิตรลาว");
  const autoMitrLaoHours = mitrLaoPermits.reduce((sum,p)=>sum+permitLaborHours(p), 0);
  const autoContractorHours = contractorPermits.reduce((sum,p)=>sum+permitLaborHours(p), 0);
  const hoursOverride = state.settings.hoursOverride || { mitrLao:null, contractor:null };
  const mitrLaoHours = (typeof hoursOverride.mitrLao === "number") ? hoursOverride.mitrLao : autoMitrLaoHours;
  const contractorHours = (typeof hoursOverride.contractor === "number") ? hoursOverride.contractor : autoContractorHours;
  return mitrLaoHours + contractorHours;
}

  const lastIncidentDate = sortedIncidents[0] ? sortedIncidents[0].date : null;
  const daysWithoutIncident = lastIncidentDate ? Math.floor((new Date().setHours(0,0,0,0) - new Date(lastIncidentDate).setHours(0,0,0,0)) / 86400000) : null;
  const capaItems = allCorrectiveItems();
  const today = new Date().toISOString().slice(0,10);
  const capaOverdue = capaItems.filter(it=>it.status!=="closed" && it.dueDate && it.dueDate<today).length;
  const capaOpen = capaItems.filter(it=>it.status!=="closed").length;

    </div>
    <div class="card" style="text-align:center;">

      <div style="font-family:'Oswald',sans-serif;font-size:32px;">${nearMissThisYear.length}</div>

    </div>
  </div>`));

  // อัตราความปลอดภัย TRIR / LTIFR — คำนวณจากชั่วโมงการทำงานรวม (ดึงจากใบขออนุญาตทำงานทั้งหมด เช่นเดียวกับแดชบอร์ด Work Permit)
  const totalHours = computeTotalLaborHoursAllPermits();
  const recordableCount = allIncidentRecords().filter(r=>r.recordable).length;
  const ltiCount = allIncidentRecords().filter(r=>r.lostTime).length;
  const trir = totalHours>0 ? ((recordableCount*200000)/totalHours).toFixed(2) : null;
  const ltifr = totalHours>0 ? ((ltiCount*1000000)/totalHours).toFixed(2) : null;
  wrap.appendChild(el(`<div class="card" style="margin-bottom:16px;">
    <h3 style="margin-top:0;font-size:15px;">อัตราความปลอดภัย (Safety Rates)</h3>

        <div style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);">TRIR (ต่อ 200,000 ชม.)</div><div style="font-family:'Oswald',sans-serif;font-size:26px;">${trir}</div></div>

  });
  wrap.appendChild(modGrid);

  // กราฟแนวโน้ม 6 เดือนล่าสุด: อุบัติเหตุ vs Near Miss
  const monthLabels = [];
  const incByMonth = [];
  const nmByMonth = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const y = d.getFullYear(), m = d.getMonth();
    monthLabels.push(`${String(m+1).padStart(2,'0')}/${String(y).slice(2)}`);
    incByMonth.push(allIncidentRecords().filter(x=>{ const xd=new Date(x.date); return xd.getFullYear()===y && xd.getMonth()===m; }).length);
    nmByMonth.push(state.nearMisses.filter(x=>{ const xd=new Date(x.date); return xd.getFullYear()===y && xd.getMonth()===m; }).length);
  }
  const maxTrend = Math.max(...incByMonth, ...nmByMonth, 1);
  const TR_H = 140;
  const trendCard = el(`<div class="card" style="margin-bottom:16px;">
    <h3 style="margin-top:0;font-size:15px;">แนวโน้มอุบัติเหตุ vs Near Miss (6 เดือนล่าสุด)</h3>
    <div style="display:flex;gap:6px;margin-bottom:8px;font-size:11.5px;">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--danger);border-radius:2px;margin-right:4px;"></span>อุบัติเหตุ</span>
      <span style="margin-left:12px;"><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:4px;"></span>Near Miss</span>
    </div>
    <div style="display:flex;align-items:flex-end;gap:16px;height:${TR_H}px;padding:6px 4px 0;overflow-x:auto;" id="trendChart"></div>
  </div>`);
  const trendWrap = trendCard.querySelector('#trendChart');
  monthLabels.forEach((label,idx)=>{
    const incH = Math.max((incByMonth[idx]/maxTrend)*TR_H, incByMonth[idx]>0?6:0);
    const nmH = Math.max((nmByMonth[idx]/maxTrend)*TR_H, nmByMonth[idx]>0?6:0);
    trendWrap.appendChild(el(`<div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;">
      <div style="display:flex;align-items:flex-end;gap:4px;height:${TR_H}px;">
        <div style="width:16px;background:var(--danger);border-radius:3px 3px 0 0;height:${incH}px;" title="อุบัติเหตุ ${incByMonth[idx]}"></div>
        <div style="width:16px;background:var(--accent);border-radius:3px 3px 0 0;height:${nmH}px;" title="Near Miss ${nmByMonth[idx]}"></div>
      </div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:6px;">${label}</div>
    </div>`));
  });
  wrap.appendChild(trendCard);

  // ตารางความเสี่ยงตามแผนก — รวมข้อบกพร่อง/มาตรการค้างจากทุกโมดูลตามแผนก
  const deptRisk = {};
  DEPARTMENTS.forEach(d=>{ deptRisk[d] = 0; });
  state.inspections.forEach(insp=>{
    (insp.findings||[]).filter(f=>f.status!=="closed").forEach(()=>{ if(deptRisk[insp.department]!=null) deptRisk[insp.department]++; });
  });
  state.nearMisses.forEach(nm=>{
    (nm.actions||[]).filter(a=>a.status!=="closed").forEach(()=>{ if(deptRisk[nm.department]!=null) deptRisk[nm.department]++; });
  });
  state.capas.filter(c=>c.status!=="closed").forEach(c=>{ if(deptRisk[c.department]!=null) deptRisk[c.department]++; });
  state.accidents.forEach(acc=>{
    (acc.actions||[]).filter(a=>a.status!=="closed").forEach(()=>{ if(deptRisk[acc.department]!=null) deptRisk[acc.department]++; });
  });
  const riskRows = Object.entries(deptRisk).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(riskRows.length){
    const maxRisk = Math.max(...riskRows.map(r=>r[1]));
    wrap.appendChild(el(`<div class="card">
      <h3 style="margin-top:0;font-size:15px;">พื้นที่/แผนกที่มีข้อบกพร่อง-มาตรการค้างมากที่สุด</h3>
      ${riskRows.map(([dept,count])=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <div style="width:140px;font-size:12.5px;flex-shrink:0;">${dept}</div>
          <div style="flex:1;background:var(--bg);border-radius:6px;overflow:hidden;height:18px;">
            <div style="width:${Math.max((count/maxRisk)*100,6)}%;background:${count>=maxRisk*0.7?'var(--danger)':'var(--accent)'};height:100%;"></div>
          </div>
          <div style="width:24px;text-align:right;font-size:12.5px;font-weight:700;">${count}</div>
        </div>`).join('')}
    </div>`));
  }

  return wrap;
}

    [],

    ["Fire & Emergency", state.fireEquipment.length+" อุปกรณ์", state.fireIncidents.length+" เหตุการณ์"],
    ["Corrective Action", capaItems.length+" รายการทั้งหมด", ""],
  ];
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  const capaRows = [["ที่มา","เลขที่อ้างอิง","รายละเอียด","แผนก","ผู้รับผิดชอบ","กำหนดเสร็จ","สถานะ"]]
    .concat(capaItems.map(it=>[it.sourceLabel,it.sourceCode,it.description,it.department||"",it.assignedTo||"",it.dueDate||"",it.status==="closed"?"ปิดแล้ว":"ดำเนินการอยู่"]));
  const wsCapa = XLSX.utils.aoa_to_sheet(capaRows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSummary, "สรุปภาพรวม");
  XLSX.utils.book_append_sheet(wb, wsCapa, "งานแก้ไขทั้งหมด");
  XLSX.writeFile(wb, `SafetyDashboard_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ==================== Fire & Emergency: ตรวจอุปกรณ์ดับเพลิงประจำเดือน ==================== */
function monthlyTypeDone(typeId, monthKey){
  // รอบตรวจเก่าที่ไม่ได้ระบุประเภท (r.type ว่าง) ถือว่าครอบคลุมทุกประเภท
  return state.fireMonthlyChecks.some(r=>r.month===monthKey && (!r.type || r.type===typeId));
}
function monthlyRoundsThisMonth(typeId, monthKey){
  return state.fireMonthlyChecks.filter(r=>r.month===monthKey && (!r.type || r.type===typeId));
}
// บันทึกผลตรวจ 1 ครั้ง (1 ฟอร์ม = อุปกรณ์ 1 ชิ้น) โดยไม่ต้องมีในทะเบียนก่อน
async function submitFireInspection(typeId, header, data){
  const round = {
    id:'fm'+Date.now()+Math.random().toString(36).slice(2,7),
    month: header.date.slice(0,7), type: typeId, date: header.date, time: header.time,
    department: header.department, createdAt: new Date().toISOString(),
    checkedBy: header.checkedBy,
    totalChecked: 1, failCount: data.result==="fail" ? 1 : 0,
    results: [{ equipmentId:null, code:"", type:typeId, location:data.location,
      extType:data.extType||"", extSize:data.extSize||"", extras:data.extras||{}, result:data.result,
      note:data.note||"", items:data.items, photos:data.photos||[] }]
  };
  await saveFireMonthlyChecks(round);
  state.fireMonthlyHeader = { department: header.department, checkedBy: header.checkedBy };
  showToast(`บันทึกผลตรวจ${data.result==="fail"?" (พบข้อที่ไม่ผ่าน)":""} เรียบร้อยแล้ว`);
  render();
}
/* ---- กำหนดตรวจอุปกรณ์ดับเพลิงประจำเดือน: ภายในวันที่ 15 ของเดือน (แยกตามแผนก x ประเภทอุปกรณ์) ---- */
const FIRE_MONTHLY_DEADLINE_DAY = 15;
function fireLocalMonthKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function fireRequiredTypes(){ return FIRE_EQUIPMENT_TYPES.filter(t=>t.id!=="other"); }
function fireRequiredDepts(typeId){
  const ex = ((state.settings.fireMonthlyExempt||{})[typeId])||[];
  return getFireFormConfig(typeId).deptOptions.filter(d=>d!=="อื่นๆ" && !ex.includes(d));
}
function fireDeptDone(typeId, dept, monthKey){
  return state.fireMonthlyChecks.some(r=>r.month===monthKey && (!r.type || r.type===typeId) && r.department===dept);
}
function fireMonthlyMissing(monthKey){
  const out = [];
  fireRequiredTypes().forEach(t=>fireRequiredDepts(t.id).forEach(d=>{ if(!fireDeptDone(t.id,d,monthKey)) out.push({typeId:t.id, dept:d}); }));
  return out;
}
function fireDeadlineStatus(){
  const day = new Date().getDate();
  const left = FIRE_MONTHLY_DEADLINE_DAY - day;
  return { day, left, overdue: left<0 };
}
function fireDeadlineBanner(){
  const mk = fireLocalMonthKey();
  const missing = fireMonthlyMissing(mk);
  const total = fireRequiredTypes().reduce((n,t)=>n+fireRequiredDepts(t.id).length,0);
  const st = fireDeadlineStatus();
  let bg, color, text;
  if(!missing.length){ bg='var(--success-bg)'; color='var(--success)'; text=`✅ เดือนนี้ตรวจครบทุกแผนก ทุกประเภทอุปกรณ์แล้ว (${total}/${total})`; }
  else if(st.overdue){ bg='var(--danger-bg)'; color='var(--danger)'; text=`🚨 เลยกำหนดวันที่ ${FIRE_MONTHLY_DEADLINE_DAY} มาแล้ว ${-st.left} วัน — ยังไม่ได้ตรวจอีก ${missing.length} รายการ จาก ${total}`; }
  else if(st.left<=3){ bg='var(--danger-bg)'; color='var(--danger)'; text=`⏰ เหลืออีก ${st.left===0?'วันนี้วันสุดท้าย':st.left+' วัน'} (กำหนดภายในวันที่ ${FIRE_MONTHLY_DEADLINE_DAY}) — ยังไม่ได้ตรวจ ${missing.length} รายการ จาก ${total}`; }
  else { bg='var(--accent-bg)'; color='var(--accent-ink)'; text=`📅 กำหนดตรวจภายในวันที่ ${FIRE_MONTHLY_DEADLINE_DAY} ของเดือน (เหลือ ${st.left} วัน) — ตรวจแล้ว ${total-missing.length}/${total} รายการ`; }
  return el(`<div style="padding:10px 14px;border-radius:var(--radius);background:${bg};color:${color};font-weight:600;font-size:13.5px;margin-bottom:14px;">${text}</div>`);
}
function buildFireDeadlineCard(){
  const mk = fireLocalMonthKey();
  const st = fireDeadlineStatus();
  const types = fireRequiredTypes();
  const isJp = state.role==="jp" || state.role==="admin";
  const exempt = state.settings.fireMonthlyExempt || {};
  const deptSet = [];
  types.forEach(t=>getFireFormConfig(t.id).deptOptions.forEach(d=>{ if(d!=="อื่นๆ" && !deptSet.includes(d)) deptSet.push(d); }));
  const depts = DEPARTMENTS.filter(d=>deptSet.includes(d));
  const short = t=>t.label.replace(/\s*\(.*\)/,'').replace('ตู้สายฉีดน้ำดับเพลิง','ตู้สายฉีดน้ำ');
  const warnBg = st.overdue ? 'var(--danger-bg)' : 'var(--accent-bg)';
  const warnColor = st.overdue ? 'var(--danger)' : 'var(--accent-ink)';

  const rowsHtml = depts.map(d=>{
    let missCount = 0, reqCount = 0;
    const cells = types.map(t=>{
      const isEx = (exempt[t.id]||[]).includes(d);
      const inCfg = getFireFormConfig(t.id).deptOptions.includes(d);
      if(!inCfg) return `<td style="text-align:center;color:var(--ink-muted);">–</td>`;
      if(isEx) return `<td style="text-align:center;color:var(--ink-muted);font-size:12px;">ไม่มี${isJp?` <button type="button" data-restore="${t.id}|${d}" title="กลับมาต้องตรวจ" style="border:0;background:none;cursor:pointer;">↺</button>`:''}</td>`;
      reqCount++;
      if(fireDeptDone(t.id,d,mk)) return `<td style="text-align:center;color:var(--success);font-weight:700;">✅</td>`;
      missCount++;
      return `<td style="text-align:center;"><button type="button" data-go="${t.id}|${d}" class="badge" style="border:0;cursor:pointer;background:${warnBg};color:${warnColor};">${st.overdue?'เลยกำหนด':'ยังไม่ตรวจ'}</button>${isJp?` <button type="button" data-exempt="${t.id}|${d}" title="แผนกนี้ไม่มีอุปกรณ์ชนิดนี้" style="border:0;background:none;cursor:pointer;color:var(--ink-muted);">✕</button>`:''}</td>`;
    }).join('');
    const sum = missCount ? `<span class="badge badge-danger">ค้าง ${missCount}</span>` : (reqCount ? `<span class="badge badge-success">ครบ</span>` : '-');
    return `<tr><td><b>${d}</b></td>${cells}<td style="text-align:center;">${sum}</td></tr>`;
  }).join('');

  const card = el(`<div class="card" style="margin-bottom:18px;">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;">
      <h3 style="margin:0;font-size:15px;">ความคืบหน้าการตรวจประจำเดือนแยกตามแผนก (กำหนดภายในวันที่ ${FIRE_MONTHLY_DEADLINE_DAY})</h3>
      <button type="button" class="btn btn-outline btn-sm" id="fdCopy">📋 คัดลอกข้อความแจ้งเตือนแผนกที่ค้าง</button>
    </div>
    <p class="hint" style="margin:0 0 8px;">กดปุ่ม "ยังไม่ตรวจ" เพื่อเปิดแบบตรวจของแผนกนั้นได้ทันที${isJp?' · กด ✕ ถ้าแผนกนั้นไม่มีอุปกรณ์ชนิดนั้น (จะไม่ถูกนับว่าค้าง)':''}</p>
    <div style="overflow:auto;max-height:460px;"><table class="permit-table">
      <thead><tr><th>แผนก</th>${types.map(t=>`<th style="text-align:center;">${short(t)}</th>`).join('')}<th style="text-align:center;">สรุป</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
  </div>`);

  card.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const [typeId, dept] = b.getAttribute('data-go').split('|');
    state.fireMonthlyHeader = Object.assign({}, state.fireMonthlyHeader||{}, { department: dept });
    setState({ fireMonthlyType: typeId });
  });
  async function setExempt(attr, on){
    const [typeId, dept] = attr.split('|');
    const cur = new Set((state.settings.fireMonthlyExempt||{})[typeId]||[]);
    if(on) cur.add(dept); else cur.delete(dept);
    state.settings.fireMonthlyExempt = Object.assign({}, state.settings.fireMonthlyExempt, { [typeId]: Array.from(cur) });
    await saveSettings();
    render();
  }
  card.querySelectorAll('[data-exempt]').forEach(b=>b.onclick=()=>{ const a=b.getAttribute('data-exempt'); if(confirm(`ยืนยัน: แผนก "${a.split('|')[1]}" ไม่มีอุปกรณ์ชนิดนี้ (จะไม่ถูกนับว่าค้างตรวจ)?`)) setExempt(a,true); });
  card.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>setExempt(b.getAttribute('data-restore'),false));
  card.querySelector('#fdCopy').onclick = async ()=>{
    const missing = fireMonthlyMissing(mk);
    if(!missing.length){ showToast("เดือนนี้ตรวจครบทุกแผนกแล้ว ไม่มีรายการค้าง"); return; }
    const by = {};
    missing.forEach(m=>{ (by[m.dept] = by[m.dept]||[]).push(short({label:equipmentTypeLabel(m.typeId)})); });
    const head = st.overdue ? `🚨 เลยกำหนดตรวจอุปกรณ์ดับเพลิงประจำเดือน (ภายในวันที่ ${FIRE_MONTHLY_DEADLINE_DAY}) แล้ว ${-st.left} วัน` : `⏰ แจ้งเตือน: ตรวจอุปกรณ์ดับเพลิงประจำเดือนภายในวันที่ ${FIRE_MONTHLY_DEADLINE_DAY} (เหลือ ${st.left} วัน)`;
    const msg = `${head}\nแผนกที่ยังตรวจไม่ครบ (${mk}):\n` + Object.keys(by).map(d=>`• ${d}: ${by[d].join(', ')}`).join('\n');
    try{ await navigator.clipboard.writeText(msg); showToast("คัดลอกข้อความแล้ว นำไปวางในไลน์/WhatsApp ได้เลย"); }
    catch(e){ prompt("คัดลอกข้อความนี้:", msg); }
  };
  return card;
}

function renderFireMonthlyCheck(){
  const dd = new Date();
  const pad2 = n=>String(n).padStart(2,'0');
  const currentMonth = `${dd.getFullYear()}-${pad2(dd.getMonth()+1)}`;
  const todayLocal = `${currentMonth}-${pad2(dd.getDate())}`;
  const nowTime = `${pad2(dd.getHours())}:${pad2(dd.getMinutes())}`;
  const shortLabel = t=>t.label.replace(/\s*\(.*\)/,'');
  const wrap = el(`<div><div class="pagehead"><div><h1>ตรวจอุปกรณ์ดับเพลิงประจำเดือน</h1><p>กดเลือกบล็อกประเภทอุปกรณ์ด้านล่าง แล้วกรอกแบบตรวจ — ตรวจ 1 ชิ้นต่อ 1 แบบฟอร์ม</p></div></div></div>`);

  const FIRE_TYPE_ICONS = {extinguisher:`<svg width="44" height="44" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="16" y="17" width="17" height="27" rx="6" fill="#D6342C"/><rect x="16" y="29" width="17" height="7" fill="#fff"/><rect x="21" y="11" width="7" height="7" rx="1.5" fill="#333"/><path d="M19 10 L31 8" stroke="#333" stroke-width="3" stroke-linecap="round"/><path d="M28 14 Q41 13 39 27" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/><circle cx="24.5" cy="23" r="2.6" fill="#fff" stroke="#333" stroke-width="1"/></svg>`, fire_pump:`<svg width="44" height="44" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="4" y="43" width="40" height="3" rx="1" fill="#555"/><rect x="28" y="20" width="16" height="16" rx="2" fill="#4B5563"/><circle cx="18" cy="30" r="12" fill="#2F7DC1"/><circle cx="18" cy="30" r="5" fill="#fff"/><rect x="14" y="10" width="8" height="10" fill="#2F7DC1"/><rect x="11" y="8" width="14" height="4" rx="1" fill="#1E5E99"/><rect x="4" y="27" width="6" height="6" fill="#1E5E99"/></svg>`, sprinkler:`<svg width="44" height="44" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="21" y="4" width="6" height="12" fill="#888"/><rect x="18" y="14" width="12" height="5" rx="1" fill="#666"/><path d="M19 19 L24 26 L29 19" fill="none" stroke="#666" stroke-width="2"/><rect x="16" y="26" width="16" height="3" rx="1.5" fill="#444"/><g stroke="#2F9BDD" stroke-width="2.4" stroke-linecap="round"><path d="M24 32 L24 42"/><path d="M19 32 L14 41"/><path d="M29 32 L34 41"/><path d="M15 31 L7 36"/><path d="M33 31 L41 36"/></g></svg>`, alarm:"🔔", hose:`<svg width="44" height="44" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="6" y="5" width="36" height="38" rx="3" fill="#D6342C"/><rect x="10" y="9" width="28" height="30" rx="2" fill="#F4F6F7"/><circle cx="24" cy="24" r="10" fill="none" stroke="#D6342C" stroke-width="4"/><circle cx="24" cy="24" r="5.5" fill="none" stroke="#D6342C" stroke-width="3"/><circle cx="24" cy="24" r="2" fill="#D6342C"/><rect x="21" y="41" width="6" height="3" fill="#8E1F19"/></svg>`, fire_truck:"🚒", exit_light:`<svg width="44" height="44" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3" y="12" width="42" height="24" rx="3" fill="#1E9E4F"/><text x="24" y="29.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#fff">EXIT</text></svg>`, other:"📦"};

  // ---------- หน้าแรก: บล็อกย่อยแยกตามประเภทอุปกรณ์ ----------
  if(!FIRE_EQUIPMENT_TYPES.some(t=>t.id===state.fireMonthlyType)){
    wrap.appendChild(fireDeadlineBanner());
    wrap.appendChild(buildFireDeadlineCard());
    const grid = el(`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px;"></div>`);
    FIRE_EQUIPMENT_TYPES.forEach(t=>{
      const n = monthlyRoundsThisMonth(t.id, currentMonth).length;
      const badge = n>0 ? `<span class="badge badge-success">✅ ตรวจเดือนนี้แล้ว</span>` : '<span class="badge badge-danger">⚠ ยังไม่ได้ตรวจ</span>';
      const block = el(`<div class="card" style="cursor:pointer;text-align:center;padding:18px 10px;margin:0;">
        <div style="font-size:34px;line-height:1;margin-bottom:8px;">${FIRE_TYPE_ICONS[t.id]||"🔧"}</div>
        <div style="font-weight:700;font-size:14px;margin-bottom:2px;">${shortLabel(t)}</div>
        <div style="font-size:12px;color:var(--ink-muted);margin-bottom:8px;">ตรวจเดือนนี้ ${n} ครั้ง</div>
        ${badge}
      </div>`);
      block.onclick = ()=>setState({fireMonthlyType:t.id});
      grid.appendChild(block);
    });
    wrap.appendChild(grid);
    if(state.fireMonthlyChecks.length){
      wrap.appendChild(el(`<h3 style="font-size:15px;margin:18px 0 8px;">ประวัติการตรวจล่าสุด</h3>`));
      wrap.appendChild(el(`<div class="card" style="padding:0;overflow:hidden;"><table class="permit-table">
        <thead><tr><th>วันที่</th><th>ประเภท</th><th>สถานที่</th><th>ผู้ตรวจ</th><th>ผล</th></tr></thead>
        <tbody>${state.fireMonthlyChecks.slice(0,10).map(r=>{
          const first = (r.results&&r.results[0])||{};
          return `<tr>
          <td class="code-tag" data-label="วันที่">${r.date}${r.time?' '+r.time:''}</td>
          <td data-label="ประเภท">${r.type ? shortLabel({label:equipmentTypeLabel(r.type)}) : 'ทุกประเภท'}</td>
          <td data-label="สถานที่">${(r.totalChecked>1 ? r.totalChecked+' ชิ้น' : (first.location||'-'))}</td>
          <td data-label="ผู้ตรวจ">${r.checkedBy}</td>
          <td class="status-cell" data-label="ผล">${r.failCount>0?`<span class="badge badge-danger">ไม่ผ่าน ${r.failCount}</span>`:'<span class="badge badge-success">ผ่าน</span>'}</td>
        </tr>`;}).join('')}</tbody>
      </table></div>`));
    }
    return wrap;
  }

  // ---------- หน้าแบบตรวจของประเภทที่เลือก ----------
  const activeType = FIRE_EQUIPMENT_TYPES.find(t=>t.id===state.fireMonthlyType);
  const cfg = getFireFormConfig(activeType.id);
  const flatItems = cfg.sections.flatMap(sec=>sec.items);
  const backBtn = el(`<button type="button" class="btn btn-outline btn-sm" style="margin-bottom:14px;">← กลับไปเลือกประเภทอุปกรณ์</button>`);
  backBtn.onclick = ()=>setState({fireMonthlyType:null});
  wrap.appendChild(backBtn);
  wrap.appendChild(fireDeadlineBanner());
  wrap.appendChild(el(`<h2 style="font-size:17px;margin:0 0 10px;">${cfg.title || activeType.label}</h2>`));

  const teamNames = SAFETY_MEN_LIST;
  const hdr = state.fireMonthlyHeader || {};
  const optHtml = (list)=>list.map(o=>`<option value="${o}">${o}</option>`).join('');
  const firstItemNo = 5 + cfg.extraSelects.length + 1;   // วันที่, เวลา, แผนก, ผู้ตรวจ, สถานที่ + ช่องเลือกเพิ่มเติม
  let runNo = firstItemNo;
  const sectionsHtml = cfg.sections.map((sec, si)=>{
    let idx0 = cfg.sections.slice(0,si).reduce((n,x)=>n+x.items.length,0);
    return `<h3 style="font-size:14.5px;margin:14px 0 4px;">${sec.title} (${sec.items.length} ข้อ)</h3>` + sec.items.map((txt,j)=>{
      const i = idx0 + j;
      return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line);">
        <span style="font-size:13px;flex:1;min-width:200px;">${runNo++}. ${txt} <span class="req">*</span></span>
        <span style="display:flex;gap:16px;">
          <label style="font-size:13px;display:flex;align-items:center;gap:4px;"><input type="radio" name="mitem_${i}" value="pass"> ผ่าน</label>
          <label style="font-size:13px;display:flex;align-items:center;gap:4px;"><input type="radio" name="mitem_${i}" value="fail"> ไม่ผ่าน</label>
        </span>
      </div>`;
    }).join('');
  }).join('');

  const form = el(`<form class="card" id="fireInspForm">
    ${(()=>{
      const deptField = `<div class="field"><label>${cfg.inspectorFirst?4:3}. แผนก <span class="req">*</span></label>
        <select required id="mDept"><option value="" disabled ${cfg.deptOptions.includes(hdr.department)?'':'selected'}>เลือกคำตอบของคุณ</option>${cfg.deptOptions.map(d=>`<option value="${d}" ${hdr.department===d?'selected':''}>${d}</option>`).join('')}</select>
      </div>`;
      const inspField = `<div class="field"><label>${cfg.inspectorFirst?3:4}. ${cfg.inspectorLabel} <span class="req">*</span></label>
        <select id="mInspectorSel"><option value="" disabled ${hdr.checkedBy?'':'selected'}>เลือกคำตอบของคุณ</option>${teamNames.map(n=>`<option value="${n.replace(/"/g,'&quot;')}" ${hdr.checkedBy===n?'selected':''}>${n}</option>`).join('')}<option value="__other">อื่นๆ (พิมพ์ชื่อเอง)</option></select>
        <input type="text" id="mInspectorOther" placeholder="ชื่อผู้ตรวจสอบ" style="display:none;margin-top:6px;">
      </div>`;
      const third = cfg.inspectorFirst ? inspField : deptField;
      const fourth = cfg.inspectorFirst ? deptField : inspField;
      return `<div class="grid3">
        <div class="field"><label>1. วันที่ตรวจสอบ <span class="req">*</span></label><input required type="date" id="mDate" value="${todayLocal}"></div>
        <div class="field"><label>2. เวลา <span class="req">*</span></label><input required type="time" id="mTime" value="${nowTime}"></div>
        ${third}
      </div>${fourth}`;
    })()}
    <div class="${cfg.extraSelects.length>=2?'grid3':(cfg.extraSelects.length===1?'grid2':'')}">
      <div class="field"><label>5. ${cfg.locationLabel} <span class="req">*</span></label><input required type="text" id="mLoc" placeholder="เช่น หน้าโรงงานลูกหีบ จุดที่ 3"></div>
      ${cfg.extraSelects.map((ex,k)=>`<div class="field"><label>${6+k}. ${ex.label} <span class="req">*</span></label><select required data-extra="${k}"><option value="" disabled selected>เลือกคำตอบของคุณ</option>${optHtml(ex.options)}</select></div>`).join('')}
    </div>

    ${sectionsHtml}
    <div style="margin:10px 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button type="button" class="btn btn-outline btn-sm" id="mAllPass">✓ ผ่านทุกข้อ</button>
      <span class="badge badge-wait" id="mSummary">ตอบแล้ว 0/${flatItems.length}</span>
    </div>
    <div class="field" id="mFailExtra" style="display:none;"><label>รายละเอียดข้อที่ไม่ผ่าน</label><input type="text" id="mNote" placeholder="อธิบายสิ่งที่พบ"></div>
    <div class="field"><label>${runNo}. ${cfg.resultLabel} <span class="req">*</span></label>
      <select required id="mResult"><option value="" disabled selected>เลือกคำตอบของคุณ</option><option value="pass">ผ่าน</option><option value="fail">ไม่ผ่าน (ต้องแก้ไข)</option></select>
    </div>
    <div class="field"><label>${runNo+1}. แนบรูป${shortLabel(activeType)} <span class="req">*</span> (อย่างน้อย 1 รูป — สูงสุด ${MAX_PHOTOS} รูป)</label><input required type="file" id="mPhotos" accept="image/*" multiple></div>
    <button class="btn btn-primary" type="submit" id="mSubmit">บันทึกผลตรวจ</button>
  </form>`);
  wrap.appendChild(form);

  const inspSel = form.querySelector('#mInspectorSel');
  const inspOther = form.querySelector('#mInspectorOther');
  inspSel.onchange = ()=>{ inspOther.style.display = inspSel.value==='__other' ? 'block' : 'none'; };

  function refreshSummary(){
    const picked = flatItems.map((_,i)=>form.querySelector(`input[name="mitem_${i}"]:checked`));
    const answered = picked.filter(Boolean).length;
    const failN = picked.filter(r=>r && r.value==='fail').length;
    const sum = form.querySelector('#mSummary');
    const res = form.querySelector('#mResult');
    form.querySelector('#mFailExtra').style.display = failN>0 ? 'block' : 'none';
    if(failN>0){ sum.textContent=`ไม่ผ่าน ${failN} ข้อ`; sum.className='badge badge-danger'; res.value='fail'; }
    else if(answered===flatItems.length){ sum.textContent='ผ่านทุกข้อ'; sum.className='badge badge-success'; res.value='pass'; }
    else { sum.textContent=`ตอบแล้ว ${answered}/${flatItems.length}`; sum.className='badge badge-wait'; }
  }
  form.addEventListener('change', (e)=>{ if(e.target.name && e.target.name.startsWith('mitem_')) refreshSummary(); });
  form.querySelector('#mAllPass').onclick = ()=>{
    form.querySelectorAll('input[type=radio][value=pass]').forEach(r=>{ r.checked = true; });
    refreshSummary();
  };

  form.onsubmit = async (e)=>{
    e.preventDefault();
    const checkedBy = inspSel.value==='__other' ? inspOther.value.trim() : inspSel.value;
    if(!checkedBy){ showToast(`กรุณาเลือก/ระบุ${cfg.inspectorLabel}`); return; }
    for(let i=0;i<flatItems.length;i++){
      if(!form.querySelector(`input[name="mitem_${i}"]:checked`)){ showToast(`กรุณาตอบหัวข้อตรวจให้ครบทุกข้อ (ข้อที่ ${firstItemNo+i})`); return; }
    }
    const fi = form.querySelector('#mPhotos');
    if(fi.files.length<1){ showToast(`กรุณาแนบรูป${shortLabel(activeType)} อย่างน้อย 1 รูป`); return; }
    if(fi.files.length>MAX_PHOTOS){ showToast(`แนบรูปได้ไม่เกิน ${MAX_PHOTOS} รูป`); return; }
    const btn = form.querySelector('#mSubmit');
    btn.disabled = true; btn.textContent = "กำลังบันทึก...";
    let photos = [];
    try{
      const raw = await filesToDataUrls(fi.files);
      photos = await uploadPhotosAndGetUrls(raw, "firemonthly_"+activeType.id+"_"+Date.now());
    }catch(err){
      showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองอีกครั้ง");
      btn.disabled = false; btn.textContent = "บันทึกผลตรวจ";
      return;
    }
    const items = flatItems.map((txt,i)=>({ text: txt, ok: form.querySelector(`input[name="mitem_${i}"]:checked`).value==='pass' }));
    const extras = {}; const legacy = {};
    cfg.extraSelects.forEach((ex,k)=>{
      const v = form.querySelector(`select[data-extra="${k}"]`).value;
      extras[ex.key] = v;
      if(ex.legacy) legacy[ex.legacy] = v;
    });
    await submitFireInspection(activeType.id,
      { date: form.querySelector('#mDate').value, time: form.querySelector('#mTime').value, department: form.querySelector('#mDept').value, checkedBy },
      Object.assign({ location: form.querySelector('#mLoc').value.trim(),
        extras, result: form.querySelector('#mResult').value,
        note: form.querySelector('#mNote').value.trim(), items, photos }, legacy));
  };

  // ---------- ประวัติของประเภทนี้ ----------
  const hist = state.fireMonthlyChecks.filter(r=>!r.type || r.type===activeType.id).slice(0,30);
  if(hist.length){
    wrap.appendChild(el(`<h3 style="font-size:15px;margin:22px 0 8px;">ประวัติการตรวจ — ${shortLabel(activeType)}</h3>`));
    hist.forEach(r=>{
      const results = r.results||[];
      const card = el(`<details class="card" style="margin-bottom:8px;">
        <summary style="cursor:pointer;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;">
          <span style="font-size:13.5px;"><strong>${r.date}${r.time?' '+r.time:''}</strong> · ${r.totalChecked>1 ? r.totalChecked+' ชิ้น' : ((results[0]&&results[0].location)||'-')} · ${r.checkedBy}${r.department?' · '+r.department:''}</span>
          ${r.failCount>0?`<span class="badge badge-danger">ไม่ผ่าน ${r.failCount}</span>`:'<span class="badge badge-success">ผ่าน</span>'}
        </summary>
        <div style="margin-top:10px;">
          ${results.map(x=>`<div style="padding:8px 0;border-top:1px solid var(--line);font-size:13px;">
            <div><strong>${x.code||''} ${x.location||''}</strong> ${(()=>{ const ex = x.extras && Object.keys(x.extras).length ? Object.values(x.extras) : [x.extType,x.extSize]; const t = ex.filter(Boolean).join(' · '); return t ? ' · '+t : ''; })()} ${x.result==='fail'?'<span class="badge badge-danger">ไม่ผ่าน</span>':'<span class="badge badge-success">ผ่าน</span>'}</div>
            ${(x.items&&x.items.some(i=>!i.ok))?`<div style="color:var(--danger);margin-top:3px;">ข้อที่ไม่ผ่าน: ${x.items.filter(i=>!i.ok).map(i=>i.text).join(' / ')}</div>`:''}
            ${x.note?`<div style="color:var(--ink-muted);margin-top:3px;">${x.note}</div>`:''}
            ${(x.photos&&x.photos.length)?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">${x.photos.map(ph=>`<img src="${ph}" style="max-width:120px;border-radius:var(--radius);border:1px solid var(--line);">`).join('')}</div>`:''}
          </div>`).join('')}
        </div>
      </details>`);
      wrap.appendChild(card);
    });
  }
  return wrap;
}

/* ==================== รายงานอุบัติเหตุ: render ==================== */

        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;font-size:15px;">3. ความเสียหายและหลักฐาน</h3>
        <div class="field"><label>ความเสียหายต่อทรัพย์สิน / เครื่องจักร</label><input type="text" name="propertyDamage" placeholder="เช่น ไม่มี / สายพานขาด ประมาณ 5,000 บาท"></div>
        <div class="field" style="margin-bottom:0;"><label>แนบรูปที่เกิดเหตุ (ไม่บังคับ — สูงสุด ${MAX_PHOTOS} รูป)</label><input type="file" id="accPhotos" accept="image/*" multiple></div>
      </div>
      <button class="btn btn-primary" type="submit" id="accSubmit">บันทึกรายงานอุบัติเหตุ</button>
    </form>
  </div>`);

  if(xlCanImport()) wrap.querySelector('#accForm').before(buildAccImportCard());
  const sevSel = wrap.querySelector('#accSeverity');
  sevSel.onchange = ()=>{
    const v = sevSel.value;
    wrap.querySelector('#accInjuredBox').style.display = (v && v!=='none') ? 'block' : 'none';
    wrap.querySelector('#accLostDaysField').style.display = (ACCIDENT_SEVERITIES[v]||{}).lostTime ? 'block' : 'none';
  };
  const personSel = wrap.querySelector('#accPersonType');
  personSel.onchange = ()=>{ wrap.querySelector('#accCompanyField').style.display = personSel.value==='ผู้รับเหมา' ? 'block' : 'none'; };

  wrap.querySelector('#accForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const sev = f.get('severity');
    const hasInjury = sev && sev!=='none';
    const bodyParts = f.getAll('bodyParts');
    if(hasInjury){
      if(!(f.get('injuredName')||'').trim()){ showToast("กรุณาระบุชื่อผู้บาดเจ็บ"); return; }
      if(!f.get('personType')){ showToast("กรุณาเลือกสถานะผู้บาดเจ็บ"); return; }
      if(!bodyParts.length){ showToast("กรุณาเลือกส่วนของร่างกายที่บาดเจ็บอย่างน้อย 1 ส่วน"); return; }
      if(!f.get('injuryType')){ showToast("กรุณาเลือกลักษณะการบาดเจ็บ"); return; }
    }
    const fi = wrap.querySelector('#accPhotos');
    if(fi.files.length>MAX_PHOTOS){ showToast(`แนบรูปได้ไม่เกิน ${MAX_PHOTOS} รูป`); return; }
    const btn = wrap.querySelector('#accSubmit');
    btn.disabled = true; btn.textContent = "กำลังบันทึก...";
    let photos = [];
    if(fi.files.length){
      try{
        const raw = await filesToDataUrls(fi.files);
        photos = await uploadPhotosAndGetUrls(raw, "accident_"+Date.now());
      }catch(err){
        showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองอีกครั้ง");
        btn.disabled = false; btn.textContent = "บันทึกรายงานอุบัติเหตุ";
        return;
      }
    }
    await createAccident({
      date:f.get('date'), time:f.get('time'), department:f.get('department'), location:f.get('location'),
      accidentType:f.get('accidentType'), description:f.get('description'),
      immediateAction:(f.get('immediateAction')||'').trim(), witnesses:(f.get('witnesses')||'').trim(),
      severity:sev, lostDays: (ACCIDENT_SEVERITIES[sev]||{}).lostTime ? Number(f.get('lostDays')||0) : 0,
      injuredName: hasInjury ? f.get('injuredName').trim() : "",
      personType: hasInjury ? f.get('personType') : "",
      injuredCompany: hasInjury && f.get('personType')==='ผู้รับเหมา' ? (f.get('injuredCompany')||'').trim() : "",
      bodyParts: hasInjury ? bodyParts : [], injuryType: hasInjury ? f.get('injuryType') : "",
      propertyDamage:(f.get('propertyDamage')||'').trim(), photos
    });
  };
  return wrap;
}

// แดชบอร์ดสามเหลี่ยมกลับหัว: จำนวนมาตรการแก้ไข/ป้องกันอุบัติเหตุ แยกตามระดับ Hierarchy of Controls
function buildControlsTriangleCard(){
  const counts = {}; CONTROL_LEVELS.forEach(c=>counts[c.id]=0);
  let unset = 0, total = 0;
  state.accidents.forEach(a=>(a.actions||[]).forEach(x=>{ total++; if(counts[x.controlLevel]!==undefined) counts[x.controlLevel]++; else unset++; }));
  const classified = total - unset;
  const strong = counts.elimination + counts.substitution + counts.engineering;
  const strongPct = classified ? Math.round(strong/classified*100) : null;

  const W=760, top=10, bandH=58, gap=3, topW=440, x0=10, cx=x0+topW/2, totalH=bandH*5;
  const halfAt = y => (topW/2) * (1 - (y-top)/totalH);
  let svg = `<svg viewBox="0 0 ${W} ${top+totalH+10}" width="100%" role="img" aria-label="แผนภาพลำดับขั้นการควบคุมความเสี่ยง" xmlns="http://www.w3.org/2000/svg" style="max-width:820px;display:block;margin:0 auto;font-family:inherit;">`;
  CONTROL_LEVELS.forEach((c,i)=>{
    const y1 = top + i*bandH + (i? gap/2:0), y2 = top + (i+1)*bandH - gap/2;
    const h1 = halfAt(y1), h2 = halfAt(y2);
    const midY = (y1+y2)/2;
    svg += `<polygon points="${cx-h1},${y1} ${cx+h1},${y1} ${cx+h2},${y2} ${cx-h2},${y2}" fill="${c.color}"/>`;
    const fs = i>=3 ? 13 : 16;
    svg += `<text x="${cx}" y="${midY-2}" text-anchor="middle" font-weight="700" font-size="${fs}" fill="${c.ink}">${c.short}</text>`;
    svg += `<text x="${cx}" y="${midY+15}" text-anchor="middle" font-size="12.5" fill="${c.ink}">${counts[c.id]} มาตรการ</text>`;
    const lx = cx + (h1+h2)/2 + 6;
    svg += `<line x1="${lx}" y1="${midY}" x2="${x0+topW+30}" y2="${midY}" stroke="#C9D1CE" stroke-width="1.5"/>`;
    svg += `<text x="${x0+topW+38}" y="${midY-2}" font-size="13" font-weight="700" fill="#16232B">${i+1}. ${c.label.replace(/\s*\(.*\)/,'')}</text>`;
    svg += `<text x="${x0+topW+38}" y="${midY+14}" font-size="12" fill="#5B6B70">${c.desc}</text>`;
  });
  svg += `</svg>`;

  const insight = total===0 ? `ยังไม่มีมาตรการแก้ไข/ป้องกันที่บันทึกไว้`
    : classified===0 ? `มี ${total} มาตรการ แต่ยังไม่ได้ระบุระดับ — เลือกระดับตอนเพิ่มมาตรการในรายงานอุบัติเหตุ`
    : `มาตรการระดับสูง (กำจัด/ทดแทน/วิศวกรรม) ${strong} จาก ${classified} มาตรการ = <b>${strongPct}%</b>${strongPct<50?' — ควรเพิ่มมาตรการที่ต้นเหตุมากกว่าการพึ่ง PPE/การอบรม':''}${unset?` · ยังไม่ระบุระดับ ${unset} มาตรการ`:''}`;
  return el(`<div class="card" style="margin-bottom:16px;">
    <h3 style="margin:0 0 2px;font-size:15px;">ลำดับขั้นการควบคุมความเสี่ยง (Hierarchy of Controls)</h3>
    <p class="hint" style="margin:0 0 10px;">มาตรการแก้ไข/ป้องกันจากรายงานอุบัติเหตุทั้งหมด แยกตามประสิทธิผล — ยิ่งอยู่ด้านบนยิ่งได้ผลมาก</p>
    ${svg}
    <p style="margin:10px 0 0;font-size:13px;">${insight}</p>
  </div>`);
}

    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ยังไม่ปิดเคส</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:${open?'var(--danger)':'var(--success)'};">${open}</div></div>
  </div>`));
  wrap.appendChild(buildControlsTriangleCard());
  const table = el(`<div class="card" style="padding:0;overflow:hidden;"><table class="permit-table">
    <thead><tr><th>เลขที่</th><th>วันที่</th><th>แผนก / จุดเกิดเหตุ</th><th>ประเภท</th><th>ผู้บาดเจ็บ</th><th>ความรุนแรง</th><th>สถานะ</th></tr></thead>
    <tbody>${list.map(a=>{
      const sv = ACCIDENT_SEVERITIES[a.severity]||ACCIDENT_SEVERITIES.none;
      return `<tr class="clickable" data-id="${a.id}">
        <td class="code-tag" data-label="เลขที่">${a.code}</td>
        <td data-label="วันที่">${a.date}${a.time?' '+a.time:''}</td>
        <td data-label="แผนก / จุดเกิดเหตุ">${a.department} — ${a.location}</td>
        <td data-label="ประเภท">${a.accidentType}</td>
        <td data-label="ผู้บาดเจ็บ">${a.injuredName||'-'}</td>
        <td data-label="ความรุนแรง"><span class="badge ${sv.cls}">${sv.short}</span></td>
        <td class="status-cell" data-label="สถานะ">${accStatusBadge(a.status)}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`);
  table.querySelectorAll('tr.clickable').forEach(tr=>tr.onclick=()=>setState({accDetailId:tr.dataset.id}));
  wrap.appendChild(table);
  return wrap;
}

function renderAccActionsList(container, acc){
  const actions = acc.actions || [];
  container.innerHTML = (actions.length===0 ? '<p class="hint">ยังไม่มีมาตรการแก้ไข/ป้องกัน</p>' : '') + actions.map(a=>`
    <div class="card" style="padding:12px 14px;margin-bottom:8px;" data-action-id="${a.id}">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start;">
        <div style="flex:1;min-width:200px;font-size:13.5px;">${a.description}${controlLevelOf(a.controlLevel)?` <span class="badge" style="background:${controlLevelOf(a.controlLevel).color};color:${controlLevelOf(a.controlLevel).ink};margin-left:6px;">${controlLevelOf(a.controlLevel).short}</span>`:''}</div>
        ${a.status==='closed' ? '<span class="badge badge-success">ปิดแล้ว</span>' : '<span class="badge badge-danger">ค้างดำเนินการ</span>'}
      </div>
      ${(a.assignedTo||a.dueDate)?`<div style="font-size:12px;color:var(--ink-muted);margin-top:4px;">${a.assignedTo?`มอบหมาย: ${a.assignedTo}`:''}${a.dueDate?` · กำหนดเสร็จ: ${a.dueDate}`:''}</div>`:''}
      ${a.status!=='closed' ? `<div class="no-print" style="margin-top:8px;"><button type="button" class="btn btn-success btn-sm" data-a-close>✓ ปิดมาตรการนี้</button></div>`
        : `<div class="no-print" style="margin-top:8px;font-size:12px;color:var(--ink-muted);">ปิดโดย ${a.closedBy||'(ไม่ระบุ)'} เมื่อ ${a.closedAt?new Date(a.closedAt).toLocaleString('th-TH'):''}${a.closeNote?` — ${a.closeNote}`:''}
          <button type="button" class="btn btn-outline btn-sm" data-a-reopen style="margin-left:8px;">เปิดใหม่</button></div>`}
    </div>`).join('');
  container.querySelectorAll('[data-action-id]').forEach(card=>{
    const aid = card.dataset.actionId;
    const cb = card.querySelector('[data-a-close]');
    if(cb) cb.onclick = async ()=>{ const note = prompt("หมายเหตุการปิดมาตรการ (ถ้ามี)", ""); if(note===null) return; await closeAccAction(acc, aid, note); };
    const rb = card.querySelector('[data-a-reopen]');
    if(rb) rb.onclick = async ()=>{ await reopenAccAction(acc, aid); };
  });
}

  inner.querySelector('#accSaveInvBtn').onclick = async ()=>{
    const inv = inner.querySelector('#accInvestigator').value.trim();
    const rc = inner.querySelector('#accRootCause').value.trim();
    if(!inv || !rc){ showToast("กรุณากรอกผู้สอบสวนและสาเหตุที่แท้จริง"); return; }
    await saveAccInvestigation(acc, inv, rc);
  };
  inner.querySelector('#accAddActBtn').onclick = async ()=>{
    const desc = inner.querySelector('#accActDesc').value.trim();
    if(!desc){ showToast("กรุณากรอกรายละเอียดมาตรการ"); return; }
    await addAccAction(acc, desc, inner.querySelector('#accActWho').value.trim(), inner.querySelector('#accActDue').value, inner.querySelector('#accActLevel').value);
  };
  const cb = inner.querySelector('#accCloseBtn');
  if(cb) cb.onclick = async ()=>{ if(!confirm(`ยืนยันปิดเคส ${acc.code}?`)) return; await setAccStatus(acc, "closed"); };
  const rb = inner.querySelector('#accReopenBtn');
  if(rb) rb.onclick = async ()=>{ await setAccStatus(acc, "investigating"); };
  const db = inner.querySelector('#accDeleteBtn');

  renderAccActionsList(inner.querySelector('#accActionsList'), acc);
}

/* ==================== Safety KPI: render ==================== */
function kpiGaugeCard(label, actual, target, unit, lowerIsBetter, note){
  const good = lowerIsBetter ? actual<=target : actual>=target;
  const pct = target>0 ? Math.min(Math.round((lowerIsBetter ? (target/Math.max(actual,0.0001)) : (actual/target))*100), 150) : 0;
  const barPct = Math.min(pct,100);
  const color = good ? "var(--success)" : "var(--danger)";
  return `<div class="card">
    <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:4px;">${label}</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px;">
      <div style="font-family:'Oswald',sans-serif;font-size:28px;color:${color};">${actual}${unit}</div>
      <div style="font-size:12px;color:var(--ink-muted);">เป้าหมาย ${target}${unit}</div>
    </div>
    <div style="background:var(--bg);border-radius:6px;overflow:hidden;height:10px;"><div style="width:${barPct}%;background:${color};height:100%;"></div></div>
    ${note?`<div style="font-size:11.5px;color:var(--ink-muted);margin-top:6px;">${note}</div>`:''}
  </div>`;
}

function computeSafetyInsights(){
  const insights = [];
  const today = new Date();
  const thisMonthStart = new Date(today.getFullYear(), today.getMonth()-2, 1);
  const prevMonthStart = new Date(today.getFullYear(), today.getMonth()-5, 1);
  const inRange = (dateStr, from, to)=>{ const d=new Date(dateStr); return d>=from && d<to; };
  const eventDates = [
    ...state.nearMisses.map(r=>r.date), ...state.accidents.map(a=>a.date), ...state.fireIncidents.map(i=>i.date)
  ];
  const recent3 = eventDates.filter(d=>inRange(d, thisMonthStart, new Date(today.getFullYear(),today.getMonth()+1,1))).length;
  const prev3 = eventDates.filter(d=>inRange(d, prevMonthStart, thisMonthStart)).length;
  if(prev3>0){
    const diffPct = Math.round(((recent3-prev3)/prev3)*100);
    if(diffPct>=20) insights.push({level:"danger", icon:"📈", text:`เหตุการณ์ด้านความปลอดภัย (อุบัติเหตุ+Near Miss+เหตุฉุกเฉิน) 3 เดือนล่าสุดเพิ่มขึ้น ${diffPct}% เทียบ 3 เดือนก่อนหน้า (${recent3} เทียบ ${prev3} ครั้ง) — ควรทบทวนมาตรการป้องกัน`});
    else if(diffPct<=-20) insights.push({level:"good", icon:"📉", text:`เหตุการณ์ด้านความปลอดภัย 3 เดือนล่าสุดลดลง ${Math.abs(diffPct)}% เทียบ 3 เดือนก่อนหน้า — แนวโน้มดีขึ้น`});
  } else if(recent3>0){
    insights.push({level:"warn", icon:"📈", text:`พบเหตุการณ์ด้านความปลอดภัย ${recent3} ครั้งใน 3 เดือนล่าสุด (ก่อนหน้านี้ไม่มีข้อมูลเทียบ)`});
  }

  const deptCount = {};
  state.inspections.forEach(i=>(i.findings||[]).filter(f=>f.status!=="closed").forEach(()=>{ deptCount[i.department]=(deptCount[i.department]||0)+1; }));
  state.nearMisses.forEach(r=>(r.actions||[]).filter(a=>a.status!=="closed").forEach(()=>{ deptCount[r.department]=(deptCount[r.department]||0)+1; }));
  state.accidents.forEach(a=>(a.actions||[]).filter(x=>x.status!=="closed").forEach(()=>{ deptCount[a.department]=(deptCount[a.department]||0)+1; }));
  const topDept = Object.entries(deptCount).sort((a,b)=>b[1]-a[1])[0];
  if(topDept && topDept[1]>=3) insights.push({level:"warn", icon:"🏭", text:`แผนก "${topDept[0]}" มีข้อบกพร่อง/มาตรการค้างดำเนินการมากที่สุด (${topDept[1]} รายการ) — ควรลงพื้นที่ตรวจเพิ่มเติม`});

  const eqFailCount = {};
  state.fireEquipment.forEach(eq=>{
    const fails = (eq.checks||[]).filter(c=>c.result==="fail").length;
    if(fails>=2) eqFailCount[eq.code] = {fails, type:equipmentTypeLabel(eq.type), location:eq.location};
  });
  const repeatEq = Object.entries(eqFailCount).sort((a,b)=>b[1].fails-a[1].fails)[0];
  if(repeatEq) insights.push({level:"danger", icon:"🔧", text:`อุปกรณ์ ${repeatEq[0]} (${repeatEq[1].type} — ${repeatEq[1].location}) ไม่ผ่านการตรวจซ้ำ ${repeatEq[1].fails} ครั้ง — อาจต้องเปลี่ยนหรือซ่อมถาวรแทนการแก้ไขชั่วคราว`});

  const capaItems = allCorrectiveItems();
  const openCapa = capaItems.filter(it=>it.status!=="closed");
  const overdueCapa = openCapa.filter(it=>it.dueDate && it.dueDate<today.toISOString().slice(0,10));
  if(openCapa.length>0){
    const rate = Math.round((overdueCapa.length/openCapa.length)*100);
    if(rate>=30) insights.push({level:"danger", icon:"⏰", text:`งานแก้ไข (CAPA) ที่ค้างอยู่ ${overdueCapa.length}/${openCapa.length} รายการ (${rate}%) เกินกำหนดเวลาแล้ว — ควรติดตามผู้รับผิดชอบ`});
  }

  const fireAttention = state.fireEquipment.filter(eq=>equipmentStatus(eq).cls==="badge-danger").length;
  if(fireAttention>0) insights.push({level:"danger", icon:"🔥", text:`มีอุปกรณ์ดับเพลิง ${fireAttention} ชิ้นที่ต้องแก้ไขหรือหมดอายุ — ตรวจสอบที่เมนู Fire → ทะเบียนอุปกรณ์ดับเพลิง`});

  const blacklisted = state.contractors.filter(c=>c.general&&c.general.blacklisted);
  if(blacklisted.length>0) insights.push({level:"warn", icon:"👷", text:`มีผู้รับเหมา ${blacklisted.length} บริษัทติดบัญชีดำ (Blacklist) — ตรวจสอบก่อนอนุมัติใบขออนุญาตทำงานใหม่`});

  const daysWithoutIncident = (()=>{
    const sorted = allIncidentRecords().sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(!sorted.length) return null;
    return Math.floor((new Date().setHours(0,0,0,0) - new Date(sorted[0].date).setHours(0,0,0,0))/86400000);
  })();
  if(daysWithoutIncident!==null && daysWithoutIncident>=90) insights.push({level:"good", icon:"🏆", text:`ไม่เกิดอุบัติเหตุมาแล้ว ${daysWithoutIncident} วันติดต่อกัน — รักษามาตรฐานนี้ไว้`});

  if(insights.length===0) insights.push({level:"good", icon:"✅", text:"ไม่พบสัญญาณผิดปกติที่เด่นชัดในข้อมูลปัจจุบัน — ระบบจะวิเคราะห์ใหม่ทุกครั้งที่มีข้อมูลเพิ่ม"});
  return insights;
}
function renderAiInsights(){
  const wrap = el(`<div><div class="pagehead"><div><h1>🤖 ข้อมูลเชิงลึกอัตโนมัติ</h1><p>วิเคราะห์แนวโน้ม จุดเสี่ยง และความผิดปกติจากข้อมูลจริงในระบบทั้งหมดโดยอัตโนมัติ (ประมวลผลในเครื่อง ไม่ส่งข้อมูลออกไปที่ใด)</p></div></div></div>`);

      <div style="font-size:13.5px;line-height:1.5;">${ins.text}</div>

  });

const AI_PROVIDERS = {
  anthropic: { label:"Claude (Anthropic)", defaultModel:"claude-sonnet-4-5", keyHint:"ขึ้นต้นด้วย sk-ant-..." },
  openai:    { label:"ChatGPT (OpenAI)",    defaultModel:"gpt-4o-mini",      keyHint:"ขึ้นต้นด้วย sk-..." }
};
function loadAiSettings(){
  try{
    const raw = localStorage.getItem("safetyAiSettings");
    if(raw){
      const s = JSON.parse(raw);
      state.aiProvider = s.provider || "anthropic";
      state.aiModel = s.model || "";
      state.aiApiKey = s.apiKey || "";
      state.aiIncludeContext = s.includeContext!==false;
      state.aiMessages = Array.isArray(s.messages) ? s.messages : [];
    }
  }catch(e){ /* localStorage ใช้ไม่ได้ (โหมดส่วนตัว ฯลฯ) — ใช้ค่าเริ่มต้นแทน */ }
}
function persistAiSettings(){
  try{
    localStorage.setItem("safetyAiSettings", JSON.stringify({
      provider: state.aiProvider, model: state.aiModel, apiKey: state.aiApiKey,
      includeContext: state.aiIncludeContext, messages: state.aiMessages.slice(-40)
    }));
  }catch(e){ /* บันทึกไม่ได้ก็ปล่อยผ่าน ไม่กระทบการใช้งานหลัก */ }
}
function buildSafetyContextSummary(){
  const items = allCorrectiveItems();
  const today = new Date().toISOString().slice(0,10);
  return JSON.stringify({
    permits_total: state.permits.length,
    inspections_total: state.inspections.length,
    inspection_open_findings: state.inspections.reduce((s,i)=>s+(i.findings||[]).filter(f=>f.status!=="closed").length,0),
    near_miss_total: state.nearMisses.length,
    near_miss_open: state.nearMisses.filter(r=>r.status!=="closed").length,
    accidents_total: state.accidents.length,
    contractors_total: state.contractors.length,

    capa_open: items.filter(it=>it.status!=="closed").length,

async function callAiProvider(userText){
  const provider = state.aiProvider;
  const apiKey = state.aiApiKey.trim();
  const model = (state.aiModel||"").trim() || AI_PROVIDERS[provider].defaultModel;
  const sysPrompt = "คุณเป็นผู้ช่วยด้านความปลอดภัยในการทำงาน (Safety AI) ให้กับโรงงานน้ำตาลมิตรลาว ตอบเป็นภาษาไทย กระชับ นำไปใช้ได้จริง"
    + (state.aiIncludeContext ? ("\n\nข้อมูลสรุปสถานะความปลอดภัยปัจจุบันจากระบบ (JSON):\n"+buildSafetyContextSummary()) : "");
  const history = state.aiMessages.slice(-16).map(m=>({role:m.role, content:m.text}));
  history.push({role:"user", content:userText});
  if(provider==="anthropic"){
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model, max_tokens:1024, system:sysPrompt, messages: history })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error((data.error&&data.error.message) || `HTTP ${resp.status}`);
    return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim() || "(ไม่มีข้อความตอบกลับ)";
  } else {
    const resp = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+apiKey },
      body: JSON.stringify({ model, messages:[{role:"system",content:sysPrompt}, ...history] })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error((data.error&&data.error.message) || `HTTP ${resp.status}`);
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "(ไม่มีข้อความตอบกลับ)";
  }
}

    <p style="margin:6px 0 0;font-size:13px;">API Key จะถูกบันทึกไว้ในเบราว์เซอร์นี้เท่านั้น (localStorage) ไม่ถูกส่งขึ้นฐานข้อมูลกลางของระบบ — <strong>ห้ามใช้ฟีเจอร์นี้บนคอมพิวเตอร์สาธารณะหรือเครื่องที่ใช้ร่วมกับผู้อื่น</strong> และควรตั้งวงเงินการใช้งาน (usage limit) ของ API Key ไว้เสมอ เนื่องจากไฟล์นี้เป็น HTML ไฟล์เดี่ยวไม่มีเซิร์ฟเวอร์หลังบ้าน การเรียก AI จึงทำจากเบราว์เซอร์โดยตรง ผู้ให้บริการบาง API อาจปฏิเสธการเรียกจากเบราว์เซอร์ (CORS) ได้เช่นกัน</p>
  </div>`));

  const settingsCard = el(`<div class="card" style="margin-bottom:14px;">
    <h3 style="margin-top:0;font-size:14.5px;">ตั้งค่า AI</h3>
    <div class="grid3">
      <div class="field"><label>ผู้ให้บริการ</label><select id="aiProviderSel">${Object.entries(AI_PROVIDERS).map(([k,v])=>`<option value="${k}" ${state.aiProvider===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
      <div class="field"><label>โมเดล (เว้นว่างใช้ค่าเริ่มต้น)</label><input type="text" id="aiModelInput" placeholder="${AI_PROVIDERS[state.aiProvider].defaultModel}" value="${state.aiModel||''}"></div>
      <div class="field"><label>API Key <span id="aiKeyHint" style="font-weight:400;color:var(--ink-muted);">(${AI_PROVIDERS[state.aiProvider].keyHint})</span></label><input type="password" id="aiKeyInput" placeholder="วาง API Key ของคุณที่นี่" value="${state.aiApiKey||''}"></div>
    </div>
    <label class="checkrow" style="margin-top:4px;"><input type="checkbox" id="aiCtxCheck" ${state.aiIncludeContext?'checked':''}> แนบสรุปสถานะความปลอดภัยปัจจุบันไปกับคำถาม (ช่วยให้ AI ตอบเกี่ยวกับข้อมูลจริงในระบบได้)</label>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
      <button type="button" class="btn btn-outline btn-sm" id="aiSaveSettingsBtn">บันทึกการตั้งค่า</button>
      <button type="button" class="btn btn-outline btn-sm" id="aiClearKeyBtn">ลบ API Key ที่บันทึกไว้</button>
      <button type="button" class="btn btn-outline btn-sm" id="aiClearChatBtn">ล้างประวัติแชท</button>
    </div>
  </div>`);
  wrap.appendChild(settingsCard);
  const providerSel = settingsCard.querySelector('#aiProviderSel');
  providerSel.onchange = ()=>{
    settingsCard.querySelector('#aiModelInput').placeholder = AI_PROVIDERS[providerSel.value].defaultModel;
    settingsCard.querySelector('#aiKeyHint').textContent = `(${AI_PROVIDERS[providerSel.value].keyHint})`;
  };
  settingsCard.querySelector('#aiSaveSettingsBtn').onclick = ()=>{
    state.aiProvider = providerSel.value;
    state.aiModel = settingsCard.querySelector('#aiModelInput').value.trim();
    state.aiApiKey = settingsCard.querySelector('#aiKeyInput').value.trim();
    state.aiIncludeContext = settingsCard.querySelector('#aiCtxCheck').checked;
    persistAiSettings();
    showToast("บันทึกการตั้งค่า AI แล้ว (เก็บในเบราว์เซอร์นี้เท่านั้น)");
  };
  settingsCard.querySelector('#aiClearKeyBtn').onclick = ()=>{
    state.aiApiKey = ""; settingsCard.querySelector('#aiKeyInput').value = "";
    persistAiSettings();
    showToast("ลบ API Key ที่บันทึกไว้แล้ว");
  };
  settingsCard.querySelector('#aiClearChatBtn').onclick = ()=>{
    state.aiMessages = []; persistAiSettings(); render();
  };

  const chatBox = el(`<div class="card" id="aiChatBox" style="min-height:200px;max-height:420px;overflow-y:auto;margin-bottom:10px;"></div>`);
  function paintChat(){
    if(state.aiMessages.length===0){
      chatBox.innerHTML = `<p class="hint" style="margin:0;">ยังไม่มีข้อความ — ลองถามเช่น "สรุปความเสี่ยงด้านความปลอดภัยตอนนี้" หรือ "แนะนำวิธีลดอุบัติเหตุในแผนกลูกหีบ"</p>`;
      return;
    }
    chatBox.innerHTML = state.aiMessages.map(m=>`
      <div style="margin-bottom:12px;display:flex;${m.role==='user'?'justify-content:flex-end;':''}">
        <div style="max-width:80%;padding:8px 12px;border-radius:10px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;background:${m.role==='user'?'var(--accent-bg)':'var(--bg)'};color:${m.role==='user'?'var(--accent-ink)':'var(--ink)'};">${m.text.replace(/</g,'&lt;')}</div>
      </div>`).join('');
    chatBox.scrollTop = chatBox.scrollHeight;
  }
  paintChat();
  wrap.appendChild(chatBox);

  const inputRow = el(`<form id="aiChatForm" style="display:flex;gap:8px;">
    <input type="text" id="aiChatInput" placeholder="พิมพ์คำถามเกี่ยวกับความปลอดภัย..." style="flex:1;" required>
    <button class="btn btn-primary" type="submit" id="aiSendBtn">ส่ง</button>
  </form>`);
  wrap.appendChild(inputRow);

  inputRow.onsubmit = async (e)=>{
    e.preventDefault();
    const input = inputRow.querySelector('#aiChatInput');
    const text = input.value.trim();
    if(!text) return;
    if(!state.aiApiKey){ showToast("กรุณาใส่และบันทึก API Key ก่อนเริ่มแชท"); return; }
    state.aiMessages.push({role:"user", text});
    input.value = "";
    paintChat();
    const sendBtn = inputRow.querySelector('#aiSendBtn');
    sendBtn.disabled = true; sendBtn.textContent = "กำลังคิด...";
    try{
      const reply = await callAiProvider(text);
      state.aiMessages.push({role:"assistant", text: reply});
    }catch(err){
      state.aiMessages.push({role:"assistant", text: `⚠ เรียก AI ไม่สำเร็จ: ${err.message}\n\nสาเหตุที่พบบ่อย: API Key ไม่ถูกต้อง, เครดิตหมด, หรือผู้ให้บริการปฏิเสธการเรียกจากเบราว์เซอร์โดยตรง (CORS) — ลองตรวจสอบ API Key หรือเปลี่ยนผู้ให้บริการ`});
    }
    persistAiSettings();
    sendBtn.disabled = false; sendBtn.textContent = "ส่ง";
    paintChat();
  };
  return wrap;
}

function mountLoginModal(){
  const bg = document.getElementById('modalBg');
  const inner = document.getElementById('modalInner');
  bg.onclick = (e)=>{ if(e.target===bg){ const ret = state.loginReturnPermit; setState(ret ? {showLoginModal:false, pendingModule:null, loginReturnPermit:null, detailId:ret} : {showLoginModal:false, pendingModule:null}); } };
  inner.innerHTML = `
    <button class="modal-close" id="closeLoginModal">×</button>
    <h2 style="margin:0 0 4px;font-size:19px;">🔒 เข้าสู่ระบบ</h2>
    <p style="color:var(--ink-muted);margin:0 0 16px;font-size:13px;">โมดูลนี้ต้องเข้าสู่ระบบก่อนใช้งาน (ยกเว้น Work Permit Online ที่ใช้ได้โดยไม่ต้องล็อกอิน)</p>
    <form id="loginForm">
      <div class="field"><label>ชื่อผู้ใช้</label>
        <select required id="loginUsername" autocomplete="username">
          <option value="" disabled selected>เลือกชื่อผู้ใช้</option>
          ${USER_ACCOUNTS.map(a=>`<option value="${a.username}">${a.name} (${a.username})</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>รหัสผ่าน</label><input required type="password" id="loginPassword" autocomplete="current-password"></div>
      <label class="checkrow" style="margin-bottom:12px;"><input type="checkbox" id="loginRemember" checked> จดจำการเข้าสู่ระบบในเครื่องนี้ (ไม่ต้องล็อกอินซ้ำครั้งหน้า)</label>
      <div id="loginError" style="display:none;color:var(--danger);font-size:12.5px;margin-bottom:10px;">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
      <button class="btn btn-primary" type="submit" style="width:100%;">เข้าสู่ระบบ</button>
    </form>
  `;
  inner.querySelector('#closeLoginModal').onclick = ()=>{ const ret = state.loginReturnPermit; setState(ret ? {showLoginModal:false, pendingModule:null, loginReturnPermit:null, detailId:ret} : {showLoginModal:false, pendingModule:null}); };
  inner.querySelector('#loginForm').onsubmit = (e)=>{
    e.preventDefault();
    const username = inner.querySelector('#loginUsername').value.trim();
    const password = inner.querySelector('#loginPassword').value;
    const remember = inner.querySelector('#loginRemember').checked;
    const ok = attemptLogin(username, password, remember);
    if(!ok){ inner.querySelector('#loginError').style.display = 'block'; return; }
    const m = state.pendingModule || "permit";
    const defaultRoute = m==="inspection" ? "insp_list" : m==="nearmiss" ? "nm_list" : m==="contractor" ? "contractors" : m==="fire" ? "fire_monthly" : m==="capa" ? "capa_all" : m==="overview" ? "safety_overview" : m==="kpi" ? "kpi_dashboard" : m==="ai" ? "ai_insights" : "new";
    showToast(`ยินดีต้อนรับ ${state.authUser.name}`);
    if(state.loginReturnPermit){ const ret = state.loginReturnPermit; setState({ showLoginModal:false, pendingModule:null, loginReturnPermit:null, appModule:"permit", route:"all", detailId:ret }); return; }
    setState({ showLoginModal:false, pendingModule:null, appModule:m, route:defaultRoute, fireMonthlyType:null });
  };
}

      </div>
      <div class="grid3">
        <div class="field"><label>เจ้าของเอกสาร (Process Owner)</label><input type="text" name="owner" placeholder="ชื่อ-ตำแหน่ง"></div>
        <div class="field"><label>วันที่มีผลบังคับใช้</label><input type="date" name="effectiveDate"></div>

    ${state.role==='admin' ? `<div class="card" style="margin-top:16px;border-color:#E3C1B3;">

      <button type="button" class="btn btn-danger" id="deleteDocBtn">🗑 ลบเอกสารนี้ออกจากทะเบียน</button>
    </div>` : ''}
  `;
  inner.querySelector('#closeDocModal').onclick = ()=>setState({docDetailId:null});
  const addCopyBtn = inner.querySelector('#addCopyBtn');
  if(addCopyBtn) addCopyBtn.onclick = async ()=>{
    const holder = inner.querySelector('#copyHolder').value.trim();
    const loc = inner.querySelector('#copyLocation').value.trim();
    if(!holder || !loc){ showToast("กรุณากรอกชื่อผู้ถือสำเนาและสถานที่"); return; }
    await addControlledCopy(doc, holder, loc);
  };
  inner.querySelectorAll('[data-remove-copy]').forEach(btn=>{
    btn.onclick = ()=>removeControlledCopy(doc, Number(btn.getAttribute('data-remove-copy')));
  });
  const toReviewBtn = inner.querySelector('#toReviewBtn');
  if(toReviewBtn) toReviewBtn.onclick = ()=>setDocStatus(doc, "review");
  const toControlledBtn = inner.querySelector('#toControlledBtn');
  if(toControlledBtn) toControlledBtn.onclick = ()=>setDocStatus(doc, "controlled");
  const toggleLockBtn = inner.querySelector('#toggleLockBtn');
  if(toggleLockBtn) toggleLockBtn.onclick = ()=>toggleMasterLock(doc);
  const reviseBtn = inner.querySelector('#reviseBtn');
  if(reviseBtn) reviseBtn.onclick = async ()=>{
    const v = inner.querySelector('#reviseVersion').value.trim();
    const desc = inner.querySelector('#reviseDesc').value.trim();
    const darNo = inner.querySelector('#reviseDar').value.trim();
    if(!v || !desc){ showToast("กรุณากรอกฉบับที่ใหม่และรายละเอียดการเปลี่ยนแปลง"); return; }
    await reviseDocument(doc, v, desc, darNo);
  };
  const obsoleteBtn = inner.querySelector('#obsoleteBtn');
  if(obsoleteBtn) obsoleteBtn.onclick = async ()=>{
    const reason = inner.querySelector('#obsoleteReason').value.trim();
    if(!confirm(`ยืนยันยกเลิกเอกสาร ${doc.docNo}?`)) return;
    await markObsolete(doc, reason);
  };
  const deleteBtn = inner.querySelector('#deleteDocBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    if(!(await requireAdmin(`ยืนยันลบเอกสาร ${doc.docNo} ออกจากทะเบียนอย่างถาวร?`))) return;
    await deleteDocument(doc.id);
  };
}

  const existingDocNos = state.safetyDocs.map(d=>`${d.docNo} — ${d.title}`);
  wrap.appendChild(el(`<details class="card" style="margin-bottom:14px;" ${state.dars.length===0?'open':''}>
    <summary style="cursor:pointer;font-weight:700;font-size:14px;">+ สร้างคำขอใหม่ (DAR)</summary>

      <div class="grid3">
        <div class="field"><label>ประเภทคำขอ <span class="req">*</span></label><select required name="type" id="darType">${DAR_TYPES.map(t=>`<option value="${t.id}">${t.label}</option>`).join('')}</select></div>
        <div class="field"><label>วันที่ยื่นคำขอ <span class="req">*</span></label><input required type="date" name="requestDate" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>ผู้ยื่นคำขอ <span class="req">*</span></label><input required type="text" name="requestedBy" placeholder="ชื่อ-ตำแหน่ง"></div>
      </div>
      <div class="field" id="darDocNoField" style="display:none;"><label>เอกสารที่เกี่ยวข้อง <span class="req">*</span></label>
        <select name="docNo" id="darDocNoSelect"><option value="" disabled selected>เลือกเอกสาร</option>${state.safetyDocs.map(d=>`<option value="${d.docNo}">${d.docNo} — ${d.title}</option>`).join('')}</select>
      </div>
      <div class="grid3" id="darNewFields">
        <div class="field"><label>ชื่อเอกสาร <span class="req">*</span></label><input type="text" name="title" placeholder="ชื่อเอกสารที่ต้องการจัดทำ"></div>
        <div class="field"><label>ประเภทเอกสาร</label><select name="category">${DOC_CATEGORIES.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}</select></div>

      </div>
      <div class="field"><label>เจ้าของเอกสาร (Process Owner)</label><input type="text" name="owner" placeholder="ชื่อ-ตำแหน่ง"></div>
      <div class="field"><label>เหตุผล/รายละเอียดคำขอ <span class="req">*</span></label><textarea required name="reason" placeholder="เหตุผลของการจัดทำ/แก้ไข/ยกเลิกเอกสารนี้"></textarea></div>
      <button class="btn btn-primary btn-sm" type="submit">ส่งคำขอ</button>
    </form>
  </details>`));

  const typeSel = wrap.querySelector('#darType');
  const docNoField = wrap.querySelector('#darDocNoField');
  const newFields = wrap.querySelector('#darNewFields');
  function refreshDarFields(){
    const isNew = typeSel.value==='new';
    docNoField.style.display = isNew ? 'none' : '';
    newFields.style.display = isNew ? '' : 'none';
    wrap.querySelector('#darDocNoSelect').required = !isNew;
    wrap.querySelector('[name=title]').required = isNew;
    wrap.querySelector('[name=department]').required = isNew;
  }
  typeSel.onchange = refreshDarFields;
  refreshDarFields();

  wrap.querySelector('#darForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);

      docNo = f.get('docNo');

      if(!title || !department){ showToast("กรุณากรอกชื่อเอกสารและแผนก"); return; }

    <thead><tr><th>เลขที่คำขอ</th><th>ประเภท</th><th>เอกสาร</th><th>ผู้ยื่นคำขอ</th><th>วันที่</th><th>สถานะ</th></tr></thead>

      <td data-label="ประเภท">${(DAR_TYPES.find(t=>t.id===d.type)||{}).label||d.type}</td>
      <td data-label="เอกสาร">${d.docNo?`${d.docNo} — `:''}${d.title}</td>
      <td data-label="ผู้ยื่นคำขอ">${d.requestedBy}</td>
      <td data-label="วันที่">${d.requestDate}</td>
      <td class="status-cell" data-label="สถานะ">${darStatusBadge(d.status)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`);
  table.querySelectorAll('tr.clickable').forEach(tr=>tr.onclick=()=>setState({darDetailId:tr.dataset.id}));
  wrap.appendChild(table);
  return wrap;
}
