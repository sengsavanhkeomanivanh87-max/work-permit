  render();
}
/* ---- กำหนดตรวจอุปกรณ์ดับเพลิงประจำเดือน: ภายในวันที่ 15 ของเดือน (แยกตามแผนก x ประเภทอุปกรณ์) ---- */
const FIRE_MONTHLY_DEADLINE_DAY = 15;
function fireLocalMonthKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function fireRequiredTypes(){ return FIRE_EQUIPMENT_TYPES.filter(t=>t.id!=="other"); }
function fireRequiredDepts(typeId){
  const ex = ((state.settings.fireMonthlyExempt||{})[typeId])||[];
  return getFireFormConfig(typeId).deptOptions.filter(d=>d!=="อื่นๆ" && !ex.includes(d));
}
function fireDeptDone(typeId, dept, monthKey){
  return state.fireMonthlyChecks.some(r=>r.month===monthKey && (!r.type || r.type===typeId) && r.department===dept);
}
function fireMonthlyMissing(monthKey){
  const out = [];
  fireRequiredTypes().forEach(t=>fireRequiredDepts(t.id).forEach(d=>{ if(!fireDeptDone(t.id,d,monthKey)) out.push({typeId:t.id, dept:d}); }));
  return out;
}
function fireDeadlineStatus(){
  const day = new Date().getDate();
  const left = FIRE_MONTHLY_DEADLINE_DAY - day;
  return { day, left, overdue: left<0 };
}
function fireDeadlineBanner(){
  const mk = fireLocalMonthKey();
  const missing = fireMonthlyMissing(mk);
  const total = fireRequiredTypes().reduce((n,t)=>n+fireRequiredDepts(t.id).length,0);
  const st = fireDeadlineStatus();
  let bg, color, text;
  if(!missing.length){ bg='var(--success-bg)'; color='var(--success)'; text=`✅ เดือนนี้ตรวจครบทุกแผนก ทุกประเภทอุปกรณ์แล้ว (${total}/${total})`; }
  else if(st.overdue){ bg='var(--danger-bg)'; color='var(--danger)'; text=`🚨 เลยกำหนดวันที่ ${FIRE_MONTHLY_DEADLINE_DAY} มาแล้ว ${-st.left} วัน — ยังไม่ได้ตรวจอีก ${missing.length} รายการ จาก ${total}`; }
  else if(st.left<=3){ bg='var(--danger-bg)'; color='var(--danger)'; text=`⏰ เหลืออีก ${st.left===0?'วันนี้วันสุดท้าย':st.left+' วัน'} (กำหนดภายในวันที่ ${FIRE_MONTHLY_DEADLINE_DAY}) — ยังไม่ได้ตรวจ ${missing.length} รายการ จาก ${total}`; }
  else { bg='var(--accent-bg)'; color='var(--accent-ink)'; text=`📅 กำหนดตรวจภายในวันที่ ${FIRE_MONTHLY_DEADLINE_DAY} ของเดือน (เหลือ ${st.left} วัน) — ตรวจแล้ว ${total-missing.length}/${total} รายการ`; }
  return el(`<div style="padding:10px 14px;border-radius:var(--radius);background:${bg};color:${color};font-weight:600;font-size:13.5px;margin-bottom:14px;">${text}</div>`);
}
// แดชบอร์ดสรุป: แผนกไหนตรวจครบแล้ว / แผนกไหนยังไม่ตรวจ (ให้ จป. ตามงานได้ทันที)
function buildFireDeptDashboard(){
  const mk = fireLocalMonthKey(), st = fireDeadlineStatus();
  const types = fireRequiredTypes();
  const short = t=>t.label.replace(/\s*\(.*\)/,'').replace('ตู้สายฉีดน้ำดับเพลิง','ตู้สายฉีดน้ำ');
  const deptSet = [];
  types.forEach(t=>fireRequiredDepts(t.id).forEach(d=>{ if(!deptSet.includes(d)) deptSet.push(d); }));
  const depts = DEPARTMENTS.filter(d=>deptSet.includes(d)).map(d=>{
    const req = types.filter(t=>fireRequiredDepts(t.id).includes(d));
    const missing = req.filter(t=>!fireDeptDone(t.id,d,mk));
    return { dept:d, req:req.length, done:req.length-missing.length, missing };
  });
  const complete = depts.filter(x=>x.missing.length===0);
  const pending = depts.filter(x=>x.missing.length>0).sort((a,b)=> (a.done/a.req)-(b.done/b.req) || b.missing.length-a.missing.length);
  const totalReq = depts.reduce((n,x)=>n+x.req,0), totalDone = depts.reduce((n,x)=>n+x.done,0);
  const pct = totalReq ? Math.round(totalDone/totalReq*100) : 0;
  const late = st.overdue;
  const red = 'var(--danger)', redBg = 'var(--danger-bg)', green = 'var(--success)', greenBg = 'var(--success-bg)';
  const stat = (label, val, color)=>`<div class="card" style="text-align:center;margin:0;"><div style="font-size:12.5px;color:var(--ink-muted);">${label}</div><div style="font-size:34px;font-weight:600;color:${color||'var(--ink)'};line-height:1.2;">${val}</div></div>`;
  const bar = (p, color)=>`<div style="height:8px;border-radius:4px;background:var(--wait-bg);overflow:hidden;"><div style="height:100%;width:${p}%;background:${color};"></div></div>`;

  const pendingHtml = pending.length ? pending.map(x=>{
    const p = Math.round(x.done/x.req*100);
    const tag = x.done===0 ? `<span class="badge badge-danger">${late?'เลยกำหนด · ':''}ยังไม่ตรวจเลย</span>` : `<span class="badge badge-accent">${late?'เลยกำหนด · ':''}ตรวจบางส่วน</span>`;
    return `<div style="padding:10px 0;border-bottom:1px solid var(--line);">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:5px;"><b>${x.dept}</b><span style="font-size:12.5px;color:var(--ink-muted);">${x.done}/${x.req} ${tag}</span></div>
      ${bar(p, p===0?red:'var(--accent)')}
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">${x.missing.map(t=>`<button type="button" data-fgo="${t.id}|${x.dept}" class="badge" style="border:0;cursor:pointer;background:${redBg};color:${red};">${short(t)}</button>`).join('')}</div>
    </div>`;
  }).join('') : `<p class="hint" style="margin:6px 0;">🎉 ทุกแผนกตรวจครบแล้ว</p>`;
  const completeHtml = complete.length ? complete.map(x=>`<span class="badge" style="background:${greenBg};color:${green};margin:0 6px 6px 0;font-size:12.5px;padding:5px 11px;">✅ ${x.dept}</span>`).join('') : `<p class="hint" style="margin:6px 0;">ยังไม่มีแผนกที่ตรวจครบ</p>`;

  const card = el(`<div style="margin-bottom:18px;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px;">
      ${stat('แผนกที่ต้องตรวจ', depts.length)}
      ${stat('ตรวจครบแล้ว', complete.length, green)}
      ${stat('ยังไม่ครบ / ต้องตาม', pending.length, pending.length?red:green)}
      ${stat('ความคืบหน้ารวม', pct+'%', pct===100?green:'var(--ink)')}
    </div>
    <div class="card" style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><b>ความคืบหน้าการตรวจเดือนนี้ (${mk})</b><span>${totalDone}/${totalReq} รายการ</span></div>${bar(pct, pct===100?green:(late?red:'var(--accent)'))}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;">
      <div class="card" style="margin:0;border-top:3px solid ${red};"><h3 style="margin:0 0 4px;font-size:15px;color:${red};">❌ แผนกที่ยังไม่ตรวจ / ตรวจไม่ครบ (${pending.length})</h3><p class="hint" style="margin:0 0 4px;">เรียงจากแผนกที่ค้างมากที่สุด — กดชื่ออุปกรณ์เพื่อเปิดแบบตรวจ</p>${pendingHtml}</div>
      <div class="card" style="margin:0;border-top:3px solid ${green};"><h3 style="margin:0 0 10px;font-size:15px;color:${green};">✅ แผนกที่ตรวจครบแล้ว (${complete.length})</h3><div>${completeHtml}</div></div>
    </div>
  </div>`);
  card.querySelectorAll('[data-fgo]').forEach(b=>b.onclick=()=>{
    const [typeId, dept] = b.getAttribute('data-fgo').split('|');
    state.fireMonthlyHeader = Object.assign({}, state.fireMonthlyHeader||{}, { department: dept });
    setState({ fireMonthlyType: typeId });
  });
  return card;
}
function buildFireDeadlineCard(){

      <button type="button" class="btn btn-outline btn-sm" id="fdCopy">📋 คัดลอกข้อความแจ้งเตือนแผนกที่ค้าง</button>
    </div>

    <div style="overflow:auto;max-height:460px;"><table class="permit-table">

  card.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{

    state.fireMonthlyHeader = Object.assign({}, state.fireMonthlyHeader||{}, { department: dept });
    setState({ fireMonthlyType: typeId });
  });
  async function setExempt(attr, on){
    const [typeId, dept] = attr.split('|');
    const cur = new Set((state.settings.fireMonthlyExempt||{})[typeId]||[]);
    if(on) cur.add(dept); else cur.delete(dept);
    state.settings.fireMonthlyExempt = Object.assign({}, state.settings.fireMonthlyExempt, { [typeId]: Array.from(cur) });
    await saveSettings();
    render();
  }
  card.querySelectorAll('[data-exempt]').forEach(b=>b.onclick=()=>{ const a=b.getAttribute('data-exempt'); if(confirm(`ยืนยัน: แผนก "${a.split('|')[1]}" ไม่มีอุปกรณ์ชนิดนี้ (จะไม่ถูกนับว่าค้างตรวจ)?`)) setExempt(a,true); });
  card.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>setExempt(b.getAttribute('data-restore'),false));
  card.querySelector('#fdCopy').onclick = async ()=>{
    const missing = fireMonthlyMissing(mk);
    if(!missing.length){ showToast("เดือนนี้ตรวจครบทุกแผนกแล้ว ไม่มีรายการค้าง"); return; }
    const by = {};
    missing.forEach(m=>{ (by[m.dept] = by[m.dept]||[]).push(short({label:equipmentTypeLabel(m.typeId)})); });
    const head = st.overdue ? `🚨 เลยกำหนดตรวจอุปกรณ์ดับเพลิงประจำเดือน (ภายในวันที่ ${FIRE_MONTHLY_DEADLINE_DAY}) แล้ว ${-st.left} วัน` : `⏰ แจ้งเตือน: ตรวจอุปกรณ์ดับเพลิงประจำเดือนภายในวันที่ ${FIRE_MONTHLY_DEADLINE_DAY} (เหลือ ${st.left} วัน)`;
    const msg = `${head}\nแผนกที่ยังตรวจไม่ครบ (${mk}):\n` + Object.keys(by).map(d=>`• ${d}: ${by[d].join(', ')}`).join('\n');
    try{ await navigator.clipboard.writeText(msg); showToast("คัดลอกข้อความแล้ว นำไปวางในไลน์/WhatsApp ได้เลย"); }
    catch(e){ prompt("คัดลอกข้อความนี้:", msg); }
  };
  return card;
}

          <td class="status-cell" data-label="ผล">${r.failCount>0?`<span class="badge badge-danger">ไม่ผ่าน ${r.failCount}</span>`:'<span class="badge badge-success">ผ่าน</span>'}</td>
        </tr>`;}).join('')}</tbody>
      </table></div>`));

  }

  // ---------- หน้าแบบตรวจของประเภทที่เลือก ----------
  const activeType = FIRE_EQUIPMENT_TYPES.find(t=>t.id===state.fireMonthlyType);

  const flatItems = cfg.sections.flatMap(sec=>sec.items);
  const backBtn = el(`<button type="button" class="btn btn-outline btn-sm" style="margin-bottom:14px;">← กลับไปเลือกประเภทอุปกรณ์</button>`);
  backBtn.onclick = ()=>setState({fireMonthlyType:null});
  wrap.appendChild(backBtn);
  wrap.appendChild(fireDeadlineBanner());
  wrap.appendChild(el(`<h2 style="font-size:17px;margin:0 0 10px;">${cfg.title || activeType.label}</h2>`));

  const teamNames = SAFETY_MEN_LIST;
  const hdr = state.fireMonthlyHeader || {};
  const optHtml = (list)=>list.map(o=>`<option value="${o}">${o}</option>`).join('');
  const firstItemNo = 5 + cfg.extraSelects.length + 1;   // วันที่, เวลา, แผนก, ผู้ตรวจ, สถานที่ + ช่องเลือกเพิ่มเติม
  let runNo = firstItemNo;
  const sectionsHtml = cfg.sections.map((sec, si)=>{
    let idx0 = cfg.sections.slice(0,si).reduce((n,x)=>n+x.items.length,0);
    return `<h3 style="font-size:14.5px;margin:14px 0 4px;">${sec.title} (${sec.items.length} ข้อ)</h3>` + sec.items.map((txt,j)=>{
      const i = idx0 + j;
      return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line);">
        <span style="font-size:13px;flex:1;min-width:200px;">${runNo++}. ${txt} <span class="req">*</span></span>
        <span style="display:flex;gap:16px;">
          <label style="font-size:13px;display:flex;align-items:center;gap:4px;"><input type="radio" name="mitem_${i}" value="pass"> ผ่าน</label>
          <label style="font-size:13px;display:flex;align-items:center;gap:4px;"><input type="radio" name="mitem_${i}" value="fail"> ไม่ผ่าน</label>
        </span>
      </div>`;
    }).join('');
  }).join('');

    ${(()=>{
      const deptField = `<div class="field"><label>${cfg.inspectorFirst?4:3}. แผนก <span class="req">*</span></label>
        <select required id="mDept"><option value="" disabled ${cfg.deptOptions.includes(hdr.department)?'':'selected'}>เลือกคำตอบของคุณ</option>${cfg.deptOptions.map(d=>`<option value="${d}" ${hdr.department===d?'selected':''}>${d}</option>`).join('')}</select>
      </div>`;
      const inspField = `<div class="field"><label>${cfg.inspectorFirst?3:4}. ${cfg.inspectorLabel} <span class="req">*</span></label>
        <select id="mInspectorSel"><option value="" disabled ${hdr.checkedBy?'':'selected'}>เลือกคำตอบของคุณ</option>${teamNames.map(n=>`<option value="${n.replace(/"/g,'&quot;')}" ${hdr.checkedBy===n?'selected':''}>${n}</option>`).join('')}<option value="__other">อื่นๆ (พิมพ์ชื่อเอง)</option></select>
        <input type="text" id="mInspectorOther" placeholder="ชื่อผู้ตรวจสอบ" style="display:none;margin-top:6px;">
      </div>`;
      const third = cfg.inspectorFirst ? inspField : deptField;
      const fourth = cfg.inspectorFirst ? deptField : inspField;
      return `<div class="grid3">
        <div class="field"><label>1. วันที่ตรวจสอบ <span class="req">*</span></label><input required type="date" id="mDate" value="${todayLocal}"></div>
        <div class="field"><label>2. เวลา <span class="req">*</span></label><input required type="time" id="mTime" value="${nowTime}"></div>
        ${third}
      </div>${fourth}`;
    })()}
    <div class="${cfg.extraSelects.length>=2?'grid3':(cfg.extraSelects.length===1?'grid2':'')}">
      <div class="field"><label>5. ${cfg.locationLabel} <span class="req">*</span></label><input required type="text" id="mLoc" placeholder="เช่น หน้าโรงงานลูกหีบ จุดที่ 3"></div>
      ${cfg.extraSelects.map((ex,k)=>`<div class="field"><label>${6+k}. ${ex.label} <span class="req">*</span></label><select required data-extra="${k}"><option value="" disabled selected>เลือกคำตอบของคุณ</option>${optHtml(ex.options)}</select></div>`).join('')}
    </div>

    ${sectionsHtml}
    <div style="margin:10px 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button type="button" class="btn btn-outline btn-sm" id="mAllPass">✓ ผ่านทุกข้อ</button>
      <span class="badge badge-wait" id="mSummary">ตอบแล้ว 0/${flatItems.length}</span>

  const inspSel = form.querySelector('#mInspectorSel');

  function refreshSummary(){
    const picked = flatItems.map((_,i)=>form.querySelector(`input[name="mitem_${i}"]:checked`));
    const answered = picked.filter(Boolean).length;

    const btn = form.querySelector('#mSubmit');
    btn.disabled = true; btn.textContent = "กำลังบันทึก...";
    let photos = [];
    try{
      const raw = await filesToDataUrls(fi.files);
      photos = await uploadPhotosAndGetUrls(raw, "firemonthly_"+activeType.id+"_"+Date.now());
    }catch(err){
      showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองอีกครั้ง");
      btn.disabled = false; btn.textContent = "บันทึกผลตรวจ";
      return;
    }
    const items = flatItems.map((txt,i)=>({ text: txt, ok: form.querySelector(`input[name="mitem_${i}"]:checked`).value==='pass' }));
    const extras = {}; const legacy = {};
    cfg.extraSelects.forEach((ex,k)=>{
      const v = form.querySelector(`select[data-extra="${k}"]`).value;
      extras[ex.key] = v;
      if(ex.legacy) legacy[ex.legacy] = v;
    });
    await submitFireInspection(activeType.id,
      { date: form.querySelector('#mDate').value, time: form.querySelector('#mTime').value, department: form.querySelector('#mDept').value, checkedBy },
      Object.assign({ location: form.querySelector('#mLoc').value.trim(),
        extras, result: form.querySelector('#mResult').value,
        note: form.querySelector('#mNote').value.trim(), items, photos }, legacy));
  };

  // ---------- ประวัติของประเภทนี้ ----------
  const hist = state.fireMonthlyChecks.filter(r=>!r.type || r.type===activeType.id).slice(0,30);
  if(hist.length){
    wrap.appendChild(el(`<h3 style="font-size:15px;margin:22px 0 8px;">ประวัติการตรวจ — ${shortLabel(activeType)}</h3>`));
    hist.forEach(r=>{
      const results = r.results||[];
      const card = el(`<details class="card" style="margin-bottom:8px;">
        <summary style="cursor:pointer;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;">
          <span style="font-size:13.5px;"><strong>${r.date}${r.time?' '+r.time:''}</strong> · ${r.totalChecked>1 ? r.totalChecked+' ชิ้น' : ((results[0]&&results[0].location)||'-')} · ${r.checkedBy}${r.department?' · '+r.department:''}</span>
          ${r.failCount>0?`<span class="badge badge-danger">ไม่ผ่าน ${r.failCount}</span>`:'<span class="badge badge-success">ผ่าน</span>'}
        </summary>
        <div style="margin-top:10px;">
          ${results.map(x=>`<div style="padding:8px 0;border-top:1px solid var(--line);font-size:13px;">
            <div><strong>${x.code||''} ${x.location||''}</strong> ${(()=>{ const ex = x.extras && Object.keys(x.extras).length ? Object.values(x.extras) : [x.extType,x.extSize]; const t = ex.filter(Boolean).join(' · '); return t ? ' · '+t : ''; })()} ${x.result==='fail'?'<span class="badge badge-danger">ไม่ผ่าน</span>':'<span class="badge badge-success">ผ่าน</span>'}</div>
            ${(x.items&&x.items.some(i=>!i.ok))?`<div style="color:var(--danger);margin-top:3px;">ข้อที่ไม่ผ่าน: ${x.items.filter(i=>!i.ok).map(i=>i.text).join(' / ')}</div>`:''}
            ${x.note?`<div style="color:var(--ink-muted);margin-top:3px;">${x.note}</div>`:''}
            ${(x.photos&&x.photos.length)?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">${x.photos.map(ph=>`<img src="${ph}" style="max-width:120px;border-radius:var(--radius);border:1px solid var(--line);">`).join('')}</div>`:''}
          </div>`).join('')}
        </div>
      </details>`);
      wrap.appendChild(card);
    });
  }
  return wrap;
}

        <div class="field" style="margin-bottom:0;"><label>แนบรูปที่เกิดเหตุ (ไม่บังคับ — สูงสุด ${MAX_PHOTOS} รูป)</label><input type="file" id="accPhotos" accept="image/*" multiple></div>

  if(xlCanImport()) wrap.querySelector('#accForm').before(buildAccImportCard());
  const sevSel = wrap.querySelector('#accSeverity');
  sevSel.onchange = ()=>{
    const v = sevSel.value;
    wrap.querySelector('#accInjuredBox').style.display = (v && v!=='none') ? 'block' : 'none';
    wrap.querySelector('#accLostDaysField').style.display = (ACCIDENT_SEVERITIES[v]||{}).lostTime ? 'block' : 'none';
  };
  const personSel = wrap.querySelector('#accPersonType');
  personSel.onchange = ()=>{ wrap.querySelector('#accCompanyField').style.display = personSel.value==='ผู้รับเหมา' ? 'block' : 'none'; };

  wrap.querySelector('#accForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const sev = f.get('severity');
    const hasInjury = sev && sev!=='none';
    const bodyParts = f.getAll('bodyParts');
    if(hasInjury){
      if(!(f.get('injuredName')||'').trim()){ showToast("กรุณาระบุชื่อผู้บาดเจ็บ"); return; }
      if(!f.get('personType')){ showToast("กรุณาเลือกสถานะผู้บาดเจ็บ"); return; }
      if(!bodyParts.length){ showToast("กรุณาเลือกส่วนของร่างกายที่บาดเจ็บอย่างน้อย 1 ส่วน"); return; }
      if(!f.get('injuryType')){ showToast("กรุณาเลือกลักษณะการบาดเจ็บ"); return; }
    }
    const fi = wrap.querySelector('#accPhotos');
    if(fi.files.length>MAX_PHOTOS){ showToast(`แนบรูปได้ไม่เกิน ${MAX_PHOTOS} รูป`); return; }
    const btn = wrap.querySelector('#accSubmit');
    btn.disabled = true; btn.textContent = "กำลังบันทึก...";
    let photos = [];
    if(fi.files.length){
      try{
        const raw = await filesToDataUrls(fi.files);
        photos = await uploadPhotosAndGetUrls(raw, "accident_"+Date.now());
      }catch(err){
        showToast("อัปโหลดรูปภาพไม่สำเร็จ ลองอีกครั้ง");
        btn.disabled = false; btn.textContent = "บันทึกรายงานอุบัติเหตุ";
        return;
      }
    }
    await createAccident({
      date:f.get('date'), time:f.get('time'), department:f.get('department'), location:f.get('location'),
      accidentType:f.get('accidentType'), description:f.get('description'),
      immediateAction:(f.get('immediateAction')||'').trim(), witnesses:(f.get('witnesses')||'').trim(),
      severity:sev, lostDays: (ACCIDENT_SEVERITIES[sev]||{}).lostTime ? Number(f.get('lostDays')||0) : 0,
      injuredName: hasInjury ? f.get('injuredName').trim() : "",
      personType: hasInjury ? f.get('personType') : "",
      injuredCompany: hasInjury && f.get('personType')==='ผู้รับเหมา' ? (f.get('injuredCompany')||'').trim() : "",
      bodyParts: hasInjury ? bodyParts : [], injuryType: hasInjury ? f.get('injuryType') : "",
      propertyDamage:(f.get('propertyDamage')||'').trim(), photos
    });
  };
  return wrap;
}

// แดชบอร์ดสามเหลี่ยมกลับหัว: จำนวนมาตรการแก้ไข/ป้องกันอุบัติเหตุ แยกตามระดับ Hierarchy of Controls
function buildControlsTriangleCard(){
  const counts = {}; CONTROL_LEVELS.forEach(c=>counts[c.id]=0);
  let unset = 0, total = 0;
  state.accidents.forEach(a=>(a.actions||[]).forEach(x=>{ total++; if(counts[x.controlLevel]!==undefined) counts[x.controlLevel]++; else unset++; }));
  const classified = total - unset;
  const strong = counts.elimination + counts.substitution + counts.engineering;
  const strongPct = classified ? Math.round(strong/classified*100) : null;

  const W=760, top=10, bandH=58, gap=3, topW=440, x0=10, cx=x0+topW/2, totalH=bandH*5;
  const halfAt = y => (topW/2) * (1 - (y-top)/totalH);
  let svg = `<svg viewBox="0 0 ${W} ${top+totalH+10}" width="100%" role="img" aria-label="แผนภาพลำดับขั้นการควบคุมความเสี่ยง" xmlns="http://www.w3.org/2000/svg" style="max-width:820px;display:block;margin:0 auto;font-family:inherit;">`;
  CONTROL_LEVELS.forEach((c,i)=>{
    const y1 = top + i*bandH + (i? gap/2:0), y2 = top + (i+1)*bandH - gap/2;
    const h1 = halfAt(y1), h2 = halfAt(y2);
    const midY = (y1+y2)/2;
    svg += `<polygon points="${cx-h1},${y1} ${cx+h1},${y1} ${cx+h2},${y2} ${cx-h2},${y2}" fill="${c.color}"/>`;
    const fs = i>=3 ? 13 : 16;
    svg += `<text x="${cx}" y="${midY-2}" text-anchor="middle" font-weight="700" font-size="${fs}" fill="${c.ink}">${c.short}</text>`;
    svg += `<text x="${cx}" y="${midY+15}" text-anchor="middle" font-size="12.5" fill="${c.ink}">${counts[c.id]} มาตรการ</text>`;
    const lx = cx + (h1+h2)/2 + 6;
    svg += `<line x1="${lx}" y1="${midY}" x2="${x0+topW+30}" y2="${midY}" stroke="#C9D1CE" stroke-width="1.5"/>`;
    svg += `<text x="${x0+topW+38}" y="${midY-2}" font-size="13" font-weight="700" fill="#16232B">${i+1}. ${c.label.replace(/\s*\(.*\)/,'')}</text>`;
    svg += `<text x="${x0+topW+38}" y="${midY+14}" font-size="12" fill="#5B6B70">${c.desc}</text>`;
  });
  svg += `</svg>`;

  const insight = total===0 ? `ยังไม่มีมาตรการแก้ไข/ป้องกันที่บันทึกไว้`
    : classified===0 ? `มี ${total} มาตรการ แต่ยังไม่ได้ระบุระดับ — เลือกระดับตอนเพิ่มมาตรการในรายงานอุบัติเหตุ`
    : `มาตรการระดับสูง (กำจัด/ทดแทน/วิศวกรรม) ${strong} จาก ${classified} มาตรการ = <b>${strongPct}%</b>${strongPct<50?' — ควรเพิ่มมาตรการที่ต้นเหตุมากกว่าการพึ่ง PPE/การอบรม':''}${unset?` · ยังไม่ระบุระดับ ${unset} มาตรการ`:''}`;
  return el(`<div class="card" style="margin-bottom:16px;">
    <h3 style="margin:0 0 2px;font-size:15px;">ลำดับขั้นการควบคุมความเสี่ยง (Hierarchy of Controls)</h3>
    <p class="hint" style="margin:0 0 10px;">มาตรการแก้ไข/ป้องกันจากรายงานอุบัติเหตุทั้งหมด แยกตามประสิทธิผล — ยิ่งอยู่ด้านบนยิ่งได้ผลมาก</p>
    ${svg}
    <p style="margin:10px 0 0;font-size:13px;">${insight}</p>
  </div>`);
}

function renderAccList(){
  const wrap = el(`<div><div class="pagehead"><div><h1>🚑 รายการอุบัติเหตุ</h1><p>รายงานอุบัติเหตุจากการทำงานทั้งหมด พร้อมสถานะการสอบสวนและมาตรการแก้ไข</p></div></div></div>`);
  const list = state.accidents;
  if(list.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีรายงานอุบัติเหตุ</h3><p>ยินดีด้วย — ยังไม่มีอุบัติเหตุถูกบันทึก หากเกิดเหตุให้สร้างรายงานจากเมนู "รายงานอุบัติเหตุใหม่"</p></div>`));
    return wrap;
  }
  const thisYear = new Date().getFullYear();
  const yr = list.filter(a=>new Date(a.date).getFullYear()===thisYear);
  const lti = yr.filter(a=>(ACCIDENT_SEVERITIES[a.severity]||{}).lostTime).length;
  const lostDays = yr.reduce((n,a)=>n+(Number(a.lostDays)||0),0);
  const open = list.filter(a=>a.status!=="closed").length;
  wrap.appendChild(el(`<div class="grid4" style="margin-bottom:16px;">
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">อุบัติเหตุปีนี้ (${thisYear})</div><div style="font-family:'Oswald',sans-serif;font-size:32px;">${yr.length}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">หยุดงาน (LTI) ปีนี้</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:${lti?'var(--danger)':'var(--success)'};">${lti}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">วันสูญเสียรวมปีนี้</div><div style="font-family:'Oswald',sans-serif;font-size:32px;">${lostDays}</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">ยังไม่ปิดเคส</div><div style="font-family:'Oswald',sans-serif;font-size:32px;color:${open?'var(--danger)':'var(--success)'};">${open}</div></div>
  </div>`));
  wrap.appendChild(buildControlsTriangleCard());
  const table = el(`<div class="card" style="padding:0;overflow:hidden;"><table class="permit-table">
    <thead><tr><th>เลขที่</th><th>วันที่</th><th>แผนก / จุดเกิดเหตุ</th><th>ประเภท</th><th>ผู้บาดเจ็บ</th><th>ความรุนแรง</th><th>สถานะ</th></tr></thead>
    <tbody>${list.map(a=>{
      const sv = ACCIDENT_SEVERITIES[a.severity]||ACCIDENT_SEVERITIES.none;
      return `<tr class="clickable" data-id="${a.id}">
        <td class="code-tag" data-label="เลขที่">${a.code}</td>
        <td data-label="วันที่">${a.date}${a.time?' '+a.time:''}</td>
        <td data-label="แผนก / จุดเกิดเหตุ">${a.department} — ${a.location}</td>
        <td data-label="ประเภท">${a.accidentType}</td>
        <td data-label="ผู้บาดเจ็บ">${a.injuredName||'-'}</td>
        <td data-label="ความรุนแรง"><span class="badge ${sv.cls}">${sv.short}</span></td>
        <td class="status-cell" data-label="สถานะ">${accStatusBadge(a.status)}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`);
  table.querySelectorAll('tr.clickable').forEach(tr=>tr.onclick=()=>setState({accDetailId:tr.dataset.id}));
  wrap.appendChild(table);
  return wrap;
}

function renderAccActionsList(container, acc){
  const actions = acc.actions || [];
  container.innerHTML = (actions.length===0 ? '<p class="hint">ยังไม่มีมาตรการแก้ไข/ป้องกัน</p>' : '') + actions.map(a=>`
    <div class="card" style="padding:12px 14px;margin-bottom:8px;" data-action-id="${a.id}">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start;">
        <div style="flex:1;min-width:200px;font-size:13.5px;">${a.description}${controlLevelOf(a.controlLevel)?` <span class="badge" style="background:${controlLevelOf(a.controlLevel).color};color:${controlLevelOf(a.controlLevel).ink};margin-left:6px;">${controlLevelOf(a.controlLevel).short}</span>`:''}</div>
        ${a.status==='closed' ? '<span class="badge badge-success">ปิดแล้ว</span>' : '<span class="badge badge-danger">ค้างดำเนินการ</span>'}
      </div>
      ${(a.assignedTo||a.dueDate)?`<div style="font-size:12px;color:var(--ink-muted);margin-top:4px;">${a.assignedTo?`มอบหมาย: ${a.assignedTo}`:''}${a.dueDate?` · กำหนดเสร็จ: ${a.dueDate}`:''}</div>`:''}
      ${a.status!=='closed' ? `<div class="no-print" style="margin-top:8px;"><button type="button" class="btn btn-success btn-sm" data-a-close>✓ ปิดมาตรการนี้</button></div>`
        : `<div class="no-print" style="margin-top:8px;font-size:12px;color:var(--ink-muted);">ปิดโดย ${a.closedBy||'(ไม่ระบุ)'} เมื่อ ${a.closedAt?new Date(a.closedAt).toLocaleString('th-TH'):''}${a.closeNote?` — ${a.closeNote}`:''}
          <button type="button" class="btn btn-outline btn-sm" data-a-reopen style="margin-left:8px;">เปิดใหม่</button></div>`}
    </div>`).join('');
  container.querySelectorAll('[data-action-id]').forEach(card=>{
    const aid = card.dataset.actionId;
    const cb = card.querySelector('[data-a-close]');
    if(cb) cb.onclick = async ()=>{ const note = prompt("หมายเหตุการปิดมาตรการ (ถ้ามี)", ""); if(note===null) return; await closeAccAction(acc, aid, note); };
    const rb = card.querySelector('[data-a-reopen]');
    if(rb) rb.onclick = async ()=>{ await reopenAccAction(acc, aid); };
  });
}

      <div class="grid2">

  inner.querySelector('#accSaveInvBtn').onclick = async ()=>{

    await saveAccInvestigation(acc, inv, rc);
  };
  inner.querySelector('#accAddActBtn').onclick = async ()=>{
    const desc = inner.querySelector('#accActDesc').value.trim();
    if(!desc){ showToast("กรุณากรอกรายละเอียดมาตรการ"); return; }
    await addAccAction(acc, desc, inner.querySelector('#accActWho').value.trim(), inner.querySelector('#accActDue').value, inner.querySelector('#accActLevel').value);
  };
  const cb = inner.querySelector('#accCloseBtn');
  if(cb) cb.onclick = async ()=>{ if(!confirm(`ยืนยันปิดเคส ${acc.code}?`)) return; await setAccStatus(acc, "closed"); };
  const rb = inner.querySelector('#accReopenBtn');

  const db = inner.querySelector('#accDeleteBtn');

  renderAccActionsList(inner.querySelector('#accActionsList'), acc);
}

/* ==================== Safety KPI: render ==================== */
function kpiGaugeCard(label, actual, target, unit, lowerIsBetter, note){
  const good = lowerIsBetter ? actual<=target : actual>=target;
  const pct = target>0 ? Math.min(Math.round((lowerIsBetter ? (target/Math.max(actual,0.0001)) : (actual/target))*100), 150) : 0;
  const barPct = Math.min(pct,100);
  const color = good ? "var(--success)" : "var(--danger)";
  return `<div class="card">
    <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:4px;">${label}</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px;">
      <div style="font-family:'Oswald',sans-serif;font-size:28px;color:${color};">${actual}${unit}</div>
      <div style="font-size:12px;color:var(--ink-muted);">เป้าหมาย ${target}${unit}</div>
    </div>
    <div style="background:var(--bg);border-radius:6px;overflow:hidden;height:10px;"><div style="width:${barPct}%;background:${color};height:100%;"></div></div>
    ${note?`<div style="font-size:11.5px;color:var(--ink-muted);margin-top:6px;">${note}</div>`:''}
  </div>`;
}
function renderKpiDashboard(){
  const wrap = el(`<div><div class="pagehead"><div><h1>🎯 Safety KPI</h1><p>เปรียบเทียบผลจริงกับเป้าหมายที่ตั้งไว้ — ปรับเป้าหมายได้ที่เมนู "ตั้งเป้าหมาย KPI"</p></div></div></div>`);
  const t = state.kpiTargets || defaultKpiTargets();
  const thisYear = new Date().getFullYear();
  const totalHours = computeTotalLaborHoursAllPermits();
  const recordableCount = allIncidentRecords().filter(r=>r.recordable).length;
  const ltiCount = allIncidentRecords().filter(r=>r.lostTime).length;
  const trir = totalHours>0 ? Number(((recordableCount*200000)/totalHours).toFixed(2)) : null;
  const ltifr = totalHours>0 ? Number(((ltiCount*1000000)/totalHours).toFixed(2)) : null;

  const capaItems = allCorrectiveItems();
  const capaThisYear = capaItems.filter(it=>new Date(it.createdAt).getFullYear()===thisYear);
  const capaClosed = capaThisYear.filter(it=>it.status==="closed").length;
  const capaRate = capaThisYear.length ? Math.round((capaClosed/capaThisYear.length)*100) : 100;

  const nmThisYear = state.nearMisses.filter(r=>new Date(r.date).getFullYear()===thisYear);
  const monthsPassed = new Date().getMonth()+1;
  const nmMonthlyAvg = Math.round((nmThisYear.length / monthsPassed)*10)/10;

  const fireTypesWithEq = FIRE_EQUIPMENT_TYPES.filter(ft=>state.fireEquipment.some(eq=>eq.type===ft.id));
  const currentMonthKey = new Date().toISOString().slice(0,7);

  const fireRate = fireTypesWithEq.length ? Math.round((fireDone/fireTypesWithEq.length)*100) : 100;

  const inspThisMonth = state.inspections.filter(i=>i.date && i.date.slice(0,7)===currentMonthKey).length;

  const cards = [];
  cards.push(trir!==null ? kpiGaugeCard("TRIR (ยิ่งต่ำยิ่งดี)", trir, t.trir, "", true, `จากอุบัติเหตุ ${recordableCount} ครั้ง / ${formatHours(totalHours)} คน-ชม.`) : `<div class="card"><div style="font-size:12.5px;color:var(--ink-muted);">TRIR</div><p class="hint" style="margin:6px 0 0;">ยังไม่มีข้อมูลชั่วโมงการทำงาน</p></div>`);
  cards.push(ltifr!==null ? kpiGaugeCard("LTIFR (ยิ่งต่ำยิ่งดี)", ltifr, t.ltifr, "", true, `จากเคสหยุดงาน ${ltiCount} ครั้ง`) : `<div class="card"><div style="font-size:12.5px;color:var(--ink-muted);">LTIFR</div><p class="hint" style="margin:6px 0 0;">ยังไม่มีข้อมูลชั่วโมงการทำงาน</p></div>`);
  cards.push(kpiGaugeCard("อัตราปิดงานแก้ไข (CAPA) ตรงเป้า", capaRate, t.capaClosureRate, "%", false, `ปิดแล้ว ${capaClosed}/${capaThisYear.length} รายการ ปีนี้`));
  cards.push(kpiGaugeCard("การแจ้ง Near Miss เฉลี่ย/เดือน", nmMonthlyAvg, t.nearMissMonthly, "", false, "ยิ่งแจ้งมาก ยิ่งสะท้อนวัฒนธรรมความปลอดภัยที่ดี"));
  cards.push(kpiGaugeCard("ตรวจอุปกรณ์ดับเพลิงประจำเดือน", fireRate, t.fireInspectionRate, "%", false, `ตรวจแล้ว ${fireDone}/${fireTypesWithEq.length} ประเภทเดือนนี้`));
  cards.push(kpiGaugeCard("ตรวจความปลอดภัยเดือนนี้", inspThisMonth, t.inspectionMonthly, " ครั้ง", false, "จำนวนครั้งที่ตรวจ Safety Inspection เดือนนี้"));

  wrap.appendChild(el(`<div class="grid3" style="margin-bottom:16px;">${cards.join('')}</div>`));
  return wrap;
}

/* ==================== Safety AI: render ==================== */
function computeSafetyInsights(){
  const insights = [];
  const today = new Date();
  const thisMonthStart = new Date(today.getFullYear(), today.getMonth()-2, 1);
  const prevMonthStart = new Date(today.getFullYear(), today.getMonth()-5, 1);
  const inRange = (dateStr, from, to)=>{ const d=new Date(dateStr); return d>=from && d<to; };
  const eventDates = [
    ...state.nearMisses.map(r=>r.date), ...state.accidents.map(a=>a.date), ...state.fireIncidents.map(i=>i.date)
  ];
  const recent3 = eventDates.filter(d=>inRange(d, thisMonthStart, new Date(today.getFullYear(),today.getMonth()+1,1))).length;
  const prev3 = eventDates.filter(d=>inRange(d, prevMonthStart, thisMonthStart)).length;
  if(prev3>0){
    const diffPct = Math.round(((recent3-prev3)/prev3)*100);
    if(diffPct>=20) insights.push({level:"danger", icon:"📈", text:`เหตุการณ์ด้านความปลอดภัย (อุบัติเหตุ+Near Miss+เหตุฉุกเฉิน) 3 เดือนล่าสุดเพิ่มขึ้น ${diffPct}% เทียบ 3 เดือนก่อนหน้า (${recent3} เทียบ ${prev3} ครั้ง) — ควรทบทวนมาตรการป้องกัน`});
    else if(diffPct<=-20) insights.push({level:"good", icon:"📉", text:`เหตุการณ์ด้านความปลอดภัย 3 เดือนล่าสุดลดลง ${Math.abs(diffPct)}% เทียบ 3 เดือนก่อนหน้า — แนวโน้มดีขึ้น`});
  } else if(recent3>0){
    insights.push({level:"warn", icon:"📈", text:`พบเหตุการณ์ด้านความปลอดภัย ${recent3} ครั้งใน 3 เดือนล่าสุด (ก่อนหน้านี้ไม่มีข้อมูลเทียบ)`});
  }

  const deptCount = {};
  state.inspections.forEach(i=>(i.findings||[]).filter(f=>f.status!=="closed").forEach(()=>{ deptCount[i.department]=(deptCount[i.department]||0)+1; }));
  state.nearMisses.forEach(r=>(r.actions||[]).filter(a=>a.status!=="closed").forEach(()=>{ deptCount[r.department]=(deptCount[r.department]||0)+1; }));
  state.accidents.forEach(a=>(a.actions||[]).filter(x=>x.status!=="closed").forEach(()=>{ deptCount[a.department]=(deptCount[a.department]||0)+1; }));
  const topDept = Object.entries(deptCount).sort((a,b)=>b[1]-a[1])[0];
  if(topDept && topDept[1]>=3) insights.push({level:"warn", icon:"🏭", text:`แผนก "${topDept[0]}" มีข้อบกพร่อง/มาตรการค้างดำเนินการมากที่สุด (${topDept[1]} รายการ) — ควรลงพื้นที่ตรวจเพิ่มเติม`});

  const eqFailCount = {};
  state.fireEquipment.forEach(eq=>{
    const fails = (eq.checks||[]).filter(c=>c.result==="fail").length;
    if(fails>=2) eqFailCount[eq.code] = {fails, type:equipmentTypeLabel(eq.type), location:eq.location};
  });
  const repeatEq = Object.entries(eqFailCount).sort((a,b)=>b[1].fails-a[1].fails)[0];
  if(repeatEq) insights.push({level:"danger", icon:"🔧", text:`อุปกรณ์ ${repeatEq[0]} (${repeatEq[1].type} — ${repeatEq[1].location}) ไม่ผ่านการตรวจซ้ำ ${repeatEq[1].fails} ครั้ง — อาจต้องเปลี่ยนหรือซ่อมถาวรแทนการแก้ไขชั่วคราว`});

  const capaItems = allCorrectiveItems();
  const openCapa = capaItems.filter(it=>it.status!=="closed");
  const overdueCapa = openCapa.filter(it=>it.dueDate && it.dueDate<today.toISOString().slice(0,10));
  if(openCapa.length>0){
    const rate = Math.round((overdueCapa.length/openCapa.length)*100);
    if(rate>=30) insights.push({level:"danger", icon:"⏰", text:`งานแก้ไข (CAPA) ที่ค้างอยู่ ${overdueCapa.length}/${openCapa.length} รายการ (${rate}%) เกินกำหนดเวลาแล้ว — ควรติดตามผู้รับผิดชอบ`});
  }

  const fireAttention = state.fireEquipment.filter(eq=>equipmentStatus(eq).cls==="badge-danger").length;
  if(fireAttention>0) insights.push({level:"danger", icon:"🔥", text:`มีอุปกรณ์ดับเพลิง ${fireAttention} ชิ้นที่ต้องแก้ไขหรือหมดอายุ — ตรวจสอบที่เมนู Fire → ทะเบียนอุปกรณ์ดับเพลิง`});

  const blacklisted = state.contractors.filter(c=>c.general&&c.general.blacklisted);
  if(blacklisted.length>0) insights.push({level:"warn", icon:"👷", text:`มีผู้รับเหมา ${blacklisted.length} บริษัทติดบัญชีดำ (Blacklist) — ตรวจสอบก่อนอนุมัติใบขออนุญาตทำงานใหม่`});

  const daysWithoutIncident = (()=>{
    const sorted = allIncidentRecords().sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(!sorted.length) return null;
    return Math.floor((new Date().setHours(0,0,0,0) - new Date(sorted[0].date).setHours(0,0,0,0))/86400000);
  })();
  if(daysWithoutIncident!==null && daysWithoutIncident>=90) insights.push({level:"good", icon:"🏆", text:`ไม่เกิดอุบัติเหตุมาแล้ว ${daysWithoutIncident} วันติดต่อกัน — รักษามาตรฐานนี้ไว้`});

  if(insights.length===0) insights.push({level:"good", icon:"✅", text:"ไม่พบสัญญาณผิดปกติที่เด่นชัดในข้อมูลปัจจุบัน — ระบบจะวิเคราะห์ใหม่ทุกครั้งที่มีข้อมูลเพิ่ม"});
  return insights;
}
function renderAiInsights(){
  const wrap = el(`<div><div class="pagehead"><div><h1>🤖 ข้อมูลเชิงลึกอัตโนมัติ</h1><p>วิเคราะห์แนวโน้ม จุดเสี่ยง และความผิดปกติจากข้อมูลจริงในระบบทั้งหมดโดยอัตโนมัติ (ประมวลผลในเครื่อง ไม่ส่งข้อมูลออกไปที่ใด)</p></div></div></div>`);
  const insights = computeSafetyInsights();
  const styleFor = lvl => lvl==="danger" ? {bg:"var(--danger-bg)",color:"var(--danger)",border:"#E3C1B3"} : lvl==="warn" ? {bg:"var(--accent-bg)",color:"var(--accent-ink)",border:"#E8D9B0"} : {bg:"var(--success-bg)",color:"var(--success)",border:"#BFE0C7"};
  insights.forEach(ins=>{
    const st = styleFor(ins.level);
    wrap.appendChild(el(`<div class="card" style="display:flex;gap:12px;align-items:flex-start;border-color:${st.border};margin-bottom:10px;">
      <div style="font-size:22px;line-height:1;">${ins.icon}</div>
      <div style="font-size:13.5px;line-height:1.5;">${ins.text}</div>
    </div>`));
  });
  return wrap;
}

  const apiKey = state.aiApiKey.trim();
  const model = (state.aiModel||"").trim() || AI_PROVIDERS[provider].defaultModel;
  const sysPrompt = "คุณเป็นผู้ช่วยด้านความปลอดภัยในการทำงาน (Safety AI) ให้กับโรงงานน้ำตาลมิตรลาว ตอบเป็นภาษาไทย กระชับ นำไปใช้ได้จริง"
    + (state.aiIncludeContext ? ("\n\nข้อมูลสรุปสถานะความปลอดภัยปัจจุบันจากระบบ (JSON):\n"+buildSafetyContextSummary()) : "");
  const history = state.aiMessages.slice(-16).map(m=>({role:m.role, content:m.text}));
  history.push({role:"user", content:userText});
  if(provider==="anthropic"){
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model, max_tokens:1024, system:sysPrompt, messages: history })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error((data.error&&data.error.message) || `HTTP ${resp.status}`);
    return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim() || "(ไม่มีข้อความตอบกลับ)";
  } else if(provider==="gemini"){
    const data = await geminiGenerate(apiKey, model, { systemInstruction:{ parts:[{text:sysPrompt}] }, contents: history.map(m=>({ role: m.role==="assistant"?"model":"user", parts:[{text:m.content}] })) });
    return ((data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[]).map(x=>x.text||"").join("\n").trim() || "(ไม่มีข้อความตอบกลับ)";
  } else {
    const resp = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+apiKey },
      body: JSON.stringify({ model, messages:[{role:"system",content:sysPrompt}, ...history] })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error((data.error&&data.error.message) || `HTTP ${resp.status}`);
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "(ไม่มีข้อความตอบกลับ)";
  }
}

  inputRow.onsubmit = async (e)=>{

    if(!state.aiApiKey){ showToast("กรุณาใส่และบันทึก API Key ก่อนเริ่มแชท"); return; }
    state.aiMessages.push({role:"user", text});

    const sendBtn = inputRow.querySelector('#aiSendBtn');
    sendBtn.disabled = true; sendBtn.textContent = "กำลังคิด...";
    try{
      const reply = await callAiProvider(text);
      state.aiMessages.push({role:"assistant", text: reply});
    }catch(err){
      state.aiMessages.push({role:"assistant", text: `⚠ เรียก AI ไม่สำเร็จ: ${err.message}\n\nสาเหตุที่พบบ่อย: API Key ไม่ถูกต้อง, เครดิตหมด, หรือผู้ให้บริการปฏิเสธการเรียกจากเบราว์เซอร์โดยตรง (CORS) — ลองตรวจสอบ API Key หรือเปลี่ยนผู้ให้บริการ`});
    }
    persistAiSettings();
    sendBtn.disabled = false; sendBtn.textContent = "ส่ง";
    paintChat();
  };
  return wrap;
}

      <input type="text" id="copyLocation" placeholder="สถานที่/จุดใช้งาน" style="flex:1;min-width:140px;">
      <button type="button" class="btn btn-outline btn-sm" id="addCopyBtn">+ ออกสำเนาควบคุม</button>
    </div>` : ''}

    ${doc.status!=='obsolete' ? `
    <div class="no-print" style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;">
      ${doc.status==='draft' ? `<button type="button" class="btn btn-outline btn-sm" id="toReviewBtn">ส่งทบทวน/อนุมัติ</button>` : ''}
      ${doc.status==='review' ? `<button type="button" class="btn btn-success btn-sm" id="toControlledBtn">✓ อนุมัติเป็นเอกสารควบคุม</button>` : ''}
      <button type="button" class="btn btn-outline btn-sm" id="toggleLockBtn">${doc.masterLocked?'🔓 ปลดล็อก':'🔒 ล็อก'} Master Template</button>
    </div>
    <div class="card no-print" style="background:#FAFAF8;margin-top:12px;">
      <h3 style="margin-top:0;font-size:14px;">ปรับปรุงเอกสาร (Revise)</h3>
      <div class="grid2">
        <div class="field"><label>ฉบับที่ใหม่</label><input type="text" id="reviseVersion" placeholder="เช่น 2.0"></div>
        <div class="field"><label>อ้างอิง DAR (ถ้ามี)</label><input type="text" id="reviseDar" placeholder="เช่น DAR-20260101-001"></div>
      </div>
      <div class="field"><label>รายละเอียดการเปลี่ยนแปลง</label><input type="text" id="reviseDesc" placeholder="สรุปสิ่งที่แก้ไข"></div>
      <button type="button" class="btn btn-outline btn-sm" id="reviseBtn">บันทึกการปรับปรุง</button>
    </div>
    <div class="card no-print" style="background:var(--danger-bg);border-color:#E3C1B3;margin-top:12px;">
      <h3 style="margin-top:0;font-size:14px;color:var(--danger);">ยกเลิกเอกสาร (Obsolete)</h3>
      <div class="field"><label>เหตุผลที่ยกเลิก</label><input type="text" id="obsoleteReason" placeholder="เช่น ถูกแทนที่ด้วย SOP-004 ฉบับใหม่"></div>
      <button type="button" class="btn btn-danger btn-sm" id="obsoleteBtn">ยกเลิกเอกสารนี้</button>
    </div>` : `<p class="hint" style="margin-top:14px;">เอกสารนี้ถูกยกเลิกแล้ว — จัดการการเรียกคืนได้ที่เมนู "เรียกคืนเอกสารยกเลิก"</p>`}

    ${state.role==='admin' ? `<div class="card" style="margin-top:16px;border-color:#E3C1B3;">
      <h3 style="margin-top:0;font-size:14px;color:var(--danger);">โซนอันตราย (สำหรับผู้ดูแลระบบ)</h3>
      <button type="button" class="btn btn-danger" id="deleteDocBtn">🗑 ลบเอกสารนี้ออกจากทะเบียน</button>
    </div>` : ''}
  `;
  inner.querySelector('#closeDocModal').onclick = ()=>setState({docDetailId:null});
  const addCopyBtn = inner.querySelector('#addCopyBtn');
  if(addCopyBtn) addCopyBtn.onclick = async ()=>{
    const holder = inner.querySelector('#copyHolder').value.trim();
    const loc = inner.querySelector('#copyLocation').value.trim();
    if(!holder || !loc){ showToast("กรุณากรอกชื่อผู้ถือสำเนาและสถานที่"); return; }
    await addControlledCopy(doc, holder, loc);
  };
  inner.querySelectorAll('[data-remove-copy]').forEach(btn=>{
    btn.onclick = ()=>removeControlledCopy(doc, Number(btn.getAttribute('data-remove-copy')));
  });
  const toReviewBtn = inner.querySelector('#toReviewBtn');
  if(toReviewBtn) toReviewBtn.onclick = ()=>setDocStatus(doc, "review");
  const toControlledBtn = inner.querySelector('#toControlledBtn');
  if(toControlledBtn) toControlledBtn.onclick = ()=>setDocStatus(doc, "controlled");
  const toggleLockBtn = inner.querySelector('#toggleLockBtn');
  if(toggleLockBtn) toggleLockBtn.onclick = ()=>toggleMasterLock(doc);
  const reviseBtn = inner.querySelector('#reviseBtn');
  if(reviseBtn) reviseBtn.onclick = async ()=>{
    const v = inner.querySelector('#reviseVersion').value.trim();
    const desc = inner.querySelector('#reviseDesc').value.trim();
    const darNo = inner.querySelector('#reviseDar').value.trim();
    if(!v || !desc){ showToast("กรุณากรอกฉบับที่ใหม่และรายละเอียดการเปลี่ยนแปลง"); return; }
    await reviseDocument(doc, v, desc, darNo);
  };
  const obsoleteBtn = inner.querySelector('#obsoleteBtn');
  if(obsoleteBtn) obsoleteBtn.onclick = async ()=>{
    const reason = inner.querySelector('#obsoleteReason').value.trim();
    if(!confirm(`ยืนยันยกเลิกเอกสาร ${doc.docNo}?`)) return;
    await markObsolete(doc, reason);
  };
  const deleteBtn = inner.querySelector('#deleteDocBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    if(!(await requireAdmin(`ยืนยันลบเอกสาร ${doc.docNo} ออกจากทะเบียนอย่างถาวร?`))) return;
    await deleteDocument(doc.id);
  };
}

/* ---- 2. DAR: คำขอจัดทำ/แก้ไข/ยกเลิกเอกสาร ---- */
function renderDocDar(){
  const wrap = el(`<div><div class="pagehead"><div><h1>คำขอจัดทำ/แก้ไข/ยกเลิกเอกสาร (DAR)</h1><p>Document Action Request — ทุกการเปลี่ยนแปลงเอกสารควรเริ่มจากคำขอนี้ก่อนเสมอ เพื่อให้มีการทบทวนและอนุมัติอย่างเป็นระบบ</p></div></div></div>`);

  const existingDocNos = state.safetyDocs.map(d=>`${d.docNo} — ${d.title}`);
  wrap.appendChild(el(`<details class="card" style="margin-bottom:14px;" ${state.dars.length===0?'open':''}>
    <summary style="cursor:pointer;font-weight:700;font-size:14px;">+ สร้างคำขอใหม่ (DAR)</summary>
    <form id="darForm" style="margin-top:10px;">
      <div class="grid3">
        <div class="field"><label>ประเภทคำขอ <span class="req">*</span></label><select required name="type" id="darType">${DAR_TYPES.map(t=>`<option value="${t.id}">${t.label}</option>`).join('')}</select></div>
        <div class="field"><label>วันที่ยื่นคำขอ <span class="req">*</span></label><input required type="date" name="requestDate" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>ผู้ยื่นคำขอ <span class="req">*</span></label><input required type="text" name="requestedBy" placeholder="ชื่อ-ตำแหน่ง"></div>
      </div>
      <div class="field" id="darDocNoField" style="display:none;"><label>เอกสารที่เกี่ยวข้อง <span class="req">*</span></label>
        <select name="docNo" id="darDocNoSelect"><option value="" disabled selected>เลือกเอกสาร</option>${state.safetyDocs.map(d=>`<option value="${d.docNo}">${d.docNo} — ${d.title}</option>`).join('')}</select>
      </div>
      <div class="grid3" id="darNewFields">
        <div class="field"><label>ชื่อเอกสาร <span class="req">*</span></label><input type="text" name="title" placeholder="ชื่อเอกสารที่ต้องการจัดทำ"></div>
        <div class="field"><label>ประเภทเอกสาร</label><select name="category">${DOC_CATEGORIES.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}</select></div>
        <div class="field"><label>แผนก/กระบวนการ <span class="req">*</span></label><select name="department"><option value="" disabled selected>เลือกแผนก</option>${DEPARTMENTS.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>เจ้าของเอกสาร (Process Owner)</label><input type="text" name="owner" placeholder="ชื่อ-ตำแหน่ง"></div>
      <div class="field"><label>เหตุผล/รายละเอียดคำขอ <span class="req">*</span></label><textarea required name="reason" placeholder="เหตุผลของการจัดทำ/แก้ไข/ยกเลิกเอกสารนี้"></textarea></div>
      <button class="btn btn-primary btn-sm" type="submit">ส่งคำขอ</button>
    </form>
  </details>`));

  const typeSel = wrap.querySelector('#darType');
  const docNoField = wrap.querySelector('#darDocNoField');
  const newFields = wrap.querySelector('#darNewFields');
  function refreshDarFields(){
    const isNew = typeSel.value==='new';
    docNoField.style.display = isNew ? 'none' : '';
    newFields.style.display = isNew ? '' : 'none';
    wrap.querySelector('#darDocNoSelect').required = !isNew;
    wrap.querySelector('[name=title]').required = isNew;
    wrap.querySelector('[name=department]').required = isNew;
  }
  typeSel.onchange = refreshDarFields;
  refreshDarFields();

  wrap.querySelector('#darForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const type = f.get('type');
    let title = f.get('title'), category = f.get('category'), department = f.get('department'), owner = f.get('owner'), docNo = "";
    if(type!=='new'){
      docNo = f.get('docNo');
      if(!docNo){ showToast("กรุณาเลือกเอกสารที่เกี่ยวข้อง"); return; }
      const doc = state.safetyDocs.find(d=>d.docNo===docNo);
      if(doc){ title = doc.title; category = doc.category; department = doc.department; owner = doc.owner; }
    } else {
      if(!title || !department){ showToast("กรุณากรอกชื่อเอกสารและแผนก"); return; }
    }
    await createDar({ type, docNo, title, category, department, owner, requestedBy:f.get('requestedBy'), requestDate:f.get('requestDate'), reason:f.get('reason') });
  };

  if(state.dars.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีคำขอ DAR</h3><p>สร้างคำขอแรกจากฟอร์มด้านบน</p></div>`));
    return wrap;
  }
  const table = el(`<div class="card" style="padding:0;overflow:hidden;"><table class="permit-table">
    <thead><tr><th>เลขที่คำขอ</th><th>ประเภท</th><th>เอกสาร</th><th>ผู้ยื่นคำขอ</th><th>วันที่</th><th>สถานะ</th></tr></thead>
    <tbody>${state.dars.map(d=>`<tr class="clickable" data-id="${d.id}">
      <td class="code-tag" data-label="เลขที่คำขอ">${d.darNo}</td>
      <td data-label="ประเภท">${(DAR_TYPES.find(t=>t.id===d.type)||{}).label||d.type}</td>
      <td data-label="เอกสาร">${d.docNo?`${d.docNo} — `:''}${d.title}</td>
      <td data-label="ผู้ยื่นคำขอ">${d.requestedBy}</td>
      <td data-label="วันที่">${d.requestDate}</td>
      <td class="status-cell" data-label="สถานะ">${darStatusBadge(d.status)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`);
  table.querySelectorAll('tr.clickable').forEach(tr=>tr.onclick=()=>setState({darDetailId:tr.dataset.id}));
  wrap.appendChild(table);
  return wrap;
}

      <div class="field"><label>ผู้พิจารณา</label><input type="text" id="darReviewer" placeholder="ชื่อผู้อนุมัติ (เช่น DCC / จป.)"></div>

/* ---- 3. เรียกคืนเอกสารยกเลิก (Obsolete Recall) ---- */
function renderDocRecall(){
  const wrap = el(`<div><div class="pagehead"><div><h1>เรียกคืนเอกสารยกเลิก (Obsolete Recall)</h1><p>ติดตามการเรียกคืนเอกสารที่ยกเลิกแล้วออกจากทุกจุดใช้งาน เพื่อป้องกันการหยิบไปใช้งานผิดพลาด แล้วยืนยันการทำลาย</p></div></div></div>`);
  const obsoleteDocs = state.safetyDocs.filter(d=>d.status==='obsolete');
  if(obsoleteDocs.length===0){
    wrap.appendChild(el(`<div class="empty"><h3>ยังไม่มีเอกสารที่ถูกยกเลิก</h3><p>เมื่อมีการยกเลิกเอกสารจากเมนู "ทะเบียนเอกสาร" รายการจะมาแสดงที่นี่เพื่อติดตามการเรียกคืน</p></div>`));
    return wrap;
  }
  obsoleteDocs.forEach(doc=>{
    const info = doc.obsoleteInfo || {};
    const expectedLocations = (doc.controlledCopies||[]).length;
    const recalledCount = (info.recalledFrom||[]).length;
    const complete = expectedLocations>0 && recalledCount>=expectedLocations;
    const card = el(`<div class="card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;">
        <div><strong>${doc.docNo}</strong> — ${doc.title}</div>
        ${info.disposalDate ? '<span class="badge badge-success">ทำลายแล้ว</span>' : complete ? '<span class="badge badge-accent">เรียกคืนครบแล้ว</span>' : '<span class="badge badge-danger">กำลังเรียกคืน</span>'}
      </div>
      <p style="font-size:12.5px;color:var(--ink-muted);margin:4px 0 10px;">ยกเลิกเมื่อ ${info.obsoleteDate||'-'}${info.reason?` — ${info.reason}`:''}${expectedLocations?` · คาดว่ามีสำเนาควบคุม ${expectedLocations} จุด`:''}</p>
      <div style="font-size:13px;">${(info.recalledFrom&&info.recalledFrom.length) ? info.recalledFrom.map(r=>`<div>✓ เรียกคืนจาก "${r.location}" โดย ${r.recalledBy} เมื่อ ${r.date}</div>`).join('') : '<p class="hint" style="margin:0;">ยังไม่มีการบันทึกการเรียกคืน</p>'}</div>
      ${!info.disposalDate ? `
      <div class="no-print" style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        <input type="text" placeholder="จุดที่เรียกคืน" data-recall-loc style="flex:1;min-width:140px;">
        <input type="text" placeholder="ผู้เรียกคืน" data-recall-by style="flex:1;min-width:140px;">
        <button type="button" class="btn btn-outline btn-sm" data-add-recall>+ บันทึกการเรียกคืน</button>
      </div>
      <div class="card no-print" style="background:#FAFAF8;margin-top:10px;">
        <h3 style="margin-top:0;font-size:13.5px;">ยืนยันการทำลาย</h3>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <input type="text" placeholder="วิธีทำลาย เช่น ย่อยกระดาษ" data-dispose-method style="flex:1;min-width:140px;">
          <input type="text" placeholder="ผู้ยืนยัน" data-dispose-by style="flex:1;min-width:140px;">
          <button type="button" class="btn btn-danger btn-sm" data-confirm-dispose>ยืนยันทำลาย</button>
        </div>
      </div>` : `<p style="font-size:12.5px;color:var(--ink-muted);margin-top:8px;">ทำลายโดย ${info.confirmedBy} เมื่อ ${info.disposalDate} (วิธี: ${info.disposalMethod})</p>`}
    </div>`);
    const addBtn = card.querySelector('[data-add-recall]');
    if(addBtn) addBtn.onclick = async ()=>{
      const loc = card.querySelector('[data-recall-loc]').value.trim();
      const by = card.querySelector('[data-recall-by]').value.trim();
      if(!loc || !by){ showToast("กรุณากรอกจุดที่เรียกคืนและผู้เรียกคืน"); return; }
      await addRecallLocation(doc, loc, by);
    };
    const disposeBtn = card.querySelector('[data-confirm-dispose]');
    if(disposeBtn) disposeBtn.onclick = async ()=>{
      const method = card.querySelector('[data-dispose-method]').value.trim();
      const by = card.querySelector('[data-dispose-by]').value.trim();
      if(!method || !by){ showToast("กรุณากรอกวิธีทำลายและผู้ยืนยัน"); return; }
      if(!confirm(`ยืนยันว่าทำลายเอกสาร ${doc.docNo} แล้ว?`)) return;
      await confirmDisposal(doc, method, by);
    };
    wrap.appendChild(card);
  });
  return wrap;
}

/* ---- 4. ตารางอายุการจัดเก็บ & แผนสำรองข้อมูล ---- */
function renderDocRetention(){
  const ds = state.docSettings || defaultDocSettings();
  const wrap = el(`<div><div class="pagehead"><div><h1>ตารางอายุการจัดเก็บ & แผนสำรองข้อมูล</h1><p>กำหนดระยะเวลาจัดเก็บบันทึกแต่ละประเภท และแผนรองรับเมื่อระบบไอทีขัดข้อง (IT Outage)</p></div></div></div>`);
  wrap.appendChild(el(`<div class="card" style="background:var(--accent-bg);margin-bottom:14px;">

    <p style="margin:4px 0 0;font-size:12.5px;">ตัวเลขอายุการจัดเก็บเริ่มต้นเป็นตัวอย่างทั่วไปเท่านั้น ไม่ใช่คำแนะนำทางกฎหมาย โปรดตรวจสอบกับฝ่ายกฎหมาย/ที่ปรึกษาด้านแรงงานของบริษัทเพื่อความถูกต้องตามกฎหมายที่บังคับใช้จริงก่อนนำไปใช้งาน</p>
  </div>`));

  const form = el(`<form class="card" id="retentionForm" style="margin-bottom:14px;">
    <h3 style="margin-top:0;font-size:15px;">ตารางอายุการจัดเก็บบันทึก (Retention Schedule)</h3>
    <div id="retRows"></div>
    <button type="button" class="btn btn-outline btn-sm no-print" id="addRetRowBtn" style="margin:8px 0;">+ เพิ่มแถว</button>
    <button class="btn btn-primary btn-sm" type="submit">บันทึกตาราง</button>
  </form>`);
  const rowsEl = form.querySelector('#retRows');
  function paintRows(){
    rowsEl.innerHTML = ds.retentionRows.map((r,i)=>`
      <div class="grid3" data-ret-row="${i}" style="align-items:flex-end;">
        <div class="field"><label>ประเภทบันทึก</label><input type="text" data-ret-type value="${(r.recordType||'').replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>อายุจัดเก็บ (ปี)</label><input type="number" min="0" data-ret-years value="${r.years}"></div>
        <div class="field" style="display:flex;gap:6px;">
          <input type="text" data-ret-basis value="${(r.legalBasis||'').replace(/"/g,'&quot;')}" placeholder="อ้างอิง/หมายเหตุ" style="flex:1;">
          <button type="button" class="jsaRemove no-print" data-remove-row style="margin-top:8px;">×</button>
        </div>
      </div>`).join('');
    rowsEl.querySelectorAll('[data-remove-row]').forEach((btn,i)=>{
      btn.onclick = ()=>{ ds.retentionRows.splice(i,1); paintRows(); };
    });
  }
  paintRows();
  form.querySelector('#addRetRowBtn').onclick = ()=>{ ds.retentionRows.push({recordType:"",years:0,legalBasis:""}); paintRows(); };
  form.onsubmit = async (e)=>{
    e.preventDefault();
    const rows = Array.from(rowsEl.querySelectorAll('[data-ret-row]')).map(r=>({
      recordType: r.querySelector('[data-ret-type]').value.trim(),
      years: Number(r.querySelector('[data-ret-years]').value)||0,
      legalBasis: r.querySelector('[data-ret-basis]').value.trim()
    })).filter(r=>r.recordType);
    state.docSettings.retentionRows = rows;
    await saveDocSettings();
  };
  wrap.appendChild(form);

  const itForm = el(`<form class="card" id="itPlanForm">
    <h3 style="margin-top:0;font-size:15px;">แผนรับมือระบบไอทีล่ม (IT Outage Backup Plan)</h3>

    <button class="btn btn-primary btn-sm" type="submit">บันทึกแผนสำรอง</button>

  itForm.onsubmit = async (e)=>{
    e.preventDefault();
    state.docSettings.itOutagePlan = itForm.querySelector('#itPlanText').value;
    await saveDocSettings();
  };
  wrap.appendChild(itForm);
  return wrap;
}

function genAccessCode(){
  const d = new Date();
  const ymd = d.getFullYear().toString()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const n = state.accessRequests.filter(r=>r.code.includes(ymd)).length + 1;
  return `AR-${ymd}-${String(n).padStart(3,'0')}`;
}

/* ==================== นำเข้าข้อมูลย้อนหลังจาก Excel (อุบัติเหตุ / คำร้องขอเข้าพื้นที่) ==================== */
function xlNormKey(k){ return String(k==null?'':k).replace(/[\*\s\r\n]+/g,'').toLowerCase(); }
function xlGet(row, label){
  const want = xlNormKey(label);
  for(const k of Object.keys(row)){ if(xlNormKey(k)===want){ const v=row[k]; return (typeof v==='string') ? v.trim() : v; } }
  return "";
}
function xlIsEmptyRow(row){ return Object.values(row).every(v=>v===""||v==null); }
function xlStr(v){ return v==null ? "" : String(v).trim(); }
function xlYearFix(y){ y = parseInt(y,10); return y>2400 ? y-543 : y; }
function xlPad(n){ return String(n).padStart(2,'0'); }
function xlValidYMD(y,m,d){ return y>=1990 && y<=2100 && m>=1 && m<=12 && d>=1 && d<=31; }
function xlParseDate(v){
  if(v===""||v==null) return "";
  if(typeof v==='number'){
    const o = (typeof XLSX!=='undefined' && XLSX.SSF) ? XLSX.SSF.parse_date_code(v) : null;
    return (o && xlValidYMD(o.y,o.m,o.d)) ? `${o.y}-${xlPad(o.m)}-${xlPad(o.d)}` : "";
  }
  const t = String(v).trim();
  let m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m){ const y=xlYearFix(m[1]), mo=+m[2], d=+m[3]; return xlValidYMD(y,mo,d) ? `${y}-${xlPad(mo)}-${xlPad(d)}` : ""; }
  m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if(m){ const d=+m[1], mo=+m[2], y=xlYearFix(m[3]); return xlValidYMD(y,mo,d) ? `${y}-${xlPad(mo)}-${xlPad(d)}` : ""; }
  return "";
}
function xlParseTime(v, fallbackFromDateCell){
  if(typeof v==='number' && v>=0){
    const frac = v - Math.floor(v); const mins = Math.round(frac*1440);
    return `${xlPad(Math.floor(mins/60)%24)}:${xlPad(mins%60)}`;
  }
  if(v!=="" && v!=null){ const m = String(v).match(/(\d{1,2})[:.](\d{2})/); if(m) return `${xlPad(+m[1])}:${m[2]}`; }
  if(typeof fallbackFromDateCell==='number' && fallbackFromDateCell%1>0){ return xlParseTime(fallbackFromDateCell); }
  return "";
}
// จับคู่ค่าในเซลล์กับรายการมาตรฐาน: ตรงทุกตัว → ตรงบางส่วน (ไม่สนช่องว่าง)
function xlMatch(v, list){
  const t = xlStr(v).replace(/\s+/g,''); if(!t) return null;
  const n = s=>String(s).replace(/\s+/g,'');
  return list.find(x=>n(x)===t) || list.find(x=>n(x).includes(t) || t.includes(n(x))) || null;
}
async function xlReadRows(file){
  if(typeof XLSX==="undefined") throw new Error("โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้าแล้วลองใหม่");
  const wb = XLSX.read(await file.arrayBuffer(), { type:"array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { defval:"" });
}
function xlDownloadTemplate(filename, headers, examples, helpCols){
  if(typeof XLSX==="undefined"){ showToast("โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้าแล้วลองใหม่"); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, ...examples]);
  ws['!cols'] = headers.map(h=>({wch: Math.max(14, String(h).length+4)}));
  const names = Object.keys(helpCols);
  const maxLen = Math.max(...names.map(n=>helpCols[n].length));
  const help = [names]; for(let i=0;i<maxLen;i++) help.push(names.map(n=>helpCols[n][i]||""));
  const ws2 = XLSX.utils.aoa_to_sheet(help); ws2['!cols'] = names.map(()=>({wch:34}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "ข้อมูล");
  XLSX.utils.book_append_sheet(wb, ws2, "ค่าที่ใช้ได้");
  XLSX.writeFile(wb, filename);
}
// การ์ดนำเข้า: ดาวน์โหลดแม่แบบ → เลือกไฟล์ → ดูตัวอย่างผล/ข้อผิดพลาด → กดยืนยัน
function buildExcelImportCard(opt){
  const card = el(`<div class="card" style="margin-bottom:16px;border-style:dashed;">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;">
      <div><h3 style="margin:0 0 2px;font-size:15px;">📥 ${opt.title}</h3><p class="hint" style="margin:0;">${opt.hint}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn btn-outline btn-sm" data-tpl>⬇ ดาวน์โหลดแม่แบบ Excel</button>
        <label class="btn btn-primary btn-sm" style="margin:0;cursor:pointer;">⬆ เลือกไฟล์ Excel<input type="file" data-file accept=".xlsx,.xls,.csv" style="display:none;"></label>
      </div>
    </div>
    <div data-preview style="margin-top:12px;"></div>
  </div>`);
  const prev = card.querySelector('[data-preview]');
  card.querySelector('[data-tpl]').onclick = opt.template;
  const input = card.querySelector('[data-file]');
  input.onchange = async ()=>{
    const file = input.files[0]; if(!file) return;
    prev.innerHTML = `<p class="hint">กำลังอ่านไฟล์...</p>`;
    try{
      const rows = (await xlReadRows(file)).filter(r=>!xlIsEmptyRow(r));
      if(!rows.length){ prev.innerHTML = `<p class="hint" style="color:var(--danger);">ไม่พบข้อมูลในแผ่นงานแรกของไฟล์ (ต้องมีหัวตารางแถวแรก)</p>`; input.value=""; return; }
      const res = opt.parse(rows);   // {items, errors:[{row,msg}], dups:number, summary:string}
      const errHtml = res.errors.length ? `<div style="max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;margin-top:8px;font-size:12.5px;background:var(--danger-bg);color:var(--danger);">${res.errors.slice(0,40).map(e=>`แถว ${e.row}: ${e.msg}`).join('<br>')}${res.errors.length>40?`<br>…และอีก ${res.errors.length-40} แถว`:''}</div>` : '';
      prev.innerHTML = `<div style="font-size:13.5px;"><b>ผลตรวจไฟล์ "${file.name.replace(/[<>&"]/g,'')}"</b>: พร้อมนำเข้า <b style="color:var(--success);">${res.items.length}</b> ${opt.unit}${res.dups?` · ข้ามรายการซ้ำ ${res.dups}`:''}${res.errors.length?` · มีปัญหา <b style="color:var(--danger);">${res.errors.length}</b> แถว (จะไม่ถูกนำเข้า)`:''}${res.summary?`<br><span class="hint">${res.summary}</span>`:''}</div>${errHtml}
        <div style="margin-top:10px;display:flex;gap:8px;"><button type="button" class="btn btn-success btn-sm" data-go ${res.items.length?'':'disabled'}>✓ ยืนยันนำเข้า ${res.items.length} ${opt.unit}</button><button type="button" class="btn btn-outline btn-sm" data-cancel>ยกเลิก</button></div>`;
      prev.querySelector('[data-cancel]').onclick = ()=>{ prev.innerHTML=""; input.value=""; };
      prev.querySelector('[data-go]').onclick = async (ev)=>{
        ev.target.disabled = true; ev.target.textContent = "กำลังนำเข้า...";
        try{ await opt.commit(res.items); }catch(e){ showToast("นำเข้าไม่สำเร็จ: "+(e.message||e)); }
        input.value = "";
      };
    }catch(e){ prev.innerHTML = `<p class="hint" style="color:var(--danger);">อ่านไฟล์ไม่สำเร็จ: ${(e.message||e)}</p>`; input.value=""; }
  };
  return card;
}

function accSeverityFromText(t){
  const s = xlStr(t).toLowerCase(); if(!s) return "";
  if(/ไม่มี|none/.test(s)) return "none";
  if(/ปฐมพยาบาล|first/.test(s)) return "first_aid";
  if(/หยุดงาน|lti|lost/.test(s)) return "lost_time";
  if(/รักษา|medical/.test(s)) return "medical";
  if(/ทุพพลภาพ|เสียชีวิต|fatal/.test(s)) return "fatal";
  return "";
}

function accImportParse(rows){
  const items = [], errors = [], seen = new Set(); let dups = 0;
  const existing = new Set(state.accidents.map(a=>`${a.date}|${a.time||''}|${a.department}|${(a.location||'').trim()}|${(a.description||'').slice(0,40)}`));
  rows.forEach((r,i)=>{
    const rowNo = i+2, errs = [];
    const dateRaw = xlGet(r,"วันที่เกิดเหตุ");
    const date = xlParseDate(dateRaw); if(!date) errs.push("วันที่เกิดเหตุไม่ถูกต้อง/ว่าง");
    const time = xlParseTime(xlGet(r,"เวลา"), dateRaw);
    const department = xlMatch(xlGet(r,"แผนก"), DEPARTMENTS); if(!department) errs.push(`แผนก "${xlStr(xlGet(r,"แผนก"))}" ไม่ตรงกับรายการ`);
    const location = xlStr(xlGet(r,"จุดเกิดเหตุ")); if(!location) errs.push("จุดเกิดเหตุว่าง");
    const accidentType = xlMatch(xlGet(r,"ประเภทอุบัติเหตุ"), ACCIDENT_TYPES); if(!accidentType) errs.push(`ประเภทอุบัติเหตุ "${xlStr(xlGet(r,"ประเภทอุบัติเหตุ"))}" ไม่ตรงกับรายการ`);
    const description = xlStr(xlGet(r,"รายละเอียดเหตุการณ์")); if(!description) errs.push("รายละเอียดเหตุการณ์ว่าง");
    const severity = accSeverityFromText(xlGet(r,"ความรุนแรง")); if(!severity) errs.push(`ความรุนแรง "${xlStr(xlGet(r,"ความรุนแรง"))}" ไม่ถูกต้อง`);
    const sv = ACCIDENT_SEVERITIES[severity]||{};
    const injured = severity && severity!=="none";
    const injuredName = xlStr(xlGet(r,"ชื่อผู้บาดเจ็บ"));
    if(injured && !injuredName) errs.push("มีผู้บาดเจ็บแต่ไม่ระบุชื่อ");
    const personType = injured ? (xlMatch(xlGet(r,"สถานะผู้บาดเจ็บ"), ACC_PERSON_TYPES) || "") : "";
    const bodyParts = injured ? xlStr(xlGet(r,"ส่วนของร่างกายที่บาดเจ็บ")).split(/[,;\n，]+/).map(x=>xlMatch(x,ACC_BODY_PARTS)).filter(Boolean) : [];
    const injuryType = injured ? (xlMatch(xlGet(r,"ลักษณะการบาดเจ็บ"), ACC_INJURY_TYPES) || "") : "";
    const stTxt = xlStr(xlGet(r,"สถานะเคส"));
    const status = /กำลัง/.test(stTxt) ? "investigating" : /รอ/.test(stTxt) ? "reported" : "closed";
    if(errs.length){ errors.push({row:rowNo, msg:errs.join(" · ")}); return; }
    const key = `${date}|${time}|${department}|${location}|${description.slice(0,40)}`;
    if(existing.has(key) || seen.has(key)){ dups++; return; }
    seen.add(key);
    const inv = xlStr(xlGet(r,"ผู้สอบสวน")), rc = xlStr(xlGet(r,"สาเหตุที่แท้จริง"));
    items.push({
      date, time, department, location, accidentType, description,
      immediateAction: xlStr(xlGet(r,"การช่วยเหลือเบื้องต้น")), witnesses: xlStr(xlGet(r,"พยาน")),
      severity, lostDays: sv.lostTime ? (Number(xlGet(r,"จำนวนวันหยุดงาน"))||0) : 0,
      injuredName: injured ? injuredName : "", personType, injuredCompany: personType==="ผู้รับเหมา" ? xlStr(xlGet(r,"บริษัทผู้รับเหมา")) : "",
      bodyParts, injuryType, propertyDamage: xlStr(xlGet(r,"ความเสียหายทรัพย์สิน")), status,
      invest: (inv||rc) ? {investigator:inv, rootCause:rc} : null
    });
  });
  const closed = items.filter(x=>x.status==="closed").length;
  return { items, errors, dups, summary: items.length ? `สถานะเคสที่ไม่ระบุจะถือเป็น "ปิดเคสแล้ว" (ปิดแล้ว ${closed} / ยังไม่ปิด ${items.length-closed}) · เลขที่เอกสารจะอิงวันที่เกิดเหตุ` : "" };
}
async function accImportCommit(items){
  let latest = state.accidents;
  try{ const fresh = await storageAdapter.get("wp:accidents", true); if(fresh) latest = JSON.parse(fresh.value); }catch(e){}
  state.accidents = latest;
  const nowIso = new Date().toISOString();
  items.forEach(it=>{
    const ymd = it.date.replace(/-/g,'');
    const n = state.accidents.filter(a=>(a.code||'').includes(ymd)).length + 1;
    const { invest, ...rest } = it;
    state.accidents.push(Object.assign({
      id:'ac'+Date.now()+Math.random().toString(36).slice(2,8),
      code:`ACC-${ymd}-${String(n).padStart(3,'0')}`, createdAt:nowIso,
      reporterEmail: state.myEmail||"", actions:[], photos:[], imported:true,
      investigation: invest ? { investigator:invest.investigator, rootCause:invest.rootCause, investigatedAt:nowIso } : null
    }, rest));
  });
  state.accidents.sort((a,b)=>`${b.date||''} ${b.time||''}`.localeCompare(`${a.date||''} ${a.time||''}`));
  await saveAccidents();
  showToast(`นำเข้าอุบัติเหตุย้อนหลัง ${items.length} รายการแล้ว`);
  setState({ route:"acc_list" });
}

function arImportParse(rows){
  const errors = [], groups = new Map(); let dups = 0;
  const existingKeys = new Set(state.accessRequests.map(r=>`${r.company}|${r.startDate}|${r.endDate}|${r.purpose}`));
  rows.forEach((r,i)=>{
    const rowNo = i+2, errs = [];
    const company = xlStr(xlGet(r,"บริษัทผู้รับเหมา")); if(!company) errs.push("ชื่อบริษัทว่าง");
    const coordName = xlStr(xlGet(r,"ผู้ควบคุมงาน")); if(!coordName) errs.push("ผู้ควบคุมงานว่าง");
    const pTxt = xlStr(xlGet(r,"วัตถุประสงค์"));
    const pHit = AR_PURPOSES.find(p=>pTxt && (p.label.replace(/\s+/g,'')===pTxt.replace(/\s+/g,'') || p.id===pTxt.toLowerCase())) || AR_PURPOSES.find(p=>pTxt && p.id!=="other" && (p.label.includes(pTxt)||pTxt.includes(p.label)));
    const purpose = pHit ? pHit.id : (pTxt ? "other" : ""); if(!purpose) errs.push("วัตถุประสงค์ว่าง");
    const startRaw = xlGet(r,"วันที่เริ่ม"), endRaw = xlGet(r,"วันที่สิ้นสุด");
    const startDate = xlParseDate(startRaw); if(!startDate) errs.push("วันที่เริ่มไม่ถูกต้อง/ว่าง");
    const endDate = xlParseDate(endRaw) || startDate; if(endDate && startDate && endDate<startDate) errs.push("วันที่สิ้นสุดก่อนวันที่เริ่ม");
    const person = xlStr(xlGet(r,"ชื่อ-นามสกุลพนักงาน")); if(!person) errs.push("ชื่อพนักงานว่าง");
    if(errs.length){ errors.push({row:rowNo, msg:errs.join(" · ")}); return; }
    const gid = xlStr(xlGet(r,"รหัสกลุ่ม")) || `${company}|${startDate}|${endDate}|${purpose}`;
    let g = groups.get(gid);
    if(!g){
      const stTxt = xlStr(xlGet(r,"สถานะคำร้อง"));
      g = { company, coordinator:{ name:coordName, phone:xlStr(xlGet(r,"เบอร์โทรผู้ควบคุมงาน")) },
        ownerDept: xlStr(xlGet(r,"หน่วยงานเจ้าของงาน")), purpose, purposeNote: purpose==="other" ? (xlStr(xlGet(r,"ระบุวัตถุประสงค์ (ถ้าเลือกอื่นๆ)"))||pTxt) : "",
        startDate, endDate, startTime: xlParseTime(xlGet(r,"เวลาเริ่ม"))||"08:00", endTime: xlParseTime(xlGet(r,"เวลาสิ้นสุด"))||"17:00",
        trainingDate: xlParseDate(xlGet(r,"วันที่อบรม")), requesterName: xlStr(xlGet(r,"ผู้ยื่นคำร้อง")) || coordName,
        status: /ไม่อนุมัติ|ปฏิเสธ/.test(stTxt) ? "rejected" : /รอ/.test(stTxt) ? "pending" : "approved", team:[] };
      groups.set(gid, g);
    }
    if(!g.team.some(t=>t.name===person)) g.team.push({ name:person, position: xlStr(xlGet(r,"ตำแหน่ง")), insurer: xlStr(xlGet(r,"บริษัทประกัน")), policyNo: xlStr(xlGet(r,"เลขที่กรมธรรม์")), insuranceStart: xlParseDate(xlGet(r,"ประกันอุบัติเหตุเริ่ม")), insuranceEnd: xlParseDate(xlGet(r,"ประกันอุบัติเหตุสิ้นสุด")) });
  });
  const items = [];
  groups.forEach(g=>{
    if(existingKeys.has(`${g.company}|${g.startDate}|${g.endDate}|${g.purpose}`)){ dups++; return; }
    items.push(g);
  });
  const people = items.reduce((n,g)=>n+g.team.length,0);
  const approved = items.filter(g=>g.status==="approved").length;
  return { items, errors, dups, summary: items.length ? `รวมเป็นคำร้อง ${items.length} ใบ · พนักงาน ${people} คน · อนุมัติแล้ว ${approved} ใบ (จะเพิ่มเข้าทะเบียนผู้รับเหมา/ผู้ผ่านการอบรมอัตโนมัติ)` : "" };
}
async function arImportCommit(items){
  const nowIso = new Date().toISOString();
  const made = [];
  items.forEach(g=>{
    const ymd = g.startDate.replace(/-/g,'');
    const n = state.accessRequests.filter(r=>(r.code||'').includes(ymd)).length + 1;
    const req = {
      id:"ar_"+Date.now()+Math.random().toString(36).slice(2,8), code:`AR-${ymd}-${String(n).padStart(3,'0')}`,
      company:g.company, coordinator:g.coordinator, entryDate:g.startDate, ownerDept:g.ownerDept,
      trainingDateNeeded:g.trainingDate||g.startDate, traineeCount:String(g.team.length),
      workTypes:[], compliance:{}, purpose:g.purpose, purposeNote:g.purposeNote,
      startDate:g.startDate, startTime:g.startTime, endDate:g.endDate, endTime:g.endTime,
      team:g.team, workerCount:g.team.length, documents:[], requesterName:g.requesterName,
      createdAt:nowIso, status:g.status, approval:null, imported:true
    };
    if(g.status!=="pending") req.approval = { decision:g.status, comment:"นำเข้าข้อมูลย้อนหลังจาก Excel", approverEmail:state.myEmail||"(ไม่ระบุ)", at:nowIso };
    state.accessRequests.push(req); made.push(req);
  });
  await saveAccessRequests();
  for(const req of made){ if(req.status==="approved") await syncContractorFromAccessRequest(req, { noRender:true }); }
  await saveAccessRequests();
  showToast(`นำเข้าคำร้องขอเข้าพื้นที่ ${made.length} ใบแล้ว`);
  setState({ route:"ar_list" });
}

// เผื่อคำร้องเก่าก่อนมีฟีเจอร์อนุมัติ ยังไม่มีฟิลด์ status — ถือว่า "รออนุมัติ" ไปก่อน
function arStatusOf(request){ return request.status || "pending"; }
function arStatusBadge(status){
  if(status==="approved") return `<span class="badge badge-success">อนุมัติแล้ว</span>`;
  if(status==="rejected") return `<span class="badge badge-danger">ไม่อนุมัติ</span>`;
  return `<span class="badge badge-accent">รอ จป. อนุมัติ</span>`;
}
// ปีที่อบรมจากวันที่ (รองรับ 2026-10-06, 06/10/2026, ปี พ.ศ.) — ใบรับรองหมดอายุสิ้นปีที่อบรม (31 ธ.ค.)
function trainYearOf(d){
  if(!d) return "";
  const m = String(d).match(/(\d{4})/);
  if(!m) return "";
  let y = parseInt(m[1],10);
  if(y>2400) y -= 543;
  return String(y);
}
function trainExpiryOf(d){ const y = trainYearOf(d); return y ? `${y}-12-31` : ""; }
// ดึงข้อมูลคำร้องที่ จป. อนุมัติไปแล้วแต่ยังไม่เคยซิงก์ (เช่นอนุมัติก่อนมีฟีเจอร์นี้) เข้ารายละเอียดรับเหมา — ทำครั้งเดียวต่อคำร้อง
async function backfillApprovedAccessRequests(){
  if(state._arBackfillRunning) return;
  const pending = (state.accessRequests||[]).filter(r=>r.status==="approved" && !r.contractorSynced);
  if(!pending.length) return;
  state._arBackfillRunning = true;
  try{
    for(const r of pending){ await syncContractorFromAccessRequest(r, { noRender:true, skipHidden:true }); r.contractorSynced = true; }
    await saveAccessRequests();
  } finally { state._arBackfillRunning = false; }
  render();
}
// เมื่อ จป. อนุมัติคำร้องขอเข้าพื้นที่ ให้ดึงข้อมูลบริษัท/ทีมงาน/เอกสารจากคำร้องนั้น
// ไปอัปเดต "รายละเอียดรับเหมา" (ทะเบียนผู้รับเหมา) ให้อัตโนมัติ — ไม่ต้องคีย์ซ้ำ และสถิติบนแดชบอร์ดจะอัปเดตตาม
async function syncContractorFromAccessRequest(request, opts){
  opts = opts || {};
  // บริษัทที่ไม่อยู่ในรายชื่อมาตรฐาน (พิมพ์เองตอนขอเข้าพื้นที่) ต้องเพิ่มเข้ารายการ ไม่งั้นข้อมูลถูกบันทึกแต่ไม่แสดงในหน้ารายละเอียดรับเหมา
  if(request.company && !allContractorCompanies().includes(request.company)){
    const hidden = state.settings.hiddenContractorCompanies||[];
    if(opts.skipHidden && hidden.includes(request.company)) return false;
    state.settings.hiddenContractorCompanies = hidden.filter(c=>c!==request.company);
    if(!CONTRACTOR_COMPANIES.includes(request.company)) state.settings.customContractorCompanies = (state.settings.customContractorCompanies||[]).concat([request.company]);
    await saveSettings();
  }
  const profile = getContractorProfile(request.company);
  profile.general = Object.assign(defaultContractorGeneral(), profile.general||{});
  profile.workers = profile.workers || [];
  profile.documents = profile.documents || [];

  profile.general.entryDate = request.entryDate || profile.general.entryDate;
  profile.general.ownerDept = request.ownerDept || profile.general.ownerDept;
  profile.general.coordinatorName = (request.coordinator&&request.coordinator.name) || profile.general.coordinatorName;
  profile.general.phone = (request.coordinator&&request.coordinator.phone) || profile.general.phone;
  profile.general.startDate = request.startDate || profile.general.startDate;
  profile.general.endDate = request.endDate || profile.general.endDate;
  profile.general.trainingDateNeeded = request.trainingDateNeeded || profile.general.trainingDateNeeded;
  profile.general.traineeCount = request.traineeCount || profile.general.traineeCount;
  profile.general.workTypes = Array.from(new Set([...(profile.general.workTypes||[]), ...(request.workTypes||[])]));
  profile.general.compliance = Object.assign({}, profile.general.compliance, request.compliance);

  // วันที่อบรม: ใช้วันที่อบรมที่ระบุในคำร้อง ถ้าไม่มีใช้วันที่เข้าทำงาน/วันเริ่มงาน/วันที่ จป. อนุมัติ
  const trainedDate = request.trainingDateNeeded || request.entryDate || request.startDate || ((request.approval&&request.approval.at)||"").slice(0,10) || "";
  (request.team||[]).forEach(t=>{
    const name = (t.name||"").trim();
    if(!name) return;
    const tDate = t.trainedDate || trainedDate;   // คนที่เพิ่มทีหลังมีวันที่เข้าทำงาน/อบรมของตัวเอง
    const tYear = trainYearOf(tDate);
    // คนเดิมปีเดียวกัน = ไม่เพิ่มซ้ำ / คนเดิมที่ยังไม่มีวันที่อบรม = เติมวันที่ให้ / คนเดิมคนละปี = เพิ่มแถวใหม่ (ต่ออายุรายปี)
    const same = profile.workers.find(w=>w.name===name && (trainYearOf(w.trainedDate)===tYear || !trainYearOf(w.trainedDate)));
    if(same){
      if(!same.trainedDate) same.trainedDate = tDate;
      if(!same.position && t.position) same.position = t.position;
      if(t.insuranceStart && !same.insuranceStart) same.insuranceStart = t.insuranceStart;
      if(t.insuranceEnd && !same.insuranceEnd) same.insuranceEnd = t.insuranceEnd;
      if(t.insurer && !same.insurer) same.insurer = t.insurer;
      if(t.policyNo && !same.policyNo) same.policyNo = t.policyNo;
    } else {
      profile.workers.push({ name, position: t.position||"", trainedDate: tDate, requestCode: request.code, insuranceStart: t.insuranceStart||"", insuranceEnd: t.insuranceEnd||"", insurer: t.insurer||"", policyNo: t.policyNo||"" });
    }
  });
  profile.general.workerCount = String(profile.workers.length);

  const existingDocNames = new Set(profile.documents.map(d=>d.name));
  (request.documents||[]).forEach(d=>{
    if(d.name && !existingDocNames.has(d.name)){
      profile.documents.push(d);
      existingDocNames.add(d.name);
    }
  });

  request.contractorSynced = true;
  await persistContractorProfile(profile, opts);
  return true;
}
// บันทึกผลการอนุมัติ/ไม่อนุมัติคำร้องขอเข้าพื้นที่ (อนุมัติขั้นตอนเดียวโดย จป.)
async function decideAccessRequest(request, decision, comment){
  request.status = decision;
  request.approval = {
    decision, comment: comment||"",
    approverEmail: state.myEmail || "(ไม่ระบุ)",
    at: new Date().toISOString()
  };
  await saveAccessRequests();
  if(decision==="approved"){
    await syncContractorFromAccessRequest(request, { noRender:true });
    await saveAccessRequests();
    showToast(`อนุมัติคำร้อง ${request.code} แล้ว — อัปเดตข้อมูล "${request.company}" ในทะเบียนผู้รับเหมาแล้ว`);
  } else {
    showToast(`ไม่อนุมัติคำร้อง ${request.code}`);
  }
  render();
}
